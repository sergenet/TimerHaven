<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Προγραμματιστής Συνάντησης</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Βρείτε την καλύτερη ώρα συνάντησης για όλους, οπουδήποτε στον κόσμο.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body { background: #f4f7fb; font-family: 'Montserrat', Arial, sans-serif; }
    .main-container { max-width: 1200px; margin: 2em auto; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
    .center-row { display: flex; flex-direction: row; justify-content: center; align-items: stretch; gap: 2em; width: 100%; }
    .tool-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px #e0e7ef;
      min-width: 220px;
      max-width: 340px;
      width: 340px;
      min-height: 500px;
      flex: 1 1 340px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      padding: 2em 1.3em 1em 1.3em;
      margin: 0;
      box-sizing: border-box;
      text-align: left;
      overflow: hidden;
    }
    .back-link { display: inline-block; margin-bottom: 1em; color: #007bff; text-decoration: none; font-weight: bold; font-size: 1em; }
    .back-link:hover { text-decoration: underline; }
    .faq-section { margin-top: 1.1em; margin-bottom: 0.3em; font-size: 1em; background: #f7fafc; border-radius: 8px; padding: 1em; box-shadow: 0 1px 4px #e0e7ef; }
    .faq-section summary { font-weight: bold; font-size: 1.07em; cursor: pointer; margin-bottom: 0.5em; }
    .language-selector-row { margin-bottom: 1em; }
  </style>
</head>
<body>
  <div class="main-container">
    <div class="center-row">
      <div class="tool-card">
        <div class="language-selector-row">
          <label for="languageSelector">Γλώσσα</label>
          <select id="languageSelector" class="form-select" onchange="onLanguageChange()">
            <option value="en">Αγγλικά</option><option value="fr">Γαλλικά</option><option value="de">Γερμανικά</option><option value="ru">Ρωσικά</option><option value="el">Ελληνικά</option><option value="es">Ισπανικά</option><option value="ar">العربية</option>
          </select>
        </div>
        <a href="index.html" class="back-link"><i class="fa fa-arrow-left"></i> Επιστροφή στο κύριο μενού</a>
        <h3><i class="fa fa-users"></i> Προγραμματιστής Συνάντησης</h3>
        <form id="meetingForm">
          <div class="meeting-form-row">
            <label for="participantName">Όνομα συμμετέχοντα</label>
            <input type="text" id="participantName" class="form-control" placeholder="Εισάγετε όνομα (π.χ. Γιώργος)" autocomplete="off">
          </div>
          <div class="meeting-form-row">
            <label for="participantCity">Ζώνη ώρας / Πόλη</label>
            <select id="participantCity" class="form-select" autocomplete="off">
              <option value="" disabled selected>Επιλέξτε πόλη/ζώνη ώρας</option>
              <option value="America/New_York">Νέα Υόρκη 🇺🇸</option><option value="America/Chicago">Σικάγο 🇺🇸</option><option value="America/Los_Angeles">Λος Άντζελες 🇺🇸</option><option value="America/Toronto">Τορόντο 🇨🇦</option><option value="Europe/London">Λονδίνο 🇬🇧</option><option value="Europe/Paris">Παρίσι 🇫🇷</option><option value="Europe/Berlin">Βερολίνο 🇩🇪</option><option value="Europe/Moscow">Μόσχα 🇷🇺</option><option value="Europe/Istanbul">Κωνσταντινούπολη 🇹🇷</option><option value="Asia/Dubai">Ντουμπάι 🇦🇪</option><option value="Asia/Kolkata">Καλκούτα 🇮🇳</option><option value="Asia/Shanghai">Σανγκάη 🇨🇳</option><option value="Asia/Tokyo">Τόκιο 🇯🇵</option><option value="Asia/Singapore">Σιγκαπούρη 🇸🇬</option><option value="Asia/Jakarta">Τζακάρτα 🇮🇩</option><option value="Australia/Sydney">Σίδνεϊ 🇦🇺</option><option value="Pacific/Auckland">Όκλαντ 🇳🇿</option><option value="America/Sao_Paulo">Σάο Πάολο 🇧🇷</option><option value="America/Mexico_City">Μεξικό 🇲🇽</option><option value="Africa/Johannesburg">Γιοχάνεσμπουργκ 🇿🇦</option><option value="Africa/Cairo">Κάιρο 🇪🇬</option><option value="Africa/Nairobi">Ναϊρόμπι 🇰🇪</option><option value="Asia/Seoul">Σεούλ 🇰🇷</option><option value="Asia/Hong_Kong">Χονγκ Κονγκ 🇭🇰</option><option value="Asia/Bangkok">Μπανγκόκ 🇹🇭</option><option value="Asia/Manila">Μανίλα 🇵🇭</option><option value="Europe/Madrid">Μαδρίτη 🇪🇸</option><option value="Europe/Rome">Ρώμη 🇮🇹</option><option value="Europe/Warsaw">Βαρσοβία 🇵🇱</option><option value="Europe/Amsterdam">Άμστερνταμ 🇳🇱</option><option value="Europe/Athens">Αθήνα 🇬🇷</option><option value="America/Vancouver">Βανκούβερ 🇨🇦</option>
            </select>
          </div>
          <button type="button" class="btn btn-success btn-participant" id="addParticipant"><i class="fa fa-plus"></i> Προσθήκη συμμετέχοντα</button>
        </form>
        <div class="participant-list" id="participantList"></div>
        <div class="meeting-form-row">
          <label for="meetingDate">Επιλέξτε ημερομηνία</label>
          <input type="date" id="meetingDate" class="form-control">
        </div>
        <div class="meeting-form-row">
          <label for="meetingTime">Επιλέξτε ώρα</label>
          <input type="time" id="meetingTime" class="form-control">
          <button type="button" class="btn btn-primary btn-sm" style="margin-top:0.6em;" id="calcTimes"><i class="fa fa-clock"></i> Εμφάνιση ωρών</button>
        </div>
        <div>
          <div id="meetingTimes"></div>
        </div>
        <details class="faq-section">
          <summary>Συχνές Ερωτήσεις</summary>
          <ul style="padding-left: 1em;">
            <li><b>Πόσοι συμμετέχοντες;</b> Όσοι θέλετε.</li><li><b>Ποιες ζώνες ώρας;</b> Επιλέξτε από 30+ δημοφιλείς πόλεις/ζώνες.</li><li><b>Πώς μοιράζομαι;</b> Αντιγράψτε τις ώρες και μοιραστείτε τις με τους συμμετέχοντες.</li>
          </ul>
        </details>
      </div>
    </div>
  </div>
  <script>
    function onLanguageChange() {
      var lang = document.getElementById("languageSelector").value;
      window.location.href = "meeting-planner-" + lang + ".html";
    }
  </script>
</body>
</html>
