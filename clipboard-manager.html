    body { background: #f4f7fb; font-family: 'Montserrat', Arial, sans-serif; }

    .center-row { display: flex; flex-direction: row; justify-content: center; align-items: stretch; gap: 2em; width: 100%; }
    .article-card, .tool-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px #e0e7ef;
      min-width: 220px;
      max-width: 340px;
      width: 340px;
      min-height: 500px;
      flex: 1 1 340px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      padding: 2em 1.3em 1em 1.3em;
      margin: 0;
      box-sizing: border-box;
      text-align: left;
      overflow: hidden;
    }
    .article-card h2, .tool-card h3 {
      font-size: 1.35em;
      font-weight: 700;
      margin-bottom: 0.4em;
      display: flex;
      align-items: center;
      gap: 0.3em;
    }
    .article-card .btn, .tool-card .btn { 
      align-self: stretch;
      font-weight: 600; 
      border-radius: 8px; 
      margin-top: 0.2em; 
      margin-bottom: 0; 
      box-sizing: border-box;
    }
    .clipboard-form { margin-bottom: 1em; }
    .clipboard-form textarea { width: 100%; min-height: 50px; border-radius: 7px; border: 1px solid #e0e7ef; padding: 8px; font-size: 1em; margin-bottom: 0.5em; resize: vertical; }
    .clipboard-form .btn { font-weight: 600; border-radius: 7px; padding: 0.4em 1.3em; margin-bottom: 6px; }
    .clips-list {
      margin-bottom: 1em;
      margin-top: 0.5em;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 2px;
    }
    .clips-list::-webkit-scrollbar { width: 8px; }
    .clips-list::-webkit-scrollbar-thumb { background: #e0e7ef; border-radius: 4px; }
    .clip-item { background: #f7fafc; border-radius: 7px; padding: 0.6em 0.8em; margin-bottom: 0.6em; display: flex; align-items: center; justify-content: space-between; word-break: break-word; }
    .clip-text { flex-grow: 1; margin-right: 1em; font-size: 1em; }
    .clip-actions .btn { font-size: 0.95em; padding: 0.15em 0.7em; border-radius: 5px; margin-left: 0.2em; }
    .help-section { margin-bottom: 1em; font-size: 1em; }
    .faq-section { margin-top: 1.1em; margin-bottom: 0.3em; font-size: 1em; background: #f7fafc; border-radius: 8px; padding: 1em; box-shadow: 0 1px 4px #e0e7ef; }
    .faq-section summary { font-weight: bold; font-size: 1.07em; cursor: pointer; margin-bottom: 0.5em; }
    .back-link { display: inline-block; margin-bottom: 1em; color: #007bff; text-decoration: none; font-weight: bold; font-size: 1em; }
    .back-link:hover { text-decoration: underline; }
    .language-select {
      text-align: right;
      padding: 20px 40px 0 0;
      margin-bottom: 0.7em;
      position: relative;
      z-index: 5;
    }
    .language-select label {
      margin-right: 8px;
      font-size: 1.08em;
      font-weight: 600;
      color: #185a9d;
    }
    #clipboard-lang-select {
      min-width: 150px;
      font-size: 1.08em;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #43cea2;
      background: linear-gradient(90deg, #43cea2 0%, #185a9d 100%);
      color: #fff;
      margin-left: 6px;
      margin-right: 4px;
      box-shadow: 0 2px 8px #e0e7ef;
      transition: background 0.2s;
      font-weight: 600;
    }
    #clipboard-lang-select option {
      color: #185a9d;
      background: #f4f7fb;
      font-weight: 500;
    }
    body[dir="rtl"] .language-select {
      text-align: left;
      padding: 20px 0 0 40px;
    }
    body[dir="rtl"] #clipboard-lang-select {
      margin-left: 4px;
      margin-right: 6px;
    }
    @media (max-width: 1100px) { .main-container{padding:0 8px;} .center-row{gap:1em;} .tool-card,.article-card{width:97vw;max-width:540px;height:auto;} }
    @media (max-width: 800px) { .main-container{padding:0;} .center-row{flex-direction:column;align-items:center;} .tool-card,.article-card{width:98vw;max-width:540px;height:auto;} .article-card { display: none !important; } }
    details[open] summary::after { content: " ▲"; font-size: 0.9em; }
    details summary { cursor: pointer; padding: 0.35em 0; font-weight: bold; font-size: 1.09em; }
    details:not([open]) summary::after { content: " ▼"; font-size: 0.9em; }
  </style>
</head>

    let clips = JSON.parse(localStorage.getItem('clipboardClips') || '[]');

    function updateClipboardLanguage() {
      const lang = document.getElementById("clipboard-lang-select").value;
      document.body.dir = (lang === "ar") ? "rtl" : "ltr";
      document.getElementById("language-label").textContent = clipboardTranslations[lang]["language-label"] || clipboardTranslations["en"]["language-label"];
      document.getElementById("back-link").textContent = clipboardTranslations[lang]["back-link"] || clipboardTranslations["en"]["back-link"];
      document.getElementById("tool-title").innerHTML = `<i class="fa fa-clipboard"></i> ${clipboardTranslations[lang]["tool-title"] || clipboardTranslations["en"]["tool-title"]}`;
      document.getElementById("tool-help").textContent = clipboardTranslations[lang]["tool-help"] || clipboardTranslations["en"]["tool-help"];
      document.getElementById("faq-title").textContent = clipboardTranslations[lang]["faq-title"] || clipboardTranslations["en"]["faq-title"];
      document.getElementById("faq-list").innerHTML = clipboardTranslations[lang]["faq-list"] || clipboardTranslations["en"]["faq-list"];
      document.getElementById("howto-title").innerHTML = clipboardTranslations[lang]["howto-title"] || clipboardTranslations["en"]["howto-title"];
      document.getElementById("howto-steps").innerHTML = clipboardTranslations[lang]["howto-steps"] || clipboardTranslations["en"]["howto-steps"];
      document.getElementById("howto-article-btn").textContent = clipboardTranslations[lang]["howto-article-btn"] || clipboardTranslations["en"]["howto-article-btn"];
      document.getElementById("howto-article-btn").href = clipboardTranslations[lang]["howto-article-link"] || clipboardTranslations["en"]["howto-article-link"];
      document.getElementById("tips-title").innerHTML = clipboardTranslations[lang]["tips-title"] || clipboardTranslations["en"]["tips-title"];
      document.getElementById("tips-list").innerHTML = clipboardTranslations[lang]["tips-list"] || clipboardTranslations["en"]["tips-list"];
      document.getElementById("tips-article-btn").textContent = clipboardTranslations[lang]["tips-article-btn"] || clipboardTranslations["en"]["tips-article-btn"];
      document.getElementById("tips-article-btn").href = clipboardTranslations[lang]["tips-article-link"] || clipboardTranslations["en"]["tips-article-link"];
      document.getElementById("clipboardInput").placeholder = clipboardTranslations[lang]["clipboardInput"] || clipboardTranslations["en"]["clipboardInput"];
      document.getElementById("add-btn").textContent = clipboardTranslations[lang]["add-btn"] || clipboardTranslations["en"]["add-btn"];
      renderClips();
    }

    document.getElementById("clipboard-lang-select").addEventListener("change", function() {
      localStorage.setItem('clipboardLang', this.value);
      updateClipboardLanguage();
    });

    document.addEventListener("DOMContentLoaded", function() {
      const savedLang = localStorage.getItem('clipboardLang') || 'en';
      document.getElementById('clipboard-lang-select').value = savedLang;
      updateClipboardLanguage();
    });

    function renderClips() {
      const lang = document.getElementById("clipboard-lang-select").value;
      const list = document.getElementById('clips-list');
      list.innerHTML = '';
      if (!clips.length) {
        list.innerHTML = `<div style="color:#888;">${clipboardTranslations[lang]["no-clips"] || clipboardTranslations["en"]["no-clips"]}</div>`;
        return;
      }
      clips.forEach((clip, idx) => {
        list.innerHTML += `
          <div class="clip-item">
            <span class="clip-text">${clip.text}</span>
            <div class="clip-actions">
              <button class="btn btn-success btn-sm" onclick="copyClip(${idx})" title="${clipboardTranslations[lang]["clip-copy"] || clipboardTranslations["en"]["clip-copy"]}">
                <i class="fa fa-copy"></i> ${clipboardTranslations[lang]["clip-copy"] || clipboardTranslations["en"]["clip-copy"]}
              </button>
              <button class="btn btn-danger btn-sm" onclick="deleteClip(${idx})" title="${clipboardTranslations[lang]["clip-delete"] || clipboardTranslations["en"]["clip-delete"]}">
                <i class="fa fa-trash"></i> ${clipboardTranslations[lang]["clip-delete"] || clipboardTranslations["en"]["clip-delete"]}
              </button>
            </div>
          </div>
        `;
      });
    }

    window.copyClip = function(idx) {
      navigator.clipboard.writeText(clips[idx].text)
        .then(() => {
          // Optional: Add a visual feedback
        });
    };
    window.deleteClip = function(idx) {
      clips.splice(idx, 1);
      localStorage.setItem('clipboardClips', JSON.stringify(clips));
      renderClips();
    };

    document.getElementById('clipboardForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const text = document.getElementById('clipboardInput').value.trim();
      if (!text) return;
      clips.unshift({ text });
      localStorage.setItem('clipboardClips', JSON.stringify(clips));
      document.getElementById('clipboardInput').value = '';
      renderClips();
    });
  </script>
