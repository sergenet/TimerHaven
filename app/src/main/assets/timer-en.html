  <script>
    (function () {
      // Timer logic
      var timer = null;
      var totalSeconds = 25 * 60;
      var running = false;
      function updateTimerDisplay() {
        var hrs = Math.floor(totalSeconds / 3600);
        var min = Math.floor((totalSeconds % 3600) / 60);
        var sec = totalSeconds % 60;
        var disp = document.getElementById('timerDisplay');
        if (disp) disp.textContent = String(hrs).padStart(2, '0') + ':' + String(min).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
      }

      window.adjTime = function (id, delta) {
        var el = document.getElementById(id);
        if (!el) return;
        var val = parseInt(el.value, 10);
        if (isNaN(val)) val = 0;
        val += delta;
        var max = parseInt(el.max, 10) || 59;
        var min = parseInt(el.min, 10) || 0;
        if (val > max) val = max;
        if (val < min) val = min;
        el.value = val;
        setTimerLengths();
      };
      function setTimerLengths() {
        var hrEl = document.getElementById('hours');
        var minEl = document.getElementById('minutes');
        var secEl = document.getElementById('seconds');
        var hr = hrEl ? parseInt(hrEl.value, 10) : 0;
        var min = minEl ? parseInt(minEl.value, 10) : 25;
        var sec = secEl ? parseInt(secEl.value, 10) : 0;
        hr = isNaN(hr) ? 0 : hr;
        min = isNaN(min) ? 0 : min;
        sec = isNaN(sec) ? 0 : sec;
        totalSeconds = Math.max(0, hr * 3600 + min * 60 + sec);
        updateTimerDisplay();
      }
      // Safe hookup: check elements exist before binding
      function safeBind(id, ev, fn) {
        var el = document.getElementById(id);
        if (el) el.addEventListener(ev, fn);
      }
      safeBind('hours', 'change', setTimerLengths);
      safeBind('minutes', 'change', setTimerLengths);
      safeBind('seconds', 'change', setTimerLengths);
      safeBind('startBtn', 'click', function () {
        if (running) return;
        running = true;
        timer = setInterval(function () {
          if (totalSeconds > 0) {
            totalSeconds--;
            updateTimerDisplay();
          } else {
            clearInterval(timer);
            running = false;
            if (window.TimerHavenApp) {
              window.TimerHavenApp.notifyTimerEnd("Timer Finished", "Your task session has ended.");
            }
            try { alert("Time's up!"); } catch (e) {/*ignore*/ }
          }
        }, 1000);
      });
      safeBind('pauseBtn', 'click', function () {
        if (timer) clearInterval(timer);
        running = false;
      });
      safeBind('resetBtn', 'click', function () {
        if (timer) clearInterval(timer);
        running = false;
        var hrEl = document.getElementById('hours');
        var minEl = document.getElementById('minutes');
        var secEl = document.getElementById('seconds');
        if (hrEl) hrEl.value = '0';
        if (minEl) minEl.value = '25';
        if (secEl) secEl.value = '0';
        var nameInput = document.getElementById('sessionName');
        if (nameInput) nameInput.value = '';
        setTimerLengths();
      });
      // initialize
      setTimerLengths();
      // Persistence & Sync
      var sessions = [];
      try {
        var saved = localStorage.getItem('timerSessions_en');
        if (saved) sessions = JSON.parse(saved);
      } catch (e) { sessions = []; }
      function saveSessions() {
        localStorage.setItem('timerSessions_en', JSON.stringify(sessions));
        requestAnimationFrame(renderSessions);
      }
      function renderSessions() {
        var log = document.getElementById('sessionLog');
        if (!log) return;
        if (sessions.length === 0) {
          log.innerHTML = '<div class="text-muted">No sessions logged yet.</div>';
          return;
        }
        log.innerHTML = sessions.map(function (s, idx) {
          return '<div style="margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid #f0f0f0; display:flex; justify-content:space-between; align-items:center;">' +
            '<div><strong>' + (s.name || 'Unnamed Session') + '</strong><br>' +
            '<span class="text-muted" style="font-size:0.8rem;">' + s.duration + ' — ' + s.date + '</span></div>' +
            '<button class="btn btn-sm btn-outline-danger" onclick="deleteSession(' + idx + ')" title="Delete session"><i class="fa fa-trash"></i> Delete</button>' +
            '</div>';
        }).join('');
      }
      window.deleteSession = function (idx) {
        var removed = sessions.splice(idx, 1)[0];
        saveSessions();
        if (removed && removed.id && window.SyncManager && window.SyncManager.isAvailable()) {
          try {
            window.SyncManager.deleteTaskSession(removed.id);
          } catch (e) { }
        }
      };
      safeBind('recordBtn', 'click', function () {
        var nameInput = document.getElementById('sessionName');
        var name = nameInput ? nameInput.value.trim() : '';
        var hrEl = document.getElementById('hours');
        var minEl = document.getElementById('minutes');
        var secEl = document.getElementById('seconds');
        var hrStr = hrEl ? hrEl.value : '0';
        var minStr = minEl ? minEl.value : '25';
        var secStr = secEl ? secEl.value : '0';
        var duration = (parseInt(hrStr) > 0 ? hrStr + 'h ' : '') + minStr + 'm ' + secStr + 's';
        var session = {
          id: 'task_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
          name: name,
          duration: duration,
          date: new Date().toLocaleString(),
          timestamp: Date.now()
        };
        sessions.unshift(session);
        saveSessions();
        if (window.SyncManager && window.SyncManager.isAvailable()) {
          try {
            window.SyncManager.saveTaskSession(session.id, session);
          } catch (e) { }
        }
        if (nameInput) nameInput.value = '';
      });
      renderSessions();
      // Cloud Sync Listeners
      window.addEventListener('timerhaven:cloudDataLoaded', function (e) {
        const cloudData = e.detail;
        if (cloudData && cloudData.tasks) {
          let changed = false;
          cloudData.tasks.forEach(cloudTask => {
            const existing = sessions.find(s => s.id === cloudTask.id);
            if (!existing) {
              sessions.push(cloudTask);
              changed = true;
            }
          });
          if (changed) {
            sessions.sort(function (a, b) { return (b.timestamp || 0) - (a.timestamp || 0); });
            saveSessions();
          }
        }
      });
      window.addEventListener('timerhaven:cloudDataChanged', function () {
        if (SyncManager.isAvailable()) SyncManager.initialize();
      });
    })();
  </script>
