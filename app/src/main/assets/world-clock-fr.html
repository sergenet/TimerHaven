<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="alternate" href="https://timerhaven.com/world-clock-en.html" hreflang="en" />
  <link rel="alternate" href="https://timerhaven.com/world-clock-fr.html" hreflang="fr" />
  <link rel="alternate" href="https://timerhaven.com/world-clock-es.html" hreflang="es" />
  <link rel="alternate" href="https://timerhaven.com/world-clock-de.html" hreflang="de" />
  <link rel="alternate" href="https://timerhaven.com/world-clock-ru.html" hreflang="ru" />
  <link rel="alternate" href="https://timerhaven.com/world-clock-el.html" hreflang="el" />
  <link rel="alternate" href="https://timerhaven.com/world-clock-ar.html" hreflang="ar" />
  <link rel="alternate" href="https://timerhaven.com/world-clock-en.html" hreflang="x-default" />
  <title>Horloge mondiale &mdash; TimerHaven</title>
  <meta name="description" content="Voyez l'heure partout dans le monde instantanément.">
  <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
  <style>
    body {
      background: #f4f7fb;
      font-family: 'Montserrat', Arial, sans-serif;
      color: #0b2545;
      margin: 0;
    }

    .main-container {
      max-width: 1200px;
      margin: 2.4rem auto;
      padding: 0 1rem;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
    }

    .tool-card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 6px 20px rgba(11, 37, 69, 0.06);
      width: 480px;
      padding: 1.6rem;
      box-sizing: border-box;
    }

    .back-link {
      color: #0d6efd;
      display: inline-block;
      margin-bottom: .6rem;
      text-decoration: none;
      font-weight: 700;
    }

    .tool-title {
      color: #185a9d;
      font-size: 1.35rem;
      margin: 0 0 .6rem 0;
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .clock-item {
      background: #f7fafc;
      border-radius: 8px;
      padding: .8rem;
      margin-bottom: .6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    @media (max-width:900px) {
      .tool-card {
        width: 98vw;
      }
    }

    .btn {
      display: inline-block;
      font-weight: 400;
      text-align: center;
      cursor: pointer;
      padding: .375rem .75rem;
      font-size: 1rem;
      line-height: 1.5;
      border-radius: .25rem;
      border: 1px solid transparent;
      text-decoration: none;
    }

    .btn-success {
      color: #fff;
      background-color: #28a745;
      border-color: #28a745;
    }

    .btn-outline-secondary {
      color: #6c757d;
      border-color: #6c757d;
      background-color: transparent;
    }

    .btn-outline-danger {
      color: #dc3545;
      border-color: #dc3545;
      background-color: transparent;
    }

    .btn-sm {
      padding: .25rem .5rem;
      font-size: .875rem;
      border-radius: .2rem;
    }

    .btn:active {
      opacity: 0.8;
      transform: scale(0.98);
    }

    .form-control {
      display: block;
      width: 100%;
      padding: .375rem .75rem;
      font-size: 1rem;
      color: #495057;
      background-color: #fff;
      border: 1px solid #ced4da;
      border-radius: .25rem;
      box-sizing: border-box;
    }

    .autocomplete-wrap {
      position: relative;
    }

    .autocomplete-list {
      position: absolute;
      left: 0;
      right: 0;
      z-index: 1000;
      background: #fff;
      border: 1px solid #ced4da;
      border-radius: 0 0 .25rem .25rem;
      max-height: 220px;
      overflow-y: auto;
      margin: 0;
      padding: 0;
      list-style: none;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      display: none;
    }

    .autocomplete-list li {
      padding: .5rem .75rem;
      cursor: pointer;
      font-size: .95rem;
      border-bottom: 1px solid #f0f0f0;
      color: #333;
    }

    .autocomplete-list li:hover,
    .autocomplete-list li.active {
      background: #e9f0ff;
    }

    .analog-clock {
      width: 50px;
      height: 50px;
      flex-shrink: 0;
    }

    @media (max-width:520px) {
      .tool-card {
        padding: 12px;
      }
    }
  </style>
</head>

<body>
  <main class="main-container" role="main">
    <section class="tool-card" aria-labelledby="tool-title">
      <a href="index.html" class="back-link" onclick="window.location.href='index.html'; return false;">&larr; Retour au
        menu principal</a>
      <h3 id="tool-title" class="tool-title"><i class="fa fa-globe"></i> Horloge mondiale</h3>
      <div style="margin-bottom:.8rem;color:#374151;line-height:1.5;">
        <p>Ajoutez des villes ou collez un fuseau horaire IANA pour comparer les heures locales.</p>
      </div>
      <div>
        <form id="clockForm" onsubmit="return false;">
          <div class="autocomplete-wrap">
            <input type="text" id="cityInput" class="form-control" placeholder="Entrez le nom d'une ville..."
              autocomplete="off">
            <ul class="autocomplete-list" id="autocompleteList"></ul>
          </div>
          <div style="display:flex; gap:.5rem; margin-top:.5rem;">
            <select id="citySelect" class="form-control" style="flex:1;">
              <option value="" disabled selected>Choisir dans la liste</option>
            </select>
            <button id="addClockBtn" class="btn btn-success btn-sm" type="button" style="min-width:80px;"><i
                class="fa fa-plus"></i> Ajouter</button>
          </div>
          <div style="margin-top:.6rem;">
            <button id="clearClocksBtn" class="btn btn-outline-secondary btn-sm" type="button">Tout effacer</button>
          </div>
        </form>
        <div id="errorMsg" style="color:#b00;margin-top:.6rem;"></div>
        <div id="clockList" style="margin-top:.8rem;"></div>
      </div>
    </section>
  </main>
  <script src="assets/vendor/luxon.min.js"></script>
  <script>if (typeof luxon === 'undefined') window.luxon = { DateTime: { now: () => ({ setZone: () => ({ isValid: false, toFormat: () => 'missing' }) }) } };</script>
  <script>
    const PAGE_LANG = 'fr';
    const { DateTime } = luxon;
    function escapeHtml(s) { if (!s) return ''; return String(s).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;'); }

    function drawAnalogClock(canvas, tz) {
      const ctx = canvas.getContext('2d');
      const size = canvas.width, r = size / 2;
      ctx.clearRect(0, 0, size, size);
      let now;
      try { now = DateTime.now().setZone(tz); if (!now.isValid) return; } catch { return; }
      const h = now.hour % 12, m = now.minute, s = now.second;
      ctx.save(); ctx.translate(r, r);
      ctx.beginPath(); ctx.arc(0, 0, r - 2, 0, 2 * Math.PI); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#185a9d'; ctx.lineWidth = 2; ctx.stroke();
      for (let i = 0; i < 12; i++) { const a = (i * Math.PI) / 6, inn = r - 8, out = r - 3; ctx.beginPath(); ctx.moveTo(inn * Math.sin(a), -inn * Math.cos(a)); ctx.lineTo(out * Math.sin(a), -out * Math.cos(a)); ctx.strokeStyle = '#0b2545'; ctx.lineWidth = i % 3 === 0 ? 2 : 1; ctx.stroke(); }
      const hA = ((h + m / 60) * Math.PI) / 6; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo((r * 0.5) * Math.sin(hA), -(r * 0.5) * Math.cos(hA)); ctx.strokeStyle = '#0b2545'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke();
      const mA = ((m + s / 60) * Math.PI) / 30; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo((r * 0.7) * Math.sin(mA), -(r * 0.7) * Math.cos(mA)); ctx.strokeStyle = '#185a9d'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.stroke();
      const sA = (s * Math.PI) / 30; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo((r * 0.75) * Math.sin(sA), -(r * 0.75) * Math.cos(sA)); ctx.strokeStyle = '#dc3545'; ctx.lineWidth = 1; ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 2, 0, 2 * Math.PI); ctx.fillStyle = '#0b2545'; ctx.fill();
      ctx.restore();
    }

    const FALLBACK_CITIES = [
      { name: "Athens", timezone: "Europe/Athens" }, { name: "Bangkok", timezone: "Asia/Bangkok" },
      { name: "Beijing", timezone: "Asia/Shanghai" }, { name: "Berlin", timezone: "Europe/Berlin" },
      { name: "Boston", timezone: "America/New_York" }, { name: "Buenos Aires", timezone: "America/Argentina/Buenos_Aires" },
      { name: "Cairo", timezone: "Africa/Cairo" }, { name: "Chicago", timezone: "America/Chicago" },
      { name: "Dubai", timezone: "Asia/Dubai" }, { name: "London", timezone: "Europe/London" },
      { name: "Madrid", timezone: "Europe/Madrid" }, { name: "Mexico City", timezone: "America/Mexico_City" },
      { name: "Mumbai", timezone: "Asia/Kolkata" }, { name: "New York", timezone: "America/New_York" },
      { name: "Paris", timezone: "Europe/Paris" }, { name: "Rome", timezone: "Europe/Rome" },
      { name: "San Francisco", timezone: "America/Los_Angeles" }, { name: "Sao Paulo", timezone: "America/Sao_Paulo" },
      { name: "Seoul", timezone: "Asia/Seoul" }, { name: "Sydney", timezone: "Australia/Sydney" },
      { name: "Tokyo", timezone: "Asia/Tokyo" }, { name: "Toronto", timezone: "America/Toronto" }
    ];

    let selectedCity = null, latestQuery = '', activeIdx = -1;
    const cityInput = document.getElementById('cityInput');
    const acList = document.getElementById('autocompleteList');
    const citySelect = document.getElementById('citySelect');

    // Populate dropdown
    FALLBACK_CITIES.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.name + '|' + c.timezone;
      opt.textContent = c.name + ' (' + c.timezone + ')';
      citySelect.appendChild(opt);
    });

    // Dropdown auto-add
    citySelect.addEventListener('change', function () {
      const val = this.value;
      if (!val) return;
      const [name, tz] = val.split('|');
      addClock(name, tz);
      this.selectedIndex = 0;
      cityInput.value = '';
    });

    function renderAC(entries) {
      activeIdx = -1;
      if (!entries || entries.length === 0) { acList.style.display = 'none'; return; }
      acList.innerHTML = entries.map((e, i) => {
        let label = e.name;
        if (e.countryName) label += ` \u2014 ${e.countryName}`;
        return `<li data-idx="${i}" data-name="${escapeHtml(e.name)}" data-tz="${escapeHtml(e.timezone)}" data-label="${escapeHtml(label)}">${escapeHtml(label)} (${escapeHtml(e.timezone)})</li>`;
      }).join('');
      acList.style.display = 'block';
      acList.querySelectorAll('li').forEach(li => { li.addEventListener('mousedown', function (ev) { ev.preventDefault(); pickItem(this); }); });
    }

    function pickItem(li) {
      const name = li.getAttribute('data-name'), tz = li.getAttribute('data-tz'), label = li.getAttribute('data-label');
      acList.style.display = 'none';
      addClock(label, tz);
      cityInput.value = '';
      selectedCity = null;
    }

    async function fetchCities(query) {
      latestQuery = query;
      if (!query || query.length < 3) { renderAC([]); return; }
      try {
        const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=10&language=${PAGE_LANG}&format=json`);
        const data = await res.json();
        if (latestQuery !== query) return;
        if (data && data.results && data.results.length > 0) {
          const mapped = data.results.map(r => ({ name: r.name, countryName: r.admin1 ? `${r.admin1}, ${r.country || ''}` : (r.country || ''), timezone: r.timezone || 'UTC' }));
          renderAC(mapped);
          return;
        }
      } catch (e) { console.warn("Open-Meteo fetch failed.", e); }
      if (latestQuery !== query) return;
      const q = query.toLowerCase();
      renderAC(FALLBACK_CITIES.filter(e => e.name.toLowerCase().includes(q) || e.timezone.toLowerCase().includes(q)));
    }

    let debounceTimer;
    cityInput.addEventListener('input', function () { selectedCity = null; clearTimeout(debounceTimer); debounceTimer = setTimeout(() => fetchCities(this.value.trim()), 300); });
    cityInput.addEventListener('keydown', function (e) {
      const items = acList.querySelectorAll('li');
      if (!items.length) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = Math.min(activeIdx + 1, items.length - 1); items.forEach((li, i) => li.classList.toggle('active', i === activeIdx)); items[activeIdx].scrollIntoView({ block: 'nearest' }); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); activeIdx = Math.max(activeIdx - 1, 0); items.forEach((li, i) => li.classList.toggle('active', i === activeIdx)); items[activeIdx].scrollIntoView({ block: 'nearest' }); }
      else if (e.key === 'Enter') { e.preventDefault(); if (activeIdx >= 0 && activeIdx < items.length) pickItem(items[activeIdx]); else if (this.value.trim()) manualAdd(this.value.trim()); }
    });
    cityInput.addEventListener('blur', function () { setTimeout(() => { acList.style.display = 'none'; }, 200); });

    let clocks = JSON.parse(localStorage.getItem('worldClocks_fr') || '[]');
    function saveClocks() { localStorage.setItem('worldClocks_fr', JSON.stringify(clocks)); }

    function renderClocks() {
      const list = document.getElementById('clockList');
      list.innerHTML = '';
      if (!clocks || clocks.length === 0) { list.innerHTML = '<div style="color:#888;">Aucune horloge ajoutée.</div>'; return; }
      clocks.forEach((clock, idx) => {
        let timeStr = '...'; let error = false;
        try {
          const now = DateTime.now().setZone(clock.tz);
          if (!now.isValid) throw new Error('invalid');
          timeStr = now.toFormat('cccc, dd LLL yyyy') + '<br>' + now.toFormat('HH:mm:ss');
        } catch { timeStr = 'Fuseau horaire invalide'; error = true; }
        const div = document.createElement('div');
        div.className = 'clock-item';
        const canvasId = 'clock-canvas-' + idx;
        div.innerHTML = `
        <div style="display:flex;gap:.9rem;align-items:center;">
          <canvas id="${canvasId}" class="analog-clock" width="100" height="100"></canvas>
          <div style="min-width:0;">
            <div style="font-weight:700;">${escapeHtml(clock.label)}</div>
            <div style="font-size:.95rem;color:#444;">${timeStr}${error ? ' <span style="color:#b00;">(vérifiez le fuseau)</span>' : ''}</div>
          </div>
        </div>
        <div><button class="btn btn-outline-danger btn-sm" onclick="deleteClock(${idx})" aria-label="Delete"><i class="fa fa-trash"></i></button></div>`;
        list.appendChild(div);
        const canvas = document.getElementById(canvasId);
        if (canvas && !error) drawAnalogClock(canvas, clock.tz);
      });
    }

    function addClock(label, tz) { clocks.push({ label, tz }); saveClocks(); renderClocks(); document.getElementById('errorMsg').textContent = ''; }
    function manualAdd(input) {
      if (/^[A-Za-z]+\/[A-Za-z_+\-\/]+$/.test(input) || /^(GMT|UTC)[+-]?\d*$/i.test(input)) {
        try { const test = DateTime.now().setZone(input); if (test.isValid) { addClock(input, input); cityInput.value = ''; return; } } catch { }
      }
      document.getElementById('errorMsg').textContent = 'Ville non trouvée. Tapez au moins 3 caractères pour chercher, ou entrez un fuseau IANA (ex. Europe/Paris).';
    }

    document.getElementById('addClockBtn').addEventListener('click', function () {
      document.getElementById('errorMsg').textContent = '';
      if (selectedCity) { addClock(selectedCity.label, selectedCity.timezone); cityInput.value = ''; selectedCity = null; return; }
      const dropVal = citySelect.value;
      if (dropVal) { const [name, tz] = dropVal.split('|'); addClock(name, tz); citySelect.selectedIndex = 0; return; }
      const val = cityInput.value.trim();
      if (!val) { document.getElementById('errorMsg').textContent = 'Veuillez sélectionner ou entrer un nom de ville.'; return; }
      manualAdd(val);
    });
    document.getElementById('clearClocksBtn').addEventListener('click', function () {
      if (!clocks || clocks.length === 0) return;
      if (!confirm('Effacer toutes les horloges ?')) return;
      clocks = []; saveClocks(); renderClocks();
    });
    window.deleteClock = function (idx) { clocks.splice(idx, 1); saveClocks(); renderClocks(); }
    setInterval(() => renderClocks(), 1000);
    renderClocks();
  </script>
</body>

</html>
