      </div>
      <div class="tool-help" style="color:#6b7c89; margin-bottom:.8rem; display:none;">
        Boost focus with the Pomodoro technique. Set work and break durations and begin focused sessions.
      </div>
      <div class="pomodoro-section" aria-live="polite">
        <div class="mb-2" style="display:flex;gap:.8rem;flex-wrap:wrap;">
          <label style="font-weight:600;">Work (min):
            <input id="workLength" type="number" min="1" max="60" value="25" class="form-control"
              style="width:100px; margin-left:.4rem;">
          </label>
          <label style="font-weight:600;">Break (min):
            <input id="breakLength" type="number" min="1" max="30" value="5" class="form-control"
              style="width:100px; margin-left:.4rem;">
          </label>
        </div>
        <div id="pomodoroStatus" style="font-weight:600; margin-bottom:.25rem;">Work</div>
        <div id="pomodoroDisplay" class="pomodoro-display">25:00</div>
        <div class="controls-row">
          <button id="startBtn" class="btn btn-success btn-small"><i class="fa fa-play"></i> Start</button>
          <button id="pauseBtn" class="btn btn-secondary btn-small"><i class="fa fa-pause"></i> Pause</button>
          <button id="resetBtn" class="btn btn-danger btn-small"><i class="fa fa-refresh"></i> Reset</button>
        </div>
        <div id="pomodoroCycle" style="margin-top:.5rem; color:#185a9d; font-weight:600;">Completed cycles: 0</div>
        <div class="toggles" aria-hidden="false" style="margin-top:.6rem;">
          <label style="display:flex; align-items:center; gap:.35rem;">
            <input type="checkbox" id="beepToggle" checked> Beep on end
          </label>
          <label style="display:flex; align-items:center; gap:.35rem;">
            <input type="checkbox" id="autoStartToggle"> Auto-start next period
          </label>
        </div>
      </div>
    </section>

  </main>
  <script>
    (function () {
      // State
      let timer = null;
      let running = false;
      let isWork = true;
      let timeLeft = 25 * 60;
      let cycleCount = 0;
      let beepToggleEl, autoStartToggleEl;

      // Play a beep using WebAudio oscillator (Android WebView compatible)
      function playBeep() {
        try {
          var ctx = new (window.AudioContext || window.webkitAudioContext)();
          if (ctx.state === 'suspended') ctx.resume();
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(800, ctx.currentTime);
          gain.gain.setValueAtTime(1.0, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.0);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 1.0);
        } catch (e) {
          if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
        }
      }

      // Vibrate (if supported)
      function vibrate(duration) {
        try { if (navigator.vibrate) navigator.vibrate(duration || 400); } catch (e) { }
      }

      // Called when a period ends
      function onPeriodEnd() {
        if (beepToggleEl && beepToggleEl.checked) {
          playBeep();
        }
        vibrate(300);
        if (isWork) cycleCount++;
        isWork = !isWork;
        setLengths();
        try {
          var status = document.getElementById('pomodoroStatus');
          if (status) {
            status.setAttribute('aria-live', 'polite');
            status.textContent = isWork ? "Work" : "Break";
          }
        } catch (e) { }
        if (autoStartToggleEl && autoStartToggleEl.checked) {
          setTimeout(function () { startTimer(); }, 250);
        }
      }

      // Update display
      function updateDisplay() {
        var disp = document.getElementById('pomodoroDisplay');
        var status = document.getElementById('pomodoroStatus');
        var cycleEl = document.getElementById('pomodoroCycle');
        if (!disp || !status || !cycleEl) return;
        var min = Math.floor(timeLeft / 60);
        var sec = timeLeft % 60;
        disp.textContent = String(min).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
        status.textContent = isWork ? "Work" : "Break";
        cycleEl.textContent = "Completed cycles: " + cycleCount;
      }

      // Set timer lengths for current period
      function setLengths() {
        var workEl = document.getElementById('workLength');
        var breakEl = document.getElementById('breakLength');
        if (!workEl || !breakEl) return;
        if (isWork) {
          timeLeft = parseInt(workEl.value, 10) * 60;
        } else {
          timeLeft = parseInt(breakEl.value, 10) * 60;
        }
        updateDisplay();
      }

      // Start/Pause/Reset
      function startTimer() {
        if (running) return;
        running = true;
        timer = setInterval(function () {
          if (timeLeft > 0) {
            timeLeft--;
            updateDisplay();
          } else {
            clearInterval(timer);
            running = false;
            onPeriodEnd();
          }
        }, 1000);
      }
      function pauseTimer() {
        if (timer) clearInterval(timer);
        running = false;
      }
      function resetTimer() {
        if (timer) clearInterval(timer);
        running = false;
        cycleCount = 0;
        isWork = true;
        setLengths();
      }


      // Native bridge: let the Android app mirror this session (notification + widget).
      window.TimerHavenPomodoro = {
        getState: function () {
          function num(id, fallback) {
            var el = document.getElementById(id);
            var value = el ? parseInt(el.value, 10) : NaN;
            return isNaN(value) ? fallback : value;
          }
          return {
            running: running,
            phase: isWork ? 'work' : 'break',
            remaining: timeLeft,
            workMin: num('workLength', 25),
            breakMin: num('breakLength', 5),
            cycles: cycleCount
          };
        },
        restore: function (state) {
          if (!state) return;
          var workEl = document.getElementById('workLength');
          var breakEl = document.getElementById('breakLength');
          if (workEl && state.workMin) workEl.value = state.workMin;
          if (breakEl && state.breakMin) breakEl.value = state.breakMin;
          isWork = state.phase !== 'break';
          cycleCount = state.cycles || 0;
          if (timer) clearInterval(timer);
          running = false;
          if (typeof state.remaining === 'number') timeLeft = state.remaining;
          updateDisplay();
          if (state.running && timeLeft > 0) startTimer();
        }
      };

      function attachIfExists(id, event, cb) {
        var el = document.getElementById(id);
        if (el) el.addEventListener(event, cb);
      }

      // Initialize
      function initPomodoro() {
        beepToggleEl = document.getElementById('beepToggle');
        autoStartToggleEl = document.getElementById('autoStartToggle');
        attachIfExists('workLength', 'change', setLengths);
        attachIfExists('breakLength', 'change', setLengths);
        attachIfExists('startBtn', 'click', function () { startTimer(); });
        attachIfExists('pauseBtn', 'click', function () { pauseTimer(); });
        attachIfExists('resetBtn', 'click', function () { resetTimer(); });
        // Create AudioContext on first click to satisfy autoplay policy
        document.addEventListener('click', function onFirstClick() {
          try { new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { }
          document.removeEventListener('click', onFirstClick);
        });
        setLengths();
      }

      document.addEventListener('DOMContentLoaded', function () {
        try {
          var help = document.getElementById('tool-help');
          if (help && help.dataset && help.dataset.preserve === 'true') { /* keep */ }
        } catch (e) { }
        initPomodoro();
      });
    })();
  </script>
