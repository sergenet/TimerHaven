  <!-- Robust city population script via Open-Meteo Autocomplete -->
  <script>
    (function () {
      const select = document.getElementById('cityDropdown');
      const cityInput = document.getElementById('cityInput');
      if (!select) return;

      function escapeHtml(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      const FALLBACK_CITIES = [
        "Auckland", "Bangkok", "Beijing", "Berlin", "Cairo", "Cape Town", "Chicago", "Dhaka", "Delhi", "Dubai",
        "Hanoi", "Helsinki", "Hong Kong", "Istanbul", "Jakarta", "Johannesburg", "Kolkata", "Kuala Lumpur",
        "Lagos", "Lahore", "Lima", "Lisbon", "London", "Los Angeles", "Madrid", "Manila", "Melbourne",
        "Mexico City", "Milan", "Montreal", "Moscow", "Mumbai", "Nairobi", "New York", "Osaka", "Oslo",
        "Paris", "Perth", "Prague", "Quito", "Rio de Janeiro", "Riyadh", "Rome", "San Francisco", "Santiago",
        "São Paulo", "Seoul", "Shanghai", "Shenzhen", "Singapore", "Stockholm", "Sydney", "Taipei", "Tokyo",
        "Toronto", "Vancouver", "Vienna", "Warsaw", "Wellington"
      ];

      function getOrCreateList(inputEl) {
        let ul = inputEl.nextElementSibling;
        if (!ul || !ul.classList.contains('autocomplete-list')) {
          ul = document.createElement('ul');
          ul.className = 'autocomplete-list';
          ul.style.cssText = 'position:absolute; left:0; right:0; z-index:1000; background:#fff; border:1px solid #ced4da; border-radius:0 0 .25rem .25rem; max-height:200px; overflow-y:auto; margin:0; padding:0; list-style:none; box-shadow:0 4px 6px rgba(0,0,0,0.1); display:none; text-align:left;';
          inputEl.parentNode.style.position = 'relative';
          inputEl.parentNode.insertBefore(ul, inputEl.nextSibling);
        }
        return ul;
      }

      function renderAutocomplete(entries, inputEl, targetSel) {
        const ul = getOrCreateList(inputEl);
        if (!entries || entries.length === 0) {
          ul.style.display = 'none';
          return;
        }
        ul.innerHTML = entries.map(c => `<li style="padding:.5rem .75rem; cursor:pointer; font-size:.95rem; border-bottom:1px solid #f0f0f0; color:#333;" data-val="${escapeHtml(c)}">${escapeHtml(c)}</li>`).join('');
        ul.style.display = 'block';

        ul.querySelectorAll('li').forEach(li => {
          li.onclick = function() {
             const val = this.getAttribute('data-val');
             targetSel.innerHTML = `<option value="${val}" selected>${val}</option>`;
             targetSel.value = val;
             inputEl.value = val;
             ul.style.display = 'none';
             targetSel.dispatchEvent(new Event('change'));
          };
        });
      }

            let latestQuery = '';
      async function fetchCities(query, inputEl, targetSel) {
        latestQuery = query;
        if (!query || query.length < 2) {
          renderAutocomplete(FALLBACK_CITIES, inputEl, targetSel);
          return;
        }
        try {
          let lang = 'en';
          if (document.documentElement && document.documentElement.lang) {
            lang = document.documentElement.lang.slice(0, 2);
          }
          const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=10&language=${lang}&format=json`);
          const data = await res.json();
          if (latestQuery !== query) return; // Prevent race conditions
          if (data && data.results && data.results.length > 0) {
            const mapped = data.results.map(r => r.name + (r.admin1 ? ', ' + r.admin1 : '') + (r.country ? ', ' + r.country : ''));
            renderAutocomplete(Array.from(new Set(mapped)), inputEl, targetSel);
            return;
          }
        } catch(e) { console.warn("Open-Meteo fetch failed.", e); }
        if (latestQuery !== query) return;
        const q = query.toLowerCase();
        renderAutocomplete(FALLBACK_CITIES.filter(e => e.toLowerCase().includes(q)), inputEl, targetSel);
      }

      let debounceTimer;
      if (cityInput) {
        cityInput.addEventListener('input', (e) => {
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(() => fetchCities(e.target.value.trim(), cityInput, select), 400);
        });
        cityInput.addEventListener('focus', (e) => {
          if(!e.target.value.trim()) fetchCities('', cityInput, select);
        });
      }

      document.addEventListener('click', e => {
         document.querySelectorAll('.autocomplete-list').forEach(ul => {
           if (!ul.contains(e.target) && e.target !== ul.previousElementSibling) {
             ul.style.display = 'none';
           }
         });
      });

      select.innerHTML = '<option value="">Select city...</option>' + FALLBACK_CITIES.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');

    })();
  </script>
  <!-- full weather logic (unchanged) -->
  <script>
    /* Full EN page JS with robust mobile-friendly geolocation helper */
    const DEFAULT_PAGE_LANG = 'en';
    const SUPPORTED_LANGS = ['en', 'fr', 'de', 'es', 'ru', 'el', 'ar'];
    const PAGE_LANG = 'en';
    const UI_STRINGS = {
      en: { PLEASE_SELECT: "Please select or enter a city.", GEO_UNSUPPORTED: "Geolocation not supported.", UNABLE_LOCATION: "Unable to get your location.", FETCH_ERROR: "Error fetching weather data.", NOT_FOUND_TEMPLATE: "Could not find weather for \"{city}\".", SELECT_CITY_PLACEHOLDER: "Select city...", OR_ENTER_CITY_PLACEHOLDER: "Or enter city..." }
    };
    const WEATHERCODE_DESC = {
      0: { en: "Clear sky" },
      1: { en: "Mainly clear" },
      2: { en: "Partly cloudy" },
      3: { en: "Overcast" },
      45: { en: "Fog" },
      48: { en: "Depositing rime fog" },
      51: { en: "Light drizzle" },
      53: { en: "Moderate drizzle" },
      55: { en: "Dense drizzle" },
      56: { en: "Light freezing drizzle" },
      57: { en: "Dense freezing drizzle" },
      61: { en: "Slight rain" },
      63: { en: "Moderate rain" },
      65: { en: "Heavy rain" },
      71: { en: "Slight snow fall" },
      73: { en: "Moderate snow fall" },
      75: { en: "Heavy snow fall" },
      80: { en: "Slight rain showers" },
      81: { en: "Moderate rain showers" },
      82: { en: "Violent rain showers" },
      95: { en: "Thunderstorm" },
      96: { en: "Thunderstorm with slight hail" },
      99: { en: "Thunderstorm with heavy hail" }
    };
    const TEMP_UNIT_KEY = 'timerhavenTempUnit';
    const DEFAULT_UNIT = 'C';
    let LAST_QUERY = null;
    function getStoredUnit() {
      try { const u = localStorage.getItem(TEMP_UNIT_KEY); if (u === 'C' || u === 'F') return u; } catch (e) { }
      return DEFAULT_UNIT;
    }
    function setStoredUnit(u) { try { localStorage.setItem(TEMP_UNIT_KEY, u); } catch (e) { } }
    function applyUnitUI() {
      const u = getStoredUnit();
      const c = document.getElementById('unitC'), f = document.getElementById('unitF');
      if (!c || !f) return;
      if (u === 'C') { c.classList.add('active'); f.classList.remove('active'); } else { f.classList.add('active'); c.classList.remove('active'); }
    }
    function reapplyLastQuery() {
      if (!LAST_QUERY) return;
      if (LAST_QUERY.type === 'coords' && LAST_QUERY.lat != null && LAST_QUERY.lon != null) {
        fetchOpenMeteoForecast(LAST_QUERY.lat, LAST_QUERY.lon).then(fore => { try { document.getElementById('weatherResult').innerHTML = renderOpenMeteo(fore, LAST_QUERY.placeName || ''); } catch (e) { } });
      } else if (LAST_QUERY.type === 'city' && LAST_QUERY.city) {
        fetchWeather(LAST_QUERY.city);
      } else if (LAST_QUERY.type === 'backend' && LAST_QUERY.city) {
        fetchBackendCity(LAST_QUERY.city);
      }
    }
    function t(key, vars) {
      const dict = UI_STRINGS[PAGE_LANG] || UI_STRINGS[DEFAULT_PAGE_LANG];
      let s = dict[key] || '';
      if (vars && typeof vars === 'object') { Object.keys(vars).forEach(k => { s = s.replace('{' + k + '}', vars[k]); }); }
      return s;
    }
    function describeWeatherCode(code) {
      const obj = WEATHERCODE_DESC[code];
      if (!obj) return String(code);
      return obj[PAGE_LANG] || obj['en'] || String(code);
    }
    function localizedWeekday(dateStr) {
      try { const d = new Date(dateStr); return new Intl.DateTimeFormat(PAGE_LANG, { weekday: 'short' }).format(d); } catch (e) { return dateStr; }
    }
    function getWeatherEmoji(code) {
      if (code === null || code === undefined) return '•';
      if (code === 0) return '☀️';
      if (code === 1 || code === 2) return '🌤️';
      if (code === 3) return '☁️';
      if ([45, 48].includes(code)) return '🌫️';
      if ([51, 53, 55, 56, 57].includes(code)) return '🌦️';
      if ([61, 63, 65, 80, 81, 82].includes(code)) return '🌧️';
      if ([71, 73, 75].includes(code)) return '❄️';
      if ([95, 96, 99].includes(code)) return '⛈️';
      return '🌤️';
    }
    function renderOpenMeteo(forecast, placeName) {
      const unit = getStoredUnit();
      const tempSymbol = (unit === 'F') ? '°F' : '°C';
      const speedUnit = (unit === 'F') ? 'mph' : 'm/s';
      const cw = forecast.current_weather || {};
      const daily = forecast.daily || {};
      const parts = [];
      const title = `<div style="font-weight:700; margin-bottom:6px;">${placeName || ''}</div>`;
      const weatherLabel = describeWeatherCode(cw.weathercode);
      const currentHtml = `<div style="display:flex;gap:.6rem;align-items:center;">
      <div style="flex:1"><div style="font-weight:700;font-size:1.05rem;">${weatherLabel}</div></div>
      <div style="text-align:right;min-width:110px">
        <div style="font-size:1.45rem;font-weight:700;">${typeof cw.temperature === 'number' ? Math.round(cw.temperature) + tempSymbol : 'N/A'
        }</div>
      <div style="color:#6b7280;">Wind ${typeof cw.windspeed === 'number' ? Math.round(cw.windspeed) + ' ' + speedUnit : 'N/A'}</div>
      </div>
    </div>`;
      parts.push(title + currentHtml);
      if (daily.time && daily.time.length) {
        const days = daily.time.map((d, i) => {
          const maxT = daily.temperature_2m_max && daily.temperature_2m_max[i] !== undefined ? Math.round(daily.temperature_2m_max[i]) : ' ? ';
          const minT = daily.temperature_2m_min && daily.temperature_2m_min[i] !== undefined ? Math.round(daily.temperature_2m_min[i]) : ' ? ';
          const code = daily.weathercode && daily.weathercode[i] !== undefined ? daily.weathercode[i] : null;
          const desc = code !== null ? describeWeatherCode(code) : '';
          return { date: d, maxT, minT, code, desc };
        }).slice(0, 7);
        let grid = '<div class="forecast-grid">';
        days.forEach(day => {
          grid += `<div class="forecast-day">
                    <div class="day">${localizedWeekday(day.date)}</div>
                    <div class="weather-icon">${getWeatherEmoji(day.code)}</div>
                    <div class="desc">${day.desc}</div>
                    <div class="temp"><span style="font-weight:700;">${day.maxT}${tempSymbol}</span> / ${day.minT}${tempSymbol}</div>
                 </div>`;
        });
        grid += '</div>';
        parts.push(grid);
      }
      return parts.join('');
    }
    function geocodeCity(city) {
      const cityName = city.split(",")[0].trim();
      const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=${PAGE_LANG}`;
      return fetch(url).then(r => r.json()).then(j => {
        if (j && Array.isArray(j.results) && j.results.length > 0) {
          const r0 = j.results[0];
          return { latitude: r0.latitude, longitude: r0.longitude, name: r0.name + (r0.country ? ', ' + r0.country : '') };
        }
        return null;
      }).catch(() => null);
    }
    function fetchOpenMeteoForecast(lat, lon) {
      const unit = getStoredUnit();
      const temperature_unit = (unit === 'F') ? 'fahrenheit' : 'celsius';
      const windspeed_unit = (unit === 'F') ? 'mph' : 'ms';
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lon)}&daily=temperature_2m_max,temperature_2m_min,weathercode&current_weather=true&timezone=auto&forecast_days=7&temperature_unit=${temperature_unit}&windspeed_unit=${windspeed_unit}`;
      return fetch(url).then(r => r.json());
    }
    function fetchBackendCity(city) {
      const resultEl = document.getElementById('weatherResult');
      return fetch(`/weather?city=${encodeURIComponent(city)}`)
        .then(r => r.json())
        .then(data => {
          if (!data || (data.cod && parseInt(data.cod, 10) !== 200)) {
            const err = (data && (data.error || data.message)) || t('NOT_FOUND_TEMPLATE', { city });
            resultEl.innerHTML = `<span style="color:#b00;">${err}</span>`;
            return null;
          }
          LAST_QUERY = { type: 'backend', city };
          resultEl.innerHTML = renderWeatherData(data);
          return data;
        })
        .catch(() => {
          resultEl.innerHTML = '<span style="color:#b00;">' + t('FETCH_ERROR') + '</span>';
          return null;
        });
    }
    function renderWeatherData(data) {
      const unit = getStoredUnit();
      let tempStr = (data.main && typeof data.main.temp === 'number') ? Math.round(data.main.temp) + '°C' : 'N/A';
      if (unit === 'F' && data.main && typeof data.main.temp === 'number') tempStr = Math.round((data.main.temp * 9 / 5) + 32) + '°F';
      const windUnit = (unit === 'F') ? 'mph' : 'm/s';
      let wind = data.wind ? data.wind.speed : 'N/A';
      if (unit === 'F' && data.wind && typeof data.wind.speed === 'number') wind = Math.round(data.wind.speed * 2.23694);
      return `<b>${data.name}${data.sys && data.sys.country ? ', ' + data.sys.country : ''}</b><br>
            Weather: ${data.weather && data.weather[0] ? data.weather[0].description : 'N/A'}<br>
            Temperature: ${tempStr}<br>
            Humidity: ${data.main ? data.main.humidity : 'N/A'}%<br>
            Wind: ${wind} ${windUnit}`;
    }
    function fetchWeather(city) {
      const resultEl = document.getElementById('weatherResult');
      if (!city) {
        resultEl.innerHTML = '<span style="color:#b00;">' + t('PLEASE_SELECT') + '</span>';
        return;
      }
      resultEl.innerHTML = 'Loading...';
      geocodeCity(city).then(geo => {
        if (geo && geo.latitude != null && geo.longitude != null) {
          LAST_QUERY = { type: 'city', city };
          fetchOpenMeteoForecast(geo.latitude, geo.longitude).then(fore => {
            if (!fore) return fetchBackendCity(city);
            try {
              LAST_QUERY = { type: 'coords', lat: geo.latitude, lon: geo.longitude, placeName: geo.name, city: city };
              resultEl.innerHTML = renderOpenMeteo(fore, geo.name || city);
            } catch (e) {
              console.error('renderOpenMeteo error', e);
              resultEl.innerHTML = '<span style="color:#b00;">' + t('FETCH_ERROR') + '</span>';
            }
          }).catch(() => fetchBackendCity(city));
        } else {
          fetchBackendCity(city);
        }
      }).catch(() => fetchBackendCity(city));
    }
    // UI wiring
    try {
      const dd = document.getElementById('cityDropdown');
      if (dd) {
        dd.addEventListener('change', function () {
          const input = document.getElementById('cityInput');
          if (input) input.value = this.value;
          if (this.value) fetchWeather(this.value);
        });
      }
      const cityInput = document.getElementById('cityInput');
      if (cityInput) {
        cityInput.addEventListener('input', function () {
          const val = this.value.trim();
          const dd2 = document.getElementById('cityDropdown');
          let found = false;
          if (dd2) {
            for (let i = 0; i < dd2.options.length; i++) {
              if (dd2.options[i].value.toLowerCase() === val.toLowerCase()) { dd2.selectedIndex = i; found = true; break; }
            }
            if (!found) dd2.selectedIndex = 0;
          }
        });
      }
      const form = document.getElementById('weatherForm');
      if (form) {
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          const city = (document.getElementById('cityInput') && document.getElementById('cityInput').value.trim()) || (document.getElementById('cityDropdown') && document.getElementById('cityDropdown').value);
          fetchWeather(city);
        });
      }
    } catch (e) { console.warn(e); }
    // ---- Robust unit toggle handlers (no debug helpers exposed) ----
    (function () {
      function switchUnit(u) {
        try {
          setStoredUnit(u);
          applyUnitUI();
          // small delay so UI updates before re-querying
          setTimeout(reapplyLastQuery, 50);
        } catch (err) {
          console.warn('[unit] switch error', err);
        }
      }
      const btnC = document.getElementById('unitC');
      const btnF = document.getElementById('unitF');
      function addHandlers(btn, unit) {
        if (!btn) return;
        // click
        btn.addEventListener('click', function (e) { e.preventDefault(); switchUnit(unit); });
        // touch (for some WebViews)
        try { btn.addEventListener('touchend', function (e) { e.preventDefault(); switchUnit(unit); }, { passive: false }); } catch (e) { }
        // keyboard
        btn.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); switchUnit(unit); } });
      }
      addHandlers(btnC, 'C');
      addHandlers(btnF, 'F');
      // Document-level delegated fallback
      document.addEventListener('click', function (e) {
        try {
          const t = e.target;
          const unitBtn = t.closest && t.closest('#unitC, #unitF');
          if (unitBtn) {
            e.preventDefault();
            switchUnit(unitBtn.id === 'unitC' ? 'C' : 'F');
          }
        } catch (er) { }
      });
    })();
    // ---- end unit handlers ----
    try { if (!localStorage.getItem(TEMP_UNIT_KEY)) localStorage.setItem(TEMP_UNIT_KEY, DEFAULT_UNIT); } catch (e) { }
    applyUnitUI();
    // Injected/native coordinates fetch helper (fixed: sets internal LAST_QUERY too)
    window._injectedFetchByCoords = window._injectedFetchByCoords || function (lat, lon, placeName) {
      try {
        if (typeof fetchOpenMeteoForecast === 'function' && typeof renderOpenMeteo === 'function') {
          fetchOpenMeteoForecast(lat, lon).then(fore => {
            try {
              // Save the last query in both the module variable and on window so reapplyLastQuery works
              const q = { type: 'coords', lat: lat, lon: lon, placeName: placeName || '' };
              LAST_QUERY = q;
              window.LAST_QUERY = q;
              document.getElementById('weatherResult').innerHTML = renderOpenMeteo(fore, placeName || '');
            } catch (e) {
              console.error('renderOpenMeteo error', e);
              document.getElementById('weatherResult').innerHTML = '<span style="color:#b00;">Error rendering weather</span>';
            }
          }).catch(err => {
            console.error('fetchOpenMeteoForecast error', err);
            document.getElementById('weatherResult').innerHTML = '<span style="color:#b00;">Error fetching forecast</span>';
          });
        } else {
          console.log('Coordinates available:', lat, lon);
        }
      } catch (e) { console.error(e); }
    };
    (function () {
      const TIMEOUT_MS = 10000;
      const useBtn = document.getElementById('useLocationBtn');
      const resultEl = document.getElementById('weatherResult');
      function log(msg) { try { console.debug('[geo] ' + msg); } catch (e) { } }
      function show(msg, isError) {
        if (!resultEl) return;
        resultEl.innerHTML = isError ? ('<span style="color:#b00;">' + msg + '</span>') : msg;
      }
      function getPositionWithTimeout(opts) {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) {
            const err = new Error('Geolocation unavailable');
            err.code = 0;
            return reject(err);
          }
          let finished = false;
          const timer = setTimeout(() => {
            if (finished) return;
            finished = true;
            const err = new Error('Timeout');
            err.code = 3;
            reject(err);
          }, TIMEOUT_MS);
          navigator.geolocation.getCurrentPosition(pos => {
            if (finished) return;
            finished = true;
            clearTimeout(timer);
            resolve(pos);
          }, err => {
            if (finished) return;
            finished = true;
            clearTimeout(timer);
            reject(err);
          }, opts || { enableHighAccuracy: false, maximumAge: 0, timeout: TIMEOUT_MS });
        });
      }
      async function queryPermission() {
        if (!navigator.permissions || !navigator.permissions.query) return null;
        try {
          const p = await navigator.permissions.query({ name: 'geolocation' });
          return p.state;
        } catch (e) {
          log('permissions.query failed: ' + e);
          return null;
        }
      }
      function permissionHelpText() {
        return `
        <div style="font-size:0.95rem;line-height:1.3;">
          Location access appears blocked. To enable:
          <ul>
            <li>Open the browser menu → Site settings → Location → allow timerhaven.com</li>
            <li>Ensure Android Settings → Location is turned on</li>
            <li>Avoid private/incognito mode</li>
          </ul>
          Or paste coordinates from your Maps app (Share → Copy coordinates).
        </div>
      `;
      }
      async function handleUseLocation(e) {
        e && e.preventDefault && e.preventDefault();
        show('Detecting location...');
        log('User requested location');
        const perm = await queryPermission().catch(() => null);
        log('permission state: ' + perm);
        if (perm === 'denied') {
          show(permissionHelpText(), true);
          return;
        }
        let pos = null;
        try {
          // Try cached/quick first
          pos = await getPositionWithTimeout({ enableHighAccuracy: false, maximumAge: 60 * 1000, timeout: 5000 });
          log('got coords quick: ' + pos.coords.latitude + ',' + pos.coords.longitude);
        } catch (err) {
          log('quick getCurrentPosition failed, trying fresh...');
          try {
            pos = await getPositionWithTimeout({ enableHighAccuracy: true, maximumAge: 0, timeout: TIMEOUT_MS + 5000 });
            log('got coords after prompt: ' + pos.coords.latitude + ',' + pos.coords.longitude);
          } catch (err2) {
            log('final getCurrentPosition failed: ' + (err2 && err2.code) + ' / ' + err2.message);
            if (err2 && err2.code === 1) show(permissionHelpText(), true);
            else if (err2 && err2.code === 3) show('Location request timed out. Ensure GPS is on and try again.', true);
            else show('Location unavailable on this device or browser.', true);
            return;
          }
        }
        if (!pos) return;
        show('Identifying location...');
        let locName = null;
        try {
          const geoResp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`, {
            headers: { 'Accept-Language': 'en', 'User-Agent': 'TimerHaven/1.1' }
          });
          if (geoResp.ok) {
            const geoData = await geoResp.json();
            locName = geoData.address.city || geoData.address.town || geoData.address.village || geoData.address.suburb || geoData.name || (geoData.display_name ? geoData.display_name.split(',')[0] : null);
          }
        } catch (e) { log('Reverse geo failed: ' + e); }
        const displayName = locName || (pos.coords.latitude.toFixed(4) + ', ' + pos.coords.longitude.toFixed(4));
        show(displayName + ' — fetching...');
        if (typeof window._injectedFetchByCoords === 'function') {
          window._injectedFetchByCoords(pos.coords.latitude, pos.coords.longitude, locName);
        } else if (typeof fetchOpenMeteoForecast === 'function') {
          fetchOpenMeteoForecast(pos.coords.latitude, pos.coords.longitude)
            .then(f => { resultEl.innerHTML = renderOpenMeteo(f, locName || displayName); })
            .catch(err => { log('fetch forecast after geo err: ' + err); show('Error fetching forecast', true); });
        }
      }
      if (useBtn) {
        try { useBtn.removeEventListener && useBtn.removeEventListener('click', handleUseLocation); } catch (e) { }
        useBtn.addEventListener('click', handleUseLocation);
      }
      window.receiveNativeLocation = function (obj) {
        try {
          const lat = parseFloat(obj.latitude || obj.lat);
          const lon = parseFloat(obj.longitude || obj.lon || obj.lng);
          if (!isNaN(lat) && !isNaN(lon)) {
            show('Location from app: ' + lat + ', ' + lon + ' — fetching...');
            if (typeof window._injectedFetchByCoords === 'function') window._injectedFetchByCoords(lat, lon);
            else if (typeof fetchOpenMeteoForecast === 'function') {
              fetchOpenMeteoForecast(lat, lon).then(f => { document.getElementById('weatherResult').innerHTML = renderOpenMeteo(f, ''); }).catch(err => { log(err); show('Error fetching forecast', true); });
            }
          }
        } catch (e) { log(e); }
      };
    })();
  </script>
