    <meta charset="UTF-8">
    <title>Welcome to the Community — TimerHaven</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background: #f4f7fb;
            font-family: 'Montserrat', Arial, sans-serif;
            color: #102a43;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .thank-you-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.1);
            padding: 4rem 3rem;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        .success-icon {
            font-size: 4rem;
            color: #43cea2;
            margin-bottom: 2rem;
            display: block;
        }
        h1 {
            font-weight: 800;
            color: #185a9d;
            margin-bottom: 1.5rem;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #64748b;
            margin-bottom: 2.5rem;
        }
        .btn-home {
            border-radius: 50px;
            padding: 0.9rem 2.5rem;
            background: #185a9d;
            border: none;
            color: white;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
        }
        .btn-home:hover {
            background: #144a82;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(24, 90, 157, 0.3);
            color: white;
        }
        .steps-list {
            text-align: left;
            margin: 2rem 0;
            padding: 0;
            list-style: none;
            display: inline-block;
        }
        .steps-list li {
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            color: #334155;
            font-weight: 600;
        }
        .step-num {
            background: #e0f7fa;
            color: #00796b;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="thank-you-card">
        <span class="success-icon"><i class="fas fa-check-circle"></i></span>
        <h1>You're on the list!</h1>
        <p>Thank you for joining the TimerHaven community. We're excited to help you transform your productivity.</p>
        <ul class="steps-list">
            <li><span class="step-num">1</span> Check your inbox for a confirmation email</li>
            <li><span class="step-num">2</span> Add <strong>hello@timerhaven.com</strong> to your contacts</li>
            <li><span class="step-num">3</span> Start your first session using our tools below</li>
        </ul>
        <div class="mt-4">
            <a href="/index.html" class="btn-home">Explore Our Tools</a>
        </div>
    </div>
</body>
</html>
