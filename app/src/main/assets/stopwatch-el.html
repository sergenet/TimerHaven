  <style>

    .back-link {

      margin-bottom: .75rem;
      color: var(--accent) !important;
      text-decoration: none;
      font-weight: 700
    }

    .back-link:hover {
      text-decoration: underline
    }

    .tool-title {
      color: var(--brand);
      font-size: 1.35rem;
      margin: 0 0 .6rem 0;

      flex-wrap: wrap;

      margin-top: .8rem;
    }

      margin-top: 1rem;
      background: #f7fafc;

      padding: 1rem;
      box-shadow: 0 1px 4px #e0e7ef;

<body>
  <script>try { localStorage.setItem('timerhavenLang', 'el'); } catch (e) { };</script>
  <main class="container" role="main">
    <article class="card" aria-labelledby="tool-title">
      <a href="index.html" class="back-link" id="back-link">&larr;&nbsp;Επιστροφή στο κυρίως μενού</a>
      <h3 id="tool-title" class="tool-title"><i class="fa fa-clock" aria-hidden="true"></i> Χρονόμετρο</h3>

      <div class="stopwatch-section" aria-live="polite">
        <div id="swDisplay" class="stopwatch-display" aria-atomic="true">00:00:00</div>
        <div class="controls-row" role="toolbar" aria-label="Στοιχεία ελέγχου χρονόμετρου">
          <!-- Inline SVG Start button (fill #0b63a0 to match the other tools) -->
          <button id="swStartBtn" class="svg-btn" type="button" aria-label="Εκκίνηση χρονομέτρου" title="Έναρξη">
            <svg width="72" height="36" viewBox="0 0 72 36" xmlns="http://www.w3.org/2000/svg" role="img"
              aria-hidden="false" focusable="false">
              <rect x="0" y="0" rx="6" ry="6" width="72" height="36" fill="#0b63a0"></rect>
              <text x="36" y="22" font-family="Montserrat, Arial, Helvetica, sans-serif" font-size="14"
                font-weight="700" text-anchor="middle" fill="#ffffff">Έναρξη</text>
            </svg>
          </button>
          <!-- Fallback plain button (hidden visually) -->
          <button id="swStartBtnFallback" class="btn btn-brand btn-fallback" type="button"
            style="background:#0b63a0;color:#fff;border-color:rgba(0,0,0,0.05);">Έναρξη</button>
          <button id="swPauseBtn" class="btn btn-secondary" type="button" aria-label="Παύση">Παύση</button>
          <button id="swResetBtn" class="btn btn-danger" type="button" aria-label="Επαναφορά">Επαναφορά</button>
          <button id="swLapBtn" class="btn btn-info" type="button" aria-label="Γύρος">Γύρος</button>
        </div>
        <div id="lapList" class="lap-list" style="margin-top:.8rem;" aria-live="polite"></div>

      </div>
    </article>
  </main>
  <script>
    (function () {
      // Stopwatch logic (keeps the same behavior as stopwatch-en; Greek UI labels)
      var swTimer = null, swStart = null, swElapsed = 0, swRunning = false, laps = [];
      function swFormat(ms) {
        var t = Math.floor(ms / 1000);
        var h = Math.floor(t / 3600);
        var m = Math.floor((t % 3600) / 60);
        var s = t % 60;
        return String(h).padStart(2, '0') + ":" + String(m).padStart(2, '0') + ":" + String(s).padStart(2, '0');
      }
      function renderLaps() {
        var lapList = document.getElementById('lapList');
        lapList.innerHTML = laps.map(function (l, i) {
          return '<div class="lap-item">Γύρος ' + (i + 1) + ': ' + swFormat(l) + '</div>';
        }).join('');
      }
      function swUpdateDisplay() {
        document.getElementById('swDisplay').textContent = swFormat(swElapsed);
        renderLaps();
      }
      function startStopwatch() {
        if (swRunning) return;
        swRunning = true;
        swStart = Date.now() - swElapsed;
        swTimer = setInterval(function () {
          swElapsed = Date.now() - swStart;
          swUpdateDisplay();
        }, 100);
      }
      function pauseStopwatch() {
        swRunning = false;
        clearInterval(swTimer);
      }
      function resetStopwatch() {
        swRunning = false;
        clearInterval(swTimer);
        swElapsed = 0;
        laps = [];
        swUpdateDisplay();
      }
      function lapStopwatch() {
        if (swRunning) laps.push(swElapsed);
        swUpdateDisplay();
      }
      document.addEventListener('DOMContentLoaded', function () {
        var svgStart = document.getElementById('swStartBtn');
        var fallbackStart = document.getElementById('swStartBtnFallback');
        var pauseBtn = document.getElementById('swPauseBtn');
        var resetBtn = document.getElementById('swResetBtn');
        var lapBtn = document.getElementById('swLapBtn');
        if (svgStart) {
          svgStart.addEventListener('click', startStopwatch);
          svgStart.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startStopwatch(); } });
          svgStart.setAttribute('tabindex', '0');
        }
        if (fallbackStart) fallbackStart.addEventListener('click', startStopwatch);
        if (pauseBtn) pauseBtn.addEventListener('click', pauseStopwatch);
        if (resetBtn) resetBtn.addEventListener('click', resetStopwatch);
        if (lapBtn) lapBtn.addEventListener('click', lapStopwatch);
        // initialize display
        swUpdateDisplay();
      });
    })();
  </script>
