  <main class="main-container" role="main">
    <section class="tool-card" aria-labelledby="tool-title">
      <a href="index.html" class="back-link" onclick="window.location.href='index.html'; return false;">&larr; Back to
        Main Menu</a>
      <h3 id="tool-title" class="tool-title"><i class="fa fa-stopwatch"></i> Stopwatch</h3>
      <div class="tool-intro" id="tool-help" data-preserve="true"
        style="margin-top:.6rem;margin-bottom:.9rem;color:#374151;line-height:1.45;">
        <p>Measure elapsed time for any activity. Record laps to track progress.</p>
      </div>
      <div class="stopwatch-section" aria-live="polite">
        <div id="swDisplay" class="stopwatch-display">00:00:00</div>
        <div class="controls-row">
          <button id="swStartBtn" class="btn btn-success btn-small">Start</button>
          <button id="swPauseBtn" class="btn btn-secondary btn-small">Pause</button>
          <button id="swResetBtn" class="btn btn-danger btn-small">Reset</button>
          <button id="swLapBtn" class="btn btn-info btn-small">Lap</button>
        </div>
        <div id="lapList" class="lap-list" style="margin-top:.8rem;"></div>
      </div>
    </section>
  </main>
  <script>
    (function () {
      // Safe helper
      function $id(id) { return document.getElementById(id); }
      // Stopwatch state
      var swTimer = null, swStart = null, swElapsed = 0, swRunning = false, laps = [];
      // Format milliseconds -> HH:MM:SS
      function swFormat(ms) {
        var t = Math.floor(ms / 1000);
        var h = Math.floor(t / 3600);
        var m = Math.floor((t % 3600) / 60);
        var s = t % 60;
        return String(h).padStart(2, '0') + ":" + String(m).padStart(2, '0') + ":" + String(s).padStart(2, '0');
      }
      // Render lap list safely
      function renderLaps() {
        var lapList = $id('lapList');
        if (!lapList) return;
        lapList.innerHTML = laps.map(function (l, i) {
          return '<div class="lap-item" style="background:#f7fafc;padding:.45rem;border-radius:8px;margin-bottom:.4rem;">Lap ' + (i + 1) + ': ' + swFormat(l) + '</div>';
        }).join('');
      }
      // Update display
      function swUpdateDisplay() {
        var display = $id('swDisplay');
        if (!display) return;
        display.textContent = swFormat(swElapsed);
        renderLaps();
      }
      // Safe binding helper
      function safeBind(id, ev, fn) {
        var el = $id(id);
        if (el) el.addEventListener(ev, fn);
      }
      safeBind('swStartBtn', 'click', function () {
        if (swRunning) return;
        swRunning = true;
        swStart = Date.now() - swElapsed;
        swTimer = setInterval(function () {
          swElapsed = Date.now() - swStart;
          swUpdateDisplay();
        }, 100);
      });
      safeBind('swPauseBtn', 'click', function () {
        swRunning = false;
        clearInterval(swTimer);
      });
      safeBind('swResetBtn', 'click', function () {
        swRunning = false;
        clearInterval(swTimer);
        swElapsed = 0;
        laps = [];
        swUpdateDisplay();
      });
      safeBind('swLapBtn', 'click', function () {
        if (swRunning) laps.push(swElapsed);
        swUpdateDisplay();
      });
      // initial render
      swUpdateDisplay();
    })();
  </script>
