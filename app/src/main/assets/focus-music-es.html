  <style>
    :root {
      --brand: #0b63a0;
      --muted: #6b7c89;
      --card: #fff;
      --bg: #fbfeff
    }

    html,
    body {

    body {
      background: var(--bg);
      font-family: 'Montserrat', Arial, sans-serif;
      color: var(--text-dark, #102a43);
      margin: 0;
      padding: 2rem;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      padding: 1.6rem 1.5rem;

    /* Make Back link explicit blue to match other tools */

      box-shadow: 0 1px 4px #e0e7ef;
    }

    .faq-section summary {
      font-weight: 700;
      font-size: 1.02rem;
      cursor: pointer;
    }

    .faq-section ul {
      padding-left: 1em;
      margin-top: .5rem;
      color: var(--muted);
    }

    /* Smaller play/stop buttons, inline */
    .player-controls {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: .6rem;
    }

    .player-controls .btn {

<body>
  <script>try { localStorage.setItem('timerhavenLang', 'es'); } catch (e) { };</script>
  <main class="container" role="main">
    <section class="card tool-card" aria-labelledby="tool-title">
      <a href="index.html" class="back-link" id="back-link">← Volver al menú principal</a>
      <div id="tool-title" class="tool-title"><i class="fa fa-music"></i> Música para concentrarse</div>
      <!-- Read full guide button (canonical Spanish path; opens in new tab) -->


      <div class="music-player">
        <label for="music-select" id="music-label">Selecciona una lista:</label>
        <select id="music-select" class="form-select mb-2" style="max-width:360px;">
          <option value="white">Ruido blanco</option>
          <option value="rain">Lluvia</option>
          <option value="alpha">Ondas alfa</option>
          <option value="classical">Clásica</option>
          <option value="ocean">Olas</option>
          <option value="cafe">Ambiente de café</option>
        </select>
        <div class="form-check mb-2" style="display:inline-block; margin-right:12px;">
          <input class="form-check-input" type="checkbox" id="music-loop">
          <label class="form-check-label" for="music-loop" id="loop-label-text">Repetir pista</label>
        </div>
        <div class="player-controls" role="toolbar" aria-label="Audio controls"
          style="display:flex; gap:0.5rem; align-items:center; margin-bottom:.6rem; margin-top:.6rem;">
          <button class="btn btn-primary btn-sm" id="play-btn" aria-label="Play">Play</button>
          <button class="btn btn-secondary btn-sm" id="pause-btn" aria-label="Pause">Pausa</button>
          <button class="btn btn-danger btn-sm" id="stop-btn" aria-label="Stop">Stop</button>
        </div>
        <audio id="focus-audio" style="display:none;" controls></audio>
      </div>

    </section>
  </main>
  <script>
    const tracks = {
      white: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
      rain: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
      alpha: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
      classical: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",
      ocean: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3",
      cafe: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3"
    };
    const focusMusicTranslations = {
      en: {
        "language-label": "Language:",
        "back-link": "← Back to Main Menu",
        "tool-title": "Focus Music",
        "tool-help": "Enhance your concentration and productivity with music scientifically shown to help focus. Choose soothing sounds: white noise, rain, alpha waves, classical, ocean waves, or cafe ambience.",
        "music-label": "Select a playlist:",
        "music-white": "White Noise",
        "music-rain": "Rain",
        "music-alpha": "Alpha Waves",
        "music-classical": "Classical",
        "music-ocean": "Ocean Waves",
        "music-cafe": "Cafe Ambience",
        "loop-label": "Loop track",
        "play": "Play",
        "stop": "Stop",
        "pause": "Pausa",
        "faq-title": "FAQs",
        "faq-list": `<li><b>Can I loop tracks?</b> Yes — enable the "Loop track" checkbox or use the audio player's loop control after pressing Play.</li>
          <li><b>Does this work offline?</b> No — tracks stream from remote servers, so an internet connection is required.</li>
          <li><b>Can I add my own music?</b> Not yet. If you'd like this feature, tell us and we'll evaluate adding user uploads or playlist imports.</li>`,
        "howto-article-btn": "Read full guide",
        "howto-article-link": "https://timerhaven.com/en/focus-music/focus-music-index.html",
        "tips-title": '<i class="fa fa-lightbulb" style="color:#43cea2;"></i> Focus Music Productivity Tips',
        "tips-list": `<li><b>Experiment with genres:</b> Try different playlists to find what suits your work.</li>
          <li><b>Use headphones:</b> They help block distractions and improve focus.</li>
          <li><b>Keep volume moderate:</b> Low volume is better for concentration than loud playback.</li>`,
        "tips-article-btn": "Read full guide",
        "tips-article-link": "focus-music-tips.html"
      },
      es: {
        "language-label": "Idioma:",
        "back-link": "← Volver al menú principal",
        "tool-title": "Música para concentrarse",
        "tool-help": "Mejora tu concentración y productividad con música que favorece el enfoque. Elige sonidos relajantes: ruido blanco, lluvia, ondas alfa, clásica, olas o ambiente de café.",
        "music-label": "Selecciona una lista:",
        "music-white": "Ruido blanco",
        "music-rain": "Lluvia",
        "music-alpha": "Ondas alfa",
        "music-classical": "Clásica",
        "music-ocean": "Olas",
        "music-cafe": "Ambiente de café",
        "loop-label": "Repetir pista",
        "play": "Reproducir",
        "stop": "Detener",
        "pause": "Pausa",
        "faq-title": "Preguntas frecuentes",
        "faq-list": `<li><b>¿Puedo repetir la pista?</b> Sí — activa la casilla "Repetir pista" o usa el control de repetición del reproductor después de pulsar Reproducir.</li>
          <li><b>¿Funciona sin conexión?</b> No — las pistas se transmiten desde servidores remotos, por lo que se necesita conexión a Internet.</li>
          <li><b>¿Puedo añadir mi propia música?</b> Aún no. Si deseas esta función, cuéntanos y la consideraremos.</li>`,
        "howto-article-btn": "Leer artículo completo",
        "howto-article-link": "https://timerhaven.com/es/focus-music/focus-music-index.html",
        "tips-title": '<i class="fa fa-lightbulb" style="color:#43cea2;"></i> Consejos para la productividad con música de concentración',
        "tips-list": `<li><b>Prueba géneros:</b> Intenta diferentes playlists para ver cuál se adapta mejor a tu trabajo.</li>
          <li><b>Usa auriculares:</b> Ayudan a bloquear distracciones y mejorar el enfoque.</li>
          <li><b>Mantén el volumen moderado:</b> El volumen bajo favorece la concentración frente a una reproducción alta.</li>`,
        "tips-article-btn": "Leer artículo completo",
        "tips-article-link": "focus-music-tips-es.html"
      }
    };
    function getLang() {
      try { return (localStorage.getItem('timerhavenLang') || 'es').slice(0, 2); } catch (e) { return 'es'; }
    }
    function applyLanguage(lang) {
      lang = (lang || getLang()).slice(0, 2);
      const t = focusMusicTranslations[lang] || focusMusicTranslations['es'];
      document.body.dir = (lang === 'ar') ? 'rtl' : 'ltr';
      const back = document.getElementById('back-link');
      if (back) back.textContent = t['back-link'] || '';
      const toolTitle = document.getElementById('tool-title');
      if (toolTitle) toolTitle.innerHTML = `<i class="fa fa-music"></i> ${t['tool-title'] || ''}`;
      const help = document.getElementById('tool-help');
      if (help) help.textContent = t['tool-help'] || '';
      const musicLabel = document.getElementById('music-label');
      if (musicLabel) musicLabel.textContent = t['music-label'] || '';
      const ms = document.getElementById('music-select');
      if (ms && ms.options) {
        ms.options[0].text = t['music-white'] || 'Ruido blanco';
        ms.options[1].text = t['music-rain'] || 'Lluvia';
        ms.options[2].text = t['music-alpha'] || 'Ondas alfa';
        ms.options[3].text = t['music-classical'] || 'Clásica';
        ms.options[4].text = t['music-ocean'] || 'Olas';
        ms.options[5].text = t['music-cafe'] || 'Ambiente de café';
      }
      const loopText = document.getElementById('loop-label-text');
      if (loopText) loopText.textContent = t['loop-label'] || 'Repetir pista';
      const playBtn = document.getElementById('play-btn');
      if (playBtn) playBtn.textContent = t['play'] || 'Play';
      const pauseBtn = document.getElementById('pause-btn');
      if (pauseBtn) pauseBtn.textContent = t['pause'] || 'Pause';
      const stopBtn = document.getElementById('stop-btn');
      if (stopBtn) stopBtn.textContent = t['stop'] || 'Stop';
    }

    window.addEventListener('storage', function (e) {
      if (e.key === 'timerhavenLang') applyLanguage((e.newValue || 'es').slice(0, 2));
    });

    function playMusic() {
      const sel = document.getElementById("music-select").value;
      const audio = document.getElementById("focus-audio");
      if (audio.src !== tracks[sel]) {
        audio.src = tracks[sel];
        audio.load();
      }
      audio.loop = document.getElementById("music-loop").checked;
      audio.style.display = "block";
      audio.play().catch((e) => { console.warn("Playback failed", e); });
    }

    function pauseMusic() {
      const audio = document.getElementById("focus-audio");
      if (audio) audio.pause();
    }

    function stopMusic() {
      const audio = document.getElementById("focus-audio");
      if (audio) {
        audio.pause();
        audio.currentTime = 0;
        audio.style.display = "none";
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      applyLanguage(getLang());
      const playBtn = document.getElementById('play-btn');
      const pauseBtn = document.getElementById('pause-btn');
      const stopBtn = document.getElementById('stop-btn');
      const loopCb = document.getElementById('music-loop');
      if (playBtn) playBtn.addEventListener('click', playMusic);
      if (pauseBtn) pauseBtn.addEventListener('click', pauseMusic);
      if (stopBtn) stopBtn.addEventListener('click', stopMusic);
      if (loopCb) loopCb.addEventListener('change', function () { const a = document.getElementById("focus-audio"); if (a) a.loop = this.checked; });
    });
  </script>
</body>
