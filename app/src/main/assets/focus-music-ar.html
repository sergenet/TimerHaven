  <title>موسيقى التركيز — TimerHaven</title>
  <meta name="description"
    content="استمع لموسيقى التركيز، الضجيج الأبيض، وأصوات الطبيعة لتعزيز إنتاجيتك. تخلص من المشتتات وأنجز مهامك بوضوح ذهني." />
  <link href="assets/vendor/bootstrap.min.css" rel="stylesheet" />
  <style>
    :root {
      --brand: #0b63a0;
      --muted: #6b7c89;
      --card: #fff;
      --bg: #f4f7fb
    }

    body {
      background: var(--bg);
      font-family: 'Montserrat', Arial, sans-serif;
      color: #102a43;
      margin: 0;
      padding: 0;
      direction: rtl;
    }

    .main-container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 90vh;
      box-sizing: border-box;
    }

    .tool-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px #e0e7ef;
      width: 420px;
      padding: 1.6rem 1.5rem;
      box-sizing: border-box;
    }

    .back-link {
      display: inline-block;
      margin-bottom: .75rem;
      color: var(--brand, #0d6efd) !important;
      text-decoration: none;
      font-weight: 700;
    }

    .tool-title {
      font-size: 1.35rem;
      margin: 0 0 .4rem 0;
      display: flex;
      align-items: center;
      gap: .4rem;
      color: #185a9d;
    }

    .music-player label {
      display: block;
      margin-bottom: .3rem;
      font-weight: 600;
      text-align: right;
    }

    .btn {
      display: inline-block;
      font-weight: 400;
      text-align: center;
      vertical-align: middle;
      cursor: pointer;
      padding: .375rem .75rem;
      font-size: 1rem;
      line-height: 1.5;
      border-radius: .25rem;
      border: 1px solid transparent;
      text-decoration: none;
    }

    .btn-primary {
      color: #fff;
      background-color: #007bff;
      border-color: #007bff;
    }

    .btn-secondary {
      color: #fff;
      background-color: #6c757d;
      border-color: #6c757d;
    }

    .btn-danger {
      color: #fff;
      background-color: #dc3545;
      border-color: #dc3545;
    }

    .btn-sm {
      padding: .25rem .5rem;
      font-size: .875rem;
      border-radius: .2rem;
    }

    .btn:active {
      opacity: 0.8;
      transform: scale(0.98);
    }

    .form-select {
      display: block;
      width: 100%;
      padding: .375rem .75rem;
      font-size: 1rem;
      color: #495057;
      background-color: #fff;
      border: 1px solid #ced4da;
      border-radius: .25rem;
      text-align: right;
    }

    @media (max-width:900px) {
      .tool-card {
        width: 98vw;
        padding: 1rem;
      }
    }
  </style>
</head>

<body>
  <main class="main-container" role="main">
    <section class="tool-card" aria-labelledby="tool-title">
      <a href="index.html" class="back-link" id="back-link"
        onclick="window.location.href='index.html'; return false;">&rarr; العودة إلى القائمة الرئيسية</a>
      <div id="tool-title" class="tool-title"><i class="fa fa-music"></i> موسيقى التركيز</div>

      <div class="music-player">
        <label for="music-select" id="music-label">اختر قائمة تشغيل:</label>
        <select id="music-select" class="form-select mb-2">
          <option value="white">ضجيج أبيض</option>
          <option value="rain">مطر</option>
          <option value="alpha">موجات ألفا</option>
          <option value="classical">كلاسيكي</option>
          <option value="ocean">أمواج المحيط</option>
          <option value="cafe">أجواء المقهى</option>
        </select>
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="music-loop">
          <label class="form-check-label" for="music-loop" id="loop-label-text">تكرار المقطع</label>
        </div>
        <div class="player-controls" role="toolbar" aria-label="Audio controls"
          style="display:flex; gap:0.5rem; align-items:center; margin-bottom:.6rem; margin-top:.6rem; justify-content: flex-start; flex-direction: row-reverse;">
          <button class="btn btn-primary btn-sm" id="play-btn" aria-label="Play">تشغيل</button>
          <button class="btn btn-secondary btn-sm" id="pause-btn" aria-label="Pause">إيقاف مؤقت</button>
          <button class="btn btn-danger btn-sm" id="stop-btn" aria-label="Stop">إيقاف</button>
        </div>
        <audio id="focus-audio" style="display:none;" controls></audio>
      </div>
    </section>
  </main>
  <script>
    const tracks = {
      white: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
      rain: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
      alpha: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
      classical: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",
      ocean: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3",
      cafe: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3"
    };
    const focusMusicTranslations = {
      en: {
        "back-link": "← Back to Main Menu",
        "tool-title": "Focus Music",
        "music-label": "Select a playlist:",
        "music-white": "White Noise",
        "music-rain": "Rain",
        "music-alpha": "Alpha Waves",
        "music-classical": "Classical",
        "music-ocean": "Ocean Waves",
        "music-cafe": "Cafe Ambience",
        "loop-label": "Loop track",
        "play": "Play",
        "stop": "Stop",
        "pause": "Pause"
      },
      ar: {
        "back-link": "← العودة إلى القائمة الرئيسية",
        "tool-title": "موسيقى التركيز",
        "music-label": "اختر قائمة تشغيل:",
        "music-white": "ضجيج أبيض",
        "music-rain": "مطر",
        "music-alpha": "موجات ألفا",
        "music-classical": "كلاسيكي",
        "music-ocean": "أمواج المحيط",
        "music-cafe": "أجواء المقهى",
        "loop-label": "تكرار المقطع",
        "play": "تشغيل",
        "stop": "إيقاف",
        "pause": "إيقاف مؤقت"
      }
    };

    function getLang() {
      try { return (localStorage.getItem('timerhavenLang') || 'ar').slice(0, 2); } catch (e) { return 'ar'; }
    }

    function applyLanguage(lang) {
      lang = (lang || getLang()).slice(0, 2);
      const t = focusMusicTranslations[lang] || focusMusicTranslations['ar'];
      document.body.dir = (lang === 'ar') ? 'rtl' : 'ltr';
      const back = document.getElementById('back-link');
      if (back) back.textContent = t['back-link'] || '';
      const toolTitle = document.getElementById('tool-title');
      if (toolTitle) toolTitle.innerHTML = `<i class="fa fa-music"></i> ${t['tool-title'] || ''}`;

      const musicLabel = document.getElementById('music-label');
      if (musicLabel) musicLabel.textContent = t['music-label'] || '';
      const ms = document.getElementById('music-select');
      if (ms && ms.options) {
        ms.options[0].text = t['music-white'] || '';
        ms.options[1].text = t['music-rain'] || '';
        ms.options[2].text = t['music-alpha'] || '';
        ms.options[3].text = t['music-classical'] || '';
        ms.options[4].text = t['music-ocean'] || '';
        ms.options[5].text = t['music-cafe'] || '';
      }
      const loopText = document.getElementById('loop-label-text');
      if (loopText) loopText.textContent = t['loop-label'] || '';
      const playBtn = document.getElementById('play-btn');
      if (playBtn) playBtn.textContent = t['play'] || '';
      const pauseBtn = document.getElementById('pause-btn');
      if (pauseBtn) pauseBtn.textContent = t['pause'] || '';
      const stopBtn = document.getElementById('stop-btn');
      if (stopBtn) stopBtn.textContent = t['stop'] || '';
    }

    window.addEventListener('storage', function (e) {
      if (e.key === 'timerhavenLang') applyLanguage((e.newValue || 'ar').slice(0, 2));
    });

    function playMusic() {
      const sel = document.getElementById("music-select").value;
      const audio = document.getElementById("focus-audio");
      if (audio.src !== tracks[sel]) {
        audio.src = tracks[sel];
        audio.load();
      }
      audio.loop = document.getElementById("music-loop").checked;
      audio.style.display = "block";
      audio.play().catch((e) => { console.warn("Playback failed", e); });
    }

    function pauseMusic() {
      const audio = document.getElementById("focus-audio");
      if (audio) audio.pause();
    }

    function stopMusic() {
      const audio = document.getElementById("focus-audio");
      if (audio) {
        audio.pause();
        audio.currentTime = 0;
        audio.style.display = "none";
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      applyLanguage(getLang());
      const playBtn = document.getElementById('play-btn');
      const pauseBtn = document.getElementById('pause-btn');
      const stopBtn = document.getElementById('stop-btn');
      const loopCb = document.getElementById('music-loop');
      if (playBtn) playBtn.addEventListener('click', playMusic);
      if (pauseBtn) pauseBtn.addEventListener('click', pauseMusic);
      if (stopBtn) stopBtn.addEventListener('click', stopMusic);
      if (loopCb) loopCb.addEventListener('change', function () { const a = document.getElementById("focus-audio"); if (a) a.loop = this.checked; });
    });
  </script>
</body>

</html>
