  <style>
    :root {
      --brand: #185a9d;
      --muted: #51606b;
      --card-bg: #ffffff;
      /* Standardfarbe für 'Read full guide' und 'Back to Main Menu' */

.muted {

<body>
  <main style="display:flex;justify-content:center;padding:28px 12px 64px;">
    <article class="tool-card" role="main" aria-labelledby="tool-title" style="width:420px;padding:1.6rem;">
      <a href="index.html" class="back-link" onclick="window.location.href='index.html'; return false;" style="margin-bottom:8px;display:inline-block;color:var(--brand,#0d6efd) !important;">&larr;&nbsp;Zurück zum Hauptmenü</a>
      <div class="tool-title" id="tool-title"><i class="fa fa-clipboard"></i> Zwischenablage-Manager
      </div>
      <div class="tool-intro-in-card" id="tool-help-card" data-preserve="true">
        <p>Speichere kurze Textausschnitte, um sie später wiederzuverwenden. Clips werden lokal in deinem
        Browser gespeichert.</p>
      </div>
      <div class="top-controls">
        <button id="clear-all" class="btn btn-danger btn-sm ms-auto"><i class="fa fa-trash"></i> Alles löschen</button>
      </div>
      <form id="clipboardForm" class="clipboard-form" aria-label="Notiz hinzufügen">
        <textarea id="clipboardInput" placeholder="Text hier eingeben oder einfügen..." class="form-control"
          aria-label="Clipboard-Eingabe"></textarea>
        <div style="display:flex; gap:.5rem; margin-top:.6rem;">
          <button type="submit" id="add-btn" class="btn btn-success"><i class="fa fa-plus"></i> Hinzufügen</button>
          <button type="button" id="paste-btn" class="btn btn-outline-secondary"><i class="fa fa-paste"></i> Einfügen</button>
          <button type="button" id="clear-input" class="btn btn-outline-danger"><i class="fa fa-eraser"></i> Leeren</button>
        </div>
      </form>
      <div id="clips-list" class="clips-list" aria-live="polite" aria-atomic="true"></div>
      </div>
      </article>
  </main>
<script>
    // Storage helpers
    function safeSet(key, value) { try { localStorage.setItem(key, value); return true; } catch (e) { return false; } }
    function safeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
    const STORAGE_KEY = 'clipboardClips_v1_de';
    let clips;
    try {
      clips = JSON.parse(safeGet(STORAGE_KEY) || '[]');
    } catch (e) {
      clips = [];
    }
    if (!Array.isArray(clips)) clips = [];
    // Assign IDs to legacy clips
    clips.forEach(c => { if (!c.id) c.id = 'clip_' + Math.random().toString(36).substr(2, 9) + '_' + (c.created || Date.now()); });
    function saveClips() {
      safeSet(STORAGE_KEY, JSON.stringify(clips));
      requestAnimationFrame(function () {
        renderClips();
      });
    }
    const clipsListEl = document.getElementById('clips-list'),
      clipboardForm = document.getElementById('clipboardForm'),
      clipboardInput = document.getElementById('clipboardInput'),
      emptyState = document.getElementById('empty-state');
    function toggleEmptyState() {
      if (!emptyState) return;
      if (!clips || clips.length === 0) emptyState.style.display = 'flex';
      else emptyState.style.display = 'none';
    }
    function escapeHtml(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    function renderClips() {
      clipsListEl.innerHTML = '';
      if (!clips || clips.length === 0) { toggleEmptyState(); return; }
      toggleEmptyState();
      clips.forEach((c, i) => {
        const item = document.createElement('div'); item.className = 'clip-item';
        const text = document.createElement('div'); text.className = 'clip-text'; text.innerHTML = (c.pinned ? '<span style="font-weight:700;color:var(--brand);margin-right:.5em;"></span>' : '') + escapeHtml(c.text);
        const actions = document.createElement('div'); actions.className = 'clip-actions';
        const copyBtn = document.createElement('button'); copyBtn.className = 'btn btn-sm btn-outline-success'; copyBtn.innerHTML = '<i class="fa fa-copy"></i> Kopieren';
        copyBtn.onclick = async () => {
          try { await navigator.clipboard.writeText(c.text); copyBtn.textContent = 'Kopiert'; setTimeout(() => copyBtn.innerHTML = 'Kopieren', 900); }
          catch (e) { console.error('Kopieren fehlgeschlagen — der Browser blockiert möglicherweise den Zugriff.'); }
        };
        const editBtn = document.createElement('button'); editBtn.className = 'btn btn-sm btn-outline-secondary'; editBtn.innerHTML = '<i class="fa fa-edit"></i> Bearbeiten';
        editBtn.onclick = () => { clipboardInput.value = c.text; clipboardInput.focus(); };
        const delBtn = document.createElement('button'); delBtn.className = 'btn btn-sm btn-outline-danger'; delBtn.innerHTML = '<i class="fa fa-trash"></i> Entfernen';
        delBtn.onclick = function () {
          const removed = clips.splice(i, 1)[0];
          saveClips();
          if (removed && removed.id && window.SyncManager && window.SyncManager.isAvailable()) {
            try {
              window.SyncManager.deleteClip(removed.id);
            } catch (e) { }
          }
        };
        actions.appendChild(copyBtn); actions.appendChild(editBtn); actions.appendChild(delBtn);
        item.appendChild(text); item.appendChild(actions); clipsListEl.appendChild(item);
      });
    }
    function addClip() {
      if (!clipboardInput) return;
      const v = (clipboardInput.value || '').trim();
      if (!v) return;
      const newClip = {
        id: 'clip_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
        text: v,
        created: Date.now(),
        pinned: false
      };
      clips.unshift(newClip);
      saveClips();
      if (window.SyncManager && window.SyncManager.isAvailable()) {
        try {
          window.SyncManager.saveClip(newClip.id, newClip.text, newClip.created);
        } catch (e) { }
      }
      clipboardInput.value = '';
    }
    clipboardForm.addEventListener('submit', function (e) {
      e.preventDefault();
      addClip();
    });
    const addBtn = document.getElementById('add-btn');
    if (addBtn) {
      addBtn.addEventListener('touchstart', function (e) {
        e.preventDefault();
        addClip();
      });
      addBtn.addEventListener('click', function (e) {
        e.preventDefault();
        addClip();
      });
    }
    document.getElementById('paste-btn') && document.getElementById('paste-btn').addEventListener('click', async () => { try { const text = await navigator.clipboard.readText(); clipboardInput.value = text; } catch (e) { console.error('Kann nicht aus der Zwischenablage lesen (Zugriff verweigert).'); } });
    document.getElementById('clear-input') && document.getElementById('clear-input').addEventListener('click', () => { clipboardInput.value = ''; });
    document.getElementById('clear-all') && document.getElementById('clear-all').addEventListener('click', () => {
      if (!confirm('Alle Clips löschen? Diese Aktion kann nicht rückgängig gemacht werden.')) return;
      if (window.SyncManager && window.SyncManager.isAvailable()) clips.forEach(c => { try { window.SyncManager.deleteClip(c.id); } catch(e) {} });
      clips = []; saveClips(); renderClips();
    });
    document.addEventListener('DOMContentLoaded', () => { if (!Array.isArray(clips)) clips = []; renderClips(); toggleEmptyState(); window.__timerhaven_clips = clips; });
    // Cloud Sync Listeners
    window.addEventListener('timerhaven:cloudDataLoaded', function (e) {
      const cloudData = e.detail;
      if (cloudData && cloudData.clipboard) {
        let changed = false;
        cloudData.clipboard.forEach(cloudClip => {
          const existing = clips.find(c => c.id === cloudClip.id);
          if (!existing) {
            clips.push(cloudClip);
            changed = true;
          } else if ((cloudClip.timestamp || 0) > (existing.created || 0)) {
            existing.text = cloudClip.text;
            existing.created = cloudClip.timestamp;
            changed = true;
          }
        });
        if (changed) {
          saveClips();
          renderClips();
        }
      }
    });
    window.addEventListener('timerhaven:cloudDataChanged', function () {
      if (window.SyncManager && window.SyncManager.isAvailable()) window.SyncManager.initialize();
    });
  </script>
</body>
