  <style>
    :root {
      --brand: #0b63a0;
      --muted: #6b7c89;
      --card: #fff;
      --bg: #fbfeff
    }

    html,
    body {
      height: 100%
    }

    body {
      background: var(--bg);
      font-family: 'Montserrat', Arial, sans-serif;
      color: #0b2545;
      margin: 0;
      padding: 2rem;
      direction: rtl;
    }

    .container {
      max-width: 720px;
      margin: 0 auto
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      padding: 1.6rem 1.5rem;
      box-sizing: border-box;
    }

    /* Back link / CTA consistent */
    .back-link {
      display: inline-block;
      margin-bottom: .75rem;
      color: #007bff !important;
      text-decoration: none;
      font-weight: 700
    }

    .back-link:hover {
      text-decoration: underline
    }

    .tool-title {
      color: #185a9d;
      font-size: 1.35rem;
      margin: 0 0 .6rem 0;
      display: flex;
      align-items: center;
      gap: .5rem;
      justify-content: flex-end
    }

    .cta {
      display: inline-block;
      margin: .35rem 0 .8rem 0;
      padding: .45rem .7rem;
      border-radius: 8px;
      background: #007bff !important;
      color: #fff !important;
      text-decoration: none;
      font-weight: 700;
      font-size: .95rem;
      border: none;
      box-shadow: 0 6px 18px rgba(0, 123, 255, 0.08)
    }

    .password-form {
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: .75rem;
      justify-content: flex-end
    }

    .password-result {
      font-size: 1.15rem;
      font-weight: 600;
      min-height: 1.5rem;
      margin-bottom: .5rem;
      text-align: right
    }

    @media (max-width:900px) {
      .card {
        padding: 1rem
      }

      .password-form {
        justify-content: flex-start
      }
    }

    /* Small RTL tweaks for meta/button spacing */

<body>
  <main class="container" role="main">
    <article class="card" aria-labelledby="tool-title">
      <a href="index.html" class="back-link" id="back-link">← العودة إلى القائمة الرئيسية</a>
      <h3 id="tool-title" class="tool-title">🔑 مولد كلمات المرور</h3>
      <p style="margin:0 0 .6rem 0; text-align:right;"></p>
      <div class="password-section" style="margin-top:.6rem;">
        <form id="passwordForm" class="password-form" aria-label="نموذج مولد كلمات المرور" onsubmit="return false;">
          <label style="font-weight:600;margin-right:6px;">الطول:</label>
          <input id="pwLength" type="number" min="4" max="128" value="16" class="form-control" style="max-width:90px;">
          <label><input id="pwUpper" type="checkbox" checked> حروف كبيرة</label>
          <label><input id="pwLower" type="checkbox" checked> حروف صغيرة</label>
          <label><input id="pwDigits" type="checkbox" checked> أرقام</label>
          <label><input id="pwSymbols" type="checkbox"> رموز</label>
          <button id="generateBtn" class="btn btn-success btn-sm" type="button">إنشاء</button>
        </form>
        <div id="pwResult" class="password-result" aria-live="polite"></div>
        <div style="margin-top:.6rem; text-align:right;">
          <button id="copyBtn" class="btn btn-outline-secondary btn-sm" type="button" style="display:none;">نسخ</button>
          <button id="clearBtn" class="btn btn-outline-danger btn-sm" type="button"
            style="display:none; margin-left:6px;">مسح</button>
        </div>
      </div>
    </article>
  </main>
  <script>
    (function () {
      function randInt(max) { return Math.floor(Math.random() * max); }
      function generatePassword(length, upper, lower, digits, symbols) {
        var low = 'abcdefghijklmnopqrstuvwxyz';
        var up = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        var nums = '0123456789';
        var syms = '!@#$%^&*()-_=+[]{};:,.<>?/|`~';
        var chars = '';
        if (lower) chars += low;
        if (upper) chars += up;
        if (digits) chars += nums;
        if (symbols) chars += syms;
        if (!chars) return '';
        var out = '';
        for (var i = 0; i < length; i++) out += chars.charAt(randInt(chars.length));
        return out;
      }
      var genBtn = document.getElementById('generateBtn');
      var copyBtn = document.getElementById('copyBtn');
      var clearBtn = document.getElementById('clearBtn');
      var pwResult = document.getElementById('pwResult');
      function doGenerate() {
        var length = parseInt(document.getElementById('pwLength').value) || 16;
        length = Math.max(1, Math.min(128, length));
        var upper = document.getElementById('pwUpper').checked;
        var lower = document.getElementById('pwLower').checked;
        var digits = document.getElementById('pwDigits').checked;
        var symbols = document.getElementById('pwSymbols').checked;
        var pw = generatePassword(length, upper, lower, digits, symbols);
        pwResult.textContent = pw;
        if (pw) {
          copyBtn.style.display = 'inline-block';
          clearBtn.style.display = 'inline-block';
        } else {
          copyBtn.style.display = 'none';
          clearBtn.style.display = 'none';
        }
      }
      if (genBtn) genBtn.addEventListener('click', doGenerate);
      if (copyBtn) copyBtn.addEventListener('click', function () {
        var t = pwResult.textContent || '';
        if (!t) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(t).then(function () {
            var old = copyBtn.textContent;
            copyBtn.textContent = old + ' ✓';
            setTimeout(function () { copyBtn.textContent = old; }, 1000);
          }, function () { console.error('تعذّر النسخ إلى الحافظة.'); });
        } else {
          var ta = document.createElement('textarea');
          ta.value = t;
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); } catch (e) { console.error('تعذّر النسخ إلى الحافظة.'); }
          document.body.removeChild(ta);
        }
      });
      if (clearBtn) clearBtn.addEventListener('click', function () {
        pwResult.textContent = '';
        copyBtn.style.display = 'none';
        clearBtn.style.display = 'none';
      });
      // initial generate
      if (genBtn) genBtn.click();
    })();
  </script>
