  <script>
    const STORAGE_KEY = 'calendarNotes';
    const DEFAULT_START_KEY = 'calendar_default_start_time';
    const notes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    let currentYear, currentMonth, selectedDay, controlsHooked = false;
    const pendingDeletions = new Set();
    function saveNotes() { localStorage.setItem(STORAGE_KEY, JSON.stringify(notes)); }
    function ensureCalendarIds() {
      let changed = false;
      for (const date in notes) {
        if (!Array.isArray(notes[date])) continue;
        notes[date].forEach(n => {
          if (!n.id) {
            n.id = 'cal_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
            changed = true;
          }
          if (!n.date) {
            n.date = date;
            changed = true;
          }
        });
      }
      if (changed) saveNotes();
    }
    const translations = {
      de: {
        "back-link": "Zurück zum Hauptmenü",
        "tool-title": "Kalender",
        "tool-help": "Klicke auf einen Tag, um Notizen hinzuzufügen/anzusehen/bearbeiten. Mehrere Notizen pro Tag sind möglich und bleiben erhalten!",
        "noteModalLabel": "Notizen für den",
        "noteInput": "Neue Notiz für diesen Tag hinzufügen...",
        "note-none": "Noch keine Notizen für diesen Tag.",
        "note-delete": "Diese Notiz löschen",
        "note-close-btn": "Schließen",
        "note-add-btn": "Hinzufügen",
        "repeat-none": "Keine",
        "repeat-daily": "Täglich",
        "repeat-weekly": "Wöchentlich",
        "repeat-monthly": "Monatlich",
        "repeat-yearly": "Jährlich",
        "days": ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"],
        "months": ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"],
        "delete-prompt-title": "Wiederkehrende Notiz",
        "delete-prompt-body": "Möchten Sie die gesamte Serie oder nur dieses Vorkommen löschen?",
        "delete-series-btn": "Ganze Serie",
        "delete-occurrence-btn": "Dieses Vorkommen",
        "cancel-btn": "Abbrechen"
      }
    };
    function getLang() {
      try {
        const l = localStorage.getItem('timerhavenLang') || 'de';
        return (l && l.slice(0, 2)) || 'de';
      } catch (e) {
        return 'de';
      }
    }
    function t(lang, key) {
      const l = lang || getLang();
      return (translations[l] && translations[l][key]) ? translations[l][key] : (translations['de'][key] || '');
    }
    function parseDurationFromText(text) {
      if (!text || typeof text !== 'string') return null;
      const rangeMatch = text.match(/(\d{1,3})\s*(?:–|-)\s*(\d{1,3})\s*(?:minuten?|mins?|min)/i);
      if (rangeMatch) return parseInt(rangeMatch[1], 10);
      const singleMatch = text.match(/(\d{1,3})\s*(?:minuten?|mins?|min)/i);
      if (singleMatch) return parseInt(singleMatch[1], 10);
      return null;
    }
    function getDefaultStartTime() { return localStorage.getItem(DEFAULT_START_KEY) || '09:00'; }
    function setDefaultStartTime(value) { localStorage.setItem(DEFAULT_START_KEY, value); }
    function dateFromDateStrAndTime(dateStr, timeStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const [hh = 0, mm = 0] = (timeStr || '00:00').split(':').map(Number);
      return new Date(y, m - 1, d, hh, mm, 0, 0);
    }
    function updateLanguage(lang) {
      document.getElementById('back-link') && (document.getElementById('back-link').textContent = t(lang, 'back-link'));
      document.getElementById('tool-title') && (document.getElementById('tool-title').innerHTML = `<i class="fa fa-calendar-days"></i> ${t(lang, 'tool-title')}`);
      document.getElementById('tool-help') && (document.getElementById('tool-help').textContent = t(lang, 'tool-help'));
      document.getElementById('noteModalLabel') && (document.getElementById('noteModalLabel').innerHTML = `${t(lang, 'noteModalLabel')} <span id="modal-date-label"></span>`);
      document.getElementById('noteInput') && (document.getElementById('noteInput').placeholder = t(lang, 'noteInput'));
      document.getElementById('note-close-btn') && (document.getElementById('note-close-btn').textContent = t(lang, 'note-close-btn'));
      document.getElementById('note-add-btn') && (document.getElementById('note-add-btn').textContent = t(lang, 'note-add-btn'));
    }
    function populateMonthYearControls(year, month, lang) {
      const monthSelect = document.getElementById('calendar-month-select'), yearSelect = document.getElementById('calendar-year-select');
      if (!monthSelect || !yearSelect) return;
      const months = t(lang, 'months');
      monthSelect.innerHTML = '';
      for (let m = 0; m < 12; m++) {
        const opt = document.createElement('option'); opt.value = String(m); opt.textContent = months[m];
        if (m === month) opt.selected = true; monthSelect.appendChild(opt);
      }
      const now = new Date(); const base = now.getFullYear(); const start = base - 50, end = base + 50;
      yearSelect.innerHTML = '';
      for (let y = start; y <= end; y++) {

    }
    function getNotesForDate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const targetDate = new Date(y, m - 1, d, 0, 0, 0);
      const results = [];
      for (const originStr in notes) {
        if (!Array.isArray(notes[originStr])) continue;
        const [oy, om, od] = originStr.split('-').map(Number);

        const diffDays = Math.round((targetDate - originDate) / (1000 * 60 * 60 * 24));

          let match = false;

    function renderCalendar(year, month, lang) {

      let html = '<thead><tr>'; (t(lang, 'days')).forEach(d => html += `<th scope="col">${d}</th>`); html += '</tr></thead><tbody><tr>';
      for (let i = 0; i < firstDay; i++) html += '<td></td>';
      const now = new Date(); const todayY = now.getFullYear(), todayM = now.getMonth(), todayD = now.getDate();
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dayNotes = getNotesForDate(dateStr); const hasNote = dayNotes.length > 0;
        if ((firstDay + d - 1) % 7 === 0 && d !== 1) html += '</tr><tr>';
        const isToday = (d === todayD && month === todayM && year === todayY);
        const classes = ['day-cell', hasNote ? 'has-note' : '', isToday ? 'calendar-today' : ''].join(' ').trim();
        html += `<td role="gridcell" tabindex="0" data-date="${dateStr}" aria-label="${dateStr}"><div class="${classes}" ${isToday ? 'aria-current="date"' : ''}>${d}${hasNote ? ' <span title="Notiz gespeichert">📝</span>' : ''}</div></td>`;
      }
      html += '</tr></tbody>'; if (table) table.innerHTML = html;
    }
    function showNoteModal(dateStr) {
      selectedDay = dateStr;
      const ml = document.getElementById('modal-date-label');
      if (ml) ml.textContent = dateStr;
      renderNoteList(dateStr);
      const input = document.getElementById('noteInput');
      if (input) input.value = '';

      modalEl.classList.add('show');

        try { input && input.focus(); } catch (e) { }

    }
    function closeNoteModal() {
      const modalEl = document.getElementById('noteModal');
      modalEl.classList.remove('show');
      renderCalendar(currentYear, currentMonth, getLang());
    }
    function migrateLegacyNotes(raw) {
      if (!Array.isArray(raw)) return [];
      return raw.map(n => {
        if (typeof n === 'string') return { text: n, durationMinutes: parseDurationFromText(n) || null, createdAt: null };
        if (n && typeof n === 'object') {
          return {
            ...n,
            text: n.text || String(n),
            durationMinutes: (typeof n.durationMinutes === 'number') ? n.durationMinutes : parseDurationFromText(n.text || String(n)) || null,
            createdAt: n.createdAt || n.ts || null

        }
        return { text: String(n), durationMinutes: null, createdAt: null };
      });
    }
    function renderNoteList(dateStr) {
      const list = document.getElementById('noteList');
      if (!list) return;
      list.innerHTML = '';
      const dayNotes = getNotesForDate(dateStr);
      if (dayNotes.length === 0) {
        list.innerHTML = `<li style="color:#888;text-align:center;padding:10px;">${t('de', 'note-none')}</li>`;
        return;
      }

        let repeatInfo = (noteObj.repeat && noteObj.repeat !== 'none') ? `<span class="badge bg-info ms-1" style="font-size: 0.65rem; padding: 2px 4px;"><i class="fa fa-redo"></i></span>` : '';
        const left = document.createElement('div');
        left.style.flex = '1 1 auto';
        left.innerHTML = `<div style="font-weight:500; display: flex; align-items: center; gap: 4px; overflow-wrap: anywhere;">${timeInfo}<span>${escapeHtml(noteObj.text)}</span>${repeatInfo}</div>`;
        const delBtn = document.createElement('button');
        delBtn.className = 'btn btn-sm btn-outline-danger ms-3 delete-note-btn';
        delBtn.setAttribute('data-id', noteObj.id || '');
        delBtn.setAttribute('data-origin', noteObj.originStr || dateStr);
        delBtn.setAttribute('data-repeat', (noteObj.repeat && noteObj.repeat !== 'none') ? 'true' : 'false');
        delBtn.innerHTML = '<svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/><path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/></svg>';

    }
    function formatTime(timeStr) {
      return timeStr || '';
    }
    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;'); }
    function hookupCalendarControls() {
      if (controlsHooked) return; controlsHooked = true;
      const table = document.getElementById('calendar-table');
      if (table) {
        table.addEventListener('click', function (e) {
          const cell = e.target.closest('.day-cell');

        list.addEventListener('click', function (e) {

          if (!btn || !selectedDay) return;
          const id = btn.getAttribute('data-id'), originStr = btn.getAttribute('data-origin'), isRepeat = (btn.getAttribute('data-repeat') === 'true'), dateStr = selectedDay;
          if (isRepeat) {
            const promptHtml = `
              <div id="deleteOptions" style="padding:10px; text-align:center; background:#fff3cd; border-radius:8px; border:1px solid #ffeeba; margin-top:8px; width:100%;">
                <p style="margin-bottom:8px; font-weight:600; color:#856404;">${t(getLang(), 'delete-prompt-title')}</p>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                  <button class="btn btn-danger btn-sm" id="delSeriesBtn">${t(getLang(), 'delete-series-btn')}</button>
                  <button class="btn btn-warning btn-sm" id="delOccurrenceBtn">${t(getLang(), 'delete-occurrence-btn')}</button>
                  <button class="btn btn-secondary btn-sm" id="cancelDelBtn">${t(getLang(), 'cancel-btn')}</button>
                </div>
              </div>
            `;
            const container = btn.parentElement;
            if (container.querySelector('#deleteOptions')) return;
            container.innerHTML = promptHtml;
            container.querySelector('#delSeriesBtn').onclick = () => {
              if (notes[originStr]) {
                const idx = notes[originStr].findIndex(n => n.id === id);
                if (idx !== -1) {
                  const removed = notes[originStr].splice(idx, 1)[0];
                  if (removed && removed.id) {
                    pendingDeletions.add(removed.id);
                    setTimeout(() => pendingDeletions.delete(removed.id), 10000);
                    if (typeof SyncManager !== 'undefined' && SyncManager.isAvailable()) SyncManager.deleteCalendar(removed.id);
                  }
                }
                if (notes[originStr].length === 0) delete notes[originStr];
                saveNotes(); renderCalendar(currentYear, currentMonth, getLang()); renderNoteList(selectedDay);
              }
            };
            container.querySelector('#delOccurrenceBtn').onclick = () => {
              if (notes[originStr]) {
                const item = notes[originStr].find(n => n.id === id);
                if (item) {
                  if (!item.exclusions) item.exclusions = [];
                  if (!item.exclusions.includes(dateStr)) item.exclusions.push(dateStr);
                  item.updatedAt = Date.now();
                  saveNotes(); renderCalendar(currentYear, currentMonth, getLang()); renderNoteList(selectedDay);
                }
              }
            };
            container.querySelector('#cancelDelBtn').onclick = () => renderNoteList(selectedDay);
            return;
          }
          if (notes[originStr]) {
            const idx = notes[originStr].findIndex(n => n.id === id);
            if (idx !== -1) {
              const removed = notes[originStr].splice(idx, 1)[0];
              if (removed && removed.id) {
                pendingDeletions.add(removed.id);
                setTimeout(() => pendingDeletions.delete(removed.id), 10000);
                if (typeof SyncManager !== 'undefined' && SyncManager.isAvailable()) SyncManager.deleteCalendar(removed.id);
              }

          }

      }
      const prevYear = document.getElementById('nav-prev-year'), prevMonth = document.getElementById('nav-prev-month'), nextMonth = document.getElementById('nav-next-month'), nextYear = document.getElementById('nav-next-year'), todayBtn = document.getElementById('nav-today'), monthSelect = document.getElementById('calendar-month-select'), yearSelect = document.getElementById('calendar-year-select');
      if (prevYear) prevYear.addEventListener('click', function () { currentYear--; renderCalendar(currentYear, currentMonth, getLang()); });
      if (nextYear) nextYear.addEventListener('click', function () { currentYear++; renderCalendar(currentYear, currentMonth, getLang()); });
      if (prevMonth) prevMonth.addEventListener('click', function () { currentMonth = (currentMonth - 1 + 12) % 12; if (currentMonth === 11) currentYear--; renderCalendar(currentYear, currentMonth, getLang()); });

        noteForm.addEventListener('submit', function (e) {

            const text = input.value.trim(); if (!text) return;

              id: 'cal_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
              text: text, time: noteTime, repeat: noteRepeat, sound: noteSound,
              date: selectedDay, createdAt: createdAt, updatedAt: Date.now()

            notes[selectedDay].push(item);

            }

    }

    let alarmInterval = null, activeAlarmSound = 'beep';
    function spawnNotification(title, body, itemId, soundType) {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(title, { body: body });
      }
      triggerLoopingAlarm(title, body, itemId, soundType);
    }
    function triggerLoopingAlarm(title, body, itemId, soundType) {
      if (alarmInterval) return;
      const overlay = document.getElementById('alarmOverlay');
      if (overlay) {
        document.getElementById('alarmTitle').textContent = title;
        document.getElementById('alarmBody').textContent = body;

      }

        playAlarmSound(activeAlarmSound);
        if (typeof navigator.vibrate === 'function') {
          navigator.vibrate([200, 100, 200]);

    }
    function stopAlarm() {

      const overlay = document.getElementById('alarmOverlay');
      if (overlay) overlay.style.display = 'none';
    }
    window.unlockAudio = function() {
      try {
        if (!window.thAudioCtx) window.thAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const ctx = window.thAudioCtx;
        if (ctx.state === 'suspended') {
          ctx.resume().then(() => {
            const o = ctx.createOscillator(), g = ctx.createGain();
            g.gain.value = 0.0001; o.connect(g); g.connect(ctx.destination);
            o.start(0); o.stop(0.01);
          });
        }
      } catch (e) { }
    };
    document.addEventListener('click', window.unlockAudio, { capture: true });
    document.addEventListener('touchstart', window.unlockAudio, { capture: true });

    function playAlarmSound(soundType) {
      try {
        if (!window.thAudioCtx) window.thAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const ctx = window.thAudioCtx;
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        const startTime = ctx.currentTime;

          osc.type = 'square'; osc.frequency.setValueAtTime(300, startTime);
          osc.frequency.exponentialRampToValueAtTime(1200, startTime + 0.4);
          osc.frequency.exponentialRampToValueAtTime(300, startTime + 0.8);
          gain.gain.setValueAtTime(0, startTime);
          gain.gain.linearRampToValueAtTime(0.3, startTime + 0.1);
          gain.gain.linearRampToValueAtTime(0, startTime + 0.8);
          osc.start(startTime); osc.stop(startTime + 0.8);
        } else if (soundType === 'pulse') {
          osc.type = 'sine'; osc.frequency.setValueAtTime(1500, startTime);
          gain.gain.setValueAtTime(0, startTime);
          gain.gain.linearRampToValueAtTime(0.8, startTime + 0.02);
          gain.gain.linearRampToValueAtTime(0, startTime + 0.08);
          gain.gain.linearRampToValueAtTime(0.8, startTime + 0.12);
          gain.gain.linearRampToValueAtTime(0, startTime + 0.18);
          osc.start(startTime); osc.stop(startTime + 0.2);

          gain.gain.setValueAtTime(0, startTime);

          gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.5);
          osc.start(startTime); osc.stop(startTime + 0.5);
        }
      } catch (e) { }
    }
    function checkReminders() {
      if (alarmInterval) return;
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0'), m = String(now.getMinutes()).padStart(2, '0');
      const timeStr = `${h}:${m}`, dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      const todayNotes = getNotesForDate(dateStr);
      todayNotes.forEach(item => {
        if (!item.time || item.time !== timeStr) return;
        const lastFired = item.lastFiredMinute || '';
        if (lastFired !== (dateStr + ' ' + timeStr)) {
          item.lastFiredMinute = dateStr + ' ' + timeStr;
          spawnNotification("TimerHaven Erinnerung", item.text, item.id, item.sound || 'beep');
          saveNotes();
        }
      });
    }
    document.addEventListener('DOMContentLoaded', function () {

    });
    window.addEventListener('timerhaven:cloudDataLoaded', function (e) {
      const cloudData = e.detail;
      if (cloudData && cloudData.calendar) {
        let changed = false;
        cloudData.calendar.forEach(cloudItem => {
          const itemDate = cloudItem.date;
          if (!itemDate || !cloudItem.id || pendingDeletions.has(cloudItem.id)) return;
          if (!notes[itemDate]) notes[itemDate] = [];
          const existing = notes[itemDate].find(n => n.id === cloudItem.id);

          else if ((cloudItem.updatedAt || 0) > (existing.updatedAt || 0)) { Object.assign(existing, cloudItem); changed = true; }

      }
    });
    window.addEventListener('timerhaven:cloudDataChanged', function () { if (SyncManager.isAvailable()) SyncManager.initialize(); });
  </script>
