<body>

  <main class="main-container">
    <section class="tool-card" role="main" aria-labelledby="tool-title">
      <a href="index.html" class="back-link" id="back-link" onclick="window.location.href='index.html'; return false;">←
        Back to Main Menu</a>

      <h3 id="tool-title"><i class="fa fa-stopwatch-20"></i> Countdown Timer</h3>

      <!-- Replaced previous small muted intro with richer server-rendered in-card intro -->
      <div class="tool-intro-in-card" id="tool-help" data-preserve="true">
        <p>Set a countdown timer for deadlines, events, or meetings. Timers run while the page is open.</p>
      </div>

      <!-- Inputs are text to allow "00" display; custom spinner controls provide arrows -->
      <div class="countdown-row" aria-label="Countdown inputs">
        <div class="countdown-group" style="flex:1;">
          <label class="countdown-label" for="hours">Ώρες:</label>
          <div style="display:flex; align-items:center;">
            <input type="text" id="hours" class="form-control countdown-input" inputmode="numeric" pattern="[0-9]*"
              placeholder="00" aria-label="Hours" maxlength="2">
            <div class="spin" aria-hidden="true">
              <button type="button" class="up" data-target="hours" data-delta="1" title="Increase hours"><span
                  class="icon">▲</span></button>
              <button type="button" class="down" data-target="hours" data-delta="-1" title="Decrease hours"><span
                  class="icon">▼</span></button>
            </div>
          </div>
        </div>

        <div class="countdown-group" style="flex:1;">
          <label class="countdown-label" for="minutes">Λεπτά:</label>
          <div style="display:flex; align-items:center;">
            <input type="text" id="minutes" class="form-control countdown-input" inputmode="numeric" pattern="[0-9]*"
              placeholder="00" aria-label="Minutes" maxlength="2">
            <div class="spin" aria-hidden="true">
              <button type="button" class="up" data-target="minutes" data-delta="1" title="Increase minutes"><span
                  class="icon">▲</span></button>
              <button type="button" class="down" data-target="minutes" data-delta="-1" title="Decrease minutes"><span
                  class="icon">▼</span></button>
            </div>
          </div>
        </div>

        <div class="countdown-group" style="flex:1;">
          <label class="countdown-label" for="seconds">Δευτερόλεπτα:</label>
          <div style="display:flex; align-items:center;">
            <input type="text" id="seconds" class="form-control countdown-input" inputmode="numeric" pattern="[0-9]*"
              placeholder="00" aria-label="Seconds" maxlength="2">
            <div class="spin" aria-hidden="true">
              <button type="button" class="up" data-target="seconds" data-delta="1" title="Increase seconds"><span
                  class="icon">▲</span></button>
              <button type="button" class="down" data-target="seconds" data-delta="-1" title="Decrease seconds"><span
                  class="icon">▼</span></button>
            </div>
          </div>
        </div>
      </div>

      <div id="display">00:00:00</div>

      <div class="controls-center">
        <button class="btn btn-success" id="startBtn"><i class="fa fa-play"></i> Start</button>
        <button class="btn btn-secondary" id="pauseBtn"><i class="fa fa-pause"></i> Pause</button>
        <button class="btn btn-danger" id="resetBtn"><i class="fa fa-refresh"></i> Reset</button>
      </div>

    </section>
  </main>

  <script>
    localStorage.setItem('timerhavenLang', 'el');

    const countdownTranslations = {
      el: { "back-link": "← Επιστροφή στο κεντρικό μενού", "tool-title": "Αντίστροφη μέτρηση", "tool-help": "Ορίστε αντίστροφη μέτρηση για προθεσμίες, εκδηλώσεις ή συναντήσεις.", "hours": "Ώρες", "minutes": "Λεπτά", "seconds": "Δευτερόλεπτα", "start": "Έναρξη", "pause": "Παύση", "resume": "Συνέχιση", "reset": "Επαναφορά", "display": "00:00:00", "alert-end": "Ο χρόνος τελείωσε!", "faq-title": "Συχνές Ερωτήσεις", "faq-list": `<li><b>Το χρονόμετρο συνεχίζει αν αλλάξω καρτέλα;</b> Ναι.</li><li><b>Μπορώ να ορίσω ώρες;</b> Ναι, τώρα μπορείτε να ορίσετε ώρες, λεπτά και δευτερόλεπτα.</li><li><b>Μπορώ να κάνω παύση;</b> Ναι, χρησιμοποιήστε το κουμπί Παύση.</li>`, "howto-article-btn": "Διαβάστε τον οδηγό", "howto-article-link": "/el/countdown/countdown-index.html" }
    };

    function getLang() {
      try { return (localStorage.getItem('timerhavenLang') || 'el').slice(0, 2); } catch (e) { return 'en'; }
    }

    function pad2(n) {
      const s = String(Math.abs(parseInt(n, 10) || 0));
      return s.length < 2 ? ('0' + s) : s;
    }

    function parseInputValueText(el) {
      if (!el) return 0;
      const v = String(el.value || '').replace(/[^\d]/g, '');
      if (v === '') return 0;
      const n = parseInt(v, 10);
      return Number.isFinite(n) ? n : 0;
    }

    function applyLanguage(lang) {
      lang = lang || getLang();
      const t = countdownTranslations[lang] || countdownTranslations['el'];
      document.body.dir = (lang === 'ar') ? 'rtl' : 'ltr';

      const back = document.getElementById('back-link'); if (back) back.textContent = t['back-link'];
      const toolTitle = document.getElementById('tool-title'); if (toolTitle) toolTitle.innerHTML = `<i class="fa fa-stopwatch-20"></i> ${t['tool-title']}`;
      const help = document.getElementById('tool-help'); if (help) {
        if (!(help.dataset && help.dataset.preserve === 'true')) {
          help.textContent = t['tool-help'];
        } else {
          console.info('[i18n] preserved server-rendered tool intro (data-preserve=true)');
        }
      }

      const startBtn = document.getElementById('startBtn'); if (startBtn) startBtn.textContent = ' ' + (t['start'] || 'Start');
      const pauseBtn = document.getElementById('pauseBtn'); if (pauseBtn) pauseBtn.textContent = ' ' + (t['pause'] || 'Pause');
      const resetBtn = document.getElementById('resetBtn'); if (resetBtn) resetBtn.textContent = ' ' + (t['reset'] || 'Reset');

      const faqTitle = document.getElementById('faq-title'); if (faqTitle) faqTitle.textContent = t['faq-title'];
      const faqList = document.getElementById('faq-list'); if (faqList) faqList.innerHTML = t['faq-list'];
      const disp = document.getElementById('display'); if (disp) disp.textContent = t['display'] || '00:00:00';
    }

    let timerInterval = null;
    let totalSeconds = 0;
    let paused = false;

    function updateDisplayAndInputs() {
      const hrs = Math.floor(totalSeconds / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;
      const disp = document.getElementById('display');
      if (disp) disp.textContent = String(hrs).padStart(2, '0') + ':' + String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');

      const hrInput = document.getElementById('hours');
      const minInput = document.getElementById('minutes');
      const secInput = document.getElementById('seconds');
      if (hrInput) hrInput.value = pad2(hrs);
      if (minInput) minInput.value = pad2(mins);
      if (secInput) secInput.value = pad2(secs);
    }

    function adjustInput(targetId, delta) {
      const el = document.getElementById(targetId);
      if (!el) return;
      let n = parseInputValueText(el);
      n = Math.max(0, n + delta);
      if (targetId === 'minutes' || targetId === 'seconds') {
        if (n > 59) n = 59;
      }
      el.value = pad2(n);
      const hrs = parseInputValueText(document.getElementById('hours'));
      const mins = parseInputValueText(document.getElementById('minutes'));
      const secs = parseInputValueText(document.getElementById('seconds'));
      totalSeconds = Math.max(0, hrs * 3600 + mins * 60 + secs);
      updateDisplayAndInputs();
    }

    function handleInputKey(e) {
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        const delta = e.key === 'ArrowUp' ? 1 : -1;
        adjustInput(e.target.id, delta);
      }
    }

    function attachSpinnerRepeat(button) {
      let timer = null;
      const delta = parseInt(button.getAttribute('data-delta'), 10) || 1;
      const target = button.getAttribute('data-target');
      const step = () => adjustInput(target, delta);
      button.addEventListener('mousedown', (ev) => {
        ev.preventDefault();
        step();
        timer = setInterval(step, 120);
      });
      ['mouseup', 'mouseleave', 'mouseout'].forEach(evt => {
        button.addEventListener(evt, () => { if (timer) { clearInterval(timer); timer = null; } });
      });
      button.addEventListener('click', (ev) => { ev.preventDefault(); });
    }

    // Buzzer sound using Web Audio API (no external files needed)
    function playBuzzer() {
      try {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        var ctx = new AudioCtx();
        var beepCount = 3;
        var beepDuration = 0.3;
        var pauseDuration = 0.2;
        for (var i = 0; i < beepCount; i++) {
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'square';
          osc.frequency.value = 800;
          gain.gain.value = 0.5;
          var startTime = ctx.currentTime + i * (beepDuration + pauseDuration);
          osc.start(startTime);
          osc.stop(startTime + beepDuration);
        }
      } catch (e) {
        console.error('Buzzer error', e);
      }
    }

    document.addEventListener("DOMContentLoaded", function () {
      applyLanguage(getLang());

      totalSeconds = 0;
      const hrInput = document.getElementById('hours');
      const minInput = document.getElementById('minutes');
      const secInput = document.getElementById('seconds');
      if (hrInput) hrInput.value = '00';
      if (minInput) minInput.value = '00';
      if (secInput) secInput.value = '00';
      updateDisplayAndInputs();

      [hrInput, minInput, secInput].forEach(el => {
        if (!el) return;
        el.addEventListener('keydown', function (e) {
          if (['Backspace', 'Delete', 'Tab', 'Escape', 'Enter', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) return;
          if (e.ctrlKey || e.metaKey) return;
          if (!/^\d$/.test(e.key)) e.preventDefault();
        });
        el.addEventListener('blur', function (e) {
          const id = e.target.id;
          const n = parseInputValueText(e.target);
          if (id === 'minutes' || id === 'seconds') {
            const v = Math.max(0, Math.min(59, n));
            e.target.value = pad2(v);
          } else {
            e.target.value = pad2(n);
          }
          const hrs = parseInputValueText(document.getElementById('hours'));
          const mins = parseInputValueText(document.getElementById('minutes'));
          const secs = parseInputValueText(document.getElementById('seconds'));
          totalSeconds = Math.max(0, hrs * 3600 + mins * 60 + secs);
          updateDisplayAndInputs();
        });
        el.addEventListener('focus', function () { if (this.value === '00') this.value = ''; });
        el.addEventListener('keyup', handleInputKey);
      });

      document.querySelectorAll('.spin button').forEach(btn => attachSpinnerRepeat(btn));

      const startBtn = document.getElementById('startBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const resetBtn = document.getElementById('resetBtn');

      startBtn && startBtn.addEventListener('click', function () {
        if (timerInterval) return;

        const hrsVal = parseInputValueText(document.getElementById('hours'));
        const minsVal = parseInputValueText(document.getElementById('minutes'));
        const secsVal = parseInputValueText(document.getElementById('seconds'));
        totalSeconds = Math.max(0, hrsVal * 3600 + minsVal * 60 + secsVal);
        if (totalSeconds <= 0) {
          updateDisplayAndInputs();
          return;
        }

        paused = false;
        if (pauseBtn) pauseBtn.textContent = ' ' + (countdownTranslations[getLang()]?.pause || 'Pause');

        updateDisplayAndInputs();

        timerInterval = setInterval(function () {
          if (!paused && totalSeconds > 0) {
            totalSeconds--;
            updateDisplayAndInputs();
          }
          if (totalSeconds <= 0) {
            clearInterval(timerInterval);
            timerInterval = null;
            const t = countdownTranslations[getLang()] || countdownTranslations['el'];
            playBuzzer();
            var disp = document.getElementById('display');
            if (disp) {
              disp.style.color = '#dc3545';
              disp.textContent = t['alert-end'] || "Time's up!";
              setTimeout(function () { disp.style.color = ''; }, 5000);
            }
          }
        }, 1000);
      });

      pauseBtn && pauseBtn.addEventListener('click', function () {
        paused = !paused;
        const t = countdownTranslations[getLang()] || countdownTranslations['el'];
        this.textContent = ' ' + (paused ? (t['resume'] || 'Resume') : (t['pause'] || 'Pause'));
      });

      resetBtn && resetBtn.addEventListener('click', function () {
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        paused = false;
        totalSeconds = 0;
        const hrInputEl = document.getElementById('hours');
        const minInputEl = document.getElementById('minutes');
        const secInputEl = document.getElementById('seconds');
        if (hrInputEl) hrInputEl.value = '00';
        if (minInputEl) minInputEl.value = '00';
        if (secInputEl) secInputEl.value = '00';
        updateDisplayAndInputs();
        const t = countdownTranslations[getLang()] || countdownTranslations['el'];
        const pauseBtnEl = document.getElementById('pauseBtn');
        if (pauseBtnEl) pauseBtnEl.textContent = ' ' + (t['pause'] || 'Pause');
      });
    });
  </script>
