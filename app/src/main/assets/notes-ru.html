<body>
  <main class="container" role="main">
    <section class="card" aria-labelledby="tool-title">
      <a href="index.html" class="back-link" id="back-link">← Назад в главное меню</a>
      <h3 id="tool-title" class="tool-title"><i class="fa fa-note-sticky"></i> Заметки</h3>
      <p style="margin:0 0 .6rem 0;"></p>
      <div class="notes-section">
        <form class="notes-form" id="notesForm">
          <input type="text" id="noteInput" class="form-control" placeholder="Введите вашу заметку..."
            style="max-width:220px;">
          <button type="submit" id="addNoteBtn" class="btn btn-success btn-sm">Добавить заметку</button>
        </form>
        <div id="notesList" class="notes-list"></div>
      </div>
    </section>
  </main>
  <script>
    window.onerror = function (msg, url, line) { console.error('JS Error: ' + msg + ' @ ' + line); return false; };
    function safeSet(key, value) { try { localStorage.setItem(key, value); return true; } catch (e) { console.error('Storage Save Error', e); return false; } }
    function safeGet(key) { try { return localStorage.getItem(key); } catch (e) { console.error('Storage Read Error', e); return null; } }
    let notes = [];
    try {
      const saved = safeGet('notesData');
      if (saved) notes = JSON.parse(saved);
    } catch (e) { notes = []; }
    if (!Array.isArray(notes)) notes = [];
    // Assign IDs to legacy notes
    notes.forEach(function (n) { if (!n.id) n.id = 'note_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now(); });
    function saveNotes() {
      safeSet('notesData', JSON.stringify(notes));
      requestAnimationFrame(function () {
        renderNotes();
      });
    }
    function escapeHtml(s) {
      if (!s) return '';
      return String(s)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }
    function renderNotes() {
      const list = document.getElementById('notesList');
      list.innerHTML = '';
      if (!notes || notes.length === 0) {
        list.innerHTML = '<div style="color:#888;">Заметок пока нет.</div>';
        return;
      }
      notes.forEach((note, idx) => {
        const pinned = note.pinned ? '<span class="note-pinned"><i class="fa fa-thumbtack"></i></span>' : '';
        const div = document.createElement('div');
        div.className = 'note-item';
        div.innerHTML = `
        <div style="display:flex;align-items:center;gap:.6rem;min-width:0;">
          ${pinned}
          <span style="overflow-wrap:anywhere;">${escapeHtml(note.text)}</span>
        </div>
        <div style="display:flex;align-items:center;gap:.5rem;">
          <span class="note-meta">${escapeHtml(note.date)}</span>
          <button class="btn btn-outline-${note.pinned ? 'secondary' : 'info'} btn-sm" onclick="pinNote(${idx})" title="Закрепить/Открепить"><i class="fa fa-thumbtack"></i></button>
          <button class="btn btn-outline-danger btn-sm" onclick="deleteNote(${idx})" title="Удалить"><i class="fa fa-trash"></i></button>
        </div>
      `;
        list.appendChild(div);
      });
    }
    window.addNote = function () {
      const input = document.getElementById('noteInput');
      if (!input) return;
      const text = input.value.trim();
      if (!text) return;
      try {
        const newNote = {
          id: 'note_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
          text,
          date: new Date().toLocaleString(),
          pinned: false,
          updatedAt: Date.now()
        };
        notes.unshift(newNote);
        saveNotes();
        if (window.SyncManager && window.SyncManager.isAvailable()) {
          try {
            window.SyncManager.saveNote(newNote.id, "", newNote.text);
          } catch (e) { }
        }
        input.value = "";
      } catch (e) {
        console.error('Ошибка при добавлении заметки', e);
      }
    };
    const form = document.getElementById('notesForm');
    if (form) {
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        window.addNote();
      });
    }
    const addBtn = document.getElementById('addNoteBtn');
    if (addBtn) {
      addBtn.addEventListener('click', function (e) {
        // Обработчик отправки формы позаботится об этом
      });
    }
    window.deleteNote = function (idx) {
      const removed = notes.splice(idx, 1)[0];
      saveNotes();
      if (removed && removed.id && window.SyncManager && window.SyncManager.isAvailable()) {
        try {
          window.SyncManager.deleteNote(removed.id);
        } catch (e) { }
      }
    }
    window.pinNote = function (idx) {
      if (!notes[idx]) return;
      notes[idx].pinned = !notes[idx].pinned;
      notes[idx].updatedAt = Date.now();
      if (notes[idx].pinned) {
        var pinnedNote = notes.splice(idx, 1)[0];
        notes.unshift(pinnedNote);
      }
      saveNotes();
      if (window.SyncManager && window.SyncManager.isAvailable()) {
        var n = notes.find(function (n) { return n === (pinnedNote || notes[idx]); });
        if (n) SyncManager.saveNote(n.id, "", n.text);
      }
      renderNotes();
    }
    renderNotes();
    // Cloud Sync Listeners
    window.addEventListener('timerhaven:cloudDataLoaded', function (e) {
      const cloudData = e.detail;
      if (cloudData && cloudData.notes) {
        let changed = false;
        cloudData.notes.forEach(cloudNote => {
          const existing = notes.find(n => n.id === cloudNote.id);
          if (!existing) {
            notes.push({
              id: cloudNote.id,
              text: cloudNote.content,
              date: new Date(cloudNote.updatedAt || Date.now()).toLocaleString(),
              pinned: false,
              updatedAt: cloudNote.updatedAt
            });
            changed = true;
          } else if ((cloudNote.updatedAt || 0) > (existing.updatedAt || 0)) {
            existing.text = cloudNote.content;
            existing.updatedAt = cloudNote.updatedAt;
            changed = true;
          }
        });
        if (changed) {
          saveNotes();
          renderNotes();
        }
      }
    });
    window.addEventListener('timerhaven:cloudDataChanged', function () {
      if (SyncManager.isAvailable()) SyncManager.initialize();
    });
  </script>
