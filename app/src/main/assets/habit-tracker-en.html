  <style>

<body>
  <main class="main-container" role="main">
    <section class="tool-card" aria-labelledby="tool-title">
      <a href="index.html" class="back-link" id="back-link" onclick="window.location.href='index.html'; return false;"
        style="color:var(--brand,#0d6efd) !important;">&larr; Back to Main Menu</a>
      <div id="tool-title" class="tool-title"><i class="fa fa-check-double"></i> Habit Tracker</div>
      <div class="tool-intro-in-card" id="tool-help" data-preserve="true">
        <p>Track daily habits and build new routines locally.</p>
      </div>
      <div id="banner" class="banner" style="display:none;"></div>
      <div id="stats-bar" class="stats-bar">Tracked: 0 · Done today: 0 · Best streak: 0</div>
      <div class="habit-section">
        <form class="habit-form" id="habitForm">
          <input type="text" id="habitInput" class="form-control" placeholder="Habit name">
          <button type="submit" class="btn btn-success btn-sm" id="add-btn">Add Habit</button>
        </form>
        <div id="habitList" class="habit-list"></div>
      </div>
    </section>
  </main>
  <script>
    // Keep existing translations & behavior, but ensure the JS uses the canonical per-tool guide path
    const habitTranslations = {
      en: {
        "language-label": "Language:",
        "back-link": "— Back to Main Menu",
        "tool-title": "Habit Tracker",
        "habitInput": "Habit name",
        "add-btn": "Add Habit",
        "banner-all-done": "—? All habits done for today! Great job!",
        "stats-tracked": "Tracked: ",
        "stats-done": "Done today: ",
        "stats-best": "Best streak: ",
        "howto-title": '<i class="fa fa-check-double"></i> How to Use Habit Tracker',
        "howto-steps": `<li><b>Add a habit:</b> Type your daily habit (e.g., "Drink Water") and click Add.</li>
          <li><b>Mark done:</b> When you complete a habit for the day, click the Done button beside it.</li>
          <li><b>Remove habits:</b> Delete or archive habits you no longer want to track.</li>
          <li><b>Repeat daily:</b> Return each day to update and track your progress.</li>`,
        "howto-article-btn": "Read full guide",
        /* canonical per-tool guide URL pattern (matches your site convention) */
        "howto-article-link": "/en/habit-tracker/habit-tracker-index.html",
        "tips-title": '<i class="fa fa-lightbulb" style="color:#43cea2;"></i> Habit Productivity Tips',
        "tips-list": `<li><b>Start small:</b> Begin with easy, achievable habits to build momentum.</li>
          <li><b>Track daily:</b> Consistency is key—mark habits done every day.</li>
          <li><b>Celebrate progress:</b> Recognize small wins to stay motivated.</li>`,
        "tips-article-btn": "Read full guide",
        "tips-article-link": "habit-tips.html",
        "faq-title": "FAQs",
        "faq-list": `<li><b>Are habits saved?</b> Yes, in your browser until you clear them.</li>
          <li><b>Can I track multiple habits?</b> Yes! Add as many habits as you like.</li>
          <li><b>Can I see my streaks?</b> Streaks are displayed for each habit.</li>
          <li><b>Can I archive a habit?</b> Yes—archive habits you want to pause.</li>`,
        "mark-done": "Mark Done",
        "done-today": "Done Today",
        "streak": "Streak: ",
        "longest": "Best: ",
        "archive": "Archive",
        "unarchive": "Unarchive",
        "delete": "Delete",
        "no-habits": "No habits yet."
      }
    };
    function escapeHtml(text) {
      if (!text) return "";
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    function getTodayStr() {
      const d = new Date();
      return d.getFullYear() + "-" + (d.getMonth() + 1).toString().padStart(2, "0") + "-" + d.getDate().toString().padStart(2, "0");
    }
    function lastNDays(n) {
      const arr = [];
      for (let i = n - 1; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        arr.push(d.getFullYear() + "-" + (d.getMonth() + 1).toString().padStart(2, "0") + "-" + d.getDate().toString().padStart(2, "0"));
      }
      return arr;
    }
    let habits = JSON.parse(localStorage.getItem('habits_v1') || '[]');
    function getLang() {
      try {
        const l = localStorage.getItem('timerhavenLang') || 'en';
        return (l && l.slice(0, 2)) || 'en';
      } catch (e) {
        return 'en';
      }
    }
    function applyLanguage(lang) {
      lang = (lang || getLang()).slice(0, 2);
      const t = habitTranslations[lang] || habitTranslations['en'];
      document.body.dir = (lang === "ar") ? "rtl" : "ltr";
      const back = document.getElementById('back-link'); if (back) back.textContent = t['back-link'] || '';
      const toolTitle = document.getElementById('tool-title'); if (toolTitle) toolTitle.innerHTML = `<i class="fa fa-check-double"></i> ${t['tool-title'] || ''}`;
      const input = document.getElementById('habitInput'); if (input) input.placeholder = t['habitInput'] || '';
      const addBtn = document.getElementById('add-btn'); if (addBtn) addBtn.textContent = t['add-btn'] || '';
      const faqTitle = document.getElementById('faq-title'); if (faqTitle) faqTitle.textContent = t['faq-title'] || '';
      const faqList = document.getElementById('faq-list'); if (faqList) faqList.innerHTML = t['faq-list'] || '';
      const help = document.getElementById('tool-help');
      if (help) {
        if (!(help.dataset && help.dataset.preserve === 'true')) {
          help.textContent = t['tool-help'] || '';
        } else {
          console.info('[i18n] preserved server-rendered tool intro (data-preserve=true)');
        }
      }

    }
    function resetHabitsIfNeeded() {
      const today = getTodayStr();
      let changed = false;
      habits.forEach(habit => {
        if (!habit.history) habit.history = [];
        if (habit.lastChecked !== today) {
          habit.doneToday = false;
          habit.lastChecked = today;
          changed = true;
        }
      });
      if (changed) saveHabits();
    }
    function saveHabits() { localStorage.setItem('habits_v1', JSON.stringify(habits)); }
    // Assign IDs to legacy habits
    function ensureHabitIds() {
      let changed = false;
      habits.forEach(h => {
        if (!h.id) {
          h.id = 'habit_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
          changed = true;
        }
      });
      if (changed) saveHabits();
    }
    ensureHabitIds();
    function refreshUI() {
      if (typeof requestAnimationFrame !== 'undefined') {
        requestAnimationFrame(() => renderHabits());
      } else {
        renderHabits();
      }
    }
    function renderHabits() {
      try {
        resetHabitsIfNeeded();
        const lang = getLang();
        const t = habitTranslations[lang] || habitTranslations['en'];
        const list = document.getElementById('habitList');
        if (!list) return;
        list.innerHTML = '';
        const today = getTodayStr();
        let doneTodayCount = 0;
        let bestStreak = 0;
        let activeCount = 0;
        // Null check for habits array
        if (!habits) habits = [];
        habits.forEach(h => { if (h && !h.archived) activeCount++; });
        if (habits.length === 0 || activeCount === 0) {
          list.innerHTML = `<div style="color:#888;">${t["no-habits"] || 'No habits yet.'}</div>`;
        }
        habits.forEach((habit, idx) => {
          if (!habit || habit.archived) return;
          let streak = habit.streak || 0;
          let longest = habit.longest || streak;
          bestStreak = Math.max(bestStreak, longest);
          if (!habit.history) habit.history = [];
          let historyDots = "";
          lastNDays(7).forEach((date) => {
            const done = habit.history.includes(date);
            historyDots += `<span class="dot${done ? ' done' : ''}${date === today ? ' today' : ''}" title="${date}"></span>`;
          });
          const isDone = habit.doneToday;
          if (isDone) doneTodayCount++;
          list.innerHTML += `
          <div class="habit-item">
            <span style="min-width:0;display:block">
              <div style="font-weight:600;margin-bottom:6px;">${escapeHtml(habit.name)}</div>
              <div style="color:#6b7c89;font-size:.9rem;">${t["streak"]}${streak} — ${t["longest"]}${longest}</div>
              <div style="margin-top:6px;">${historyDots}</div>
            </span>
            <div style="display:flex;align-items:center;gap:.5rem;">
              <button class="btn btn-sm ${isDone ? 'btn-secondary' : 'btn-success'}" ${isDone ? 'disabled' : ''} onclick="markDone(${idx})">
                ${isDone ? t["done-today"] : t["mark-done"]}
              </button>
              <button class="archive-btn${habit.archived ? ' archived' : ''}" onclick="archiveHabit(${idx})">
                ${habit.archived ? t["unarchive"] : t["archive"]}
              </button>
              <button class="btn btn-outline-danger btn-sm habit-btn" onclick="deleteHabit(${idx})"><i class="fa fa-trash"></i> ${t["delete"]}</button>
            </div>
          </div>
        `;
        });
        renderStats(activeCount, doneTodayCount, bestStreak);
        renderBanner(activeCount, doneTodayCount);
      } catch (err) {
        console.error("[HabitTracker] Error rendering habits:", err);
      }
    }
    function renderStats(tracked, done, best) {
      const lang = getLang();
      const t = habitTranslations[lang] || habitTranslations['en'];
      const sb = document.getElementById("stats-bar");
      if (sb) sb.innerHTML = `${t["stats-tracked"]}${tracked} · ${t["stats-done"]}${done} · ${t["stats-best"]}${best}`;
    }
    function renderBanner(tracked, done) {
      const lang = getLang();
      const t = habitTranslations[lang] || habitTranslations['en'];
      const banner = document.getElementById("banner");
      if (!banner) return;
      if (tracked > 0 && done === tracked) {
        banner.textContent = t["banner-all-done"] || habitTranslations["en"]["banner-all-done"];
        banner.style.display = "block";
      } else {
        banner.style.display = "none";
      }
    }
    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;'); }
    function initHabitTool() {
      const form = document.getElementById('habitForm');
      if (form) {
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          try {
            const el = document.getElementById('habitInput');
            const name = (el && el.value || '').trim();
            if (!name) return;
            console.log("[HabitTracker] Adding habit:", name);
            const newHabit = {
              id: 'habit_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
              name,
              streak: 0,
              longest: 0,
              doneToday: false,
              lastChecked: getTodayStr(),
              history: [],
              archived: false,
              updatedAt: Date.now()
            };
            habits.push(newHabit);
            saveHabits();
            try {
              if (window.SyncManager && window.SyncManager.isAvailable()) {
                window.SyncManager.saveHabit(newHabit.id, newHabit);
              }
            } catch (syncErr) { console.error("[HabitTracker] Sync error (Add):", syncErr); }
            if (el) el.value = "";
            refreshUI();
          } catch (err) {
            console.error("[HabitTracker] Submit error:", err);
          }
        });
      }
    }
    window.markDone = function (idx) {
      try {
        const today = getTodayStr();
        if (!habits[idx].doneToday) {
          habits[idx].doneToday = true;
          habits[idx].lastChecked = today;
          habits[idx].streak = (habits[idx].streak || 0) + 1;
          habits[idx].longest = Math.max(habits[idx].longest || 0, habits[idx].streak);
          if (!habits[idx].history) habits[idx].history = [];
          if (!habits[idx].history.includes(today)) habits[idx].history.push(today);
          habits[idx].updatedAt = Date.now();
          saveHabits();
          try {
            if (window.SyncManager && window.SyncManager.isAvailable()) {
              window.SyncManager.saveHabit(habits[idx].id, habits[idx]);
            }
          } catch (syncErr) { console.error("[HabitTracker] Sync error (MarkDone):", syncErr); }
          refreshUI();
        }
      } catch (err) { console.error("[HabitTracker] MarkDone error:", err); }
    }
    window.archiveHabit = function (idx) {
      try {
        habits[idx].archived = !habits[idx].archived;
        habits[idx].updatedAt = Date.now();
        saveHabits();
        try {
          if (window.SyncManager && window.SyncManager.isAvailable()) {
            window.SyncManager.saveHabit(habits[idx].id, habits[idx]);
          }
        } catch (syncErr) { console.error("[HabitTracker] Sync error (Archive):", syncErr); }
        refreshUI();
      } catch (err) { console.error("[HabitTracker] Archive error:", err); }
    }
    window.deleteHabit = function (idx) {
      try {
        console.log("[HabitTracker] Deleting habit at index:", idx);
        const removed = habits.splice(idx, 1)[0];
        saveHabits();
        try {
          if (removed && removed.id && window.SyncManager && window.SyncManager.isAvailable()) {
            window.SyncManager.deleteHabit(removed.id);
          }
        } catch (syncErr) { console.error("[HabitTracker] Sync error (Delete):", syncErr); }
        refreshUI();
      } catch (err) { console.error("[HabitTracker] Delete error:", err); }
    }
    window.addEventListener('storage', function (e) {
      if (e.key === 'timerhavenLang') {
        const lang = (e.newValue || getLang()).slice(0, 2);
        applyLanguage(lang);
      }
    });
    document.addEventListener("DOMContentLoaded", function () {
      applyLanguage(getLang());
      initHabitTool();
      refreshUI();
      window.addEventListener('resize', function () { applyLanguage(getLang()); });
      window.__timerhaven_tool = window.__timerhaven_tool || {};
      window.__timerhaven_tool.habitTracker = { loadedAt: Date.now(), habitsCount: habits.length };
    });
    // Cloud Sync Listeners
    window.addEventListener('timerhaven:cloudDataLoaded', function (e) {
      const cloudData = e.detail;
      if (cloudData && cloudData.habits) {
        let changed = false;
        cloudData.habits.forEach(cloudHabit => {
          const existing = habits.find(h => h.id === cloudHabit.id);
          if (!existing) {
            habits.push(cloudHabit);
            changed = true;
          } else if ((cloudHabit.updatedAt || 0) > (existing.updatedAt || 0)) {
            // Merge cloud habit over local
            Object.assign(existing, cloudHabit);
            changed = true;
          }
        });
        if (changed) {
          saveHabits();
          refreshUI();
        }
      }
    });
    window.addEventListener('timerhaven:cloudDataChanged', function () {
      if (window.SyncManager && window.SyncManager.isAvailable()) window.SyncManager.initialize();
    });
  </script>
  <!-- External JS dependencies removed -->
</body>
