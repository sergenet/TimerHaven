<body>
  <div class="page-wrap">
    <div class="center-row single" id="center-row">
      <div aria-label="Таймер задач" class="tool-card" role="region">
        <a class="d-block mb-2" href="index.html" style="text-decoration:none; color:#0d6efd; font-weight:600;">← Назад
          в главное меню</a>
        <h3><i class="fa fa-hourglass-half"></i> Таймер</h3>

        <div aria-live="polite" class="timer-section">
          <div class="timer-controls mb-2" style="display:flex;flex-direction:column;gap:.6rem;align-items:flex-start;">
            <label style="font-weight:600; display:flex;align-items:center;">Часы:
              <div style="position:relative; display:inline-flex; align-items:center;">
                <input id="hours" type="number" min="0" max="24" value="0" class="form-control"
                  style="width:75px; padding-right:20px; text-align:center;">
                <div class="spin-arrows"
                  style="position:absolute; right:2px; display:flex; flex-direction:column; background:transparent;">
                  <button type="button" onclick="adjTime('hours',1)"
                    style="border:none;background:none;font-size:10px;padding:0 5px;cursor:pointer;color:#495057;">▲</button>
                  <button type="button" onclick="adjTime('hours',-1)"
                    style="border:none;background:none;font-size:10px;padding:0 5px;cursor:pointer;color:#495057;">▼</button>
                </div>
              </div>
            </label>
            <label style="font-weight:600; display:flex;align-items:center;">Минуты:
              <div style="position:relative; display:inline-flex; align-items:center;">
                <input id="minutes" type="number" min="0" max="59" value="25" class="form-control"
                  style="width:75px; padding-right:20px; text-align:center;">
                <div class="spin-arrows"
                  style="position:absolute; right:2px; display:flex; flex-direction:column; background:transparent;">
                  <button type="button" onclick="adjTime('minutes',1)"
                    style="border:none;background:none;font-size:10px;padding:0 5px;cursor:pointer;color:#495057;">▲</button>
                  <button type="button" onclick="adjTime('minutes',-1)"
                    style="border:none;background:none;font-size:10px;padding:0 5px;cursor:pointer;color:#495057;">▼</button>
                </div>
              </div>
            </label>
            <label style="font-weight:600; display:flex;align-items:center;">Секунды:
              <div style="position:relative; display:inline-flex; align-items:center;">
                <input id="seconds" type="number" min="0" max="59" value="0" class="form-control"
                  style="width:75px; padding-right:20px; text-align:center;">
                <div class="spin-arrows"
                  style="position:absolute; right:2px; display:flex; flex-direction:column; background:transparent;">
                  <button type="button" onclick="adjTime('seconds',1)"
                    style="border:none;background:none;font-size:10px;padding:0 5px;cursor:pointer;color:#495057;">▲</button>
                  <button type="button" onclick="adjTime('seconds',-1)"
                    style="border:none;background:none;font-size:10px;padding:0 5px;cursor:pointer;color:#495057;">▼</button>
                </div>
              </div>
            </label>
          </div>
          <div class="timer-display" id="timerDisplay">25:00</div>
          <div aria-label="Управление таймером" class="timer-btns" role="toolbar">
            <button class="btn btn-success btn-small" id="startBtn"><i class="fa fa-play"></i> Старт</button>
            <button class="btn btn-secondary btn-small" id="pauseBtn"><i class="fa fa-pause"></i> Пауза</button>
            <button class="btn btn-danger btn-small" id="resetBtn"><i class="fa fa-refresh"></i> Сброс</button>
          </div>
          <div class="mt-4">
            <h5 style="font-size:1rem;font-weight:700;">Записать сессию</h5>
            <input class="form-control mb-2" id="sessionName" placeholder="Что вы сделали?" type="text" />
            <button class="btn btn-outline-primary btn-sm w-100" id="recordBtn">Сохранить как завершенную</button>
          </div>
          <div class="mt-3" id="sessionLog"
            style="max-height:150px; overflow-y:auto; font-size:0.9rem; border-top:1px solid #eee; padding-top:10px;">
            <div class="text-muted">Сессии пока не записаны.</div>
          </div>
        </div>

  <script>
    (function () {
      // focus-on-hash so /timer-ru.html#startBtn focuses Start
      window.addEventListener('load', function () {
        try {
          var id = (location.hash || '').substring(1);
          if (!id) return;
          var el = document.getElementById(id);
          if (el && typeof el.focus === 'function') {
            setTimeout(function () { el.focus({ preventScroll: false }); }, 50);
          }
        } catch (e) { }
      });
      // Timer logic
      var timer = null;
      var totalSeconds = 25 * 60;
      var running = false;
      function updateTimerDisplay() {
        var hrs = Math.floor(totalSeconds / 3600);
        var min = Math.floor((totalSeconds % 3600) / 60);
        var sec = totalSeconds % 60;
        document.getElementById('timerDisplay').textContent =
          (hrs > 0 ? String(hrs).padStart(2, '0') + ':' : '') +
          String(min).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
      }

      window.adjTime = function (id, delta) {
        var el = document.getElementById(id);
        if (!el) return;
        var val = parseInt(el.value, 10);
        if (isNaN(val)) val = 0;
        val += delta;
        var max = parseInt(el.max, 10) || 59;
        var min = parseInt(el.min, 10) || 0;
        if (val > max) val = max;
        if (val < min) val = min;
        el.value = val;
        setTimerLengths();
      };
      function setTimerLengths() {
        var hrs = parseInt(document.getElementById('hours').value, 10) || 0;
        var min = parseInt(document.getElementById('minutes').value, 10) || 0;
        var sec = parseInt(document.getElementById('seconds').value, 10) || 0;
        totalSeconds = Math.max(0, hrs * 3600 + min * 60 + sec);
        updateTimerDisplay();
      }
      document.getElementById('hours').addEventListener('change', setTimerLengths);
      document.getElementById('minutes').addEventListener('change', setTimerLengths);
      document.getElementById('seconds').addEventListener('change', setTimerLengths);
      document.getElementById('startBtn').addEventListener('click', function () {
        if (running) return;
        running = true;
        timer = setInterval(function () {
          if (totalSeconds > 0) {
            totalSeconds--;
            updateTimerDisplay();
          } else {
            clearInterval(timer);
            running = false;
            try { alert("Время вышло!"); } catch (e) { }
          }
        }, 1000);
      });
      document.getElementById('pauseBtn').addEventListener('click', function () {
        if (timer) clearInterval(timer);
        running = false;
      });
      document.getElementById('resetBtn').addEventListener('click', function () {
        if (timer) clearInterval(timer);
        running = false;
        var hrEl = document.getElementById('hours');
        var minEl = document.getElementById('minutes');
        var secEl = document.getElementById('seconds');
        if (hrEl) hrEl.value = '0';
        if (minEl) minEl.value = '25';
        if (secEl) secEl.value = '0';
        var nameInput = document.getElementById('sessionName');
        if (nameInput) nameInput.value = '';
        setTimerLengths();
      });
      // initialize
      setTimerLengths();
      // Персистентность и синхронизация
      var sessions = [];
      try {
        var saved = localStorage.getItem('timerSessions_ru');
        if (saved) sessions = JSON.parse(saved);
      } catch (e) { sessions = []; }
      function saveSessions() {
        localStorage.setItem('timerSessions_ru', JSON.stringify(sessions));
        requestAnimationFrame(renderSessions);
      }
      function renderSessions() {
        var log = document.getElementById('sessionLog');
        if (!log) return;
        if (sessions.length === 0) {
          log.innerHTML = '<div class="text-muted">Сессии пока не записаны.</div>';
          return;
        }
        log.innerHTML = sessions.map(function (s, idx) {
          return '<div style="margin-bottom:6px; padding-bottom:4px; border-bottom:1px solid #f0f0f0; display:flex; justify-content:space-between; align-items:center;">' +
            '<div><strong>' + (s.name || 'Сессия без названия') + '</strong><br>' +
            '<span class="text-muted" style="font-size:0.8rem;">' + s.duration + 'м · ' + s.date + '</span></div>' +
            '<button class="btn btn-sm btn-outline-danger" onclick="deleteSession(' + idx + ')" title="Удалить сессию"><i class="fa fa-trash"></i></button>' +
            '</div>';
        }).join('');
      }
      window.deleteSession = function (idx) {
        var removed = sessions.splice(idx, 1)[0];
        saveSessions();
        if (removed && removed.id && window.SyncManager && window.SyncManager.isAvailable()) {
          try {
            window.SyncManager.deleteTaskSession(removed.id);
          } catch (e) { }
        }
      };
      function safeBind(id, ev, fn) {
        var el = document.getElementById(id);
        if (el) el.addEventListener(ev, fn);
      }
      safeBind('recordBtn', 'click', function () {
        var nameInput = document.getElementById('sessionName');
        var name = nameInput ? nameInput.value.trim() : '';
        var hrsEl = document.getElementById('hours');
        var minEl = document.getElementById('minutes');
        var duration = (parseInt(hrsEl ? hrsEl.value : 0) * 60) + parseInt(minEl ? minEl.value : 25);
        var session = {
          id: 'task_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
          name: name,
          duration: duration,
          date: new Date().toLocaleString(),
          timestamp: Date.now()
        };
        sessions.unshift(session);
        saveSessions();
        if (window.SyncManager && window.SyncManager.isAvailable()) {
          try {
            window.SyncManager.saveTaskSession(session.id, session);
          } catch (e) { }
        }
        if (nameInput) nameInput.value = '';
      });
      renderSessions();
      // Cloud Sync Listeners
      window.addEventListener('timerhaven:cloudDataLoaded', function (e) {
        const cloudData = e.detail;
        if (cloudData && cloudData.tasks) {
          let changed = false;
          cloudData.tasks.forEach(cloudTask => {
            const existing = sessions.find(s => s.id === cloudTask.id);
            if (!existing) {
              sessions.push(cloudTask);
              changed = true;
            }
          });
          if (changed) {
            sessions.sort(function (a, b) { return (b.timestamp || 0) - (a.timestamp || 0); });
            saveSessions();
          }
        }
      });
      window.addEventListener('timerhaven:cloudDataChanged', function () {
        if (SyncManager.isAvailable()) SyncManager.initialize();
      });
    })();
  </script>
