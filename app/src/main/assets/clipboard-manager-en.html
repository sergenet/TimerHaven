<body>
  <main style="display:flex;justify-content:center;padding:28px 12px 64px;">

        Clipboard Manager</div>

        <p>Save and reuse text snippets across tasks. Clips are stored locally in your browser.</p>
      </div>

      </div>
      <form id="clipboardForm" class="clipboard-form" aria-label="Add clipboard note" style="margin-top:.6rem;">
        <textarea id="clipboardInput" placeholder="Type or paste your note here..." class="form-control"
          aria-label="Clipboard input"></textarea>
        <div style="display:flex; gap:.5rem; margin-top:.6rem;">
          <button type="submit" id="add-btn" class="btn btn-success">Add</button>
          <button type="button" id="paste-btn" class="btn btn-outline-secondary">Paste</button>
          <button type="button" id="clear-input" class="btn btn-outline-danger">Clear</button>
        </div>
      </form>
      <div class="clips-list" id="clips-list" aria-live="polite" aria-atomic="true" style="margin-top:.8rem;"></div>

<script src="assets/js/syncManager.js"></script>
  <script>
    // console.error for mobile errors
    window.onerror = function (msg, url, line) {
      console.error('JS Error: ' + msg + '\nLine: ' + line);
      return false;
    };
    // Storage helpers
    function safeSet(key, value) { try { localStorage.setItem(key, value); return true; } catch (e) { console.error('Storage Save Error: ' + e.message); return false; } }
    function safeGet(key) { try { return localStorage.getItem(key); } catch (e) { console.error('Storage Read Error: ' + e.message); return null; } }
    const STORAGE_KEY = 'clipboardClips_v1';
    let clips;
    try {
      clips = JSON.parse(safeGet(STORAGE_KEY) || '[]');
    } catch (e) {
      clips = [];
    }
    if (!Array.isArray(clips)) clips = [];
    // Assign IDs to legacy clips if missing
    clips.forEach(c => { if (!c.id) c.id = 'clip_' + Math.random().toString(36).substr(2, 9) + '_' + (c.created || Date.now()); });
    function saveClips() {
      safeSet(STORAGE_KEY, JSON.stringify(clips));
      requestAnimationFrame(renderClips);
    }
    // Layered clipboard helpers (navigator.clipboard -> native bridge -> execCommand)
    function status(msg) {
      const s = document.getElementById('status');
      if (s) s.textContent = msg || '';
    }
    function safeWriteToClipboard(text) {
      // Prefer modern clipboard API
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text).then(function () {
          return 'navigator';
        }).catch(function (err) {
          // Try native bridge if present
          if (window.AndroidClipboard && typeof window.AndroidClipboard.writeText === 'function') {
            try { window.AndroidClipboard.writeText(text); return Promise.resolve('native'); } catch (e) { }
          }
          // Fallback to execCommand
          try {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            return Promise.resolve('exec');
          } catch (e) {
            return Promise.reject(e);
          }
        });
      }
      // If no navigator.clipboard, try native bridge
      if (window.AndroidClipboard && typeof window.AndroidClipboard.writeText === 'function') {
        try { window.AndroidClipboard.writeText(text); return Promise.resolve('native'); } catch (e) { }
      }
      // Last-resort execCommand fallback
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        return Promise.resolve('exec');
      } catch (e) {
        return Promise.reject(e);
      }
    }
    function safeReadFromClipboard() {
      // Prefer modern clipboard API
      if (navigator.clipboard && navigator.clipboard.readText) {
        return navigator.clipboard.readText().then(function (txt) { return { source: 'navigator', text: txt }; })
          .catch(function (err) {
            // fallback to native bridge if present
            if (window.AndroidClipboard && typeof window.AndroidClipboard.readText === 'function') {
              try { const r = window.AndroidClipboard.readText(); return Promise.resolve({ source: 'native', text: r || '' }); } catch (e) { }
            }
            return Promise.resolve({ source: 'none', text: '' });
          });
      }
      // If no navigator.clipboard, try native bridge
      if (window.AndroidClipboard && typeof window.AndroidClipboard.readText === 'function') {
        try { const r = window.AndroidClipboard.readText(); return Promise.resolve({ source: 'native', text: r || '' }); } catch (e) { }
      }
      // No reliable read available
      return Promise.resolve({ source: 'none', text: '' });
    }
    // Acquire DOM refs safely
    const clipsList = document.getElementById('clips-list'),
      clipboardForm = document.getElementById('clipboardForm'),
      clipboardInput = document.getElementById('clipboardInput');
    // Render clips using safeWriteToClipboard for copy action
    function renderClips() {
      if (!clipsList) return;
      clipsList.innerHTML = '';
      if (!clips || clips.length === 0) {
        const p = document.createElement('div'); p.className = 'muted'; p.textContent = 'No clips yet.'; clipsList.appendChild(p); return;
      }
      clips.forEach((c, i) => {
        const item = document.createElement('div'); item.className = 'clip-item';
        const text = document.createElement('div'); text.className = 'clip-text'; text.textContent = c.text;
        const actions = document.createElement('div'); actions.className = 'clip-actions';
        const copyBtn = document.createElement('button'); copyBtn.className = 'btn btn-sm btn-outline-success'; copyBtn.innerHTML = '<i class="fa fa-copy"></i> Copy';
        copyBtn.onclick = function () {
          // Use layered clipboard helper
          safeWriteToClipboard(c.text).then((method) => {
            if (method === 'navigator') { copyBtn.textContent = 'Copied'; setTimeout(() => copyBtn.innerHTML = '<i class="fa fa-copy"></i> Copy', 900); }
            else if (method === 'native') { copyBtn.textContent = 'Copied'; setTimeout(() => copyBtn.innerHTML = '<i class="fa fa-copy"></i> Copy', 900); }
            else if (method === 'exec') { copyBtn.textContent = 'Copied'; setTimeout(() => copyBtn.innerHTML = '<i class="fa fa-copy"></i> Copy', 900); }
          }).catch((err) => {
            console.error('Copy failed  your browser may block clipboard access.');
          });
        };
        const editBtn = document.createElement('button'); editBtn.className = 'btn btn-sm btn-outline-secondary'; editBtn.innerHTML = '<i class="fa fa-edit"></i> Edit';
        editBtn.onclick = function () { if (clipboardInput) { clipboardInput.value = c.text; clipboardInput.focus(); } };
        const delBtn = document.createElement('button'); delBtn.className = 'btn btn-sm btn-outline-danger'; delBtn.innerHTML = '<i class="fa fa-trash"></i> Delete';
        delBtn.onclick = function () {
          const removed = clips.splice(i, 1)[0];
          saveClips();
          if (removed && removed.id && window.SyncManager && window.SyncManager.isAvailable()) {
            try {
              window.SyncManager.deleteClip(removed.id);
            } catch (e) { }
          }
        };
        actions.appendChild(copyBtn); actions.appendChild(editBtn); actions.appendChild(delBtn);
        item.appendChild(text); item.appendChild(actions); clipsList.appendChild(item);
      });
    }
    function addClip() {
      if (!clipboardInput) return;
      const v = clipboardInput.value.trim();
      if (!v) return;
      const newClip = {
        id: 'clip_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
        text: v,
        created: Date.now()
      };
      clips.unshift(newClip);
      saveClips();
      if (window.SyncManager && window.SyncManager.isAvailable()) {
        try {
          window.SyncManager.saveClip(newClip.id, newClip.text, newClip.created);
        } catch (e) { }
      }
      clipboardInput.value = '';
    }
    if (clipboardForm) {
      clipboardForm.addEventListener('submit', function (e) {
        e.preventDefault();
        addClip();
      });
    }
    const addBtn = document.getElementById('add-btn');
    if (addBtn) {
      addBtn.addEventListener('touchstart', function (e) {
        e.preventDefault();
        addClip();
      });
      addBtn.addEventListener('click', function (e) {
        e.preventDefault();
        addClip();
      });
    }
    // Paste button uses safeReadFromClipboard
    const pasteBtnEl = document.getElementById('paste-btn');
    if (pasteBtnEl) pasteBtnEl.addEventListener('click', async () => {
      try {
        const res = await safeReadFromClipboard();
        if (clipboardInput) clipboardInput.value = res.text || '';
        if (res.source === 'navigator') status('Pasted from navigator.clipboard');
        else if (res.source === 'native') status('Pasted from native bridge (AndroidClipboard)');
        else status('No clipboard content available or reading unsupported.');
      } catch (e) {
        console.error('Unable to read from clipboard (permission denied or unsupported).');
      }
    });
    const clearInputEl = document.getElementById('clear-input');
    if (clearInputEl) clearInputEl.addEventListener('click', () => { if (clipboardInput) clipboardInput.value = ''; });
    const clearAllEl = document.getElementById('clear-all');
    if (clearAllEl) clearAllEl.addEventListener('click', () => {
      if (!confirm('Clear all clips? This cannot be undone.')) return;
      clips = []; safeSet(STORAGE_KEY, JSON.stringify(clips)); renderClips();
    });
    
    document.addEventListener('DOMContentLoaded', () => { if (!Array.isArray(clips)) clips = []; renderClips(); window.__timerhaven_clips = clips; });
    // Cloud Sync Listeners
    window.addEventListener('timerhaven:cloudDataLoaded', function (e) {
      const cloudData = e.detail;
      if (cloudData && cloudData.clipboard) {
        let changed = false;
        cloudData.clipboard.forEach(cloudClip => {
          const existing = clips.find(c => c.id === cloudClip.id);
          if (!existing) {
            clips.push(cloudClip);
            changed = true;
          } else {
            const cloudTs = cloudClip.timestamp || 0;
            const localTs = existing.created || 0;
            if (cloudTs > localTs) {
              existing.text = cloudClip.text;
              existing.created = cloudTs;
              changed = true;
            }
          }
        });
        if (changed) {
          saveClips();
          renderClips();
        }
      }
    });
    window.addEventListener('timerhaven:cloudDataChanged', function () {
      if (SyncManager.isAvailable()) SyncManager.initialize();
    });
  </script>
