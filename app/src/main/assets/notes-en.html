<body>
  <main class="main-container" role="main">
    <section class="tool-card" aria-labelledby="tool-title">
      <a href="index.html" class="back-link" id="back-link"
        onclick="window.location.href='index.html'; return false;">&larr; Back to Main Menu</a>
      <h3 id="tool-title" class="tool-title">📝 Notes</h3>
      <div class="tool-intro" id="tool-help" data-preserve="true"
        style="margin-top:.6rem;margin-bottom:.9rem;color:#374151;line-height:1.45;">
        <p>Take quick notes and organize your thoughts locally.</p>
      </div>
      <div class="notes-section">
        <form class="notes-form" id="notesForm">
          <input type="text" id="noteInput" class="form-control" placeholder="Type your note..."
            style="max-width:220px;">
          <button type="submit" id="addNoteBtn" class="btn btn-success btn-sm">Add Note</button>
        </form>
        <div id="notesList" class="notes-list"></div>
      </div>
    </section>
    <!-- Newsletter Signup Removed -->
  </main>
  <script>
    window.onerror = function (msg, url, line) {
      console.error('JS Error: ' + msg + ' @ ' + line);
      return false;
    };
    // Safe storage wrappers
    function safeSet(key, value) {
      try {
        localStorage.setItem(key, value);
        return true;
      } catch (e) {
        console.error('Storage Save Error', e);
        return false;
      }
    }
    function safeGet(key) {
      try {
        return localStorage.getItem(key);
      } catch (e) {
        console.error('Storage Read Error', e);
        return null;
      }
    }
    function $id(id) { return document.getElementById(id); }
    // Load notes
    var notes = [];
    try {
      const saved = safeGet('notesData');
      if (saved) notes = JSON.parse(saved);
    } catch (e) {
      notes = [];
    }
    if (!Array.isArray(notes)) notes = [];
    // Assign IDs to legacy notes
    notes.forEach(function (n) { if (!n.id) n.id = 'note_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now(); });
    function saveNotes() {
      safeSet('notesData', JSON.stringify(notes));
      requestAnimationFrame(function () {
        renderNotes();
      });
    }
    // Fixed escapeHtml (no replaceAll for old browsers)
    function escapeHtml(s) {
      if (!s) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function renderNotes() {
      var list = $id('notesList');
      if (!list) return;
      list.innerHTML = '';
      if (!notes || notes.length === 0) {
        list.innerHTML = '<div style="color:#888;">No notes yet.</div>';
        return;
      }
      notes.forEach(function (note, idx) {
        var pinned = note.pinned ? '<span class="note-pinned">📌</span>' : '';
        var div = document.createElement('div');
        div.className = 'note-item';
        div.innerHTML = '<div style="display:flex;align-items:center;gap:.6rem;">' + pinned + '<span>' + escapeHtml(note.text) + '</span></div>' +
          '<div style="display:flex;align-items:center;gap:.5rem;">' +
          '<span class="note-meta">' + escapeHtml(note.date) + '</span>' +
          '<button class="btn btn-outline-' + (note.pinned ? 'secondary' : 'info') + ' btn-sm" onclick="pinNote(' + idx + ')" title="Pin/unpin">📌</button>' +
          '<button class="btn btn-outline-danger btn-sm" onclick="deleteNote(' + idx + ')">🗑</button>' +
          '</div>';
        list.appendChild(div);
      });
    }
    window.addNote = function () {
      var input = document.getElementById('noteInput');
      if (!input) return;
      var text = input.value.trim();
      if (!text) return;
      try {
        var newNote = {
          id: 'note_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
          text: text,
          date: new Date().toLocaleString(),
          pinned: false,
          updatedAt: Date.now()
        };
        notes.unshift(newNote);
        // Clear input BEFORE async render
        input.value = '';
        input.defaultValue = '';
        saveNotes();
        if (window.SyncManager && window.SyncManager.isAvailable()) {
          try {
            window.SyncManager.saveNote(newNote.id, "", newNote.text);
          } catch (e) { }
        }
      } catch (e) {
        console.error('Error adding note', e);
      }
    };
    var frm = $id('notesForm');
    if (frm) {
      frm.addEventListener('submit', function (e) {
        e.preventDefault();
        window.addNote();
      });
    }
    window.deleteNote = function (idx) {
      var removed = notes.splice(idx, 1)[0];
      saveNotes();
      if (removed && removed.id && window.SyncManager && window.SyncManager.isAvailable()) {
        try {
          window.SyncManager.deleteNote(removed.id);
        } catch (e) { }
      }
      requestAnimationFrame(function () {
        renderNotes();
      });
    }
    window.pinNote = function (idx) {
      if (!notes[idx]) return;
      notes[idx].pinned = !notes[idx].pinned;
      notes[idx].updatedAt = Date.now();
      if (notes[idx].pinned) {
        var pinnedNote = notes.splice(idx, 1)[0];
        notes.unshift(pinnedNote);
      }
      saveNotes();
      if (window.SyncManager && window.SyncManager.isAvailable()) {
        var n = notes.find(function (n) { return n === (pinnedNote || notes[idx]); }); // Find the note we just toggled
        if (n) SyncManager.saveNote(n.id, "", n.text);
      }
      renderNotes();
    }
    // initial render
    renderNotes();
    // Cloud Sync Listeners
    window.addEventListener('timerhaven:cloudDataLoaded', function (e) {
      const cloudData = e.detail;
      if (cloudData && cloudData.notes) {
        let changed = false;
        cloudData.notes.forEach(cloudNote => {
          const existing = notes.find(n => n.id === cloudNote.id);
          if (!existing) {
            notes.push({
              id: cloudNote.id,
              text: cloudNote.content,
              date: new Date(cloudNote.updatedAt || Date.now()).toLocaleString(),
              pinned: false,
              updatedAt: cloudNote.updatedAt
            });
            changed = true;
          } else if ((cloudNote.updatedAt || 0) > (existing.updatedAt || 0)) {
            existing.text = cloudNote.content;
            existing.updatedAt = cloudNote.updatedAt;
            changed = true;
          }
        });
        if (changed) {
          saveNotes();
          renderNotes();
        }
      }
    });
    window.addEventListener('timerhaven:cloudDataChanged', function () {
      if (SyncManager.isAvailable()) SyncManager.initialize();
    });
  </script>
<!-- External JS dependencies removed -->
</body>
