<!DOCTYPE html>
<html>
<body>
<button onclick="playMusic()">Play</button>
<audio id="focus-audio" controls style="display:block"></audio>
<script>
const tracks = {
  white: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
};
function playMusic() {
  const audio = document.getElementById("focus-audio");
  audio.src = tracks.white;
  audio.style.display = "block";
  audio.load();
  audio.play();
}
</script>
</body>
</html>
