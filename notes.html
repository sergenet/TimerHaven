    .article-card .btn {
      white-space: normal;
      word-break: break-word;

      padding: 0.4em 0.6em;

      width: 100%;
      box-sizing: border-box;
      margin-top: 0.6em;
      border-radius: 8px;
      font-weight: 600;
    }
    .tool-card { background: #fff; border-radius: 16px; box-shadow: 0 2px 12px #e0e7ef; width: 410px; min-width: 240px; min-height: 330px; display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; padding: 2em 1.5em 1em 1.5em; text-align: left; position: relative; z-index: 1; }

    @media (max-width: 1100px) { .main-container{padding:0 8px;} .center-row{gap:1em;} .tool-card,.article-card{width:97vw;max-width:540px;height:auto;} }

    // Set language and update UI
    function setLanguage(lang) {
      const t = translations[lang] || translations['en'];
      // Article 1 (desktop)
      document.getElementById('howto-title').innerHTML = t.howtoTitle;
      document.getElementById('howto-list').innerHTML = t.howtoSteps.map(s => `<li>${s}</li>`).join('');
      document.getElementById('howto-link').innerHTML = t.howtoLink;
      document.getElementById('howto-link').href = lang === 'en' ? 'notes-how-to.html' : `notes-how-to-${lang}.html`;

      // Article 2 (desktop)
      document.getElementById('tips-title').innerHTML = t.tipsTitle;
      document.getElementById('tips-list').innerHTML = t.tipsItems.map(s => `<li>${s}</li>`).join('');
      document.getElementById('tips-link').innerHTML = t.tipsLink;
      document.getElementById('tips-link').href = lang === 'en' ? 'notes-tips.html' : `notes-tips-${lang}.html`;

      // Mobile sections
      document.getElementById('howto-title-mobile').innerHTML = t.howtoTitle;
      document.getElementById('howto-list-mobile').innerHTML = t.howtoSteps.map(s => `<li>${s}</li>`).join('');
      document.getElementById('tips-title-mobile').innerHTML = t.tipsTitleMobile;
      document.getElementById('tips-list-mobile').innerHTML = t.tipsItems.map(s => `<li>${s}</li>`).join('');

      // Tool card
      document.getElementById('back-main').innerHTML = t.backMain;
      document.getElementById('notes-title').innerHTML = t.notesTitle;
      document.getElementById('add-note-btn').innerHTML = t.addNoteBtn;
      document.getElementById('noteInput').placeholder = t.noteInputPlaceholder;
      document.getElementById('faq-title').innerHTML = t.faqTitle;
      document.getElementById('faq-list').innerHTML = t.faqItems.map(s => `<li>${s}</li>`).join('');

      // RTL fix for Arabic
      if(lang === 'ar') {
        document.body.setAttribute('dir', 'rtl');
      } else {
        document.body.removeAttribute('dir');
      }
    }

    // Set initial language based on selector or browser
    document.getElementById('language-select').addEventListener('change', function() {
      setLanguage(this.value);
    });

    function detectLang() {
      const lang = navigator.language.substr(0,2);
      if(Object.keys(translations).includes(lang)) {
        document.getElementById('language-select').value = lang;
        setLanguage(lang);
      } else {
        setLanguage('en');
      }
    }
    detectLang();

    // Notes code: Save, pin, delete, display notes
    let notes = JSON.parse(localStorage.getItem('notesData') || '[]');
    function saveNotes() { localStorage.setItem('notesData', JSON.stringify(notes)); }
    function renderNotes() {
      const list = document.getElementById('notesList');
      list.innerHTML = '';
      if (notes.length === 0) {
        list.innerHTML = '<div style="color:#888;">No notes yet.</div>';
        return;
      }
      notes.forEach((note, idx) => {
        const pinned = note.pinned ? '<span class="note-pinned"><i class="fa fa-thumbtack"></i></span>' : '';
        list.innerHTML += `
          <div class="note-item">
            ${pinned}
            <span>${note.text}</span>
            <span class="note-meta">${note.date}</span>
            <button class="btn btn-outline-${note.pinned ? 'secondary' : 'info'} btn-sm note-btn" onclick="pinNote(${idx})" title="Pin/unpin"><i class="fa fa-thumbtack"></i></button>
            <button class="btn btn-outline-danger btn-sm note-btn" onclick="deleteNote(${idx})"><i class="fa fa-trash"></i></button>
          </div>
        `;
      });
    }
    document.getElementById('notesForm').addEventListener('submit', function(e){
      e.preventDefault();
      const text = document.getElementById('noteInput').value.trim();
      if (!text) return;
      notes.unshift({ text, date: new Date().toLocaleString(), pinned: false });
      saveNotes();
      document.getElementById('noteInput').value = "";
      renderNotes();
    });
    window.deleteNote = function(idx){
      notes.splice(idx, 1);
      saveNotes();
      renderNotes();
    }
    window.pinNote = function(idx){
      notes[idx].pinned = !notes[idx].pinned;
      // Move pinned note to top
      if (notes[idx].pinned) {
        const pinnedNote = notes.splice(idx, 1)[0];
        notes.unshift(pinnedNote);
      }
      saveNotes();
      renderNotes();
    }
    renderNotes();
  </script>
