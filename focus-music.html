    .article-card .btn, .tool-card .btn {

    .music-player { margin-bottom: 1em; }

    .music-player select { margin-bottom: 0.7em; }
    .help-section { margin-bottom: 1em; font-size: 1em; }
    .faq-section { margin-top: 1.1em; margin-bottom: 0.3em; font-size: 1em; background: #f7fafc; border-radius: 8px; padding: 1em; box-shadow: 0 1px 4px #e0e7ef; }

    .back-link { display: inline-block; margin-bottom: 1em; color: #007bff; text-decoration: none; font-weight: bold; font-size: 1em; }
    .back-link:hover { text-decoration: underline; }

      text-align: right;

      margin-bottom: 0.7em;
      position: relative;

      font-size: 1.08em;
      font-weight: 600;
      color: #185a9d;
    }

      font-size: 1.08em;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #43cea2;
      background: linear-gradient(90deg, #43cea2 0%, #185a9d 100%);
      color: #fff;
      margin-left: 6px;
      margin-right: 4px;
      box-shadow: 0 2px 8px #e0e7ef;
      transition: background 0.2s;
      font-weight: 600;
    }
    #focus-lang-select option {
      color: #185a9d;
      background: #f4f7fb;
      font-weight: 500;
    }
    body[dir="rtl"] .language-select {
      text-align: left;
      padding: 20px 0 0 40px;
    }
    body[dir="rtl"] #focus-lang-select {
      margin-left: 4px;
      margin-right: 6px;
    }
    @media (max-width: 1100px) {
      .main-container{padding:0 8px;}
      .center-row, .card-row{gap:1em;}
      .tool-card,.article-card{width:97vw;max-width:540px;height:auto;}
    }
    @media (max-width: 800px) {
      .main-container{padding:0;}
      .center-row, .card-row{flex-direction:column;align-items:center;}

    details summary { cursor: pointer; padding: 0.35em 0; font-weight: bold; font-size: 1.09em; }
    details:not([open]) summary::after { content: " ▼"; font-size: 0.9em; }

    function updateDropdownDirection() {
      const lang = document.getElementById("focus-lang-select").value;
      document.querySelector('.language-select').style.textAlign = (lang === "ar") ? "left" : "right";
    }

    function updateFocusMusicLanguage() {
      const lang = document.getElementById("focus-lang-select").value;
      document.body.dir = (lang === "ar") ? "rtl" : "ltr";
      updateDropdownDirection();
      document.getElementById("language-label").textContent = focusMusicTranslations[lang]["language-label"];
      document.getElementById("back-link").textContent = focusMusicTranslations[lang]["back-link"];
      document.getElementById("tool-title").innerHTML = `<i class="fa fa-music"></i> ${focusMusicTranslations[lang]["tool-title"]}`;
      document.getElementById("tool-help").textContent = focusMusicTranslations[lang]["tool-help"];
      document.getElementById("music-label").textContent = focusMusicTranslations[lang]["music-label"];
      document.getElementById("music-select").options[0].text = focusMusicTranslations[lang]["music-white"];
      document.getElementById("music-select").options[1].text = focusMusicTranslations[lang]["music-rain"];
      document.getElementById("music-select").options[2].text = focusMusicTranslations[lang]["music-alpha"];
      document.getElementById("music-select").options[3].text = focusMusicTranslations[lang]["music-classical"];
      document.getElementById("music-select").options[4].text = focusMusicTranslations[lang]["music-ocean"];
      document.getElementById("music-select").options[5].text = focusMusicTranslations[lang]["music-cafe"];
      document.getElementById("loop-label-text").textContent = focusMusicTranslations[lang]["loop-label"];
      document.getElementById("play-btn").textContent = focusMusicTranslations[lang]["play"];
      document.getElementById("play-btn").onclick = playMusic;
      document.getElementById("stop-btn").textContent = focusMusicTranslations[lang]["stop"];
      document.getElementById("stop-btn").onclick = stopMusic;
      document.getElementById("faq-title").textContent = focusMusicTranslations[lang]["faq-title"];
      document.getElementById("faq-list").innerHTML = focusMusicTranslations[lang]["faq-list"];

      document.getElementById("howto-steps").innerHTML = focusMusicTranslations[lang]["howto-steps"];
      document.getElementById("howto-article-btn").textContent = focusMusicTranslations[lang]["howto-article-btn"];
      document.getElementById("howto-article-btn").href = focusMusicTranslations[lang]["howto-article-link"];
      document.getElementById("tips-title").innerHTML = focusMusicTranslations[lang]["tips-title"];
      document.getElementById("tips-list").innerHTML = focusMusicTranslations[lang]["tips-list"];

    document.getElementById("focus-lang-select").addEventListener("change", function() {
      localStorage.setItem('focusMusicLang', this.value);
      updateFocusMusicLanguage();
    });

    document.addEventListener("DOMContentLoaded", function() {
      const savedLang = localStorage.getItem('focusMusicLang') || 'en';
      document.getElementById('focus-lang-select').value = savedLang;
      updateFocusMusicLanguage();
    });

    function playMusic() {
      const sel = document.getElementById("music-select").value;
      const audio = document.getElementById("focus-audio");
      audio.src = tracks[sel];
      audio.loop = document.getElementById("music-loop").checked;
      audio.style.display = "block";
      audio.load();
      audio.play();
    }
    function stopMusic() {
      const audio = document.getElementById("focus-audio");
      audio.pause();
      audio.currentTime = 0;
      audio.style.display = "none";
    }
    document.getElementById("music-loop").addEventListener("change", function() {
      document.getElementById("focus-audio").loop = this.checked;
    });
  </script>
