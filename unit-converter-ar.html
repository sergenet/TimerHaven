<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>محول الوحدات — TimerHaven</title>
  <meta name="description" content="حوّل الطول والوزن ودرجة الحرارة والمزيد. تعلّم كيفية استخدام محول الوحدات، واحصل على نصائح ومقالات.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    :root{--brand:#0b63a0;--link-blue:#0d6efd;--muted:#6b7c89;--card:#fff;--bg:#fbfeff}
    html,body{height:100%}
    body {
      margin:0;
      padding:2rem;
      font-family:'Montserrat', Arial, sans-serif;
      background:var(--bg);
      color:#0b2545;
      direction:rtl;
    }
    .container { max-width:720px; margin:0 auto; }
    .card {
      background:var(--card);
      border-radius:16px;
      box-shadow:0 8px 24px rgba(0,0,0,0.06);
      padding:1.6rem 1.5rem;
      box-sizing:border-box;
      text-align:right;
    }
    .back-link{display:inline-block;margin-bottom:.75rem;color:var(--link-blue) !important;text-decoration:none;font-weight:700}
    .back-link:hover{text-decoration:underline}
    .tool-title { color:#185a9d; font-size:1.35rem; margin:0 0 .6rem 0; display:flex; align-items:center; gap:.5rem; justify-content:flex-end; }
    .cta{
      display:inline-block;margin:.35rem 0 .8rem 0;padding:.45rem .9rem;border-radius:999px;
      background:var(--link-blue);color:#fff;text-decoration:none;font-weight:700;font-size:.95rem;border:none;
      box-shadow:0 6px 18px rgba(13,110,253,0.12);
    }
    .unit-section{margin-top:.4rem}
    .converter-form{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap;align-items:center;justify-content:flex-end}
    .converter-result{font-weight:700;font-size:1.12em;margin-bottom:1rem;color:#102a43;min-height:1.2em;text-align:right}
    .faq-section{margin-top:1rem;background:#f7fafc;border-radius:8px;padding:1rem;box-shadow:0 1px 4px #e0e7ef;text-align:right}
    .btn-small{padding:.35rem .7rem;font-size:.9rem}
    /* keep language selector markup but hide it (defensive) */
    .top-row{display:none !important}
    /* number inputs should show LTR numerals for readability */
    input[type=number]{direction:ltr}
    @media (max-width:900px){ .card{padding:1rem} .converter-form{justify-content:flex-start} }
  </style>
</head>
<body>
  <script>try{ localStorage.setItem('timerhavenLang','ar'); }catch(e){};</script>

  <main class="container" role="main">
    <article class="card" aria-labelledby="tool-title">
      <a href="index.html" class="back-link">&larr;&nbsp;العودة إلى القائمة الرئيسية</a>

      <h3 id="tool-title" class="tool-title"><i class="fa fa-ruler-combined" aria-hidden="true"></i> محول الوحدات</h3>

      <p style="margin:0 0 .6rem 0; text-align:right;">
        <a id="read-guide-btn" class="cta" href="/ar/unit-converter/unit-converter-index.html" role="button" target="_blank" rel="noopener">اقرأ المقال كاملًا</a>
      </p>

      <div class="unit-section" aria-live="polite">
        <form id="unitForm" class="converter-form" onsubmit="return false;" aria-label="نموذج تحويل الوحدات">
          <label for="typeSelect" class="visually-hidden">النوع</label>
          <select id="typeSelect" class="form-select" style="max-width:140px;">
            <option value="length">الطول</option>
            <option value="weight">الوزن</option>
            <option value="temperature">الحرارة</option>
          </select>

          <label for="inputValue" class="visually-hidden">قيمة</label>
          <input type="number" id="inputValue" class="form-control" placeholder="القيمة" style="max-width:100px;">

          <label for="fromUnit" class="visually-hidden">من</label>
          <select id="fromUnit" class="form-select" style="max-width:140px;"></select>

          <span aria-hidden="true" style="font-size:1.3em;">→</span>

          <label for="toUnit" class="visually-hidden">إلى</label>
          <select id="toUnit" class="form-select" style="max-width:140px;"></select>

          <button id="convertBtn" class="btn btn-primary btn-sm" type="button">تحويل</button>
        </form>

        <!-- Use innerHTML with LTR spans so numbers and unit names render left-to-right and keep correct order in RTL layout -->
        <div id="unitResult" class="converter-result" aria-live="polite">ستظهر النتيجة هنا.</div>

        <details class="faq-section">
          <summary style="font-weight:700; font-size:1.02rem; cursor:pointer;">الأسئلة الشائعة</summary>
          <ul style="padding-right:1.1rem; color:#374151; list-style-position:inside;">
            <li><strong>هل تدعم جميع الوحدات؟</strong> يتضمن المحول الوحدات الأكثر استخدامًا.</li>
            <li><strong>هل التحويل مجاني؟</strong> نعم — استخدمه بلا حدود.</li>
            <li><strong>هل يمكن تحويل القيم العشرية؟</strong> نعم — يتم دعم الأعداد العشرية.</li>
          </ul>
        </details>
      </div>
    </article>
  </main>

  <script>
  // Unit definitions & conversion logic (based on en canonical)
  const unitTypes = {
    length: {
      units: { "Meter": 1, "Kilometer": 1000, "Centimeter": 0.01, "Millimeter": 0.001, "Mile": 1609.34, "Yard": 0.9144, "Foot": 0.3048, "Inch": 0.0254 },
      convert: (val, from, to) => val * unitTypes.length.units[from] / unitTypes.length.units[to]
    },
    weight: {
      units: { "Kilogram": 1, "Gram": 0.001, "Milligram": 0.000001, "Pound": 0.453592, "Ounce": 0.0283495 },
      convert: (val, from, to) => val * unitTypes.weight.units[from] / unitTypes.weight.units[to]
    },
    temperature: {
      units: { "Celsius": "C", "Fahrenheit": "F", "Kelvin": "K" },
      convert: (val, from, to) => {
        if (from === to) return val;
        if (from === "Celsius" && to === "Fahrenheit") return val * 9/5 + 32;
        if (from === "Fahrenheit" && to === "Celsius") return (val - 32) * 5/9;
        if (from === "Celsius" && to === "Kelvin") return val + 273.15;
        if (from === "Kelvin" && to === "Celsius") return val - 273.15;
        if (from === "Fahrenheit" && to === "Kelvin") return (val - 32) * 5/9 + 273.15;
        if (from === "Kelvin" && to === "Fahrenheit") return (val - 273.15) * 9/5 + 32;
      }
    }
  };

  function populateUnits(type) {
    const from = document.getElementById('fromUnit');
    const to = document.getElementById('toUnit');
    from.innerHTML = to.innerHTML = '';
    Object.keys(unitTypes[type].units).forEach(u => {
      from.appendChild(new Option(u, u));
      to.appendChild(new Option(u, u));
    });
  }

  const typeSelect = document.getElementById('typeSelect');
  const initialType = typeSelect.value || 'length';
  typeSelect.addEventListener('change', function() { populateUnits(this.value); });
  populateUnits(initialType);

  function formatNumber(v) {
    if (typeof v !== 'number' || !isFinite(v)) return v;
    // trim to max 6 decimals, remove trailing zeros
    return parseFloat(v.toFixed(6)).toString();
  }

  function doConvert() {
    const type = document.getElementById('typeSelect').value;
    const rawVal = document.getElementById('inputValue').value;
    const val = parseFloat(rawVal);
    const from = document.getElementById('fromUnit').value;
    const to = document.getElementById('toUnit').value;
    const resultEl = document.getElementById('unitResult');

    if (isNaN(val)) {
      resultEl.textContent = "الرجاء إدخال قيمة صحيحة.";
      return;
    }

    let result = unitTypes[type].convert(val, from, to);
    if (typeof result === 'number') result = formatNumber(result);

    // Wrap LTR segments in an element with dir="ltr" so numbers and English unit labels keep LTR order.
    // This prevents RTL reordering issues (e.g. "Centimeter = 0.02 Meter 2").
    const leftPart = `<span dir="ltr">${formatNumber(val)} ${from}</span>`;
    const rightPart = `<span dir="ltr">${result} ${to}</span>`;
    // Insert with the equals sign between them (equals is neutral; its placement is fine in RTL when LTR spans are used).
    resultEl.innerHTML = `${leftPart} = ${rightPart}`;
  }

  document.getElementById('convertBtn').addEventListener('click', doConvert);
  document.getElementById('unitForm').addEventListener('submit', function(e){
    e.preventDefault();
    doConvert();
  });

  // language selector redirect (markup present but hidden)
  (function() {
    var sel = document.getElementById('language-select-top');
    if (sel) {
      sel.addEventListener('change', function() {
        var v = this.value || 'en';
        window.location.href = 'unit-converter-' + v + '.html';
      });
    }
  })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
