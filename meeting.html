/* Helper: read language set by index.html */
function getLang() {
  try {
    const l = localStorage.getItem('timerhavenLang') || 'en';
    return (l && l.slice(0,2)) || 'en';
  } catch (e) {
    return 'en';
  }
}
const langNames = { en:"English", fr:"Français", es:"Español", de:"Deutsch", ru:"Русский", el:"Ελληνικά", ar:"العربية" };

/* Apply UI strings for chosen language */
function applyLanguage(lang) {
  lang = (lang || getLang()).slice(0,2);
  const t = translations[lang] || translations.en;

  document.body.dir = (lang === 'ar') ? 'rtl' : 'ltr';

  // language indicator
  const labelEl = document.getElementById('language-label');
  const nameEl = document.getElementById('language-name');
  if (labelEl) labelEl.textContent = t['language-label'] || 'Language:';
  if (nameEl) nameEl.textContent = langNames[lang] || lang;

  // main UI
  document.getElementById("back-link").textContent = t["back-link"] || '';
  document.getElementById("tool-title").textContent = t["tool-title"] || '';
  document.getElementById("participant-name-label").textContent = t["participant-name-label"] || '';
  document.getElementById("participantName").placeholder = t["participant-name-placeholder"] || '';
  document.getElementById("city-label").textContent = t["city-label"] || '';
  document.getElementById("add-participant-btn-text").textContent = t["add-participant-btn-text"] || '';

  document.getElementById("meeting-date-label").textContent = t["meeting-date-label"] || '';
  document.getElementById("meeting-time-label").textContent = t["meeting-time-label"] || '';

  // City dropdown
  const citySelect = document.getElementById("participantCity");
  citySelect.innerHTML = '';
  (t["city-options"] || []).forEach(opt => {
    const option = document.createElement("option");
    option.value = opt.value;
    option.textContent = opt.label;
    citySelect.appendChild(option);
  });

  // FAQ
  document.getElementById("faq-title").textContent = t["faq-title"] || '';
  const faqList = document.getElementById("faq-list");
  faqList.innerHTML = "";
  (t["faq-list"] || []).forEach(faq => {
    const li = document.createElement("li");
    li.innerHTML = `<b>${faq.bold}</b> ${faq.text}`;
    faqList.appendChild(li);
  });

  // How-To & Tips
  document.getElementById("howto-title").textContent = t["howto-title"] || '';
  document.getElementById("howto-article-btn").textContent = t["howto-article-btn"] || '';
  document.getElementById("howto-article-btn").href = t["howto-article-link"] || '';
  const howtoSteps = document.getElementById("howto-steps");
  howtoSteps.innerHTML = "";
  (t["howto-steps"] || []).forEach(step => {
    const li = document.createElement("li");
    li.innerHTML = `<b>${step.bold}</b> ${step.text}`;
    howtoSteps.appendChild(li);
  });

  document.getElementById("tips-title").textContent = t["tips-title"] || '';
  document.getElementById("tips-article-btn").textContent = t["tips-article-btn"] || '';
  document.getElementById("tips-article-btn").href = t["tips-article-link"] || '';
  const tipsList = document.getElementById("tips-list");
  tipsList.innerHTML = "";
  (t["tips-list"] || []).forEach(tip => {
    const li = document.createElement("li");
    li.innerHTML = `<b>${tip.bold}</b> ${tip.text}`;
    tipsList.appendChild(li);
  });

  populateTimeSelect();
  updateMeetingTimes();
}

/* Participants persistence and rendering */
const { DateTime } = luxon;
const LS_PARTICIPANTS = 'meetingPlannerParticipants';
const LS_DATE = 'meetingPlannerDate';
const LS_TIME = 'meetingPlannerTime';

function loadParticipants() {
  const saved = localStorage.getItem(LS_PARTICIPANTS);
  window.participants = saved ? JSON.parse(saved) : [];
}
function saveParticipants() {
  localStorage.setItem(LS_PARTICIPANTS, JSON.stringify(window.participants));
}
function loadMeetingSettings() {
  document.getElementById('meetingDate').value = localStorage.getItem(LS_DATE) || '';
  document.getElementById('meetingTimeSelect').value = localStorage.getItem(LS_TIME) || '';
}
function saveMeetingSettings() {
  localStorage.setItem(LS_DATE, document.getElementById('meetingDate').value);
  localStorage.setItem(LS_TIME, document.getElementById('meetingTimeSelect').value);
}
function renderParticipants() {
  const list = document.getElementById('participantList');
  list.innerHTML = '';
  const lang = getLang();
  const t = translations[lang] || translations.en;
  if (!window.participants || window.participants.length === 0) {
    list.innerHTML = `<div style="color: #888;">${t["no-participants-yet"] || "No participants yet."}</div>`;
    return;
  }
  window.participants.forEach((p, idx) => {
    const item = document.createElement('div');
    item.className = 'participant-item';
    item.innerHTML = `
      <div style="min-width:0;">
        <div style="font-weight:700;">${escapeHtml(p.name)}</div>
        <div style="font-size:.9em;color:#666;">${escapeHtml(p.city)}</div>
      </div>
      <div style="display:flex;gap:.5rem;">
        <button class="btn btn-outline-danger btn-sm" onclick="removeParticipant(${idx})" aria-label="Remove participant"><i class="fa fa-trash"></i></button>
      </div>
    `;
    list.appendChild(item);
  });
}
function escapeHtml(s) {
  if (!s) return '';
  return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'", '&#39;');
}

/* Add / remove participants */
document.getElementById('add-participant-btn').addEventListener('click', function() {
  const name = document.getElementById('participantName').value.trim();
  const city = document.getElementById('participantCity').value;
  const lang = getLang();
  const t = translations[lang] || translations.en;

  if (!name) {
    alert(t['enter-name-msg'] || 'Please enter a participant name.');
    return;
  }
  if (!city) {
    alert(t['select-city-msg'] || 'Please select a time zone/city.');
    return;
  }
  window.participants.push({ name, city });
  saveParticipants();
  document.getElementById('participantName').value = '';
  document.getElementById('participantCity').selectedIndex = 0;
  renderParticipants();
  updateMeetingTimes();
});
window.removeParticipant = function(idx) {
  window.participants.splice(idx, 1);
  saveParticipants();
  renderParticipants();
  updateMeetingTimes();
};
document.getElementById('clear-participants-btn').addEventListener('click', function(){
  if (!window.participants || window.participants.length === 0) return;
  if (!confirm('Clear all participants?')) return;
  window.participants = [];
  saveParticipants();
  renderParticipants();
  updateMeetingTimes();
});

/* Improved time selector */
function populateTimeSelect() {
  const sel = document.getElementById('meetingTimeSelect');
  const lang = getLang();
  const t = translations[lang] || translations.en;
  sel.innerHTML = '';
  const placeholder = document.createElement('option');
  placeholder.value = '';
  placeholder.textContent = '— ' + (t['meeting-time-label'] || 'Select Meeting Time') + ' —';
  sel.appendChild(placeholder);

  for (let h = 0; h < 24; h++) {
    for (let m = 0; m < 60; m += 30) {
      const hr = String(h).padStart(2,'0');
      const min = String(m).padStart(2,'0');
      const value = `${hr}:${min}`;
      const label = `${hr}:${min}`;
      const opt = document.createElement('option');
      opt.value = value;
      opt.textContent = label;
      sel.appendChild(opt);
    }
  }
  if (!sel.value) {
    const now = DateTime.local().startOf('minute');
    const minutes = now.minute;
    const next = now.plus({ minutes: (minutes < 30 ? (30 - minutes) : (60 - minutes)) });
    const v = `${String(next.hour).padStart(2,'0')}:${String(Math.floor(next.minute/30)*30).padStart(2,'0')}`;
    sel.value = v;
  }
}

function updateMeetingTimes() {
  const dateInput = document.getElementById('meetingDate').value;
  const timeInput = document.getElementById('meetingTimeSelect').value;
  const timesDiv = document.getElementById('meetingTimes');
  const lang = getLang();
  const t = translations[lang] || translations.en;

  if (!dateInput || !timeInput) {
    timesDiv.innerHTML = `<div style="color:#888;">${t['select-date-time-msg'] || 'Please select both a meeting date and time.'}</div>`;
    return;
  }
  if (!window.participants || window.participants.length === 0) {
    timesDiv.innerHTML = `<div style="color:#888;">${t['no-participants-yet'] || 'No participants yet.'}</div>`;
    return;
  }

  const localISO = `${dateInput}T${timeInput}`;
  let organizerDT = DateTime.fromISO(localISO);
  if (!organizerDT.isValid) {
    timesDiv.innerHTML = `<div style="color:#b00;">${t['select-date-time-msg'] || 'Please select both a meeting date and time.'}</div>`;
    return;
  }

  let html = `<div style="font-weight:700;margin-bottom:.4rem;">${t['meeting-times-heading'] || 'Meeting Times'}</div>`;
  html += `<div class="meeting-times-grid">`;
  html += `<div class="time-suggestion"><div><b>Organizer</b> (${escapeHtml(organizerDT.zoneName)})</div><div>${escapeHtml(organizerDT.toLocaleString(DateTime.DATETIME_FULL))}</div></div>`;

  window.participants.forEach(p => {
    let localP;
    try {
      localP = organizerDT.setZone(p.city);
    } catch (e) {
      localP = null;
    }
    const label = localP ? localP.toLocaleString(DateTime.DATETIME_FULL) : 'Invalid zone';
    html += `<div class="time-suggestion"><div><b>${escapeHtml(p.name)}</b> <span style="color:#666;">(${escapeHtml(p.city)})</span></div><div>${escapeHtml(label)}</div></div>`;
  });

  html += `</div>`;
  timesDiv.innerHTML = html;
  saveMeetingSettings();
}

/* Wire up change handlers */
document.getElementById('meetingDate').addEventListener('input', updateMeetingTimes);
document.getElementById('meetingTimeSelect').addEventListener('change', updateMeetingTimes);

/* React to timerhavenLang changes from main index */
window.addEventListener('storage', function(e){
  if (e.key === 'timerhavenLang') {
    applyLanguage((e.newValue || 'en').slice(0,2));
  }
});

/* Init */
document.addEventListener('DOMContentLoaded', function() {
  applyLanguage(getLang());
  populateTimeSelect();
  loadParticipants();
  renderParticipants();
  loadMeetingSettings();
  updateMeetingTimes();
});
  </script>
