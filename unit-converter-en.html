<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Unit Converter — TimerHaven</title>
  <meta name="description" content="Convert length, weight, temperature, and more units. Learn how to use Unit Converter, get productivity tips, FAQs, and read expert articles.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body { background:#f4f7fb; font-family:'Montserrat', Arial, sans-serif; color:#0b2545; }
    .main-container { max-width:1200px; margin:2rem auto; padding:0 1rem; display:flex; justify-content:center; align-items:flex-start; min-height:90vh; box-sizing:border-box; }
    .tool-card { background:#fff; border-radius:16px; box-shadow:0 2px 12px rgba(0,0,0,0.06); width:420px; padding:1.6rem 1.5rem; box-sizing:border-box; }
    .back-link { display:inline-block; margin-bottom:.75rem; color:var(--brand,#0d6efd) !important; text-decoration:none; font-weight:700; }
    .tool-title { color:#185a9d; font-size:1.35rem; margin:0 0 .6rem 0; display:flex; align-items:center; gap:.5rem; }
    .converter-form { display:flex; gap:.5rem; margin-bottom:1rem; flex-wrap:wrap; align-items:center; }
    .converter-result { font-weight:700; font-size:1.12em; margin-bottom:1rem; color:#102a43; }
    .faq-section { margin-top:1rem; background:#f7fafc; border-radius:8px; padding:1rem; box-shadow:0 1px 4px #e0e7ef; }
    @media (max-width:900px) { .tool-card{ width:98vw; padding:1rem; } }
  </style>
</head>
<body>
  <script>try{ localStorage.setItem('timerhavenLang','en'); }catch(e){}</script>

  <main class="main-container" role="main">
    <section class="tool-card" aria-labelledby="tool-title">
      <a href="index.html" class="back-link">&larr; Back to Main Menu</a>

      <h3 id="tool-title" class="tool-title"><i class="fa fa-ruler-combined"></i> Unit Converter</h3>

      <a id="read-guide-btn" class="read-guide" href="unit-how-to-en.html" role="button" style="display:inline-block;margin:.35rem 0 .8rem 0;padding:.45rem .7rem;border-radius:8px;background:var(--brand,#0d6efd);color:#fff;font-weight:700;font-size:.95rem;text-decoration:none;border:none;">Read full guide</a>

      <div class="unit-section">
        <form class="converter-form" id="unitForm">
          <select id="typeSelect" class="form-select" style="max-width:140px;">
            <option value="length">Length</option>
            <option value="weight">Weight</option>
            <option value="temperature">Temperature</option>
            <option value="volume">Volume</option>
          </select>

          <input type="number" id="inputValue" class="form-control" placeholder="Value" style="max-width:100px;">

          <select id="fromUnit" class="form-select" style="max-width:120px;"></select>
          <span style="font-size:1.3em;">→</span>
          <select id="toUnit" class="form-select" style="max-width:120px;"></select>

          <button type="submit" class="btn btn-primary btn-sm">Convert</button>
        </form>

        <div id="unitResult" class="converter-result">Result will appear here.</div>

        <details class="faq-section">
          <summary style="font-weight:700; font-size:1.02rem; cursor:pointer;">FAQs</summary>
          <ul style="padding-left:1.1rem; color:#374151;">
            <li><b>Are all units supported?</b> Most common units are included.</li>
            <li><b>Is the conversion free?</b> Yes — use as much as you want.</li>
            <li><b>Can I convert decimals?</b> Yes — decimal values are supported.</li>
          </ul>
        </details>
      </div>
    </section>
  </main>

  <script>
  // Unit types & conversion logic (preserved)
  const unitTypes = {
    length: {
      units: { "Meter": 1, "Kilometer": 1000, "Centimeter": 0.01, "Millimeter": 0.001, "Mile": 1609.34, "Yard": 0.9144, "Foot": 0.3048, "Inch": 0.0254 },
      convert: (val, from, to) => val * unitTypes.length.units[from] / unitTypes.length.units[to]
    },
    weight: {
      units: { "Kilogram": 1, "Gram": 0.001, "Milligram": 0.000001, "Pound": 0.453592, "Ounce": 0.0283495 },
      convert: (val, from, to) => val * unitTypes.weight.units[from] / unitTypes.weight.units[to]
    },
    temperature: {
      units: { "Celsius": "C", "Fahrenheit": "F", "Kelvin": "K" },
      convert: (val, from, to) => {
        if (from === to) return val;
        if (from === "Celsius" && to === "Fahrenheit") return val * 9/5 + 32;
        if (from === "Fahrenheit" && to === "Celsius") return (val - 32) * 5/9;
        if (from === "Celsius" && to === "Kelvin") return val + 273.15;
        if (from === "Kelvin" && to === "Celsius") return val - 273.15;
        if (from === "Fahrenheit" && to === "Kelvin") return (val - 32) * 5/9 + 273.15;
        if (from === "Kelvin" && to === "Fahrenheit") return (val - 273.15) * 9/5 + 32;
      }
    },
    volume: {
      units: { "Liter": 1, "Milliliter": 0.001, "Gallon": 3.78541, "Quart": 0.946353, "Pint": 0.473176, "Cup": 0.236588, "Fluid Ounce": 0.0295735, "Tablespoon": 0.0147868, "Teaspoon": 0.00492892 },
      convert: (val, from, to) => val * unitTypes.volume.units[from] / unitTypes.volume.units[to]
    }
  };

  function populateUnits(type) {
    const from = document.getElementById('fromUnit');
    const to = document.getElementById('toUnit');
    from.innerHTML = to.innerHTML = '';
    Object.keys(unitTypes[type].units).forEach(u => {
      from.innerHTML += `<option value="${u}">${u}</option>`;
      to.innerHTML += `<option value="${u}">${u}</option>`;
    });
  }

  document.getElementById('typeSelect').addEventListener('change', function() {
    populateUnits(this.value);
  });
  populateUnits('length');

  document.getElementById('unitForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const type = document.getElementById('typeSelect').value;
    const val = parseFloat(document.getElementById('inputValue').value);
    const from = document.getElementById('fromUnit').value;
    const to = document.getElementById('toUnit').value;
    const resultEl = document.getElementById('unitResult');
    if (isNaN(val)) {
      resultEl.innerText = "Please enter a valid value.";
      return;
    }
    let result = unitTypes[type].convert(val, from, to);
    resultEl.innerText = `${val} ${from} = ${result} ${to}`;
  });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/js/all.min.js"></script>
</body>
</html>
