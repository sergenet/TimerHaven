    body { background: #f4f7fb; font-family: 'Montserrat', Arial, sans-serif; }
    .main-container {

      margin: 2em auto;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 90vh;
    }
    .center-row {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: stretch;
      gap: 2em;
      width: 100%;
    }
    .article-card, .tool-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px #e0e7ef;
      width: 340px;
      min-width: 220px;
      max-width: 340px;
      flex: 1 1 340px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      padding: 2em 1.3em 1em 1.3em;
      margin: 0;
      box-sizing: border-box;
      min-height: 500px;
    }
    .tool-card {
      max-width: 400px;
      min-width: 300px;
    }
    .article-card h2, .tool-card h3 {
      font-size: 1.35em;
      font-weight: 700;
      margin-bottom: 0.4em;
      display: flex;
      align-items: center;
      gap: 0.3em;
    }
    .article-card ul, .article-card ol, .tool-card ul, .tool-card ol {
      margin-left: 1em;
      font-size: 1em;
      margin-bottom: 0.2em;
      padding-right: 0.2em;
      word-break: break-word;
    }
    .article-card .btn, .tool-card .btn {
      margin-top: 1.2em;
      margin-bottom: 0.6em;
      align-self: center;
      min-width: 180px;
      border-radius: 8px;
      font-weight: 600;
    }
    .calendar-table {
      width: 100%;
      margin-top: 1em;
      border-collapse: separate;
      border-spacing: 0;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
    }
    .calendar-table th, .calendar-table td {
      text-align: center;
      padding: 0.6em 0.7em;
      min-width: 36px;
      max-width: 40px;
    }
    .day-cell { cursor: pointer; border-radius: 6px; transition: background 0.1s; }
    .day-cell:hover { background: #e0e7ef; }
    .has-note { background: #ffeeba !important; }
    .calendar-today { background: #43cea2 !important; color: #fff !important; border-radius: 50% !important; font-weight: bold; box-shadow: 0 0 6px #185a9d33; }
    .modal-header { background: #f4f7fb; }
    .modal-footer { background: #f7fafc; }
    .note-list { list-style: none; padding: 0; margin-bottom: 1em; }
    .note-list li { background: #f7fafc; border-radius: 6px; margin-bottom: 0.5em; padding: 0.5em 0.8em; display: flex; align-items: center; justify-content: space-between; }
    .note-text { word-break: break-word; flex-grow: 1; }
    .note-meta { font-size: 0.85em; color: #888; margin-right: 1em; }
    .delete-note-btn { font-size: 0.9em; color: #c00; background: none; border: none; cursor: pointer; }
    .language-select {
      text-align: right;
      padding: 20px 40px 0 0;
      margin-bottom: 0.7em;
      position: relative;
      z-index: 5;
    }
    .language-select label {
      margin-right: 8px;
      font-size: 1.08em;
      font-weight: 600;
      color: #185a9d;
    }
    #lang-select {
      min-width: 150px;
      font-size: 1.08em;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #43cea2;
      background: linear-gradient(90deg, #43cea2 0%, #185a9d 100%);
      color: #fff;
      margin-left: 6px;
      margin-right: 4px;
      box-shadow: 0 2px 8px #e0e7ef;
      transition: background 0.2s;
      font-weight: 600;
    }
    #lang-select option {
      color: #185a9d;
      background: #f4f7fb;
      font-weight: 500;
    }
    body[dir="rtl"] .language-select {
      text-align: left;
      padding: 20px 0 0 40px;
    }
    body[dir="rtl"] #lang-select {
      margin-left: 4px;
      margin-right: 6px;
    }
    @media (max-width: 1100px) {
      .main-container{padding:0 8px;}
      .center-row{gap:1em;}
      .tool-card,.article-card{width:97vw;max-width:540px;height:auto;}
    }
    @media (max-width: 800px) {
      .main-container{padding:0;}
      .center-row{flex-direction:column;align-items:center;}
      .tool-card,.article-card{width:98vw;max-width:540px;height:auto;}
      .article-card { display: none !important; }
      .howto-mobile, .tips-mobile { display: block !important; margin-bottom: 1em; }
    }
    @media (min-width: 801px) {
      .howto-mobile, .tips-mobile { display: none !important; }
    }
    .back-link {
      display: inline-block;
      margin-bottom: 1em;
      color: #007bff;
      text-decoration: none;
      font-weight: bold;
      font-size: 1em;
    }
    .back-link:hover { text-decoration: underline; }
    .tip-section {
      margin-top: 1em;
      text-align: center;
      font-size: 1.08em;
      color: #43cea2;
      background: #f6fbfa;
      padding: 0.6em;
      border-radius: 8px;
      font-weight: 500;
      min-height: 2em;
      word-break: break-word;
    }
    details[open] summary::after { content: " ▲"; font-size: 0.9em; }
    details summary { cursor: pointer; padding: 0.35em 0; font-weight: bold; font-size: 1.09em; }
    details:not([open]) summary::after { content: " ▼"; font-size: 0.9em; }
    .howto-mobile { margin-bottom: 1em; }
    .tips-mobile { margin-top: 1.5em; margin-bottom: 0.5em; }
    .faq-section {
      margin-top: 1em;
      overflow: auto;
    }
  </style>
</head>

  <div class="language-select">

        </div>

      <!-- Calendar Tool (center) -->
      <div class="tool-card">

        <details class="howto-mobile" id="howto-mobile">
          <summary><h4 style="color:#185a9d;display:inline;" id="howto-mobile-title"></h4></summary>
          <ol id="howto-mobile-steps"></ol>
        </details>
        <a href="index.html" class="back-link" id="back-link">Back to Main Menu</a>
        <h3 id="tool-title"></h3>
        <div class="help-section">
          <b id="tool-help"></b>
        </div>
        <div class="mb-2">

        <table class="table calendar-table" id="calendar-table"></table>
        <details class="faq-section" id="faq-section">

          <ul id="faq-list" style="padding-left: 1em;"></ul>
        </details>
        <!-- Tips (mobile only, collapsible) -->

      <!-- Right Article Card -->
      <div class="article-card">
        <div>

          <ul id="tips-list"></ul>
        </div>
        <a href="#" class="btn btn-outline-primary btn-sm" id="tips-article-btn">Read Full Article</a>
      </div>
    </div>
  </div>

  <!-- Modal for notes -->
  <div class="modal fade" id="noteModal" tabindex="-1" aria-labelledby="noteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="noteForm" autocomplete="off">
          <div class="modal-header">
            <h5 class="modal-title" id="noteModalLabel"></h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <ul class="note-list" id="noteList"></ul>
            <textarea id="noteInput" class="form-control" rows="3" placeholder=""></textarea>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="note-close-btn"></button>
            <button type="submit" class="btn btn-success" id="note-add-btn"></button>
          </div>
        </form>
      </div>
    </div>
  </div>

    // Language switching logic
    function updateLanguage() {
      const lang = document.getElementById("lang-select").value;
      document.body.dir = (lang === "ar") ? "rtl" : "ltr";
      document.getElementById("language-label").textContent = translations[lang]["language-label"];
      document.getElementById("back-link").textContent = translations[lang]["back-link"];
      document.getElementById("tool-title").innerHTML = `<i class="fa fa-calendar-days"></i> ${translations[lang]["tool-title"]}`;
      document.getElementById("tool-help").textContent = translations[lang]["tool-help"];
      document.getElementById("faq-title").textContent = translations[lang]["faq-title"];
      document.getElementById("faq-list").innerHTML = translations[lang]["faq-list"];
      document.getElementById("howto-title").innerHTML = translations[lang]["howto-title"];
      document.getElementById("howto-steps").innerHTML = translations[lang]["howto-steps"];
      document.getElementById("howto-article-btn").textContent = translations[lang]["howto-article-btn"];
      document.getElementById("howto-article-btn").href = translations[lang]["howto-article-link"];
      document.getElementById("howto-mobile-title").innerHTML = translations[lang]["howto-mobile-title"];
      document.getElementById("howto-mobile-steps").innerHTML = translations[lang]["howto-mobile-steps"];
      document.getElementById("tips-title").innerHTML = translations[lang]["tips-title"];
      document.getElementById("tips-list").innerHTML = translations[lang]["tips-list"];
      document.getElementById("tips-article-btn").textContent = translations[lang]["tips-article-btn"];
      document.getElementById("tips-article-btn").href = translations[lang]["tips-article-link"];
      document.getElementById("tips-mobile-title").innerHTML = translations[lang]["tips-mobile-title"];
      document.getElementById("tips-mobile-list").innerHTML = translations[lang]["tips-mobile-list"];
      document.getElementById("noteModalLabel").innerHTML = `${translations[lang]["noteModalLabel"]} <span id="modal-date-label"></span>`;
      document.getElementById("noteInput").placeholder = translations[lang]["noteInput"];
      document.getElementById("note-close-btn").textContent = translations[lang]["note-close-btn"];
      document.getElementById("note-add-btn").textContent = translations[lang]["note-add-btn"];
      renderCalendar(currentYear, currentMonth, lang);
    }

    document.getElementById("lang-select").addEventListener("change", function() {
      localStorage.setItem('timerhavenLang', this.value);
      updateLanguage();
    });

    document.addEventListener("DOMContentLoaded", function() {
      const savedLang = localStorage.getItem('timerhavenLang') || 'en';
      document.getElementById('lang-select').value = savedLang;
      updateLanguage();
    });

    // Highlight today logic added here
    function renderCalendar(year, month, lang) {
      currentYear = year;
      currentMonth = month;
      lang = lang || document.getElementById("lang-select").value;
      const table = document.getElementById('calendar-table');
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      let html = `<thead><tr>`;
      translations[lang]["days"].forEach(day => {
        html += `<th>${day}</th>`;
      });
      html += `</tr></thead><tbody><tr>`;

      for (let i = 0; i < firstDay; i++) html += `<td></td>`;

      // Get today's date
      const now = new Date();
      const todayYear = now.getFullYear();
      const todayMonth = now.getMonth();
      const todayDay = now.getDate();

      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const dayNotes = notes[dateStr] || [];
        const hasNote = dayNotes.length > 0;
        if ((firstDay + d - 1) % 7 === 0 && d !== 1) html += `</tr><tr>`;
        // Check for today
        const isToday = (d === todayDay && month === todayMonth && year === todayYear);
        html += `<td class="day-cell${hasNote ? ' has-note' : ''}${isToday ? ' calendar-today' : ''}" data-date="${dateStr}">${d}${hasNote ? ' <span title="Notes saved">📝</span>' : ''}</td>`;
      }
      html += `</tr></tbody>`;
      table.innerHTML = html;

      Array.from(document.getElementsByClassName('day-cell')).forEach(cell => {
        cell.addEventListener('click', function() {
          selectedDay = this.getAttribute('data-date');
          showNoteModal(selectedDay);
        });
      });
    }

    function showNoteModal(dateStr) {
      const modalDateLabel = document.getElementById('modal-date-label');
      if (modalDateLabel) {
        modalDateLabel.textContent = dateStr;
      }
      renderNoteList(dateStr);
      document.getElementById('noteInput').value = '';
      let modal = new bootstrap.Modal(document.getElementById('noteModal'));
      modal.show();
    }

    function renderNoteList(dateStr) {
      const list = document.getElementById('noteList');
      list.innerHTML = '';
      const lang = document.getElementById("lang-select").value;
      const dayNotes = notes[dateStr] || [];
      if (dayNotes.length === 0) {
        list.innerHTML = `<li style="color:#888;">${translations[lang]["note-none"]}</li>`;
        return;
      }
      dayNotes.forEach((note, idx) => {
        list.innerHTML += `
          <li>
            <span class="note-text">${note.text}</span>
            <span class="note-meta">${new Date(note.ts).toLocaleString()}</span>
            <button class="delete-note-btn" title="${translations[lang]["note-delete"]}" onclick="deleteNote('${dateStr}',${idx})"><i class="fa fa-trash"></i></button>
          </li>
        `;
      });
    }

    document.getElementById('noteForm').addEventListener('submit', function(e) {
      e.preventDefault();
      if (!selectedDay) return;
      const text = document.getElementById('noteInput').value.trim();
      if (!text) return;
      if (!notes[selectedDay]) notes[selectedDay] = [];
      notes[selectedDay].push({ text, ts: Date.now() });
      localStorage.setItem('calendarNotes', JSON.stringify(notes));
      document.getElementById('noteInput').value = '';
      renderNoteList(selectedDay);
      renderCalendar(currentYear, currentMonth, document.getElementById("lang-select").value);
    });

    window.deleteNote = function(dateStr, idx) {
      if (!notes[dateStr]) return;
      notes[dateStr].splice(idx, 1);
      if (notes[dateStr].length === 0) delete notes[dateStr];
      localStorage.setItem('calendarNotes', JSON.stringify(notes));
      renderNoteList(dateStr);
      renderCalendar(currentYear, currentMonth, document.getElementById("lang-select").value);
    };

    const now = new Date();
    document.getElementById('calendar-month').value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    function updateCalendar() {
      const val = document.getElementById('calendar-month').value.split('-');
      renderCalendar(parseInt(val[0]), parseInt(val[1]) - 1, document.getElementById("lang-select").value);
    }
    document.getElementById('calendar-month').addEventListener('change', updateCalendar);

    updateCalendar();
  </script>
