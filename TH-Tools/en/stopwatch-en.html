<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stopwatch — TimerHaven</title>
  <meta name="description" content="Measure elapsed time for any activity. Learn how to use Stopwatch, get productivity tips, FAQs, and read expert articles.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    :root{--brand:#0b63a0;--brand-dark:#09507a;--muted:#6b7c89;--card:#fff;--bg:#fbfeff}
    html,body{height:100%}
    body { background:var(--bg); font-family:'Montserrat', Arial, sans-serif; color:#0b2545; margin:0; padding:2rem; }
    .container { max-width:720px; margin:0 auto; }
    .card { background:var(--card); border-radius:16px; box-shadow:0 8px 24px rgba(0,0,0,0.06); padding:1.6rem 1.5rem; box-sizing:border-box; }
    /* Back link — use the consistent blue used across tools (#007bff) */
    .back-link{display:inline-block;margin-bottom:.75rem;color:#007bff !important;text-decoration:none;font-weight:700}
    .back-link:hover{text-decoration:underline}
    .tool-title { color:var(--brand); font-size:1.35rem; margin:0 0 .6rem 0; display:flex; align-items:center; gap:.5rem; }
    /* Read full guide styled to explicit blue to match other tools */
    .cta{
      display:inline-block;padding:.45rem .7rem;border-radius:8px;background:#007bff !important;color:#fff !important;text-decoration:none;
      font-weight:700;font-size:.95rem;border:none;
      box-shadow:0 6px 18px rgba(0,123,255,0.08);
    }
    .cta:hover{background:#0056d6}
    .stopwatch-display { font-weight:700; font-size:1.25rem; margin-top:.5rem; margin-bottom:.5rem; color:#102a43; }
    .controls-row { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; margin-top:.5rem; }
    .lap-list { margin-top:.8rem; }
    .faq-section { margin-top:1rem; background:#f7fafc; border-radius:8px; padding:1rem; box-shadow:0 1px 4px #e0e7ef; }
    /* Make svg-button visually align with other buttons */
    .svg-btn { display:inline-block; vertical-align:middle; cursor:pointer; border:none; background:transparent; padding:0; }
    .svg-btn svg { display:block; }
    .btn-fallback { display:none; } /* keep fallback hidden unless needed */
    @media (max-width:900px) { .card{padding:1rem} }
  </style>
</head>
<body>
  <script>try{ localStorage.setItem('timerhavenLang','en'); }catch(e){};</script>

  <main class="container" role="main">
    <article class="card" aria-labelledby="tool-title">
      <a href="index.html" class="back-link" id="back-link">&larr;&nbsp;Back to Main Menu</a>

      <h3 id="tool-title" class="tool-title"><i class="fa fa-clock" aria-hidden="true"></i> Stopwatch</h3>

      <!-- Read full guide button (canonical absolute path, opens new tab) -->
      <p style="margin:0 0 .6rem 0;">
        <a id="read-guide-btn" class="cta read-guide" href="https://timerhaven.com/en/stopwatch/stopwatch-index.html" role="button" aria-label="Read full guide" target="_blank" rel="noopener">Read full guide</a>
      </p>

      <div class="stopwatch-section" aria-live="polite">
        <div id="swDisplay" class="stopwatch-display" aria-atomic="true">00:00:00</div>

        <div class="controls-row" role="toolbar" aria-label="Stopwatch controls">
          <!-- Inline-SVG button: exact fill color #0b63a0 (cannot be overridden by external CSS) -->
          <button id="swStartBtn" class="svg-btn" type="button" aria-label="Start stopwatch" title="Start">
            <svg width="72" height="36" viewBox="0 0 72 36" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="false" focusable="false">
              <rect x="0" y="0" rx="6" ry="6" width="72" height="36" fill="#0b63a0"></rect>
              <text x="36" y="22" font-family="Montserrat, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">Start</text>
            </svg>
          </button>

          <!-- Fallback plain button (kept for scripts that expect a .btn), hidden visually -->
          <button id="swStartBtnFallback" class="btn btn-brand btn-fallback" type="button" style="background:#0b63a0;color:#fff;border-color:rgba(0,0,0,0.05);">Start</button>

          <button id="swPauseBtn" class="btn btn-secondary" type="button">Pause</button>
          <button id="swResetBtn" class="btn btn-danger" type="button">Reset</button>
          <button id="swLapBtn" class="btn btn-info" type="button">Lap</button>
        </div>

        <div id="lapList" class="lap-list" style="margin-top:.8rem;" aria-live="polite"></div>

        <details class="faq-section" style="margin-top:1rem;">
          <summary style="font-weight:700; font-size:1rem;">FAQs</summary>
          <ul style="padding-left:1.1rem; color:#374151;">
            <li><strong>Can I track multiple laps?</strong> Yes, use the lap button.</li>
            <li><strong>Will the time persist?</strong> No, it resets after page reload.</li>
            <li><strong>Is this free?</strong> Yes, all TimerHaven tools are free.</li>
          </ul>
        </details>
      </div>
    </article>
  </main>

  <script>
  (function(){
    // Stopwatch logic (preserved) — uses the #swStartBtn button (SVG) and falls back to fallback button if needed.
    var swTimer = null, swStart = null, swElapsed = 0, swRunning = false, laps = [];

    function swFormat(ms) {
      var t = Math.floor(ms / 1000);
      var h = Math.floor(t / 3600);
      var m = Math.floor((t % 3600) / 60);
      var s = t % 60;
      return String(h).padStart(2,'0')+":"+String(m).padStart(2,'0')+":"+String(s).padStart(2,'0');
    }

    function renderLaps() {
      var lapList = document.getElementById('lapList');
      lapList.innerHTML = laps.map(function(l,i){
        return '<div class="lap-item" style="background:#f7fafc;padding:.45rem;border-radius:8px;margin-bottom:.4rem;">Lap '+(i+1)+': '+swFormat(l)+'</div>';
      }).join('');
    }

    function swUpdateDisplay() {
      document.getElementById('swDisplay').textContent = swFormat(swElapsed);
      renderLaps();
    }

    // Start logic (works with SVG button and fallback)
    function startStopwatch() {
      if (swRunning) return;
      swRunning = true;
      swStart = Date.now() - swElapsed;
      swTimer = setInterval(function(){
        swElapsed = Date.now() - swStart;
        swUpdateDisplay();
      }, 100);
    }
    function pauseStopwatch() {
      swRunning = false;
      clearInterval(swTimer);
    }
    function resetStopwatch() {
      swRunning = false;
      clearInterval(swTimer);
      swElapsed = 0;
      laps = [];
      swUpdateDisplay();
    }
    function lapStopwatch() {
      if (swRunning) laps.push(swElapsed);
      swUpdateDisplay();
    }

    // Wire events: SVG button triggers same handlers as regular buttons
    document.addEventListener('DOMContentLoaded', function() {
      var svgStart = document.getElementById('swStartBtn');
      var fallbackStart = document.getElementById('swStartBtnFallback');
      var pauseBtn = document.getElementById('swPauseBtn');
      var resetBtn = document.getElementById('swResetBtn');
      var lapBtn = document.getElementById('swLapBtn');

      if (svgStart) {
        svgStart.addEventListener('click', startStopwatch);
        // allow keyboard activation
        svgStart.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startStopwatch(); } });
      }
      if (fallbackStart) fallbackStart.addEventListener('click', startStopwatch);
      if (pauseBtn) pauseBtn.addEventListener('click', pauseStopwatch);
      if (resetBtn) resetBtn.addEventListener('click', resetStopwatch);
      if (lapBtn) lapBtn.addEventListener('click', lapStopwatch);

      // initialize display
      swUpdateDisplay();
      // make sure SVG buttons are focusable
      if (svgStart) svgStart.setAttribute('tabindex','0');
    });
  })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/js/all.min.js"></script>
</body>
</html>
