<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <title>Календарь — TimerHaven</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Легко сохраняйте и управляйте несколькими заметками в календаре. Узнайте, как пользоваться Календарём, получите советы по продуктивности, FAQ и экспертные статьи.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    /* Layout & visuals matched to calendar-en.html but with RU text */
    body { background: #f4f7fb; font-family: 'Montserrat', Arial, sans-serif; color: #102a43; }
    .main-container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; min-height: 90vh; }
    .main-container { max-width:1200px; margin:2rem auto; padding:0 1rem; display:flex; justify-content:center; align-items:flex-start; min-height:90vh; box-sizing:border-box; }
    
    .back-link { display:inline-block; margin-bottom:.75rem; color:var(--brand,#0d6efd) !important; text-decoration:none; font-weight:700; }
    .tool-title { color:#185a9d; font-size:1.35rem; margin:0 0 .6rem 0; display:flex; align-items:center; gap:.5rem; }
    .read-guide { display:inline-block; margin:.35rem 0 .8rem 0; padding:.45rem .7rem; border-radius:8px; background:var(--brand,#0d6efd); color:#fff; text-decoration:none; font-weight:700; font-size:.95rem; border:none; }

    .tool-card { max-width: 640px; min-width: 320px; flex: 1 1 640px; }
    
    
    

    /* Header layout: keep nav buttons and month/year on one line on desktop */
    .calendar-header { display:flex; align-items:center; justify-content:space-between; gap:.5rem; margin-bottom:.6rem; flex-wrap:nowrap; }
    .calendar-nav { display:flex; gap:.25rem; align-items:center; flex-shrink:0; }

    /* Make the nav buttons and selects share consistent height and vertical alignment */
    .calendar-nav .btn {
      min-width:40px;
      padding:.28rem .55rem;
      height:36px;
      line-height:1;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }

    .calendar-select {
      border-radius:8px;
      padding:.18rem .45rem;
      border:1px solid #e4edf5;
      background:#fff;
      font-size:.92rem;
      height:36px;               /* match button height */
      line-height:1;
      display:inline-block;
      vertical-align:middle;
      box-sizing:border-box;
      -webkit-appearance: none;
      appearance: none;
    }
    /* Reduced widths to prevent overflow inside the tool card */
    .calendar-select.month { width:130px; }
    .calendar-select.year { width:90px; }

    .calendar-table { width:100%; margin-top:1em; border-collapse:separate; border-spacing:0; background:#fff; border-radius:8px; overflow:hidden; table-layout: fixed; }
    .calendar-table th, .calendar-table td { text-align:center; padding:.6rem .45rem; min-width:36px; max-width:40px; vertical-align:middle; }
    .day-cell { cursor:pointer; border-radius:6px; transition: background 0.1s; display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; margin:0 auto; }
    .day-cell:hover { background:#e0e7ef; }
    .has-note { background:#ffeeba !important; }
    .calendar-today { background:#43cea2 !important; color:#fff !important; border-radius:50% !important; font-weight:bold; box-shadow:0 0 6px #185a9d33; }

    .modal-header { background:#f4f7fb; }
    .modal-footer { background:#f7fafc; }
    .note-list { list-style:none; padding:0; margin-bottom:1em; }
    .note-list li { background:#f7fafc; border-radius:6px; margin-bottom:0.5em; padding:0.5em 0.8em; display:flex; align-items:center; justify-content:space-between; }
    .note-text { word-break:break-word; flex-grow:1; }
    .note-meta { font-size:0.85em; color:#888; margin-right:1em; }
    .delete-note-btn { font-size:0.9em; color:#c00; background:none; border:none; cursor:pointer; }

    details[open] summary::after { content: " ▲"; font-size: 0.9em; }
    details summary { cursor:pointer; padding:0.35em 0; font-weight:bold; font-size:1.09em; }
    details:not([open]) summary::after { content: " ▼"; font-size: 0.9em; }

    /* Make How-to heading smaller (less overwhelming) while keeping Tips heading larger */
    #howto-title { font-size: 1.05em; font-weight:700; }
    #tips-title { font-size: 1.35em; font-weight:700; }

    @media (max-width:1100px) {
      .main-container{padding:0 8px;}
      .main-container { max-width:1200px; margin:2rem auto; padding:0 1rem; display:flex; justify-content:center; align-items:flex-start; min-height:90vh; box-sizing:border-box; }
      .tool-card,
    }
    @media (max-width:800px) {
      .main-container{padding:0;}
      .main-container { max-width:1200px; margin:2rem auto; padding:0 1rem; display:flex; justify-content:center; align-items:flex-start; min-height:90vh; box-sizing:border-box; }
      .tool-card,
      
      .howto-mobile {display:block!important; margin-bottom:1em;}
      /* allow the header to wrap on narrow screens */
      .calendar-header{flex-wrap:wrap; justify-content:flex-start;}
      .calendar-select{width:48%; max-width:220px; margin-top:.45rem;}
      .calendar-nav{margin-right:.5rem;}
  </style>

  <!-- Defensive override: force true horizontal table layout for the calendar -->
  <style id="calendar-table-fix">
    /* Force the calendar to behave as a real table regardless of injected styles or transforms */
    #calendar-table,
    table#calendar-table,
    .calendar-table {
      display: table !important;
      table-layout: fixed !important;
      width: 100% !important;
      border-collapse: collapse !important;
      transform: none !important;
      writing-mode: horizontal-tb !important;
      -webkit-writing-mode: horizontal-tb !important;
    }

    /* Ensure table groups and rows are correct */
    #calendar-table thead,
    #calendar-table tbody,
    #calendar-table tr {
      display: table-row-group !important;
    }
    #calendar-table tr {
      display: table-row !important;
    }

    /* Force cells to behave like table-cells */
    #calendar-table th,
    #calendar-table td {
      display: table-cell !important;
      vertical-align: middle !important;
      white-space: nowrap !important;
      float: none !important;
      position: static !important;
      width: auto !important;
      max-width: none !important;
      box-sizing: border-box !important;
      padding: .6rem .45rem !important;
    }

    /* Defensive: prevent ancestor transforms or unusual writing-modes from stacking/rotating cells */
    #calendar-table,
    #calendar-table * {
      transform: none !important;
      -webkit-transform: none !important;
      writing-mode: horizontal-tb !important;
      -webkit-writing-mode: horizontal-tb !important;
    }
  </style>
</head>
<body>
  <div class="main-container">
    <main class="main-container" role="main">
      <!-- LEFT -->

      <!-- CENTER -->
      <section class="tool-card" aria-labelledby="tool-title">

        <a href="index.html" class="back-link" id="back-link">Вернуться в главное меню</a>
        <h3 id="tool-title"><i class="fa fa-calendar-days"></i> Календарь</h3>

      <a id="read-guide-btn" class="read-guide" href="/ru/calendar-planning/calendar-index.html" role="button">Читать полное руководство</a>

        <div class="help-section">
          <b id="tool-help">Кликните любой день, чтобы добавить/просмотреть/редактировать заметки. Для каждого дня поддерживается несколько заметок!</b>
        </div>

        <!-- Header controls (buttons + month/year selects) - now kept on one line on desktop -->
        <div class="calendar-header" aria-label="Навигация календаря">
          <div class="calendar-nav" role="toolbar" aria-label="Навигация месяц/год">
            <button id="nav-prev-year" class="btn btn-sm btn-outline-secondary" aria-label="Предыдущий год">«</button>
            <button id="nav-prev-month" class="btn btn-sm btn-outline-secondary" aria-label="Предыдущий месяц">‹</button>
            <button id="nav-today" class="btn btn-sm btn-outline-secondary" aria-label="Сегодня">Сегодня</button>
            <button id="nav-next-month" class="btn btn-sm btn-outline-secondary" aria-label="Следующий месяц">›</button>
            <button id="nav-next-year" class="btn btn-sm btn-outline-secondary" aria-label="Следующий год">»</button>
          </div>

          <div style="display:flex;align-items:center;gap:.5rem;flex-shrink:0;">
            <select id="calendar-month-select" class="calendar-select month" aria-label="Выбрать месяц"></select>
            <select id="calendar-year-select" class="calendar-select year" aria-label="Выбрать год"></select>
          </div>
        </div>

        <table class="table calendar-table" id="calendar-table" aria-label="Календарь"></table>

        <details class="faq-section" id="faq-section">
          <summary id="faq-title">Часто задаваемые вопросы</summary>
          <ul id="faq-list" style="padding-left:1em;"></ul>
        </details>

      </div>

      <!-- RIGHT -->
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="noteModal" tabindex="-1" aria-labelledby="noteModalLabel" aria-hidden="true">
    <div class="modal-dialog"><div class="modal-content">
      <form id="noteForm" autocomplete="off">
        <div class="modal-header">
          <h5 class="modal-title" id="noteModalLabel">Заметки для <span id="modal-date-label"></span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body">
          <ul class="note-list" id="noteList"></ul>
          <textarea id="noteInput" class="form-control" rows="3" placeholder="Добавить новую заметку на этот день..."></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="note-close-btn">Закрыть</button>
          <button type="submit" class="btn btn-success" id="note-add-btn">Добавить заметку</button>
        </div>
      </form>
    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Force RU UI for this file
    try { localStorage.setItem('timerhavenLang', 'ru'); } catch(e){}

    // Safe load of notes
    let notes = {};
    try { notes = JSON.parse(localStorage.getItem('calendarNotes') || '{}'); } catch(e) { notes = {}; }

    let currentYear, currentMonth, selectedDay;

    function getLang(){ return localStorage.getItem('timerhavenLang') || 'ru'; }
    function getLocaleForLang(lang){ if(!lang) return 'ru-RU'; const map={en:'en-US',fr:'fr-FR',de:'de-DE',ru:'ru-RU',el:'el-GR',es:'es-ES',ar:'ar-SA'}; return map[lang]||lang; }

    const translations = {
      ru: {
        "back-link":"Вернуться в главное меню",
        "tool-title":"Календарь",
        "tool-help":"Кликните любой день, чтобы добавить/просмотреть/редактировать заметки. Для каждого дня поддерживается несколько заметок!",
        "faq-title":"Часто задаваемые вопросы",
        "faq-list": `<li><b>Сохраняются ли мои заметки?</b> Да! Заметки сохраняются в вашем браузере и остаются до удаления.</li>
          <li><b>Могу ли я добавить несколько заметок?</b> Да — можно добавлять любое количество заметок для каждого дня.</li>
          <li><b>Могу ли я удалить заметки?</b> Да — удаляйте отдельные заметки с помощью иконки корзины.</li>
          <li><b>Синхронизируются ли заметки на других устройствах?</b> Пока нет — заметки сохраняются в конкретном браузере. Для доступа с разных устройств используйте облачные приложения.</li>`,
        "howto-title":"<i class='fa fa-calendar-check'></i> Как пользоваться Календарём",
        "howto-steps": `<li><b>Кликните по дню:</b> Откройте окно для добавления/просмотра нескольких заметок на день.</li>
          <li><b>Организация событий:</b> Каждая заметка с меткой времени, можно удалить отдельно.</li>
          <li><b>Долговечно:</b> Заметки сохраняются до удаления.</li>`,
        "noteModalLabel":"Заметки для",
        "noteInput":"Добавить новую заметку на этот день...",
        "note-none":"Для этого дня заметок ещё нет.",
        "note-delete":"Удалить эту заметку",
        "note-close-btn":"Закрыть",
        "note-add-btn":"Добавить заметку",
        "days":["Вс","Пн","Вт","Ср","Чт","Пт","Сб"]
      };

    // Update UI strings and re-render if calendar already initialized
    function updateLanguage(lang){
      lang = lang || getLang();
      document.body.dir = (lang === 'ar') ? 'rtl' : 'ltr';
      const t = translations[lang] || translations['ru'];
      const el = id => document.getElementById(id);
      if (el("back-link")) el("back-link").textContent = t["back-link"];
      if (el("tool-title")) el("tool-title").innerHTML = `<i class="fa fa-calendar-days"></i> ${t["tool-title"]}`;
      if (el("tool-help")) el("tool-help").textContent = t["tool-help"];
      if (el("faq-title")) el("faq-title").textContent = t["faq-title"];
      if (el("faq-list")) el("faq-list").innerHTML = t["faq-list"];
      if (el("howto-title")) el("howto-title").innerHTML = t["howto-title"];
      if (el("howto-steps")) el("howto-steps").innerHTML = t["howto-steps"];
      if (el("tips-title")) el("tips-title").innerHTML = t["tips-title"] || '';
      if (el("noteModalLabel")) el("noteModalLabel").innerHTML = `${t["noteModalLabel"]} <span id="modal-date-label"></span>`;
      if (el("noteInput")) el("noteInput").placeholder = t["noteInput"];
      if (el("note-close-btn")) el("note-close-btn").textContent = t["note-close-btn"];
      if (el("note-add-btn")) el("note-add-btn").textContent = t["note-add-btn"];
      if (typeof currentYear === 'number' && typeof currentMonth === 'number') renderCalendar(currentYear, currentMonth, lang);
    }

    window.addEventListener('storage', function(e){
      if (e.key === 'timerhavenLang') updateLanguage(e.newValue || 'ru');
    });

    // Populate month/year selects with localized month names
    function populateMonthYearControls(year, month, lang) {
      lang = lang || getLang();
      const monthSelect = document.getElementById('calendar-month-select');
      const yearSelect = document.getElementById('calendar-year-select');
      if (!monthSelect || !yearSelect) return;
      const locale = getLocaleForLang(lang);
      const mf = new Intl.DateTimeFormat(locale, { month: 'long' });
      monthSelect.innerHTML = '';
      for (let m=0; m<12; m++) {
        const opt = document.createElement('option');
        opt.value = String(m);
        opt.textContent = mf.format(new Date(2000,m,1));
        if (m === month) opt.selected = true;
        monthSelect.appendChild(opt);
      }
      const now = new Date();
      const base = now.getFullYear();
      const start = base - 50, end = base + 50;
      yearSelect.innerHTML = '';
      for (let y = start; y <= end; y++) {
        const opt = document.createElement('option');
        opt.value = String(y);
        opt.textContent = String(y);
        if (y === year) opt.selected = true;
        yearSelect.appendChild(opt);
      }

    // Calendar renderer
    function renderCalendar(year, month, lang) {
      currentYear = year;
      currentMonth = month;
      lang = lang || getLang();
      const table = document.getElementById('calendar-table');
      if (!table) return;
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      let html = `<thead><tr>`;
      const dayNames = (translations[lang] && translations[lang].days) ? translations[lang].days : translations['ru'].days;
      dayNames.forEach(day => { html += `<th>${day}</th>`; });
      html += `</tr></thead><tbody><tr>`;

      for (let i = 0; i < firstDay; i++) html += `<td></td>`;

      const now = new Date();
      const todayYear = now.getFullYear();
      const todayMonth = now.getMonth();
      const todayDay = now.getDate();

      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const dayNotes = notes[dateStr] || [];
        const hasNote = dayNotes.length > 0;
        if ((firstDay + d - 1) % 7 === 0 && d !== 1) html += `</tr><tr>`;
        const isToday = (d === todayDay && month === todayMonth && year === todayYear);
        /* PERMANENT FIX: add inline style to force table-cell behaviour even if site/extension CSS tries to override */
        html += `<td class="day-cell${hasNote ? ' has-note' : ''}${isToday ? ' calendar-today' : ''}" data-date="${dateStr}" style="display:table-cell !important; vertical-align:middle;">${d}${hasNote ? ' <span title="Заметки сохранены">📝</span>' : ''}</td>`;
      }
      html += `</tr></tbody>`;
      table.innerHTML = html;

      // Ensure the month/year selects reflect the currently rendered calendar
      populateMonthYearControls(currentYear, currentMonth, lang);

      Array.from(table.getElementsByClassName('day-cell')).forEach(cell => {
        cell.addEventListener('click', function() {
          selectedDay = this.getAttribute('data-date');
          showNoteModal(selectedDay);
        });
      });
    }

    function showNoteModal(dateStr) {
      const modalDateLabel = document.getElementById('modal-date-label');
      if (modalDateLabel) modalDateLabel.textContent = dateStr;
      renderNoteList(dateStr);
      const ni = document.getElementById('noteInput');
      if (ni) ni.value = '';
      try { new bootstrap.Modal(document.getElementById('noteModal')).show(); } catch(e) {}

    function renderNoteList(dateStr) {
      const list = document.getElementById('noteList');
      if (!list) return;
      list.innerHTML = '';
      const lang = getLang();
      const dayNotes = notes[dateStr] || [];
      if (dayNotes.length === 0) {
        list.innerHTML = `<li style="color:#888;">${translations[lang]["note-none"] || translations['ru']["note-none"]}</li>`;
        return;
      }
      dayNotes.forEach((note, idx) => {
        const li = document.createElement('li');
        const text = document.createElement('span'); text.className = 'note-text'; text.innerHTML = escapeHtml(note.text);
        const meta = document.createElement('span'); meta.className = 'note-meta';
        try { meta.textContent = new Date(note.ts).toLocaleString(getLocaleForLang(lang)); } catch(e){ meta.textContent = new Date(note.ts).toLocaleString(); }
        const btn = document.createElement('button'); btn.className = 'delete-note-btn'; btn.title = translations[lang]['note-delete'] || 'Удалить'; btn.innerHTML = '<i class="fa fa-trash"></i>';
        btn.addEventListener('click', () => deleteNote(dateStr, idx));
        li.appendChild(text); li.appendChild(meta); li.appendChild(btn);
        list.appendChild(li);
      });
    }

    function escapeHtml(s) {
      if (!s) return '';
      return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
    }

    function attachNoteForm() {
      const form = document.getElementById('noteForm');
      if (!form) return;
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        if (!selectedDay) return;
        const textEl = document.getElementById('noteInput');
        if (!textEl) return;
        const text = textEl.value.trim();
        if (!text) return;
        if (!notes[selectedDay]) notes[selectedDay] = [];
        notes[selectedDay].push({ text, ts: Date.now() });
        try { localStorage.setItem('calendarNotes', JSON.stringify(notes)); } catch(e) {}
        textEl.value = '';
        renderNoteList(selectedDay);
        renderCalendar(currentYear, currentMonth, getLang());
      });
    }

    window.deleteNote = function(dateStr, idx) {
      if (!notes[dateStr]) return;
      notes[dateStr].splice(idx, 1);
      if (notes[dateStr].length === 0) delete notes[dateStr];
      try { localStorage.setItem('calendarNotes', JSON.stringify(notes)); } catch(e) {}
      renderNoteList(dateStr);
      renderCalendar(currentYear, currentMonth, getLang());
    };

    function hookupCalendarControls() {
      const prevYear=document.getElementById('nav-prev-year');
      const prevMonth=document.getElementById('nav-prev-month');
      const nextMonth=document.getElementById('nav-next-month');
      const nextYear=document.getElementById('nav-next-year');
      const todayBtn=document.getElementById('nav-today');
      prevYear && prevYear.addEventListener('click', ()=> renderCalendar(currentYear-1, currentMonth, getLang()));
      nextYear && nextYear.addEventListener('click', ()=> renderCalendar(currentYear+1, currentMonth, getLang()));
      prevMonth && prevMonth.addEventListener('click', ()=> { let y=currentYear,m=currentMonth-1; if(m<0){m=11;y--;} renderCalendar(y,m,getLang()); });
      nextMonth && nextMonth.addEventListener('click', ()=> { let y=currentYear,m=currentMonth+1; if(m>11){m=0;y++;} renderCalendar(y,m,getLang()); });
      todayBtn && todayBtn.addEventListener('click', ()=> { const n=new Date(); renderCalendar(n.getFullYear(), n.getMonth(), getLang()); });

      const mSel=document.getElementById('calendar-month-select');
      const ySel=document.getElementById('calendar-year-select');
      if(mSel && ySel){
        mSel.addEventListener('change', ()=> renderCalendar(parseInt(ySel.value,10), parseInt(mSel.value,10), getLang()));
        ySel.addEventListener('change', ()=> renderCalendar(parseInt(ySel.value,10), parseInt(mSel.value,10), getLang()));
      }

    document.addEventListener('DOMContentLoaded', function() {
      const now = new Date();
      currentYear = now.getFullYear();
      currentMonth = now.getMonth();

      updateLanguage(getLang());
      populateMonthYearControls(currentYear, currentMonth, getLang());
      hookupCalendarControls();
      attachNoteForm();

      try { renderCalendar(currentYear, currentMonth, getLang()); } catch(e) { console.error('renderCalendar error', e); }

      // helper to verify server file
      window.verifyCalendarFile = function(){
        fetch(window.location.href).then(r=>r.text()).then(t=>console.log('fileLen=', t.length, 'startsWith=', t.slice(0,400))).catch(e=>console.error('fetch failed', e));
        console.log('typeof renderCalendar =', typeof renderCalendar);
        console.log('#faq-list present?', !!document.getElementById('faq-list'));
      };
    });
  </script>
</body>
</html>
