  <title>Meeting Planner — TimerHaven</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body { background: #f4f7fb; font-family: 'Montserrat', Arial, sans-serif; }
    .main-container { max-width: 1200px; margin: 2em auto; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
    .center-row, .card-row { display: flex; flex-direction: row; justify-content: center; align-items: stretch; gap: 2em; width: 100%; }
    .article-card, .tool-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px #e0e7ef;
      min-width: 220px;
      max-width: 340px;
      width: 340px;
      min-height: 500px;
      flex: 1 1 340px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      padding: 2em 1.3em 1em 1.3em;
      margin: 0;
      box-sizing: border-box;
      text-align: left;
      overflow: hidden;
    }
    .article-card h2, .tool-card h3 {
      font-size: 1.35em;
      font-weight: 700;
      margin-bottom: 0.4em;
      display: flex;
      align-items: center;
      gap: 0.3em;
    }
    .article-card ul, .article-card ol, .tool-card ul, .tool-card ol { 
      margin-left: 1em; font-size: 1em; margin-bottom: 0.2em; padding-right: 0.2em; word-break: break-word; 
    }
    .article-card .btn, .tool-card .btn { 
      align-self: stretch;
      font-weight: 600; 
      border-radius: 8px; 
      margin-top: 0.2em; 
      margin-bottom: 0; 
      box-sizing: border-box;
    }
    .faq-section { margin-top: 1.1em; margin-bottom: 0.3em; font-size: 1em; background: #f7fafc; border-radius: 8px; padding: 1em; box-shadow: 0 1px 4px #e0e7ef; }
    .faq-section summary { font-weight: bold; font-size: 1.07em; cursor: pointer; margin-bottom: 0.5em; }
    .back-link { display: inline-block; margin-bottom: 1em; color: #007bff; text-decoration: none; font-weight: bold; font-size: 1em; }
    .back-link:hover { text-decoration: underline; }
    .language-select { text-align: right; padding: 10px 18px 0 0; margin-bottom: 0.5em; }
    #language-label { color: #185a9d; font-weight: bold; font-size: 1.08em; margin-right: 0.5em; letter-spacing: 0.02em; }
    #lang-select {
      border: 2px solid #43cea2;
      background: linear-gradient(90deg, #f4f7fb 60%, #e0f7fa 100%);
      color: #185a9d;
      font-weight: 600;
      border-radius: 7px;
      padding: 7px 16px;
      font-size: 1em;
      box-shadow: 0 2px 8px #e0e7ef;
      outline: none;
      transition: border 0.2s, background 0.2s;
    }
    #lang-select:focus {
      border-color: #185a9d;
      background: linear-gradient(90deg, #e0f7fa 60%, #43cea2 100%);
    }
    @media (max-width: 1100px) {
      .main-container{padding:0 8px;}
      .center-row, .card-row{gap:1em;}
      .tool-card,.article-card{width:97vw;max-width:540px;height:auto;}
    }
    @media (max-width: 800px) {
      .main-container{padding:0;}
      .center-row, .card-row{flex-direction:column;align-items:center;}
      .tool-card,.article-card{width:98vw;max-width:540px;height:auto;}
      .article-card { display: none !important; }
    }
    details[open] summary::after { content: " ▲"; font-size: 0.9em; }
    details summary { cursor: pointer; padding: 0.35em 0; font-weight: bold; font-size: 1.09em; }
    details:not([open]) summary::after { content: " ▼"; font-size: 0.9em; }
  </style>
</head>

        <div>

        </div>
        <details class="faq-section">
          <summary id="faq-title"></summary>

        </details>
        <div class="bookmark-tip"></div>

    </div>

function updateLanguage() {
  const lang = document.getElementById("lang-select").value;
  const t = translations[lang] || translations.en;
  document.body.dir = (lang === 'ar') ? 'rtl' : 'ltr';

  // Middle card
  document.getElementById("language-label").textContent = t["language-label"];
  document.getElementById("back-link").textContent = t["back-link"];
  document.getElementById("tool-title").textContent = t["tool-title"];
  document.getElementById("participant-name-label").textContent = t["participant-name-label"];
  document.getElementById("participantName").placeholder = t["participant-name-placeholder"];
  document.getElementById("city-label").textContent = t["city-label"];
  document.getElementById("add-participant-btn-text").textContent = t["add-participant-btn-text"];
  document.getElementById("meeting-date-label").textContent = t["meeting-date-label"];
  document.getElementById("meeting-time-label").textContent = t["meeting-time-label"];
  document.getElementById("show-times-btn").textContent = t["show-times-btn"];

  // City dropdown
  const citySelect = document.getElementById("participantCity");
  citySelect.innerHTML = '';
  t["city-options"].forEach(opt => {
    const option = document.createElement("option");
    option.value = opt.value;
    option.textContent = opt.label;
    if (opt.value === "") option.selected = true;
    citySelect.appendChild(option);
  });

  // FAQ
  document.getElementById("faq-title").textContent = t["faq-title"];
  const faqList = document.getElementById("faq-list");
  faqList.innerHTML = "";
  t["faq-list"].forEach(faq => {
    const li = document.createElement("li");
    li.innerHTML = `<b>${faq.bold}</b> ${faq.text}`;
    faqList.appendChild(li);
  });

  // How-To card (LEFT)
  document.getElementById("howto-title").textContent = t["howto-title"];
  document.getElementById("howto-article-btn").textContent = t["howto-article-btn"];
  document.getElementById("howto-article-btn").href = t["howto-article-link"];
  const howtoSteps = document.getElementById("howto-steps");
  howtoSteps.innerHTML = "";
  t["howto-steps"].forEach(step => {
    const li = document.createElement("li");
    li.innerHTML = `<b>${step.bold}</b> ${step.text}`;
    howtoSteps.appendChild(li);
  });

  // Tips card (RIGHT)
  document.getElementById("tips-title").textContent = t["tips-title"];
  document.getElementById("tips-article-btn").textContent = t["tips-article-btn"];
  document.getElementById("tips-article-btn").href = t["tips-article-link"];
  const tipsList = document.getElementById("tips-list");
  tipsList.innerHTML = "";
  t["tips-list"].forEach(tip => {
    const li = document.createElement("li");
    li.innerHTML = `<b>${tip.bold}</b> ${tip.text}`;
    tipsList.appendChild(li);
  });
}

// --- Meeting Planner JS (add/remove participants, show times) ---
const { DateTime } = luxon;
const LS_PARTICIPANTS = 'meetingPlannerParticipants';
const LS_DATE = 'meetingPlannerDate';
const LS_TIME = 'meetingPlannerTime';

function loadParticipants() {
  const saved = localStorage.getItem(LS_PARTICIPANTS);
  window.participants = saved ? JSON.parse(saved) : [];
}
function saveParticipants() {
  localStorage.setItem(LS_PARTICIPANTS, JSON.stringify(window.participants));
}
function loadMeetingSettings() {
  document.getElementById('meetingDate').value = localStorage.getItem(LS_DATE) || '';
  document.getElementById('meetingTime').value = localStorage.getItem(LS_TIME) || '';
}
function saveMeetingSettings() {
  localStorage.setItem(LS_DATE, document.getElementById('meetingDate').value);
  localStorage.setItem(LS_TIME, document.getElementById('meetingTime').value);
}
function renderParticipants() {
  const list = document.getElementById('participantList');
  list.innerHTML = '';
  if (!window.participants || window.participants.length === 0) {
    list.innerHTML = '<div style="color: #888;">No participants yet.</div>';
    return;
  }
  window.participants.forEach((p, idx) => {
    const item = document.createElement('div');
    item.className = 'participant-item';
    item.innerHTML = `
      <div class="participant-text"><b>${p.name}</b> (${p.city.replace(/_/g, ' ')})</div>
      <div class="participant-actions">
        <button class="btn btn-outline-danger btn-sm" onclick="removeParticipant(${idx})"><i class="fa fa-trash"></i></button>
      </div>
    `;
    list.appendChild(item);
  });
}
document.getElementById('add-participant-btn').addEventListener('click', function() {
  const name = document.getElementById('participantName').value.trim();
  const city = document.getElementById('participantCity').value;
  if (!name) {
    alert('Please enter a participant name.');
    return;
  }
  if (!city) {
    alert('Please select a time zone/city.');
    return;
  }
  window.participants.push({ name, city });
  saveParticipants();
  document.getElementById('participantName').value = '';
  document.getElementById('participantCity').selectedIndex = 0;
  renderParticipants();
});
window.removeParticipant = function(idx) {
  window.participants.splice(idx, 1);
  saveParticipants();
  renderParticipants();
  document.getElementById('meetingTimes').innerHTML = '';
};
document.getElementById('meetingDate').addEventListener('input', saveMeetingSettings);
document.getElementById('meetingTime').addEventListener('input', saveMeetingSettings);
document.getElementById('show-times-btn').addEventListener('click', function() {
  const dateInput = document.getElementById('meetingDate').value;
  const timeInput = document.getElementById('meetingTime').value;
  const timesDiv = document.getElementById('meetingTimes');
  if (!dateInput || !timeInput) {
    timesDiv.innerHTML = '<span style="color:#b00;">Please select both a meeting date and time.</span>';
    return;
  }
  if (!window.participants || window.participants.length === 0) {
    timesDiv.innerHTML = '<span style="color:#b00;">Please add at least one participant.</span>';
    return;
  }
  const localISO = dateInput + 'T' + timeInput;
  const utcTime = DateTime.fromISO(localISO, { zone: 'utc' });
  let html = '<b>Meeting Times:</b><ul class="meeting-times-list">';
  window.participants.forEach(p => {
    const localTime = utcTime.setZone(p.city);
    html += `<li><b>${p.name}</b>: ${localTime.toFormat('fff')} <span style="color:#888;">(${p.city})</span></li>`;
  });
  html += '</ul>';
  timesDiv.innerHTML = html;
});

// Init
document.getElementById("lang-select").addEventListener("change", function() {
  localStorage.setItem('meetingPlannerLang', this.value);
  updateLanguage();
});
document.addEventListener("DOMContentLoaded", function() {
  const savedLang = localStorage.getItem('meetingPlannerLang') || 'en';
  document.getElementById('lang-select').value = savedLang;
  updateLanguage();
  loadParticipants();
  renderParticipants();
  loadMeetingSettings();
});
