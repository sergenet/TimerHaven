<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>الموقت — TimerHaven</title>
  <meta name="description" content="قِس الوقت المنقضي لأي نشاط. تعلّم كيفية استخدام الموقت، واحصل على نصائح والأسئلة الشائعة."/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
  <style>
    :root{--brand:#0b63a0;--muted:#6b7c89;--card:#fff;--bg:#fbfeff;--accent:#007bff}
    html,body{height:100%}
    body {
      margin:0;
      padding:2rem;
      font-family:'Montserrat', Arial, sans-serif;
      background:var(--bg);
      color:#0b2545;
      direction:rtl;
    }
    .container { max-width:720px; margin:0 auto; }
    .card {
      background:var(--card);
      border-radius:16px;
      box-shadow:0 8px 24px rgba(0,0,0,0.06);
      padding:1.6rem 1.5rem;
      box-sizing:border-box;
    }
    /* Back link uses the site's standard blue */
    .back-link{display:inline-block;margin-bottom:.75rem;color:var(--accent) !important;text-decoration:none;font-weight:700}
    .back-link:hover{text-decoration:underline}
    .tool-title { color:var(--brand); font-size:1.35rem; margin:0 0 .6rem 0; display:flex; align-items:center; gap:.5rem; justify-content:flex-end; }
    .crt {
      display:inline-block;padding:.45rem .7rem;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none;
      font-weight:700;font-size:.95rem;border:none;box-shadow:0 6px 18px rgba(0,123,255,0.08);
    }
    .stopwatch-display { font-weight:700; font-size:1.25rem; margin-top:.5rem; margin-bottom:.5rem; text-align:right; color:#102a43; }
    .controls-row { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; justify-content:flex-end; margin-top:.5rem; }
    .lap-list { margin-top:.8rem; }
    .faq-section { margin-top:1rem; background:#f7fafc; border-radius:8px; padding:1rem; box-shadow:0 1px 4px #e0e7ef; text-align:right; }
    .svg-btn { display:inline-block; vertical-align:middle; cursor:pointer; border:none; background:transparent; padding:0; }
    .svg-btn:focus { outline:3px solid rgba(11,99,160,0.18); border-radius:6px; }
    .svg-btn svg { display:block; }
    .btn-fallback { display:none; }
    .lap-item { background:#f7fafc; padding:.45rem; border-radius:8px; margin-bottom:.4rem; text-align:right; }
    @media (max-width:900px) { .card{padding:1rem} .controls-row{justify-content:flex-start} }
  </style>
</head>
<body>
  <script>try{ localStorage.setItem('timerhavenLang','ar'); }catch(e){}</script>

  <div class="container" role="main">
    <article class="card" aria-labelledby="tool-title">
      <a href="index.html" class="back-link" id="back-link">← العودة إلى القائمة الرئيسية</a>

      <h3 id="tool-title" class="tool-title"><i class="fa fa-clock" aria-hidden="true"></i> الموقت</h3>

      <p style="margin:0 0 .6rem 0; text-align:right;">
        <a id="read-guide-btn" class="crt" href="/ar/stopwatch/stopwatch-index.html" role="button" target="_blank" rel="noopener">اقرأ المقال كاملًا</a>
      </p>

      <div class="stopwatch-section" aria-live="polite">
        <div id="swDisplay" class="stopwatch-display" aria-atomic="true">00:00:00</div>

        <div class="controls-row" role="toolbar" aria-label="عناصر تحكم الموقت">
          <!-- Inline SVG start button with exact fill color to match other tools -->
          <button id="swStartBtn" class="svg-btn" type="button" aria-label="ابدأ الموقت" title="ابدأ">
            <svg width="72" height="36" viewBox="0 0 72 36" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="false" focusable="false">
              <rect x="0" y="0" rx="6" ry="6" width="72" height="36" fill="#0b63a0"></rect>
              <text x="36" y="22" font-family="Montserrat, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">ابدأ</text>
            </svg>
          </button>

          <!-- Hidden fallback for environments that can't interact with SVG -->
          <button id="swStartBtnFallback" class="btn btn-brand btn-fallback" type="button" style="background:#0b63a0;color:#fff;border-color:rgba(0,0,0,0.05);">ابدأ</button>

          <button id="swPauseBtn" class="btn btn-secondary" type="button" aria-label="إيقاف مؤقت">إيقاف مؤقت</button>
          <button id="swResetBtn" class="btn btn-danger" type="button" aria-label="إعادة ضبط">إعادة ضبط</button>
          <button id="swLapBtn" class="btn btn-info" type="button" aria-label="لفة">لفة</button>
        </div>

        <div id="lapList" class="lap-list" style="margin-top:.8rem;" aria-live="polite"></div>

        <details class="faq-section" style="margin-top:1rem;">
          <summary style="font-weight:700; font-size:1rem;">الأسئلة الشائعة</summary>
          <ul style="padding-right:1.1rem; color:#374151; list-style-position:inside;">
            <li><b>هل يمكن تسجيل لفات متعددة؟</b> نعم، استخدم زر اللفة.</li>
            <li><b>هل يبقى الوقت محفوظاً؟</b> لا، يعاد عند إعادة التحميل.</li>
            <li><b>هل هو مجاني؟</b> نعم، جميع أدوات TimerHaven مجانية.</li>
          </ul>
        </details>
      </div>
    </article>
  </div>

  <script>
  (function(){
    // language selector redirect (markup is present but hidden)
    var sel = document.getElementById('language-select-top');
    if (sel) {
      sel.addEventListener('change', function() {
        var v = this.value || 'en';
        window.location.href = 'stopwatch-' + v + '.html';
      });
    }

    // Stopwatch logic (identical behavior to other localized pages)
    var swTimer = null, swStart = null, swElapsed = 0, swRunning = false, laps = [];

    function swFormat(ms) {
      var t = Math.floor(ms / 1000);
      var h = Math.floor(t / 3600);
      var m = Math.floor((t % 3600) / 60);
      var s = t % 60;
      return String(h).padStart(2,'0') + ":" + String(m).padStart(2,'0') + ":" + String(s).padStart(2,'0');
    }

    function renderLaps() {
      var lapList = document.getElementById('lapList');
      lapList.innerHTML = laps.map(function(l,i){
        return '<div class="lap-item">لفة '+(i+1)+': '+swFormat(l)+'</div>';
      }).join('');
    }

    function swUpdateDisplay() {
      document.getElementById('swDisplay').textContent = swFormat(swElapsed);
      renderLaps();
    }

    function startStopwatch() {
      if (swRunning) return;
      swRunning = true;
      swStart = Date.now() - swElapsed;
      swTimer = setInterval(function(){
        swElapsed = Date.now() - swStart;
        swUpdateDisplay();
      }, 100);
    }
    function pauseStopwatch() {
      swRunning = false;
      clearInterval(swTimer);
    }
    function resetStopwatch() {
      swRunning = false;
      clearInterval(swTimer);
      swElapsed = 0;
      laps = [];
      swUpdateDisplay();
    }
    function lapStopwatch() {
      if (swRunning) laps.push(swElapsed);
      swUpdateDisplay();
    }

    document.addEventListener('DOMContentLoaded', function() {
      var svgStart = document.getElementById('swStartBtn');
      var fallbackStart = document.getElementById('swStartBtnFallback');
      var pauseBtn = document.getElementById('swPauseBtn');
      var resetBtn = document.getElementById('swResetBtn');
      var lapBtn = document.getElementById('swLapBtn');

      if (svgStart) {
        svgStart.addEventListener('click', startStopwatch);
        svgStart.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startStopwatch(); } });
        svgStart.setAttribute('tabindex','0');
      }
      if (fallbackStart) fallbackStart.addEventListener('click', startStopwatch);
      if (pauseBtn) pauseBtn.addEventListener('click', pauseStopwatch);
      if (resetBtn) resetBtn.addEventListener('click', resetStopwatch);
      if (lapBtn) lapBtn.addEventListener('click', lapStopwatch);

      // initial render
      swUpdateDisplay();
    });
  })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/js/all.min.js"></script>
</body>
</html>
