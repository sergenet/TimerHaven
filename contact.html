    function getStoredLang() {
      try {
        const s = localStorage.getItem('timerhavenLang');
        if (s && typeof s === 'string') return s.slice(0, 2);
      } catch (e) { }
      return 'en';
    }
    function updateLanguage(lang) {
      if (!lang) lang = getStoredLang();
      if (!translations[lang]) lang = 'en';
      document.documentElement.lang = lang;
      if (lang === 'ar') {
        document.body.dir = 'rtl';
      } else {
        document.body.dir = 'ltr';
      }
      Object.keys(translations[lang]).forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          if (el.tagName === 'A' && id === 'back-to-menu') {
            el.innerHTML = '<i class="fa fa-arrow-left" aria-hidden="true"></i> ' + translations[lang][id];
            if (lang === 'ar') el.innerHTML = translations[lang][id] + ' <i class="fa fa-arrow-right" aria-hidden="true"></i>';
          } else {
            el.textContent = translations[lang][id];
          }
        }
      });
      document.title = translations[lang]["page-title"];
    }
    window.addEventListener('DOMContentLoaded', () => updateLanguage());

<body>
    <div class="container" id="mainContainer">
    <a href="index.html" class="back-link" id="back-to-menu"><i class="fa fa-arrow-left" aria-hidden="true"></i> Back to
      Main Menu</a>
    <h1 id="contact-us-h1">Contact Us</h1>
    <p>
      <span id="contact-intro">Have a question, suggestion, or need help? Fill out the form below or email us directly
        at</span>
      <strong>support@timerhaven.com</strong>.
    </p>
    <form id="contactForm" onsubmit="return false;">
      <div class="mb-3">
        <label for="name" class="form-label" id="label-name">Your Name:</label>
        <input type="text" class="form-control" id="name" name="Name" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label" id="label-email">Your Email:</label>
        <input type="email" class="form-control" id="email" name="Email" required>
      </div>
      <div class="mb-3">
        <label for="message" class="form-label" id="label-message">Message:</label>
        <textarea class="form-control" id="message" name="Message" rows="4" required></textarea>
      </div>
      <button type="button" id="sendMessageBtn" class="btn btn-primary"><span id="btn-send">Send Message</span></button>
    </form>
    <p style="color:#888; font-size:0.98em; margin-top:1.5em;" id="reply-notice">
      We aim to reply within 1-2 business days.
    </p>
  </div>
  <footer style="text-align:center; padding:1em 0; color:#555;">
    <span id="footer-copyright">&copy; 2025 TimerHaven. All tools are free and privacy-friendly.</span><br>
    <a href="/privacy.html" id="footer-privacy">Privacy Policy</a> ·
    <a href="/terms.html" id="footer-terms">Terms</a> ·
    <a href="/contact.html" id="footer-contact">Contact</a>
  </footer>
  <script>
    (function () {
      const sendBtn = document.getElementById('sendMessageBtn');
      if (!sendBtn) return;
      const mainContainer = document.getElementById('mainContainer');
      const form = document.getElementById('contactForm');
      const lang = getStoredLang();
      const t = translations[lang] || translations.en;
      function handleSend() {
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const message = document.getElementById('message').value.trim();
        if (!name || !email || !message) {
          alert(t["alert-fill-all"] || t["alert-empty"]);
          return;
        }
        sendBtn.disabled = true;
        const sendTextEl = document.getElementById('btn-send');
        if (sendTextEl) sendTextEl.textContent = t["status-sending"];
        const payload = {
          name: name,
          email: email,
          message: message,
          pageUrl: window.location.href,
          userAgent: navigator.userAgent
        };
        fetch('api/contact.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Contact-Secret': '2f52f6a210ba938e46411da7492a9a3c5388f4af3ddc1a2cafade513679c6a4d'
          },
          body: JSON.stringify(payload)
        })
          .then(response => response.json())
          .then(data => {
            if (data.ok) {
              const backIcon = lang === 'ar' ? '<i class="fa fa-arrow-right" aria-hidden="true"></i>' : '<i class="fa fa-arrow-left" aria-hidden="true"></i>';
              const backText = lang === 'ar' ? t["back-to-menu"] + ' ' + backIcon : backIcon + ' ' + t["back-to-menu"];
              mainContainer.innerHTML = `
                <a href="index.html" class="back-link">${backText}</a>
                <h1>${t["success-h1"]}</h1>
                <p>${t["success-p"]}</p>
                <a href="index.html" class="btn btn-primary">${t["btn-return-home"]}</a>
              `;
            } else {
              alert(t["error-prefix"] + (data.error || 'Unknown error occurred.'));
              sendBtn.disabled = false;
              if (sendTextEl) sendTextEl.textContent = t["btn-send"];
            }
          })
          .catch(error => {
            console.error('Contact Error:', error);
            alert(t["error-fail"]);
            sendBtn.disabled = false;
            if (sendTextEl) sendTextEl.textContent = t["btn-send"];
          });
      }
      sendBtn.addEventListener('touchstart', function (e) {
        e.preventDefault();
        handleSend();
      });
      sendBtn.addEventListener('click', function (e) {
        e.preventDefault();
        handleSend();
      });
      if (form) {
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          handleSend();
        });
      }
    })();
  </script>

<script>
(function () {
  var back = document.querySelector('[data-th-back]');
  if (back) back.addEventListener('click', function () {
    if (window.history.length > 1) { window.history.back(); } else { window.location.href = '/'; }
  });
  var top = document.querySelector('[data-th-top]');
  if (top) {
    var toggle = function () { top.style.display = window.scrollY > 300 ? 'block' : 'none'; };
    window.addEventListener('scroll', toggle, { passive: true });
    toggle();
    top.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }
})();
</script>
