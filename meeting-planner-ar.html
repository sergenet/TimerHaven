<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>مخطط الاجتماعات</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ابحث عن أفضل وقت للاجتماع للجميع في أي مكان في العالم.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body { background: #f4f7fb; font-family: 'Montserrat', Arial, sans-serif; }
    .main-container { max-width: 1200px; margin: 2em auto; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
    .center-row { display: flex; flex-direction: row; justify-content: center; align-items: stretch; gap: 2em; width: 100%; }
    .tool-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px #e0e7ef;
      min-width: 220px;
      max-width: 340px;
      width: 340px;
      min-height: 500px;
      flex: 1 1 340px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      padding: 2em 1.3em 1em 1.3em;
      margin: 0;
      box-sizing: border-box;
      text-align: left;
      overflow: hidden;
    }
    .back-link { display: inline-block; margin-bottom: 1em; color: #007bff; text-decoration: none; font-weight: bold; font-size: 1em; }
    .back-link:hover { text-decoration: underline; }
    .faq-section { margin-top: 1.1em; margin-bottom: 0.3em; font-size: 1em; background: #f7fafc; border-radius: 8px; padding: 1em; box-shadow: 0 1px 4px #e0e7ef; }
    .faq-section summary { font-weight: bold; font-size: 1.07em; cursor: pointer; margin-bottom: 0.5em; }
    .language-selector-row { margin-bottom: 1em; }
  </style>
</head>
<body>
  <div class="main-container">
    <div class="center-row">
      <div class="tool-card">
        <div class="language-selector-row">
          <label for="languageSelector">اللغة</label>
          <select id="languageSelector" class="form-select" onchange="onLanguageChange()">
            <option value="en">الإنجليزية</option><option value="fr">الفرنسية</option><option value="de">الألمانية</option><option value="ru">الروسية</option><option value="el">اليونانية</option><option value="es">الإسبانية</option><option value="ar">العربية</option>
          </select>
        </div>
        <a href="index.html" class="back-link"><i class="fa fa-arrow-left"></i> العودة للقائمة الرئيسية</a>
        <h3><i class="fa fa-users"></i> مخطط الاجتماعات</h3>
        <form id="meetingForm">
          <div class="meeting-form-row">
            <label for="participantName">اسم المشارك</label>
            <input type="text" id="participantName" class="form-control" placeholder="أدخل الاسم (مثال: أحمد)" autocomplete="off">
          </div>
          <div class="meeting-form-row">
            <label for="participantCity">المنطقة الزمنية / المدينة</label>
            <select id="participantCity" class="form-select" autocomplete="off">
              <option value="" disabled selected>اختر مدينة/منطقة زمنية</option>
              <option value="America/New_York">نيويورك 🇺🇸</option><option value="America/Chicago">شيكاغو 🇺🇸</option><option value="America/Los_Angeles">لوس أنجلوس 🇺🇸</option><option value="America/Toronto">تورونتو 🇨🇦</option><option value="Europe/London">لندن 🇬🇧</option><option value="Europe/Paris">باريس 🇫🇷</option><option value="Europe/Berlin">برلين 🇩🇪</option><option value="Europe/Moscow">موسكو 🇷🇺</option><option value="Europe/Istanbul">إسطنبول 🇹🇷</option><option value="Asia/Dubai">دبي 🇦🇪</option><option value="Asia/Kolkata">كولكاتا 🇮🇳</option><option value="Asia/Shanghai">شنغهاي 🇨🇳</option><option value="Asia/Tokyo">طوكيو 🇯🇵</option><option value="Asia/Singapore">سنغافورة 🇸🇬</option><option value="Asia/Jakarta">جاكرتا 🇮🇩</option><option value="Australia/Sydney">سيدني 🇦🇺</option><option value="Pacific/Auckland">أوكلاند 🇳🇿</option><option value="America/Sao_Paulo">ساو باولو 🇧🇷</option><option value="America/Mexico_City">مكسيكو سيتي 🇲🇽</option><option value="Africa/Johannesburg">جوهانسبيرغ 🇿🇦</option><option value="Africa/Cairo">القاهرة 🇪🇬</option><option value="Africa/Nairobi">نيروبي 🇰🇪</option><option value="Asia/Seoul">سيول 🇰🇷</option><option value="Asia/Hong_Kong">هونغ كونغ 🇭🇰</option><option value="Asia/Bangkok">بانكوك 🇹🇭</option><option value="Asia/Manila">مانيلا 🇵🇭</option><option value="Europe/Madrid">مدريد 🇪🇸</option><option value="Europe/Rome">روما 🇮🇹</option><option value="Europe/Warsaw">وارسو 🇵🇱</option><option value="Europe/Amsterdam">أمستردام 🇳🇱</option><option value="Europe/Athens">أثينا 🇬🇷</option><option value="America/Vancouver">فانكوفر 🇨🇦</option>
            </select>
          </div>
          <button type="button" class="btn btn-success btn-participant" id="addParticipant"><i class="fa fa-plus"></i> إضافة مشارك</button>
        </form>
        <div class="participant-list" id="participantList"></div>
        <div class="meeting-form-row">
          <label for="meetingDate">اختر تاريخ الاجتماع</label>
          <input type="date" id="meetingDate" class="form-control">
        </div>
        <div class="meeting-form-row">
          <label for="meetingTime">اختر وقت الاجتماع</label>
          <input type="time" id="meetingTime" class="form-control">
          <button type="button" class="btn btn-primary btn-sm" style="margin-top:0.6em;" id="calcTimes"><i class="fa fa-clock"></i> عرض الأوقات</button>
        </div>
        <div>
          <div id="meetingTimes"></div>
        </div>
        <details class="faq-section">
          <summary>الأسئلة الشائعة</summary>
          <ul style="padding-left: 1em;">
            <li><b>كم عدد المشاركين؟</b> أضف العدد الذي تريد.</li><li><b>ما المناطق الزمنية؟</b> اختر من أكثر من 30 مدينة عالمية.</li><li><b>كيف أشارك؟</b> انسخ أوقات الاجتماع وشاركها مع المشاركين.</li>
          </ul>
        </details>
      </div>
    </div>
  </div>
  <script>
    function onLanguageChange() {
      var lang = document.getElementById("languageSelector").value;
      window.location.href = "meeting-planner-" + lang + ".html";
    }
  </script>
</body>
</html>
