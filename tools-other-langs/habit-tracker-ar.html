<style>
    /* consistent layout with other language files */
    body { background:#f4f7fb; font-family:'Montserrat', Arial, sans-serif; direction: rtl; }
    .main-container { max-width:1200px; margin:2em auto; display:flex; justify-content:center; align-items:center; min-height:90vh; }
    .center-row { display:flex; gap:2em; width:100%; justify-content:center; align-items:flex-start; }
    .article-card, .tool-card {
      background:#fff; border-radius:16px; box-shadow:0 2px 12px #e0e7ef;
      width:340px; min-width:220px; max-width:340px; min-height:500px;
      flex:1 1 340px; display:flex; flex-direction:column; padding:2em 1.3em 1em; box-sizing:border-box;
      text-align:right; overflow:hidden;
    }
    .tool-card { max-width:410px; min-width:240px; padding:2em 1.5em 1em; position:relative; z-index:1; }
    .tool-card h3 { font-size:1.45em; font-weight:700; margin-bottom:0.1em; display:flex; align-items:center; gap:.4em; justify-content:flex-end; }
    .article-card h2, .tool-card h3 { font-size:1.35em; font-weight:700; margin-bottom:.4em; }
    .habit-form { margin-bottom:1em; display:flex; gap:.5em; justify-content:stretch; align-items:center; }
    .habit-form input { direction: ltr; } /* input text direction handled by browser; keep placeholder localized */
    .habit-list { margin-bottom:1em; }
    .habit-item { background:#f7fafc; border-radius:7px; padding:.6em .8em; margin-bottom:.6em; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    .habit-meta { font-size:0.9em; color:#888; margin-right:0.6em; margin-left:1em; }
    .habit-history { display:flex; gap:3px; margin-right:1em; align-items:center; }
    .dot { width:15px; height:15px; border-radius:50%; display:inline-block; background:#e0e7ef; border:1px solid #d0d0d0; }
    .dot.done { background:#43cea2; border:1.5px solid #185a9d; }
    .dot.today { border:2px solid #43cea2; }
    .stats-bar { background:#f6fbfa; border-radius:10px; margin-bottom:1.2em; padding:.7em 1em; font-size:1.05em; font-weight:600; color:#185a9d; display:flex; gap:2em; align-items:center; justify-content:space-between; direction:ltr; }
    .archive-btn { font-size:0.9em; margin-left:0.6em; background:#fff; border:1px solid #43cea2; color:#43cea2; border-radius:6px; padding:0.15em 0.7em; }
    .archive-btn.archived { opacity:0.65; color:#888; border-color:#d0d0d0; }
    .banner { background:linear-gradient(90deg,#43cea2 0%,#185a9d 100%); color:#fff; border-radius:10px; font-size:1.11em; font-weight:600; text-align:center; margin-bottom:1em; padding:.7em .8em; }
    .faq-section { margin-top:1.1em; margin-bottom:0.3em; font-size:1em; background:#f7fafc; border-radius:8px; padding:1em; box-shadow:0 1px 4px #e0e7ef; direction:rtl; text-align:right; }
    /* language-indicator removed */
    @media (max-width:1100px){ .main-container{padding:0 8px;} .center-row{gap:1em;} .tool-card,.article-card{width:97vw;max-width:540px;height:auto;} }
    @media (max-width:800px){ .main-container{padding:0;} .center-row{flex-direction:column;align-items:center;} .tool-card,.article-card{width:98vw;max-width:540px;height:auto;} .article-card{display:none!important;} .howto-mobile, .tips-mobile{ display:block !important; margin-bottom:1em; } }
    @media (min-width:801px){ .howto-mobile, .tips-mobile { display:none !important; } }
    details[open] summary::after{ content:" ▲"; font-size:.9em; } details summary{ cursor:pointer; padding:.35em 0; font-weight:700; font-size:1.09em; } details:not([open]) summary::after{ content:" ▼"; font-size:.9em; }
  </style>

<body dir="rtl">
<!-- Force Arabic for local-file testing -->
<script>try{ localStorage.setItem('timerhavenLang','ar'); }catch(e){}</script>
<div class="main-container">
<div class="center-row">
<!-- Left article (desktop only) -->
<div class="article-card">
<div>
<h2 id="howto-title"></h2>
<ol id="howto-steps"></ol>
</div>
<a class="btn btn-outline-primary btn-sm" href="#" id="howto-article-btn"></a>
</div>
<!-- Central tool card -->
<div class="tool-card">
<div class="banner" id="banner" style="display:none;"></div>
<a class="back-link" href="index.html" id="back-link"></a>
<h3 id="tool-title"></h3><p style="margin-top:1rem;"><a class="read-guide cta" href="/ar/habit-tracker/habit-tracker-index.html" rel="noopener" target="_blank">اقرأ الدليل الكامل</a></p>
<div aria-hidden="true" class="stats-bar" id="stats-bar"></div>
<div class="habit-section">
<form autocomplete="off" class="habit-form" id="habitForm">
<input class="form-control" id="habitInput" placeholder="" type="text"/>
<button class="btn btn-success btn-sm" id="add-btn" type="submit"></button>
</form>
<div class="habit-list" id="habitList"></div>
</div>
<details class="faq-section" id="faq-section">
<summary id="faq-title"></summary>
<ul id="faq-list" style="padding-right:1em;"></ul>
</details>
<!-- Note: removed inline tips block from inside tool-card to avoid duplicate on desktop -->
</div>
<!-- Right article (desktop only) -->
<div class="article-card">
<div>
<h2 id="tips-title"></h2>
<ul id="tips-list"></ul>
</div>
<a class="btn btn-outline-primary btn-sm" href="#" id="tips-article-btn"></a>
</div>
</div>
</div>
<!-- Mobile-only tips collapsible (outside tool-card). Hidden on desktop. -->
<details class="tips-mobile" id="tips-mobile" style="display:none;">
<summary><h4 id="tips-mobile-title" style="color:#185a9d;display:inline;"></h4></summary>
<ul id="tips-mobile-list" style="padding-right:1em;"></ul>
</details>
<script>
  // Full Arabic translations for this standalone file
  const habitTranslations = {
    ar: {
      "language-label":"اللغة:","back-link":"العودة إلى القائمة الرئيسية","tool-title":"متعقب العادات",
      "habitInput":"اسم العادة","add-btn":"أضف العادة","banner-all-done":"🎉 تم الانتهاء من جميع العادات اليوم! عمل رائع!",
      "stats-tracked":"المتعقبة: ","stats-done":"تم اليوم: ","stats-best":"أفضل سلسلة: ",
      "howto-title":'<i class="fa fa-check-double"></i> كيفية استخدام متعقب العادات',
      "howto-steps":`<li><b>أضف عادة:</b> اكتب عادة يومية وانقر إضافة.</li>
        <li><b>علّمها منجزة:</b> عندما تُنجز العادة، انقر "منجز".</li>
        <li><b>احذف/أرشف:</b> احذف أو أرشف العادات التي لا تريد تتبعها.</li>
        <li><b>كرر يومياً:</b> عد كل يوم لتحديث تقدمك.</li>`,
      "howto-article-btn":"اقرأ المقال","howto-article-link":"habit-how-to-ar.html",
      "tips-title":'<i class="fa fa-lightbulb" style="color:#43cea2;"></i> نصائح',
      "tips-list":`<li><b>ابدأ صغيراً:</b> اختر عادات سهلة بالبداية.</li>
        <li><b>تتبع يومياً:</b> الثبات هو مفتاح النجاح.</li>
        <li><b>احتفل بالتقدم:</b> الانتصارات الصغيرة تحافظ على الدافع.</li>`,
      "tips-article-btn":"اقرأ المقال","tips-article-link":"habit-tips-ar.html",
      "tips-mobile-title":'<i class="fa fa-lightbulb" style="color:#43cea2;"></i> نصائح',
      "tips-mobile-list":`<li><b>ابدأ صغيرًا:</b> ابدأ بعادات بسيطة وسهلة.</li>
        <li><b>راجع السلاسل:</b> راجع تقدمك للبقاء متحفزًا.</li>
        <li><b>اضف تذكيرات:</b> استخدم تذكيرات التقويم.</li>`,
      "faq-title":"الأسئلة الشائعة",
      "faq-list":`<li><b>هل تُحفظ العادات؟</b> نعم، في متصفحك حتى تمسحها.</li>
        <li><b>هل أستطيع تتبع عدة عادات؟</b> نعم.</li>
        <li><b>هل تُعرض السلاسل؟</b> نعم لكل عادة.</li>`,
      "mark-done":"تم","done-today":"تم اليوم","streak":"السلسلة: ","longest":"الأفضل: ",
      "archive":"أرشفة","unarchive":"استعادة","delete":"حذف","no-habits":"لا توجد عادات بعد."
    }
  };

  const langNames = { en:"English", fr:"Français", de:"Deutsch", ru:"Русский", el:"Ελληνικά", es:"Español", ar:"العربية" };

  function getTodayStr() {
    const d = new Date();
    return d.getFullYear() + "-" + (d.getMonth()+1).toString().padStart(2,"0") + "-" + d.getDate().toString().padStart(2,"0");
  }
  function lastNDays(n) {
    const arr = [];
    for (let i = n-1; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      arr.push(d.getFullYear() + "-" + (d.getMonth()+1).toString().padStart(2,"0") + "-" + d.getDate().toString().padStart(2,"0"));
    }
    return arr;
  }

  // Load habits from localStorage
  let habits = JSON.parse(localStorage.getItem('habits') || '[]');

  // Use the main index language selection (timerhavenLang) when available, default to 'ar' for this file.
  function getLang() {
    try {
      const l = localStorage.getItem('timerhavenLang') || 'ar';
      return (l && l.slice(0,2)) || 'ar';
    } catch (e) {
      return 'ar';
    }
  }

  // Apply translations and re-render
  function applyLanguage(lang) {
    lang = (lang || getLang()).slice(0,2);
    const t = habitTranslations[lang] || habitTranslations['ar'];
    // RTL support
    document.body.dir = (lang === 'ar') ? 'rtl' : 'ltr';

    const back = document.getElementById('back-link'); if (back) back.textContent = t['back-link'] || '';
    const toolTitle = document.getElementById('tool-title'); if (toolTitle) toolTitle.innerHTML = `<i class="fa fa-check-double"></i> ${t['tool-title'] || ''}`;
    const input = document.getElementById('habitInput'); if (input) input.placeholder = t['habitInput'] || '';
    const addBtn = document.getElementById('add-btn'); if (addBtn) addBtn.textContent = t['add-btn'] || '';
    const faqTitle = document.getElementById('faq-title'); if (faqTitle) faqTitle.textContent = t['faq-title'] || '';
    const faqList = document.getElementById('faq-list'); if (faqList) faqList.innerHTML = t['faq-list'] || '';
    const howtoTitle = document.getElementById('howto-title'); if (howtoTitle) howtoTitle.innerHTML = t['howto-title'] || '';
    const howtoSteps = document.getElementById('howto-steps'); if (howtoSteps) howtoSteps.innerHTML = t['howto-steps'] || '';
    const howtoBtn = document.getElementById('howto-article-btn'); if (howtoBtn) { howtoBtn.textContent = t['howto-article-btn'] || ''; howtoBtn.href = t['howto-article-link'] || ''; }

    const tipsTitle = document.getElementById('tips-title'); if (tipsTitle) tipsTitle.innerHTML = t['tips-title'] || '';
    const tipsList = document.getElementById('tips-list'); if (tipsList) tipsList.innerHTML = t['tips-list'] || '';
    const tipsBtn = document.getElementById('tips-article-btn'); if (tipsBtn) { tipsBtn.textContent = t['tips-article-btn'] || ''; tipsBtn.href = t['tips-article-link'] || ''; }
    const tipsMobileTitle = document.getElementById('tips-mobile-title'); if (tipsMobileTitle) tipsMobileTitle.innerHTML = t['tips-mobile-title'] || '';
    const tipsMobileList = document.getElementById('tips-mobile-list'); if (tipsMobileList) tipsMobileList.innerHTML = t['tips-mobile-list'] || '';

    // show mobile-only tips control if viewport < 801px
    const mobileDetails = document.getElementById('tips-mobile');
    if (mobileDetails) {
      mobileDetails.style.display = (window.innerWidth < 801) ? 'block' : 'none';
    }

    renderHabits();
  }

  function saveHabits() { localStorage.setItem('habits', JSON.stringify(habits)); }

  function resetHabitsIfNeeded() {
    const today = getTodayStr();
    let changed = false;
    habits.forEach(habit => {
      if (!habit.history) habit.history = [];
      if (habit.lastChecked !== today) {
        habit.doneToday = false;
        habit.lastChecked = today;
        changed = true;
      }
    });
    if (changed) saveHabits();
  }

  function renderStats(tracked, done, best) {
    const lang = getLang();
    const t = habitTranslations[lang] || habitTranslations['ar'];
    const sb = document.getElementById("stats-bar");
    if (sb) sb.innerHTML = `${t["stats-tracked"]}${tracked} &bull; ${t["stats-done"]}${done} &bull; ${t["stats-best"]}${best}`;
  }

  function renderBanner(tracked, done) {
    const lang = getLang();
    const t = habitTranslations[lang] || habitTranslations['ar'];
    const banner = document.getElementById("banner");
    if (tracked > 0 && done === tracked) {
      banner.textContent = t["banner-all-done"] || habitTranslations["ar"]["banner-all-done"];
      banner.style.display = "block";
    } else {
      banner.style.display = "none";
    }
  }

  function renderHabits() {
    resetHabitsIfNeeded();
    const lang = getLang();
    const t = habitTranslations[lang] || habitTranslations['ar'];
    const list = document.getElementById('habitList');
    if (!list) return;
    list.innerHTML = '';
    const today = getTodayStr();
    let doneTodayCount = 0;
    let bestStreak = 0;
    let activeCount = 0;
    habits.forEach(h => { if (!h.archived) activeCount++; });
    if (habits.length === 0 || activeCount === 0) {
      list.innerHTML = `<div style="color:#888;">${t["no-habits"] || habitTranslations["ar"]["no-habits"]}</div>`;
    }
    habits.forEach((habit, idx) => {
      if (habit.archived) return;
      let streak = habit.streak || 0;
      let longest = habit.longest || streak;
      bestStreak = Math.max(bestStreak, longest);
      if (!habit.history) habit.history = [];
      let historyDots = "";
      lastNDays(7).forEach((date) => {
        const done = habit.history.includes(date);
        historyDots += `<span class="dot${done ? ' done' : ''}${date === today ? ' today' : ''}" title="${date}"></span>`;
      });
      const isDone = habit.doneToday;
      if (isDone) doneTodayCount++;
      list.innerHTML += `
        <div class="habit-item">
          <span style="display:flex; flex-direction:column; align-items:flex-end;">
            <b>${habit.name}</b>
            <span class="habit-meta">${t["streak"]}${streak} ${t["longest"]}${longest}</span>
            <span class="habit-history">${historyDots}</span>
          </span>
          <div style="display:flex; gap:0.5em; align-items:center;">
            <button class="btn btn-outline-${isDone ? 'secondary' : 'success'} btn-sm habit-btn" onclick="markDone(${idx})" ${isDone ? 'disabled' : ''}>
              ${isDone ? t["done-today"] : t["mark-done"]}
            </button>
            <button class="archive-btn${habit.archived ? ' archived' : ''}" onclick="archiveHabit(${idx})">
              ${habit.archived ? t["unarchive"] : t["archive"]}
            </button>
            <button class="btn btn-outline-danger btn-sm habit-btn" onclick="deleteHabit(${idx})"><i class="fa fa-trash"></i> ${t["delete"]}</button>
          </div>
        </div>
      `;
    });
    renderStats(activeCount, doneTodayCount, bestStreak);
    renderBanner(activeCount, doneTodayCount);
  }

  // Form submit: add habit
  document.addEventListener('DOMContentLoaded', function() {
    // Ensure local testing picks Arabic
    try { localStorage.setItem('timerhavenLang','ar'); } catch(e) {}
    applyLanguage(getLang());

    const form = document.getElementById('habitForm');
    if (form) {
      form.addEventListener('submit', function(e){
        e.preventDefault();
        const name = document.getElementById('habitInput').value.trim();
        if (!name) return;
        habits.push({
          name,
          streak: 0,
          longest: 0,
          doneToday: false,
          lastChecked: getTodayStr(),
          history: [],
          archived: false
        });
        saveHabits();
        document.getElementById('habitInput').value = "";
        renderHabits();
      });
    }

    // Wire up storage event (language changes from other tabs)
    window.addEventListener('storage', function(e) {
      if (e.key === 'timerhavenLang') {
        const lang = (e.newValue || getLang()).slice(0,2);
        applyLanguage(lang);
      }
    });

    // Wire resize to show/hide mobile tips
    window.addEventListener('resize', function(){ applyLanguage(getLang()); });

    // Initial render
    renderHabits();
  });

  // Actions accessible from HTML
  window.markDone = function(idx){
    const today = getTodayStr();
    if (!habits[idx].doneToday) {
      habits[idx].doneToday = true;
      habits[idx].lastChecked = today;
      habits[idx].streak = (habits[idx].streak || 0) + 1;
      habits[idx].longest = Math.max(habits[idx].longest || 0, habits[idx].streak);
      if (!habits[idx].history) habits[idx].history = [];
      if (!habits[idx].history.includes(today)) habits[idx].history.push(today);
      saveHabits();
      renderHabits();
    }
  }
  window.archiveHabit = function(idx){
    habits[idx].archived = !habits[idx].archived;
    saveHabits();
    renderHabits();
  }
  window.deleteHabit = function(idx){
    habits.splice(idx, 1);
    saveHabits();
    renderHabits();
  }
</script>
