<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Rastreador de Hábitos — TimerHaven</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sigue hábitos diarios y crea nuevas rutinas.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    /* same styles as English file */
    body { background: #f4f7fb; font-family: 'Montserrat', Arial, sans-serif; }
    .main-container { max-width: 1200px; margin: 2em auto; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
    .center-row { display: flex; flex-direction: row; justify-content: center; align-items: flex-start; gap: 2em; width: 100%; }
    .article-card, .tool-card { background: #fff; border-radius: 16px; box-shadow: 0 2px 12px #e0e7ef; width: 340px; min-width: 220px; max-width: 340px; min-height: 500px; flex: 1 1 340px; display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; padding: 2em 1.3em 1em 1.3em; margin: 0; box-sizing: border-box; text-align: left; overflow: hidden; }
    .tool-card { max-width: 410px; min-width: 240px; padding: 2em 1.5em 1em 1.5em; position: relative; z-index: 1; }
    .tool-card h3 { font-size: 1.45em; font-weight: 700; margin-bottom: 0.1em; }
    .habit-form { margin-bottom: 1em; display: flex; gap: 0.5em; }
    .habit-item { background: #f7fafc; border-radius: 7px; padding: 0.6em 0.8em; margin-bottom: 0.6em; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    .dot { width: 15px; height: 15px; border-radius: 50%; display: inline-block; background: #e0e7ef; border: 1px solid #d0d0d0;}
    .dot.done { background: #43cea2; border: 1.5px solid #185a9d; }
    .dot.today { border: 2px solid #43cea2; }
    .stats-bar { background: #f6fbfa; border-radius: 10px; margin-bottom: 1.2em; padding: 0.7em 1em; font-size: 1.05em; font-weight: 600; color: #185a9d; display:flex; gap:2em; align-items:center; justify-content:space-between; }
    .banner { background: linear-gradient(90deg,#43cea2 0%,#185a9d 100%); color:#fff; border-radius:10px; font-size:1.11em; font-weight:600; text-align:center; margin-bottom:1em; padding:0.7em 0.8em; }
    /* language-indicator styles removed */
  </style>
</head>
<body>
  <!-- language-indicator removed -->

  <div class="main-container">
    <div class="center-row">
      <div class="article-card"><div><h2 id="howto-title"></h2><ol id="howto-steps"></ol></div><a href="#" class="btn btn-outline-primary btn-sm" id="howto-article-btn"></a></div>

      <div class="tool-card">
        <div id="banner" class="banner" style="display:none;"></div>
        <a href="index.html" class="back-link" id="back-link"></a>
        <h3 id="tool-title"></h3>
        <div class="stats-bar" id="stats-bar"></div>
        <form class="habit-form" id="habitForm"><input type="text" id="habitInput" class="form-control" placeholder=""><button type="submit" class="btn btn-success btn-sm" id="add-btn"></button></form>
        <div id="habitList" class="habit-list"></div>

        <details class="faq-section" id="faq-section"><summary id="faq-title"></summary><ul id="faq-list" style="padding-left:1em;"></ul></details>

        <!-- Tips removed from the middle (tool) card as requested -->
      </div>

      <div class="article-card"><div><h2 id="tips-title"></h2><ul id="tips-list"></ul></div><a href="#" class="btn btn-outline-primary btn-sm" id="tips-article-btn"></a></div>
    </div>
  </div>

  <script>
    const habitTranslations = {
      es: {
        "language-label":"Idioma:","back-link":"Volver al menú principal","tool-title":"Rastreador de Hábitos",
        "habitInput":"Nombre del hábito","add-btn":"Añadir hábito","banner-all-done":"🎉 ¡Todas las hábitos completadas hoy! ¡Buen trabajo!",
        "stats-tracked":"Rastreado: ","stats-done":"Hecho hoy: ","stats-best":"Mejor racha: ",
        "howto-title":'<i class="fa fa-check-double"></i> Cómo usar el Rastreador de Hábitos',
        "howto-steps":`<li><b>Añade un hábito:</b> Escribe tu hábito diario y pulsa Añadir.</li>
          <li><b>Marcar como hecho:</b> Cuando completes un hábito, pulsa Hecho.</li>
          <li><b>Eliminar/Archivar:</b> Elimina o archiva hábitos que no quieras seguir.</li>
          <li><b>Repetir a diario:</b> Vuelve cada día para actualizar tu progreso.</li>`,
        "howto-article-btn":"Leer artículo","howto-article-link":"habit-how-to-es.html",
        "tips-title":'<i class="fa fa-lightbulb" style="color:#43cea2;"></i> Consejos',
        "tips-list":`<li><b>Empieza pequeño:</b> Comienza con hábitos fáciles.</li>
          <li><b>Rastrea a diario:</b> La consistencia es clave.</li>
          <li><b>Celebra progreso:</b> Reconoce pequeñas victorias.</li>`,
        "tips-article-btn":"Leer artículo","tips-article-link":"habit-tips-es.html",
        "tips-mobile-title":'<i class="fa fa-lightbulb" style="color:#43cea2;"></i> Consejos',
        "tips-mobile-list":`<li><b>Empieza pequeño:</b> Construye gradualmente.</li>
          <li><b>Revisa rachas:</b> Mantén la motivación.</li>
          <li><b>Usa recordatorios:</b> Agrega alertas de calendario.</li>`,
        "faq-title":"Preguntas frecuentes",
        "faq-list":`<li><b>¿Se guardan los hábitos?</b> Sí, en tu navegador.</li>
          <li><b>¿Puedo rastrear varios hábitos?</b> Sí.</li>
          <li><b>¿Se muestran rachas?</b> Sí.</li>`,
        "mark-done":"Marcar","done-today":"Hecho hoy","streak":"Racha: ","longest":"Mejor: ",
        "archive":"Archivar","unarchive":"Desarchivar","delete":"Eliminar","no-habits":"Aún no hay hábitos."
      }
    };

    const langNames = { en: "English", fr: "Français", de: "Deutsch", ru: "Русский", el: "Ελληνικά", es: "Español", ar: "العربية" };

    function getLang() { try { const l = localStorage.getItem('timerhavenLang') || 'es'; return (l && l.slice(0,2)) || 'es'; } catch(e){ return 'es'; } }

    // For brevity this file focuses on Spanish translations and reuses the same logic as the canonical English file.
    // The script below mirrors the English file's behavior and uses habitTranslations.es for UI strings.

    function applyLanguage(lang) {
      lang = (lang || getLang()).slice(0,2);
      const t = habitTranslations[lang] || habitTranslations['es'];
      document.body.dir = (lang === "ar") ? "rtl" : "ltr";
      const labelEl = document.getElementById('language-label'); if (labelEl) labelEl.textContent = t['language-label'] || 'Idioma:';
      const nameEl = document.getElementById('language-name'); if (nameEl) nameEl.textContent = langNames[lang] || lang;
      const back = document.getElementById('back-link'); if (back) back.textContent = t['back-link'] || '';
      const toolTitle = document.getElementById('tool-title'); if (toolTitle) toolTitle.innerHTML = `<i class="fa fa-check-double"></i> ${t['tool-title'] || ''}`;
      const input = document.getElementById('habitInput'); if (input) input.placeholder = t['habitInput'] || '';
      const addBtn = document.getElementById('add-btn'); if (addBtn) addBtn.textContent = t['add-btn'] || '';
      const faqTitle = document.getElementById('faq-title'); if (faqTitle) faqTitle.textContent = t['faq-title'] || '';
      const faqList = document.getElementById('faq-list'); if (faqList) faqList.innerHTML = t['faq-list'] || '';
      const howtoTitle = document.getElementById('howto-title'); if (howtoTitle) howtoTitle.innerHTML = t['howto-title'] || '';
      const howtoSteps = document.getElementById('howto-steps'); if (howtoSteps) howtoSteps.innerHTML = t['howto-steps'] || '';
      const howtoBtn = document.getElementById('howto-article-btn'); if (howtoBtn) { howtoBtn.textContent = t['howto-article-btn'] || ''; howtoBtn.href = t['howto-article-link'] || ''; }
      const tipsTitle = document.getElementById('tips-title'); if (tipsTitle) tipsTitle.innerHTML = t['tips-title'] || '';
      const tipsList = document.getElementById('tips-list'); if (tipsList) tipsList.innerHTML = t['tips-list'] || '';
      const tipsBtn = document.getElementById('tips-article-btn'); if (tipsBtn) { tipsBtn.textContent = t['tips-article-btn'] || ''; tipsBtn.href = t['tips-article-link'] || ''; }
      const tipsMobileTitle = document.getElementById('tips-mobile-title'); if (tipsMobileTitle) tipsMobileTitle.innerHTML = t['tips-mobile-title'] || '';
      const tipsMobileList = document.getElementById('tips-mobile-list'); if (tipsMobileList) tipsMobileList.innerHTML = t['tips-mobile-list'] || '';
      renderHabits();
    }

    function getTodayStr() { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth()+1).toString().padStart(2,"0") + "-" + d.getDate().toString().padStart(2,"0"); }
    function lastNDays(n) { const arr=[]; for(let i=n-1;i>=0;i--){const d=new Date(); d.setDate(d.getDate()-i); arr.push(d.getFullYear()+"-"+(d.getMonth()+1).toString().padStart(2,"0")+"-"+d.getDate().toString().padStart(2,"0"));} return arr; }

    let habits = JSON.parse(localStorage.getItem('habits') || '[]');

    function resetHabitsIfNeeded() { const today=getTodayStr(); let changed=false; habits.forEach(h=>{ if(!h.history) h.history=[]; if(h.lastChecked!==today){ h.doneToday=false; h.lastChecked=today; changed=true;}}); if(changed) saveHabits(); }
    function saveHabits(){ localStorage.setItem('habits', JSON.stringify(habits)); }

    function renderHabits(){
      resetHabitsIfNeeded();
      const t = habitTranslations[getLang()] || habitTranslations['es'];
      const list = document.getElementById('habitList'); list.innerHTML=''; const today=getTodayStr(); let doneTodayCount=0; let bestStreak=0; let activeCount=0;
      habits.forEach(h=>{ if(!h.archived) activeCount++;});
      if(habits.length===0||activeCount===0) { list.innerHTML = `<div style="color:#888;">${t["no-habits"] || "Aún no hay hábitos."}</div>`; }
      habits.forEach((habit, idx)=>{ if(habit.archived) return; let streak=habit.streak||0; let longest=habit.longest||streak; bestStreak=Math.max(bestStreak,longest); if(!habit.history) habit.history=[]; let historyDots=""; lastNDays(7).forEach(date=>{ const done=habit.history.includes(date); historyDots += `<span class="dot${done?' done':''}${date===today?' today':''}" title="${date}"></span>`;}); const isDone=habit.doneToday; if(isDone) doneTodayCount++; list.innerHTML += `<div class="habit-item"><span><b>${habit.name}</b><span class="habit-meta">${t["streak"]}${streak} ${t["longest"]}${longest}</span><span class="habit-history">${historyDots}</span></span><button class="btn btn-outline-${isDone?'secondary':'success'} btn-sm habit-btn" onclick="markDone(${idx})" ${isDone?'disabled':''}>${isDone? t["done-today"]: t["mark-done"]}</button><button class="archive-btn${habit.archived?' archived':''}" onclick="archiveHabit(${idx})">${habit.archived? t["unarchive"]: t["archive"]}</button><button class="btn btn-outline-danger btn-sm habit-btn" onclick="deleteHabit(${idx})"><i class="fa fa-trash"></i> ${t["delete"]}</button></div>`;});
      renderStats(activeCount, doneTodayCount, bestStreak); renderBanner(activeCount, doneTodayCount);
    }
    function renderStats(tracked, done, best){ const t=habitTranslations[getLang()]; document.getElementById("stats-bar").innerHTML = `${t["stats-tracked"]}${tracked} &bull; ${t["stats-done"]}${done} &bull; ${t["stats-best"]}${best}`; }
    function renderBanner(tracked, done){ const t=habitTranslations[getLang()]; const banner=document.getElementById("banner"); if(tracked>0 && done===tracked){ banner.textContent = t["banner-all-done"]; banner.style.display="block"; } else { banner.style.display="none"; } }

    document.getElementById('habitForm').addEventListener('submit', function(e){ e.preventDefault(); const name=document.getElementById('habitInput').value.trim(); if(!name) return; habits.push({ name, streak:0, longest:0, doneToday:false, lastChecked:getTodayStr(), history:[], archived:false }); saveHabits(); document.getElementById('habitInput').value=''; renderHabits(); });

    window.markDone=function(idx){ const today=getTodayStr(); if(!habits[idx].doneToday){ habits[idx].doneToday=true; habits[idx].lastChecked=today; habits[idx].streak=(habits[idx].streak||0)+1; habits[idx].longest=Math.max(habits[idx].longest||0,habits[idx].streak); if(!habits[idx].history) habits[idx].history=[]; if(!habits[idx].history.includes(today)) habits[idx].history.push(today); saveHabits(); renderHabits(); } }
    window.archiveHabit=function(idx){ habits[idx].archived=!habits[idx].archived; saveHabits(); renderHabits(); }
    window.deleteHabit=function(idx){ habits.splice(idx,1); saveHabits(); renderHabits(); }

    window.addEventListener('storage', function(e){ if(e.key==='timerhavenLang'){ const lang=(e.newValue||getLang()).slice(0,2); applyLanguage(lang); }});
    function getLang(){ try{ const l=localStorage.getItem('timerhavenLang')||'es'; return (l && l.slice(0,2))||'es'; }catch(e){ return 'es'; } }
    function applyLanguage(lang){ lang=(lang||getLang()).slice(0,2); const t = habitTranslations[lang] || habitTranslations['es']; document.body.dir = (lang==="ar") ? "rtl" : "ltr"; const back=document.getElementById('back-link'); if(back) back.textContent=t['back-link']; const toolTitle=document.getElementById('tool-title'); if(toolTitle) toolTitle.innerHTML=`<i class="fa fa-check-double"></i> ${t['tool-title']}`; const input=document.getElementById('habitInput'); if(input) input.placeholder=t['habitInput']; const addBtn=document.getElementById('add-btn'); if(addBtn) addBtn.textContent=t['add-btn']; const faqTitle=document.getElementById('faq-title'); if(faqTitle) faqTitle.textContent=t['faq-title']; const faqList=document.getElementById('faq-list'); if(faqList) faqList.innerHTML=t['faq-list']; const howtoTitle=document.getElementById('howto-title'); if(howtoTitle) howtoTitle.innerHTML=t['howto-title']; const howtoSteps=document.getElementById('howto-steps'); if(howtoSteps) howtoSteps.innerHTML=t['howto-steps']; const howtoBtn=document.getElementById('howto-article-btn'); if(howtoBtn){ howtoBtn.textContent=t['howto-article-btn']; howtoBtn.href=t['howto-article-link']; } const tipsTitle=document.getElementById('tips-title'); if(tipsTitle) tipsTitle.innerHTML=t['tips-title']; const tipsList=document.getElementById('tips-list'); if(tipsList) tipsList.innerHTML=t['tips-list']; const tipsBtn=document.getElementById('tips-article-btn'); if(tipsBtn){ tipsBtn.textContent=t['tips-article-btn']; tipsBtn.href=t['tips-article-link']; } renderHabits(); }

    document.addEventListener('DOMContentLoaded', function(){ applyLanguage(getLang()); renderHabits(); });
  </script>

</body>
</html>
