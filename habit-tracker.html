    body { background: #f4f7fb; font-family: 'Montserrat', Arial, sans-serif; }

    .article-card, .tool-card {

      border-radius: 16px;
      box-shadow: 0 2px 12px #e0e7ef;
      width: 340px;
      min-width: 220px;
      max-width: 340px;
      min-height: 500px;
      flex: 1 1 340px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      padding: 2em 1.3em 1em 1.3em;
      margin: 0;
      box-sizing: border-box;
      text-align: left;
      overflow: hidden;
    }
    .tool-card {
      max-width: 410px;
      min-width: 240px;
      padding: 2em 1.5em 1em 1.5em;
      position: relative;
      z-index: 1;
    }
    .tool-card h3 { font-size: 1.45em; font-weight: 700; margin-bottom: 0.1em; }
    .article-card h2, .tool-card h3 {

      font-weight: 700;
      margin-bottom: 0.4em;
      display: flex;
      align-items: center;
      gap: 0.3em;
    }

    .back-link:hover { text-decoration: underline; }
    .faq-section { margin-top: 1.1em; margin-bottom: 0.3em; font-size: 1em; background: #f7fafc; border-radius: 8px; padding: 1em; box-shadow: 0 1px 4px #e0e7ef; }
    .faq-section summary { font-weight: bold; font-size: 1.07em; cursor: pointer; margin-bottom: 0.5em; }
    .tip-section { margin-top: 0.5em; text-align: center; font-size: 1.08em; color: #43cea2; background: #f6fbfa; padding: 0.6em; border-radius: 8px; font-weight: 500; min-height: 2em; word-break: break-word; }

    details:not([open]) summary::after { content: " ▼"; font-size: 0.9em; }

    .tips-mobile { margin-top: 1.5em; margin-bottom: 0.5em; }

</head>

    function getTodayStr() {
      const d = new Date();
      return d.getFullYear() + "-" + (d.getMonth()+1).toString().padStart(2,"0") + "-" + d.getDate().toString().padStart(2,"0");
    }
    function lastNDays(n) {
      const arr = [];
      for (let i = n-1; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        arr.push(d.getFullYear() + "-" + (d.getMonth()+1).toString().padStart(2,"0") + "-" + d.getDate().toString().padStart(2,"0"));
      }
      return arr;
    }
    let habits = JSON.parse(localStorage.getItem('habits') || '[]');
    function resetHabitsIfNeeded() {
      const today = getTodayStr();
      let changed = false;
      habits.forEach(habit => {
        if (!habit.history) habit.history = [];
        if (habit.lastChecked !== today) {
          habit.doneToday = false;
          habit.lastChecked = today;
          changed = true;
        }
      });
      if (changed) saveHabits();
    }
    function saveHabits() { localStorage.setItem('habits', JSON.stringify(habits)); }
    function renderHabits() {
      resetHabitsIfNeeded();
      const lang = document.getElementById("habit-lang-select").value;
      const list = document.getElementById('habitList');
      list.innerHTML = '';
      const today = getTodayStr();
      let doneTodayCount = 0;
      let bestStreak = 0;
      let activeCount = 0;
      habits.forEach(h => { if (!h.archived) activeCount++; });
      if (habits.length === 0 || activeCount === 0) {
        list.innerHTML = `<div style="color:#888;">${habitTranslations[lang]["no-habits"] || habitTranslations["en"]["no-habits"]}</div>`;
      }
      habits.forEach((habit, idx) => {
        if (habit.archived) return;
        let streak = habit.streak || 0;
        let longest = habit.longest || streak;
        bestStreak = Math.max(bestStreak, longest);
        if (!habit.history) habit.history = [];
        let historyDots = "";
        lastNDays(7).forEach((date, i) => {
          const done = habit.history.includes(date);
          historyDots += `<span class="dot${done ? ' done' : ''}${date === today ? ' today' : ''}" title="${date}"></span>`;
        });
        const isDone = habit.doneToday;
        if (isDone) doneTodayCount++;
        list.innerHTML += `
          <div class="habit-item">
            <span><b>${habit.name}</b>
              <span class="habit-meta">${habitTranslations[lang]["streak"]}${streak} ${habitTranslations[lang]["longest"]}${longest}</span>
              <span class="habit-history">${historyDots}</span>
            </span>
            <button class="btn btn-outline-${isDone ? 'secondary' : 'success'} btn-sm habit-btn" onclick="markDone(${idx})" ${isDone ? 'disabled' : ''}>
              ${isDone ? habitTranslations[lang]["done-today"] : habitTranslations[lang]["mark-done"]}
            </button>
            <button class="archive-btn${habit.archived ? ' archived' : ''}" onclick="archiveHabit(${idx})">
              ${habit.archived ? habitTranslations[lang]["unarchive"] : habitTranslations[lang]["archive"]}
            </button>
            <button class="btn btn-outline-danger btn-sm habit-btn" onclick="deleteHabit(${idx})"><i class="fa fa-trash"></i> ${habitTranslations[lang]["delete"]}</button>
          </div>
        `;
      });
      renderStats(activeCount, doneTodayCount, bestStreak);
      renderBanner(activeCount, doneTodayCount);
    }
    function renderStats(tracked, done, best) {
      const lang = document.getElementById("habit-lang-select").value;
      document.getElementById("stats-bar").innerHTML =
        `${habitTranslations[lang]["stats-tracked"]}${tracked} &bull; ${habitTranslations[lang]["stats-done"]}${done} &bull; ${habitTranslations[lang]["stats-best"]}${best}`;
    }
    function renderBanner(tracked, done) {
      const lang = document.getElementById("habit-lang-select").value;
      const banner = document.getElementById("banner");
      if (tracked > 0 && done === tracked) {
        banner.textContent = habitTranslations[lang]["banner-all-done"] || habitTranslations["en"]["banner-all-done"];
        banner.style.display = "block";
      } else {
        banner.style.display = "none";
      }
    }
    document.getElementById('habitForm').addEventListener('submit', function(e){
      e.preventDefault();
      const lang = document.getElementById("habit-lang-select").value;
      const name = document.getElementById('habitInput').value.trim();
      if (!name) return;
      habits.push({
        name,
        streak: 0,
        longest: 0,
        doneToday: false,
        lastChecked: getTodayStr(),
        history: [],
        archived: false
      });
      saveHabits();
      document.getElementById('habitInput').value = "";
      renderHabits();
    });
    window.markDone = function(idx){
      const lang = document.getElementById("habit-lang-select").value;
      const today = getTodayStr();
      if (!habits[idx].doneToday) {
        habits[idx].doneToday = true;
        habits[idx].lastChecked = today;
        habits[idx].streak = (habits[idx].streak || 0) + 1;
        habits[idx].longest = Math.max(habits[idx].longest || 0, habits[idx].streak);
        if (!habits[idx].history) habits[idx].history = [];
        if (!habits[idx].history.includes(today)) habits[idx].history.push(today);
        saveHabits();
        renderHabits();
      }
    }
    window.archiveHabit = function(idx){
      habits[idx].archived = !habits[idx].archived;
      saveHabits();
      renderHabits();
    }
    window.deleteHabit = function(idx){
      habits.splice(idx, 1);
      saveHabits();
      renderHabits();
    }
    function updateHabitLanguage() {
      const lang = document.getElementById("habit-lang-select").value;
      document.body.dir = (lang === "ar") ? "rtl" : "ltr";
      document.getElementById("language-label").textContent = habitTranslations[lang]["language-label"];
      document.getElementById("back-link").textContent = habitTranslations[lang]["back-link"];
      document.getElementById("tool-title").innerHTML = `<i class="fa fa-check-double"></i> ${habitTranslations[lang]["tool-title"]}`;
      document.getElementById("habitInput").placeholder = habitTranslations[lang]["habitInput"];
      document.getElementById("add-btn").textContent = habitTranslations[lang]["add-btn"];
      document.getElementById("faq-title").textContent = habitTranslations[lang]["faq-title"];
      document.getElementById("faq-list").innerHTML = habitTranslations[lang]["faq-list"];
      document.getElementById("howto-title").innerHTML = habitTranslations[lang]["howto-title"];
      document.getElementById("howto-steps").innerHTML = habitTranslations[lang]["howto-steps"];
      document.getElementById("howto-article-btn").textContent = habitTranslations[lang]["howto-article-btn"];
      document.getElementById("howto-article-btn").href = habitTranslations[lang]["howto-article-link"];
      document.getElementById("tips-title").innerHTML = habitTranslations[lang]["tips-title"];
      document.getElementById("tips-list").innerHTML = habitTranslations[lang]["tips-list"];
      document.getElementById("tips-article-btn").textContent = habitTranslations[lang]["tips-article-btn"];
      document.getElementById("tips-article-btn").href = habitTranslations[lang]["tips-article-link"];
      document.getElementById("tips-mobile-title").innerHTML = habitTranslations[lang]["tips-mobile-title"];
      document.getElementById("tips-mobile-list").innerHTML = habitTranslations[lang]["tips-mobile-list"];
      renderHabits();
    }
    document.getElementById("habit-lang-select").addEventListener("change", function() {
      localStorage.setItem('habitLang', this.value);
      updateHabitLanguage();
    });
    document.addEventListener("DOMContentLoaded", function() {
      const savedLang = localStorage.getItem('habitLang') || 'en';
      document.getElementById('habit-lang-select').value = savedLang;
      updateHabitLanguage();
    });
  </script>
