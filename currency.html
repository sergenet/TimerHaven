<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Currency Converter — TimerHaven</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Convert currencies using live exchange rates.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body { background: #f4f7fb; font-family: 'Montserrat', Arial, sans-serif; }
    .main-container { max-width: 1200px; margin: 2em auto; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
    .center-row { display: flex; flex-direction: row; justify-content: center; align-items: flex-start; gap: 2em; width: 100%; }

    /* Article cards: allow content to grow and ensure buttons stay inside.
       Cards are flex containers so we can equalize heights reliably. */
    .article-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px #e0e7ef;
      width: 330px;
      min-width: 200px;
      min-height: 340px;
      height: auto;
      display: flex;
      flex-direction: column;
      padding: 2em 1.3em 1.6em 1.3em; /* extra bottom padding to keep buttons inside */
      text-align: left;
      overflow: visible;
      box-sizing: border-box;
    }
    .article-card .card-inner { display:flex; flex-direction:column; flex:1 1 auto; }
    .article-card .card-content { flex:1 1 auto; }

    .article-card h2 { font-size: 1.35em; font-weight: 700; margin-bottom: 0.4em; display: flex; align-items: center; gap: 0.3em; word-break: break-word; line-height:1.15; }
    .article-card ul, .article-card ol { margin-left: 1em; font-size: 1em; margin-bottom: 0.2em; padding-right: 0.2em; word-break: break-word; }
    .article-card .btn { align-self: stretch; font-weight: 600; border-radius: 8px; margin-top: 0.8em; margin-bottom: 0; box-sizing: border-box; }

    .tool-card { background: #fff; border-radius: 16px; box-shadow: 0 2px 12px #e0e7ef; width: 410px; min-width: 240px; min-height: 330px; display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; padding: 2em 1.5em 1em 1.5em; text-align: left; position: relative; z-index: 1; box-sizing: border-box; }
    .tool-card .card-inner { display:flex; flex-direction:column; flex:1 1 auto; }
    .tool-card .card-content { flex:1 1 auto; }
    .tool-card h3 { font-size: 1.45em; font-weight: 700; margin-bottom: 0.1em; word-break:break-word; }

    .back-link { display: inline-block; margin-bottom: 1em; color: #007bff; text-decoration: none; font-weight: bold; font-size: 1em; }
    .back-link:hover { text-decoration: underline; }

    .faq-section { margin-top: 1.1em; margin-bottom: 0.3em; font-size: 1em; background: #f7fafc; border-radius: 8px; padding: 1em; box-shadow: 0 1px 4px #e0e7ef; }
    .faq-section summary { font-weight: bold; font-size: 1.07em; cursor: pointer; margin-bottom: 0.5em; }

    .converter-form { display: flex; gap: 0.6em; margin-bottom: 1em; flex-wrap: wrap; align-items: center; }
    .converter-form input[type="number"] {
      min-width: 120px; max-width: 160px; padding: 0.4rem 0.6rem; line-height: 1.25; box-sizing: border-box;
    }
    .converter-form .form-select { max-width: 140px; min-width: 110px; box-sizing: border-box; }
    .converter-result { font-weight: bold; font-size: 1.12em; margin-bottom: 1em; word-break: break-word; }

    @media (max-width: 1100px) { .main-container{padding:0 8px;} .center-row{gap:1em;} .tool-card,.article-card{width:97vw;max-width:540px;height:auto;} }
    @media (max-width: 800px) { .main-container{padding:0;} .center-row{flex-direction:column;align-items:center;} .tool-card,.article-card{width:98vw;max-width:540px;height:auto;} .article-card { display: none !important; } .howto-mobile, .tips-mobile { display: block !important; margin-bottom: 1em; } }
    @media (min-width: 801px) { .howto-mobile, .tips-mobile { display: none !important; } }

    /* ensure titles wrap */
    .article-card h2, .tool-card h3 { word-break: break-word; }

  </style>
</head>
<body>
  <div class="main-container">
    <div class="center-row" id="page-main">
      <!-- Article 1 (How-to) -->
      <div class="article-card" id="howto-article-card">
        <div class="card-inner">
          <div class="card-content">
            <h2 id="howto-title"></h2>
            <ol id="howto-steps"></ol>
          </div>
          <div class="card-actions">
            <a href="#" class="btn btn-outline-primary btn-sm" id="howto-article-btn"></a>
          </div>
        </div>
      </div>

      <!-- Tool card (center) -->
      <div class="tool-card" id="tool-card">
        <div class="card-inner">
          <details class="howto-mobile" id="howto-mobile">
            <summary><h4 style="color:#185a9d;display:inline;" id="howto-mobile-title"></h4></summary>
            <ol id="howto-mobile-steps"></ol>
          </details>
          <a href="index.html" class="back-link" id="back-link"></a>
          <h3 id="tool-title"></h3>
          <div class="tool-help" id="tool-help"></div>
          <div class="converter-section">
            <form class="converter-form" id="currencyForm">
              <input type="number" min="0" step="any" id="amount" class="form-control" placeholder="">
              <select id="fromCurrency" class="form-select"></select>
              <span style="font-size:1.3em;">→</span>
              <select id="toCurrency" class="form-select"></select>
              <button type="submit" class="btn btn-primary btn-sm" id="convert-btn"></button>
            </form>
            <div id="result" class="converter-result"></div>
          </div>
          <details class="faq-section">
            <summary id="faq-title"></summary>
            <ul id="faq-list" style="padding-left: 1em;"></ul>
          </details>
          <details class="tips-mobile" id="tips-mobile">
            <summary><h4 style="color:#185a9d;display:inline;" id="tips-mobile-title"></h4></summary>
            <ul id="tips-mobile-list"></ul>
          </details>
        </div>
      </div>

      <!-- Article 2 (Tips) -->
      <div class="article-card" id="tips-article-card">
        <div class="card-inner">
          <div class="card-content">
            <h2 id="tips-title"></h2>
            <ul id="tips-list"></ul>
          </div>
          <div class="card-actions">
            <a href="#" class="btn btn-outline-primary btn-sm" id="tips-article-btn"></a>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // -- Translations (restored) --
    const apiKey = "5f484bfa921ef56c9c279660";
    const currencyList = ["USD","EUR","GBP","JPY","AUD","CAD","CHF","CNY","SEK","NZD","MXN","SGD","HKD","NOK","KRW","TRY","INR","RUB","BRL","ZAR"];

    const currencyTranslations = {
      en: {
        "back-link":"Back to Main Menu","tool-title":"Currency Converter","tool-help":"Convert currencies using live exchange rates.",
        "amount":"Amount","convert":"Convert","result-placeholder":"Converted amount will appear here.",
        "faq-title":"FAQs","faq-list":`<li><b>Are exchange rates live?</b> Yes, rates update regularly from the API.</li>
          <li><b>Can I convert between any currency?</b> Most global currencies are supported.</li>
          <li><b>Is this free?</b> Yes, all tools on TimerHaven are free.</li>`,
        "howto-title":'<i class="fa fa-dollar-sign"></i> How to Use Currency Converter',
        "howto-steps":`<li><b>Select currencies:</b> Choose the currencies you want to convert between.</li>
          <li><b>Enter amount:</b> Type the amount you want to convert.</li>
          <li><b>View result:</b> The converted amount shows instantly.</li>`,
        "howto-article-btn":"Read Full Article","howto-article-link":"currency-how-to.html",
        "tips-title":'<i class="fa fa-lightbulb" style="color:#43cea2;"></i> Currency Productivity Tips',
        "tips-list":`<li><b>Double-check rates:</b> For large transfers, confirm rates with your bank.</li>
          <li><b>Keep a history:</b> Record conversions for budgeting.</li>
          <li><b>Use for travel:</b> Convert local prices on the go.</li>`,
        "tips-article-btn":"Read Full Article","tips-article-link":"currency-tips.html"
      },
      fr: {
        "back-link":"Retour au menu principal","tool-title":"Convertisseur de devises","tool-help":"Convertissez les devises en utilisant les taux de change en temps réel.",
        "amount":"Montant","convert":"Convertir","result-placeholder":"Le montant converti s'affichera ici.",
        "faq-title":"FAQ","faq-list":`<li><b>Les taux de change sont-ils en direct ?</b> Oui, ils sont mis à jour régulièrement.</li>
          <li><b>Puis-je convertir entre n'importe quelle devise ?</b> La plupart des devises mondiales sont disponibles.</li>
          <li><b>Est-ce gratuit ?</b> Oui, tous les outils TimerHaven sont gratuits.</li>`,
        "howto-title":'<i class="fa fa-dollar-sign"></i> Comment utiliser le Convertisseur de devises',
        "howto-steps":`<li><b>Sélectionnez les devises :</b> Choisissez les devises à convertir.</li>
          <li><b>Entrez le montant :</b> Saisissez le montant à convertir.</li>
          <li><b>Voir le résultat :</b> Le montant converti s'affiche instantanément.</li>`,
        "howto-article-btn":"Lire l'article complet","howto-article-link":"currency-how-to-fr.html",
        "tips-title":'<i class="fa fa-lightbulb" style="color:#43cea2;"></i> Conseils pour la conversion de devises',
        "tips-list":`<li><b>Vérifiez les taux :</b> Pour de gros transferts, confirmez auprès de votre banque.</li>
          <li><b>Gardez un historique :</b> Notez vos conversions pour votre budget.</li>
          <li><b>Utilisez en voyage :</b> Convertissez les prix locaux facilement.</li>`,
        "tips-article-btn":"Lire l'article complet","tips-article-link":"currency-tips-fr.html"
      },
      es: {
        "back-link":"Volver al menú principal","tool-title":"Conversor de monedas","tool-help":"Convierte monedas con tasas en tiempo real.",
        "amount":"Cantidad","convert":"Convertir","result-placeholder":"El resultado aparece aquí.",
        "faq-title":"Preguntas frecuentes","faq-list":`<li><b>¿Las tasas son en tiempo real?</b> Sí, se actualizan regularmente.</li>
          <li><b>¿Puedo convertir cualquier moneda?</b> La mayoría de monedas están disponibles.</li>
          <li><b>¿Es gratis?</b> Sí, todas las herramientas son gratuitas.</li>`,
        "howto-title":'<i class="fa fa-dollar-sign"></i> Cómo usar el Conversor de monedas',
        "howto-steps":`<li><b>Selecciona monedas:</b> Elige las monedas a convertir.</li>
          <li><b>Introduce cantidad:</b> Escribe la cantidad a convertir.</li>
          <li><b>Ver resultado:</b> El resultado aparece al instante.</li>`,
        "howto-article-btn":"Leer artículo completo","howto-article-link":"currency-how-to-es.html",
        "tips-title":'<i class="fa fa-lightbulb" style="color:#43cea2;"></i> Consejos para convertir monedas',
        "tips-list":`<li><b>Verifica las tasas:</b> Para grandes transferencias, consulta el banco.</li>
          <li><b>Mantén un historial:</b> Guarda tus conversiones para controlar gastos.</li>
          <li><b>Usa en viajes:</b> Convierte precios locales rápidamente.</li>`,
        "tips-article-btn":"Leer artículo completo","tips-article-link":"currency-tips-es.html"
      },
      el: {
        "back-link":"Επιστροφή στο κύριο μενού","tool-title":"Μετατροπέας Νομισμάτων","tool-help":"Μετατρέψτε νομίσματα με live ισοτιμίες.",
        "amount":"Ποσό","convert":"Μετατροπή","result-placeholder":"Το αποτέλεσμα εμφανίζεται εδώ.",
        "faq-title":"Συχνές Ερωτήσεις","faq-list":`<li><b>Οι ισοτιμίες είναι σε πραγματικό χρόνο;</b> Ναι, ενημερώνονται τακτικά.</li>
          <li><b>Μπορώ να μετατρέψω οποιοδήποτε νόμισμα;</b> Τα πιο δημοφιλή είναι διαθέσιμα.</li>
          <li><b>Είναι δωρεάν;</b> Ναι, όλα τα εργαλεία είναι δωρεάν.</li>`,
        "howto-title":'<i class="fa fa-dollar-sign"></i> Πώς να χρησιμοποιήσετε τον Μετατροπέα Νομισμάτων',
        "howto-steps":`<li><b>Επιλέξτε νομίσματα:</b> Διαλέξτε αυτά που θέλετε να μετατρέψετε.</li>
          <li><b>Εισάγετε ποσό:</b> Γράψτε το ποσό για μετατροπή.</li>
          <li><b>Δείτε το αποτέλεσμα:</b> Το αποτέλεσμα εμφανίζεται άμεσα.</li>`,
        "howto-article-btn":"Διαβάστε το πλήρες άρθρο","howto-article-link":"currency-how-to-el.html",
        "tips-title":'<i class="fa fa-lightbulb" style="color:#43cea2;"></i> Συμβουλές για μετατροπή νομισμάτων',
        "tips-list":`<li><b>Ελέγξτε τις ισοτιμίες:</b> Για μεγάλες μεταφορές, επιβεβαιώστε με την τράπεζα.</li>
          <li><b>Κρατήστε ιστορικό:</b> Σημειώστε τις μετατροπές για τον προϋπολογισμό.</li>
          <li><b>Ιδανικό για ταξίδια:</b> Μετατρέψτε τιμές γρήγορα.</li>`,
        "tips-article-btn":"Διαβάστε το πλήρες άρθρο","tips-article-link":"currency-tips-el.html"
      }
    };

    function populateCurrencySelects() {
      const from = document.getElementById('fromCurrency');
      const to = document.getElementById('toCurrency');
      from.innerHTML = '';
      to.innerHTML = '';
      currencyList.forEach(cur => {
        from.innerHTML += `<option value="${cur}">${cur}</option>`;
        to.innerHTML += `<option value="${cur}">${cur}</option>`;
      });
      from.value = "USD";
      to.value = "EUR";
    }
    populateCurrencySelects();

    function getLang() {
      try {
        const l = localStorage.getItem('timerhavenLang') || 'en';
        return (l && l.slice(0,2)) || 'en';
      } catch (e) {
        return 'en';
      }
    }

    function applyLanguage(lang) {
      lang = (lang || getLang()).slice(0,2);
      const t = currencyTranslations[lang] || currencyTranslations['en'];

      document.body.dir = (lang === 'ar') ? 'rtl' : 'ltr';

      const back = document.getElementById('back-link');
      if (back) back.textContent = t['back-link'] || '';

      const toolTitle = document.getElementById('tool-title');
      if (toolTitle) toolTitle.innerHTML = `<i class="fa fa-dollar-sign"></i> ${t['tool-title'] || ''}`;

      const help = document.getElementById('tool-help');
      if (help) help.textContent = t['tool-help'] || '';

      const amount = document.getElementById('amount');
      if (amount) amount.placeholder = t['amount'] || '';

      const convertBtn = document.getElementById('convert-btn');
      if (convertBtn) convertBtn.textContent = t['convert'] || 'Convert';

      const resultEl = document.getElementById('result');
      if (resultEl) resultEl.textContent = t['result-placeholder'] || '';

      const faqTitle = document.getElementById('faq-title');
      if (faqTitle) faqTitle.textContent = t['faq-title'] || '';
      const faqList = document.getElementById('faq-list');
      if (faqList) faqList.innerHTML = t['faq-list'] || '';

      const howtoTitle = document.getElementById('howto-title');
      const howtoSteps = document.getElementById('howto-steps');
      if (howtoTitle) howtoTitle.innerHTML = t['howto-title'] || '';
      if (howtoSteps) howtoSteps.innerHTML = t['howto-steps'] || '';

      const howtoBtn = document.getElementById('howto-article-btn');
      if (howtoBtn) { howtoBtn.textContent = t['howto-article-btn'] || ''; howtoBtn.href = t['howto-article-link'] || '#'; }

      const tipsTitle = document.getElementById('tips-title');
      const tipsList = document.getElementById('tips-list');
      const tipsBtn = document.getElementById('tips-article-btn');
      if (tipsTitle) tipsTitle.innerHTML = t['tips-title'] || '';
      if (tipsList) tipsList.innerHTML = t['tips-list'] || '';
      if (tipsBtn) { tipsBtn.textContent = t['tips-article-btn'] || ''; tipsBtn.href = t['tips-article-link'] || '#'; }

      const howtoMobileTitle = document.getElementById('howto-mobile-title');
      const howtoMobileSteps = document.getElementById('howto-mobile-steps');
      const tipsMobileTitle = document.getElementById('tips-mobile-title');
      const tipsMobileList = document.getElementById('tips-mobile-list');
      if (howtoMobileTitle) howtoMobileTitle.innerHTML = t['howto-title'] || '';
      if (howtoMobileSteps) howtoMobileSteps.innerHTML = t['howto-steps'] || '';
      if (tipsMobileTitle) tipsMobileTitle.innerHTML = t['tips-title'] || '';
      if (tipsMobileList) tipsMobileList.innerHTML = t['tips-list'] || '';

      // After language/apply, equalize left/right cards (how-to and tips).
      // Use a short delay to allow DOM reflow and font load.
      setTimeout(equalizeHowToAndTips, 60);
      setTimeout(equalizeHowToAndTips, 220);
    }

    // Equalize heights for only the How-to and Tips article cards (left & right).
    function equalizeHowToAndTips(){
      const left = document.getElementById('howto-article-card');
      const right = document.getElementById('tips-article-card');
      if (!left || !right) return;
      // reset
      left.style.height = '';
      right.style.height = '';
      // measure
      const lh = Math.ceil(left.getBoundingClientRect().height);
      const rh = Math.ceil(right.getBoundingClientRect().height);
      const max = Math.max(lh, rh);
      if (max > 0) {
        left.style.height = max + 'px';
        right.style.height = max + 'px';
      }
    }

    // React to language changes from other tabs
    window.addEventListener('storage', function(e) {
      if (e.key === 'timerhavenLang') {
        applyLanguage((e.newValue || 'en').slice(0,2));
      }
    });

    // Fallback observers to re-run equalization for dynamic content changes (e.g., translations)
    (function(){
      const container = document.getElementById('page-main');
      if (!container) return;
      const mo = new MutationObserver(() => {
        setTimeout(equalizeHowToAndTips, 80);
        setTimeout(equalizeHowToAndTips, 240);
      });
      mo.observe(container, { childList: true, subtree: true, characterData: true });
      window.addEventListener('resize', () => setTimeout(equalizeHowToAndTips, 80));
    })();

    // Currency select population & conversion logic (unchanged behavior)
    function populateCurrencySelects() {
      const from = document.getElementById('fromCurrency');
      const to = document.getElementById('toCurrency');
      from.innerHTML = '';
      to.innerHTML = '';
      currencyList.forEach(cur => {
        from.innerHTML += `<option value="${cur}">${cur}</option>`;
        to.innerHTML += `<option value="${cur}">${cur}</option>`;
      });
      from.value = "USD";
      to.value = "EUR";
    }
    populateCurrencySelects();

    function getLang() {
      try { const l = localStorage.getItem('timerhavenLang') || 'en'; return (l && l.slice(0,2)) || 'en'; } catch(e){ return 'en'; }
    }

    // Conversion form handler
    document.getElementById('currencyForm').addEventListener('submit', function(e){
      e.preventDefault();
      const amountVal = parseFloat(document.getElementById('amount').value);
      const fromCur = document.getElementById('fromCurrency').value;
      const toCur = document.getElementById('toCurrency').value;
      const lang = getLang();
      const t = currencyTranslations[lang] || currencyTranslations['en'];

      if (isNaN(amountVal) || amountVal <= 0) {
        document.getElementById('result').innerText = t['amount-error'] || ((lang === "ar") ? "يرجى إدخال مبلغ صحيح." : "Please enter a valid amount.");
        return;
      }

      document.getElementById('result').innerText = t['fetching'] || ((lang === "ar") ? "جارِ جلب السعر..." : "Fetching rate...");

      fetch(`https://v6.exchangerate-api.com/v6/${apiKey}/pair/${fromCur}/${toCur}/${amountVal}`)
        .then(r => r.json())
        .then(data => {
          if (data && typeof data.conversion_result !== 'undefined') {
            const conv = (Math.round((data.conversion_result + Number.EPSILON) * 100000) / 100000);
            const rate = (Math.round((data.conversion_rate + Number.EPSILON) * 100000) / 100000);
            document.getElementById('result').innerText = `${amountVal} ${fromCur} = ${conv} ${toCur} (Rate: ${rate})`;
          } else {
            document.getElementById('result').innerText = t['conversion-unavailable'] || ((lang === "ar") ? "التحويل غير متاح." : "Conversion not available.");
          }
        })
        .catch(() => {
          document.getElementById('result').innerText = t['fetch-error'] || ((lang === "ar") ? "تعذر جلب التحويل." : "Could not fetch conversion.");
        });
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', function(){
      // Remove the legacy language indicator element (defensive)
      try {
        const li = document.getElementById('language-indicator');
        if (li && li.parentNode) li.parentNode.removeChild(li);
      } catch(e){}

      applyLanguage(getLang());
      populateCurrencySelects();
      // ensure equalization after everything settles
      setTimeout(equalizeHowToAndTips, 120);
      setTimeout(equalizeHowToAndTips, 420);
    });
  </script>
