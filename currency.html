    function populateCurrencySelects() {
      const from = document.getElementById('fromCurrency');
      const to = document.getElementById('toCurrency');
      from.innerHTML = '';
      to.innerHTML = '';
      currencyList.forEach(cur => {
        from.innerHTML += `<option value="${cur}">${cur}</option>`;
        to.innerHTML += `<option value="${cur}">${cur}</option>`;
      });
      from.value = "USD";
      to.value = "EUR";
    }
    populateCurrencySelects();

    function updateDropdownDirection() {
      const lang = document.getElementById("currency-lang-select").value;
      document.querySelector('.language-select').style.textAlign = (lang === "ar") ? "left" : "right";
    }

    function updateCurrencyLanguage() {

      document.getElementById("howto-title").innerHTML = currencyTranslations[lang]["howto-title"];
      document.getElementById("howto-steps").innerHTML = currencyTranslations[lang]["howto-steps"];
      document.getElementById("howto-article-btn").textContent = currencyTranslations[lang]["howto-article-btn"];
      document.getElementById("howto-article-btn").href = currencyTranslations[lang]["howto-article-link"];
      document.getElementById("tips-title").innerHTML = currencyTranslations[lang]["tips-title"];
      document.getElementById("tips-list").innerHTML = currencyTranslations[lang]["tips-list"];
      document.getElementById("tips-article-btn").textContent = currencyTranslations[lang]["tips-article-btn"];
      document.getElementById("tips-article-btn").href = currencyTranslations[lang]["tips-article-link"];
      // Mobile
      document.getElementById("howto-mobile-title").innerHTML = currencyTranslations[lang]["howto-title"];
      document.getElementById("howto-mobile-steps").innerHTML = currencyTranslations[lang]["howto-steps"];
      document.getElementById("tips-mobile-title").innerHTML = currencyTranslations[lang]["tips-title"];
      document.getElementById("tips-mobile-list").innerHTML = currencyTranslations[lang]["tips-list"];
    }

    document.getElementById("currency-lang-select").addEventListener("change", function() {
      localStorage.setItem('currencyLang', this.value);
      updateCurrencyLanguage();
    });

    document.addEventListener("DOMContentLoaded", function() {
      const savedLang = localStorage.getItem('currencyLang') || 'en';
      document.getElementById('currency-lang-select').value = savedLang;
      updateCurrencyLanguage();
    });

    document.getElementById('currencyForm').addEventListener('submit', function(e){
      e.preventDefault();
      const amount = parseFloat(document.getElementById('amount').value);
      const fromCur = document.getElementById('fromCurrency').value;
      const toCur = document.getElementById('toCurrency').value;
      const lang = document.getElementById("currency-lang-select").value;
      if (isNaN(amount) || amount <= 0) {
        document.getElementById('result').innerText = (lang === "ar") ? "يرجى إدخال مبلغ صحيح." : "Please enter a valid amount.";
        return;
      }
      document.getElementById('result').innerText = (lang === "ar") ? "جار جلب السعر..." : "Fetching rate...";
      fetch(`https://v6.exchangerate-api.com/v6/${apiKey}/pair/${fromCur}/${toCur}/${amount}`)
        .then(r => r.json())
        .then(data => {
          if (data && data.conversion_result) {
            document.getElementById('result').innerText = `${amount} ${fromCur} = ${data.conversion_result} ${toCur} (Rate: ${data.conversion_rate})`;
          } else {
            document.getElementById('result').innerText = (lang === "ar") ? "التحويل غير متاح." : "Conversion not available.";
          }
        })
        .catch(() => {
          document.getElementById('result').innerText = (lang === "ar") ? "تعذر جلب التحويل." : "Could not fetch conversion.";
        });
    });
  </script>
