        pauseBtn: '<i class="fa fa-pause"></i> إيقاف مؤقت',
        resetBtn: '<i class="fa fa-refresh"></i> إعادة ضبط',
        faqTitle: "الأسئلة الشائعة",
        faqList: [
          "<b>هل يمكنني ضبط مدة مخصصة?</b> نعم، اختر أي فترة زمنية.",
          "<b>هل سيستمر المؤقت؟</b> لا، يتم إعادة ضبطه بعد إعادة تحميل الصفحة.",
          "<b>هل هذا مجاني؟</b> نعم، جميع أدوات TimerHaven مجانية."
        ],
        tipSection: '<i class="fa fa-bookmark"></i> <b>ضع إشارة مرجعية:</b> اضغط <b>Ctrl+D</b> (<b>Cmd+D</b> على Mac)!',
        tipsTitle: '<i class="fa fa-lightbulb" style="color:#43cea2;"></i> نصائح المؤقت',
        tipsLink: "اقرأ المقال الكامل",
        tipsList: [
          "<b>استخدم للاستراحات:</b> حدد وقت فترات الراحة.",
          "<b>تتبع الجلسات:</b> راقب مدة كل مهمة.",
          "<b>أعد التشغيل:</b> أعد الضبط بين الأنشطة للحصول على سجلات دقيقة."
        ],
        tipsMobileTitle: '<i class="fa fa-lightbulb" style="color:#43cea2;"></i> نصائح',
        alertEnd: "انتهى الوقت!"
      }
    };

    const langNames = { en: "English", fr: "Français", es: "Español", de: "Deutsch", ru: "Русский", el: "Ελληνικά", ar: "العربية" };

    function getLang() {
      try {
        const l = localStorage.getItem('timerhavenLang') || 'en';
        return (l && l.slice(0,2)) || 'en';
      } catch (e) {
        return 'en';
      }
    }

    function applyLanguage(lang) {
      lang = (lang || getLang()).slice(0,2);
      const t = translations[lang] || translations['en'];

      // RTL support
      document.documentElement.lang = lang;
      document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';

      // language indicator
      const labelEl = document.getElementById('language-label');
      const nameEl = document.getElementById('language-name');
      if (labelEl) labelEl.textContent = t['language-label'] || 'Language:';
      if (nameEl) nameEl.textContent = langNames[lang] || lang;

      // Article 1 (left)
      document.getElementById('howto-title').innerHTML = t.howtoTitle || '';
      document.getElementById('howto-steps').innerHTML = (t.howtoSteps || []).map(s => `<li>${s}</li>`).join('');
      document.getElementById('howto-link').textContent = t.howtoLink || '';
      document.getElementById('howto-link').href = (lang === 'en') ? 'timer-how-to.html' : `timer-how-to-${lang}.html`;

      // How-to mobile
      document.getElementById('howto-mobile-title').innerHTML = t.howtoMobileTitle || '';
      document.getElementById('howto-mobile-steps').innerHTML = (t.howtoSteps || []).map(s => `<li>${s}</li>`).join('');

      // Back link and tool title
      document.getElementById('back-link').innerHTML = t.backLink || '';
      document.getElementById('tool-title').innerHTML = t.toolTitle || '';

      // Form labels
      document.getElementById('minutes-label').innerHTML = t.minutesLabel || '';
      document.getElementById('seconds-label').innerHTML = t.secondsLabel || '';

      // Buttons
      document.getElementById('startBtn').innerHTML = t.startBtn || '';
      document.getElementById('pauseBtn').innerHTML = t.pauseBtn || '';
      document.getElementById('resetBtn').innerHTML = t.resetBtn || '';

      // FAQ
      document.getElementById('faq-title').textContent = t.faqTitle || '';
      document.getElementById('faq-list').innerHTML = (t.faqList || []).map(s => `<li>${s}</li>`).join('');

      // Tip section
      document.getElementById('tip-section').innerHTML = t.tipSection || '';

      // Tips mobile
      document.getElementById('tips-mobile-title').innerHTML = t.tipsMobileTitle || '';
      document.getElementById('tips-mobile-list').innerHTML = (t.tipsList || []).map(s => `<li>${s}</li>`).join('');

      // Article 2 (right)
      document.getElementById('tips-title').innerHTML = t.tipsTitle || '';
      document.getElementById('tips-list').innerHTML = (t.tipsList || []).map(s => `<li>${s}</li>`).join('');
      document.getElementById('tips-link').textContent = t.tipsLink || '';
      document.getElementById('tips-link').href = (lang === 'en') ? 'timer-tips.html' : `timer-tips-${lang}.html`;
    }

    // listen for main-menu language changes
    window.addEventListener('storage', function(e) {
      if (e.key === 'timerhavenLang') {
        applyLanguage((e.newValue || 'en').slice(0,2));
      }
    });

    // initialize after DOM is ready
    document.addEventListener('DOMContentLoaded', function() {
      // apply language from main site
      applyLanguage(getLang());
    });

    // Task Timer logic
    let timer = null;
    let totalSeconds = 25*60;
    let running = false;

    function updateTimerDisplay() {
      const min = Math.floor(totalSeconds/60);
      const sec = totalSeconds % 60;
      document.getElementById('timerDisplay').textContent =
        String(min).padStart(2,'0')+":"+String(sec).padStart(2,'0');
    }

    function setTimerLengths() {
      const min = parseInt(document.getElementById('minutes').value,10) || 0;
      const sec = parseInt(document.getElementById('seconds').value,10) || 0;
      totalSeconds = min*60 + sec;
      updateTimerDisplay();
    }

    document.getElementById('minutes').addEventListener('change', setTimerLengths);
    document.getElementById('seconds').addEventListener('change', setTimerLengths);

    document.getElementById('startBtn').onclick = function() {
      if(running) return;
      running = true;
      timer = setInterval(function(){
        if(totalSeconds>0){
          totalSeconds--;
          updateTimerDisplay();
        } else {
          clearInterval(timer);
          running = false;
          const lang = getLang();
          const t = translations[lang] || translations['en'];
          try { alert(t.alertEnd || "Time's up!"); } catch(e){}
        }
      },1000);
    };

    document.getElementById('pauseBtn').onclick = function() {
      if(timer) clearInterval(timer);
      running = false;
    };

    document.getElementById('resetBtn').onclick = function() {
      if(timer) clearInterval(timer);
      running = false;
      setTimerLengths();
    };

    setTimerLengths();
  </script>
