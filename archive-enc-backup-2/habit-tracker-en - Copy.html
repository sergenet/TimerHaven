    body { background: #f4f7fb; font-family: 'Montserrat', Arial, sans-serif; color:var(--text-dark,#102a43); }
    .main-container { max-width:1200px; margin:2rem auto; padding:0 1rem; display:flex; justify-content:center; align-items:flex-start; min-height:90vh; box-sizing:border-box; }
    .tool-card { background:#fff; border-radius:16px; box-shadow:0 2px 12px rgba(0,0,0,0.06); width:420px; padding:1.6rem 1.5rem; box-sizing:border-box; }
    .back-link { display:inline-block; margin-bottom:.75rem; color:var(--brand,#0d6efd) !important; text-decoration:none; font-weight:700; }
    /* tool title restored to dark blue */
    .tool-title { font-size:1.35rem; margin:0 0 .4rem 0; display:flex; align-items:center; gap:.4rem; color:#185a9d; }
    .read-guide { display:inline-block; margin:.35rem 0 .8rem 0; padding:.45rem .7rem; border-radius:8px; background:var(--brand,#0d6efd) !important; color:#fff !important; text-decoration:none; font-weight:700; font-size:.95rem; border:none; }
    .stats-bar { background:#f6fbfa; border-radius:10px; margin-bottom:1.2rem; padding:.7rem 1rem; font-size:1.05rem; font-weight:600; color:#185a9d; display:flex; gap:2em; align-items:center; justify-content:space-between; }
    .habit-form { margin-bottom:1rem; display:flex; gap:.5rem; }
    .habit-list { margin-bottom:1rem; }
    .habit-item { background:#f7fafc; border-radius:7px; padding:.6rem .8rem; margin-bottom:.6rem; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    .dot { width:15px; height:15px; border-radius:50%; display:inline-block; background:#e0e7ef; border:1px solid #d0d0d0; margin-left:3px; }
    .dot.done { background:#43cea2; border:1.5px solid #185a9d; }
    .dot.today { border:2px solid #43cea2; }
    .archive-btn { font-size:.9em; margin-left:.6em; background:#fff; border:1px solid #43cea2; color:#43cea2; border-radius:6px; padding:.15rem .7rem; }
    .faq-section summary { cursor:pointer; padding:.2rem 0; font-weight:700; }
    .faq-section ul { margin-top:.5rem; color:var(--muted,#6b7c89); padding-left:1rem; }
    @media (max-width:900px) { .tool-card { width:98vw; padding:1rem; } }

<script>

<body>
  <main class="main-container" role="main">
    <section class="tool-card" aria-labelledby="tool-title">
      <a href="index.html" class="back-link" id="back-link" style="color:var(--brand,#0d6efd) !important;">← Back to Main Menu</a>

      <div id="tool-title" class="tool-title"><i class="fa fa-check-double"></i> Habit Tracker</div>

      <a id="read-guide-btn" class="read-guide" href="habit-how-to.html" role="button"
         style="background:var(--brand,#0d6efd) !important; border-color:var(--brand,#0d6efd) !important; color:#fff !important;">
        Read full guide
      </a>

      <div id="banner" class="banner" style="display:none;"></div>

      <div id="stats-bar" class="stats-bar">Tracked: 0 &bull; Done today: 0 &bull; Best streak: 0</div>

      <div class="habit-section">
        <form class="habit-form" id="habitForm">
          <input type="text" id="habitInput" class="form-control" placeholder="Habit name">
          <button type="submit" class="btn btn-success btn-sm" id="add-btn">Add Habit</button>
        </form>
        <div id="habitList" class="habit-list"></div>
      </div>

      <details class="faq-section">
        <summary id="faq-title">FAQs</summary>
        <ul id="faq-list" style="padding-left:1em;"></ul>
      </details>
    </section>
  </main>

  <script>
    const habitTranslations = {
  en: {
    "language-label": "Language:",
    "back-link": "← Back to Main Menu",
    "tool-title": "Habit Tracker",
    "habitInput": "Habit name",
    "add-btn": "Add Habit",
    "banner-all-done": "🎉 All habits done for today! Great job!",
    "stats-tracked": "Tracked: ",
    "stats-done": "Done today: ",
    "stats-best": "Best streak: ",
    "howto-title": '<i class="fa fa-check-double"></i> How to Use Habit Tracker',
    "howto-steps": `<li><b>Add a habit:</b> Type your daily habit (e.g., "Drink Water") and click Add.</li>
          <li><b>Mark done:</b> When you complete a habit for the day, click the Done button beside it.</li>
          <li><b>Remove habits:</b> Delete or archive habits you no longer want to track.</li>
          <li><b>Repeat daily:</b> Return each day to update and track your progress.</li>`,
    "howto-article-btn": "Read full guide",
    "howto-article-link": "habit-how-to.html",
    "tips-title": '<i class="fa fa-lightbulb" style="color:#43cea2;"></i> Habit Productivity Tips',
    "tips-list": `<li><b>Start small:</b> Begin with easy, achievable habits to build momentum.</li>
          <li><b>Track daily:</b> Consistency is key—mark habits done every day.</li>
          <li><b>Celebrate progress:</b> Recognize small wins to stay motivated.</li>`,
    "tips-article-btn": "Read full guide",
    "tips-article-link": "habit-tips.html",
    "faq-title": "FAQs",
    "faq-list": `<li><b>Are habits saved?</b> Yes, in your browser until you clear them.</li>
          <li><b>Can I track multiple habits?</b> Yes! Add as many habits as you like.</li>
          <li><b>Can I see my streaks?</b> Streaks are displayed for each habit.</li>
          <li><b>Can I archive a habit?</b> Yes—archive habits you want to pause.</li>`,
    "mark-done": "Mark Done",
    "done-today": "Done Today",
    "streak": "Streak: ",
    "longest": "Best: ",
    "archive": "Archive",
    "unarchive": "Unarchive",
    "delete": "Delete",
    "no-habits": "No habits yet."
  }
};

    function getTodayStr() {
      const d = new Date();
      return d.getFullYear() + "-" + (d.getMonth()+1).toString().padStart(2,"0") + "-" + d.getDate().toString().padStart(2,"0");
    }
    function lastNDays(n) {
      const arr = [];
      for (let i = n-1; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        arr.push(d.getFullYear() + "-" + (d.getMonth()+1).toString().padStart(2,"0") + "-" + d.getDate().toString().padStart(2,"0"));
      }
      return arr;
    }

    let habits = JSON.parse(localStorage.getItem('habits') || '[]');

    function getLang() {
      try {
        const l = localStorage.getItem('timerhavenLang') || 'en';
        return (l && l.slice(0,2)) || 'en';
      } catch (e) {
        return 'en';
      }
    }

    function applyLanguage(lang) {
      lang = (lang || getLang()).slice(0,2);
      const t = habitTranslations[lang] || habitTranslations['en'];
      document.body.dir = (lang === "ar") ? "rtl" : "ltr";
      const back = document.getElementById('back-link'); if (back) back.textContent = t['back-link'] || '';
      const toolTitle = document.getElementById('tool-title'); if (toolTitle) toolTitle.innerHTML = `<i class="fa fa-check-double"></i> ${t['tool-title'] || ''}`;
      const input = document.getElementById('habitInput'); if (input) input.placeholder = t['habitInput'] || '';
      const addBtn = document.getElementById('add-btn'); if (addBtn) addBtn.textContent = t['add-btn'] || '';
      const faqTitle = document.getElementById('faq-title'); if (faqTitle) faqTitle.textContent = t['faq-title'] || '';
      const faqList = document.getElementById('faq-list'); if (faqList) faqList.innerHTML = t['faq-list'] || '';
      const readBtn = document.getElementById('read-guide-btn'); if (readBtn) { readBtn.textContent = t['howto-article-btn'] || 'Read full guide'; readBtn.href = t['howto-article-link'] || 'habit-how-to.html'; }
    }

    function resetHabitsIfNeeded() {
      const today = getTodayStr();
      let changed = false;
      habits.forEach(habit => {
        if (!habit.history) habit.history = [];
        if (habit.lastChecked !== today) {
          habit.doneToday = false;
          habit.lastChecked = today;
          changed = true;
        }
      });
      if (changed) saveHabits();
    }
    function saveHabits() { localStorage.setItem('habits', JSON.stringify(habits)); }

    function renderHabits() {
      resetHabitsIfNeeded();
      const lang = getLang();
      const t = habitTranslations[lang] || habitTranslations['en'];
      const list = document.getElementById('habitList');
      list.innerHTML = '';
      const today = getTodayStr();
      let doneTodayCount = 0;
      let bestStreak = 0;
      let activeCount = 0;
      habits.forEach(h => { if (!h.archived) activeCount++; });
      if (habits.length === 0 || activeCount === 0) {
        list.innerHTML = `<div style="color:#888;">${t["no-habits"] || 'No habits yet.'}</div>`;
      }
      habits.forEach((habit, idx) => {
        if (habit.archived) return;
        let streak = habit.streak || 0;
        let longest = habit.longest || streak;
        bestStreak = Math.max(bestStreak, longest);
        if (!habit.history) habit.history = [];
        let historyDots = "";
        lastNDays(7).forEach((date) => {
          const done = habit.history.includes(date);
          historyDots += `<span class="dot${done ? ' done' : ''}${date === today ? ' today' : ''}" title="${date}"></span>`;
        });
        const isDone = habit.doneToday;
        if (isDone) doneTodayCount++;
        list.innerHTML += `
          <div class="habit-item">
            <span><b>${habit.name}</b>
              <span class="habit-meta">${t["streak"]}${streak} ${t["longest"]}${longest}</span>
              <span class="habit-history">${historyDots}</span>
            </span>
            <div>
              <button class="btn btn-outline-${isDone ? 'secondary' : 'success'} btn-sm habit-btn" onclick="markDone(${idx})" ${isDone ? 'disabled' : ''}>
                ${isDone ? t["done-today"] : t["mark-done"]}
              </button>
              <button class="archive-btn${habit.archived ? ' archived' : ''}" onclick="archiveHabit(${idx})">
                ${habit.archived ? t["unarchive"] : t["archive"]}
              </button>
              <button class="btn btn-outline-danger btn-sm habit-btn" onclick="deleteHabit(${idx})"><i class="fa fa-trash"></i> ${t["delete"]}</button>
            </div>
          </div>
        `;
      });
      renderStats(activeCount, doneTodayCount, bestStreak);
      renderBanner(activeCount, doneTodayCount);
    }
    function renderStats(tracked, done, best) {
      const lang = getLang();
      const t = habitTranslations[lang] || habitTranslations['en'];
      document.getElementById("stats-bar").innerHTML =
        `${t["stats-tracked"]}${tracked} &bull; ${t["stats-done"]}${done} &bull; ${t["stats-best"]}${best}`;
    }
    function renderBanner(tracked, done) {
      const lang = getLang();
      const t = habitTranslations[lang] || habitTranslations['en'];
      const banner = document.getElementById("banner");
      if (tracked > 0 && done === tracked) {
        banner.textContent = t["banner-all-done"] || habitTranslations["en"]["banner-all-done"];
        banner.style.display = "block";
      } else {
        banner.style.display = "none";
      }
    }

    document.getElementById('habitForm').addEventListener('submit', function(e){
      e.preventDefault();
      const name = document.getElementById('habitInput').value.trim();
      if (!name) return;
      habits.push({
        name,
        streak: 0,
        longest: 0,
        doneToday: false,
        lastChecked: getTodayStr(),
        history: [],
        archived: false
      });
      saveHabits();
      document.getElementById('habitInput').value = "";
      renderHabits();
    });
    window.markDone = function(idx){
      const today = getTodayStr();
      if (!habits[idx].doneToday) {
        habits[idx].doneToday = true;
        habits[idx].lastChecked = today;
        habits[idx].streak = (habits[idx].streak || 0) + 1;
        habits[idx].longest = Math.max(habits[idx].longest || 0, habits[idx].streak);
        if (!habits[idx].history) habits[idx].history = [];
        if (!habits[idx].history.includes(today)) habits[idx].history.push(today);
        saveHabits();
        renderHabits();
      }
    }
    window.archiveHabit = function(idx){
      habits[idx].archived = !habits[idx].archived;
      saveHabits();
      renderHabits();
    }
    window.deleteHabit = function(idx){
      habits.splice(idx, 1);
      saveHabits();
      renderHabits();
    }

    window.addEventListener('storage', function(e) {
      if (e.key === 'timerhavenLang') {
        const lang = (e.newValue || getLang()).slice(0,2);
        applyLanguage(lang);
      }
    });

    document.addEventListener("DOMContentLoaded", function() {
      applyLanguage(getLang());
      renderHabits();
      // toggle mobile tips visibility on resize
      window.addEventListener('resize', function(){ applyLanguage(getLang()); });
    });
  </script>
