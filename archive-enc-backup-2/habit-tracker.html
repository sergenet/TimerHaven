  <!--
    Quick client-side redirect: if the site-wide language (timerhavenLang) is set to a non-English
    two-letter code, redirect from the generic habit-tracker.html to the localized page:
    habit-tracker-<lang>.html (e.g., habit-tracker-es.html).
    This ensures when the user clicks "Habit Tracker" from index.html the localized tool page opens.
  -->
  <script>
    (function(){
      try {
        const raw = localStorage.getItem('timerhavenLang') || '';
        const lang = (raw && raw.toString().slice(0,2).toLowerCase()) || '';
        if (!lang || lang === 'en') return;
        const path = location.pathname || '';
        const filename = path.split('/').pop().toLowerCase();
        // if already on localized page, do nothing
        if (filename && filename.indexOf('-' + lang + '.html') !== -1) return;
        // build localized filename
        const localized = path.replace(/(habit-tracker)(\.html)?$/i, '$1-' + lang + '.html');
        const target = (localized === path) ? ('/habit-tracker-' + lang + '.html') : localized;
        if (target && (target !== location.pathname + location.search + location.hash)) {
          // replace so back button doesn't keep the generic page in history
          location.replace(target + location.search + location.hash);
        }
      } catch (e) {
        // fail silently
        console && console.warn && console.warn('locale redirect failed', e);
      }
    })();
  </script>

    const langNames = { en: "English", fr: "Franأƒآ§ais", de: "Deutsch", ru: "أگآ أ'ئ'أ'آپأ'آپأگآ؛أگآ¸أگآ¹", el: "أژ•أژآ»أژآ»أژآ·أژآ½أژآ¹أژآ؛أژآ¬", es: "Espaأƒآ±ol", ar: "أکآ§أ™â€‍أکآ¹أکآ±أکآ¨أ™إ أکآ©" };

    // Helper: today's date format
    function getTodayStr() {
      const d = new Date();
      return d.getFullYear() + "-" + (d.getMonth()+1).toString().padStart(2,"0") + "-" + d.getDate().toString().padStart(2,"0");
    }
    function lastNDays(n) {
      const arr = [];
      for (let i = n-1; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        arr.push(d.getFullYear() + "-" + (d.getMonth()+1).toString().padStart(2,"0") + "-" + d.getDate().toString().padStart(2,"0"));
      }
      return arr;
    }

    // Data
    let habits = JSON.parse(localStorage.getItem('habits') || '[]');

    // get site language from main menu (timerhavenLang)
    function getSiteLang() {
      try {
        const l = localStorage.getItem('timerhavenLang') || 'en';
        return (l && l.slice(0,2)) || 'en';
      } catch (e) {
        return 'en';
      }
    }

    // apply language strings and set localized article links
    function applyLanguage(lang) {
      lang = (lang || getSiteLang()).slice(0,2);
      const t = habitTranslations[lang] || habitTranslations['en'];

      // RTL support
      document.body.dir = (lang === "ar") ? "rtl" : "ltr";

      // Update the visible UI strings
      const back = document.getElementById('back-link'); if (back) back.textContent = t['back-link'] || '';
      const toolTitle = document.getElementById('tool-title'); if (toolTitle) toolTitle.innerHTML = `<i class="fa fa-check-double"></i> ${t['tool-title'] || ''}`;
      const input = document.getElementById('habitInput'); if (input) input.placeholder = t['habitInput'] || '';
      const addBtn = document.getElementById('add-btn'); if (addBtn) addBtn.textContent = t['add-btn'] || '';
      const faqTitle = document.getElementById('faq-title'); if (faqTitle) faqTitle.textContent = t['faq-title'] || '';
      const faqList = document.getElementById('faq-list'); if (faqList) faqList.innerHTML = t['faq-list'] || '';
      const howtoTitle = document.getElementById('howto-title'); if (howtoTitle) howtoTitle.innerHTML = t['howto-title'] || '';
      const howtoSteps = document.getElementById('howto-steps'); if (howtoSteps) howtoSteps.innerHTML = t['howto-steps'] || '';
      const tipsTitle = document.getElementById('tips-title'); if (tipsTitle) tipsTitle.innerHTML = t['tips-title'] || '';
      const tipsList = document.getElementById('tips-list'); if (tipsList) tipsList.innerHTML = t['tips-list'] || '';

      // Set localized how-to and tips links based on mapping above
      const howtoBtn = document.getElementById('howto-article-btn');
      const tipsBtn = document.getElementById('tips-article-btn');
      if (howtoBtn) {
        const href = (localizedArticles.howto[lang] || localizedArticles.howto.en);
        howtoBtn.href = href;
        howtoBtn.textContent = t['howto-article-btn'] || 'Read Full Article';
      }
      if (tipsBtn) {
        const href = (localizedArticles.tips[lang] || localizedArticles.tips.en);
        tipsBtn.href = href;
        tipsBtn.textContent = t['tips-article-btn'] || 'Read Full Article';
      }

      // Update the "language indicator" text (if you still show indicator elsewhere)
      const labelEl = document.getElementById('language-label');
      const nameEl = document.getElementById('language-name');
      if (labelEl) labelEl.textContent = t['language-label'] || 'Language:';
      if (nameEl) nameEl.textContent = langNames[lang] || lang;

      // Re-render habits so labels and stats use the chosen language
      renderHabits();
    }

    // Reset daily flags if new day
    function resetHabitsIfNeeded() {
      const today = getTodayStr();
      let changed = false;
      habits.forEach(habit => {
        if (!habit.history) habit.history = [];
        if (habit.lastChecked !== today) {
          habit.doneToday = false;
          habit.lastChecked = today;
          changed = true;
        }
      });
      if (changed) saveHabits();
    }
    function saveHabits() { localStorage.setItem('habits', JSON.stringify(habits)); }

    // Rendering (same as before)
    function renderHabits() {
      resetHabitsIfNeeded();
      const lang = getSiteLang();
      const t = habitTranslations[lang] || habitTranslations['en'];
      const list = document.getElementById('habitList');
      list.innerHTML = '';
      const today = getTodayStr();
      let doneTodayCount = 0;
      let bestStreak = 0;
      let activeCount = 0;
      habits.forEach(h => { if (!h.archived) activeCount++; });
      if (habits.length === 0 || activeCount === 0) {
        list.innerHTML = `<div style="color:#888;">${t["no-habits"] || habitTranslations["en"]["no-habits"]}</div>`;
      }
      habits.forEach((habit, idx) => {
        if (habit.archived) return;
        let streak = habit.streak || 0;
        let longest = habit.longest || streak;
        bestStreak = Math.max(bestStreak, longest);
        if (!habit.history) habit.history = [];
        let historyDots = "";
        lastNDays(7).forEach((date, i) => {
          const done = habit.history.includes(date);
          historyDots += `<span class="dot${done ? ' done' : ''}${date === today ? ' today' : ''}" title="${date}"></span>`;
        });
        const isDone = habit.doneToday;
        if (isDone) doneTodayCount++;
        list.innerHTML += `
          <div class="habit-item">
            <span><b>${habit.name}</b>
              <span class="habit-meta">${t["streak"]}${streak} ${t["longest"]}${longest}</span>
              <span class="habit-history">${historyDots}</span>
            </span>
            <button class="btn btn-outline-${isDone ? 'secondary' : 'success'} btn-sm habit-btn" onclick="markDone(${idx})" ${isDone ? 'disabled' : ''}>
              ${isDone ? t["done-today"] : t["mark-done"]}
            </button>
            <button class="archive-btn${habit.archived ? ' archived' : ''}" onclick="archiveHabit(${idx})">
              ${habit.archived ? t["unarchive"] : t["archive"]}
            </button>
            <button class="btn btn-outline-danger btn-sm habit-btn" onclick="deleteHabit(${idx})"><i class="fa fa-trash"></i> ${t["delete"]}</button>
          </div>
        `;
      });
      renderStats(activeCount, doneTodayCount, bestStreak);
      renderBanner(activeCount, doneTodayCount);
    }
    function renderStats(tracked, done, best) {
      const lang = getSiteLang();
      const t = habitTranslations[lang] || habitTranslations['en'];
      document.getElementById("stats-bar").innerHTML =
        `${t["stats-tracked"]}${tracked} &bull; ${t["stats-done"]}${done} &bull; ${t["stats-best"]}${best}`;
    }
    function renderBanner(tracked, done) {
      const lang = getSiteLang();
      const t = habitTranslations[lang] || habitTranslations['en'];
      const banner = document.getElementById("banner");
      if (tracked > 0 && done === tracked) {
        banner.textContent = t["banner-all-done"] || habitTranslations["en"]["banner-all-done"];
        banner.style.display = "block";
      } else {
        banner.style.display = "none";
      }
    }

    // Actions
    document.getElementById('habitForm').addEventListener('submit', function(e){
      e.preventDefault();
      const name = document.getElementById('habitInput').value.trim();
      if (!name) return;
      habits.push({
        name,
        streak: 0,
        longest: 0,
        doneToday: false,
        lastChecked: getTodayStr(),
        history: [],
        archived: false
      });
      saveHabits();
      document.getElementById('habitInput').value = "";
      renderHabits();
    });
    window.markDone = function(idx){
      const today = getTodayStr();
      if (!habits[idx].doneToday) {
        habits[idx].doneToday = true;
        habits[idx].lastChecked = today;
        habits[idx].streak = (habits[idx].streak || 0) + 1;
        habits[idx].longest = Math.max(habits[idx].longest || 0, habits[idx].streak);
        if (!habits[idx].history) habits[idx].history = [];
        if (!habits[idx].history.includes(today)) habits[idx].history.push(today);
        saveHabits();
        renderHabits();
      }
    }
    window.archiveHabit = function(idx){
      habits[idx].archived = !habits[idx].archived;
      saveHabits();
      renderHabits();
    }
    window.deleteHabit = function(idx){
      habits.splice(idx, 1);
      saveHabits();
      renderHabits();
    }

    // When timerhavenLang changes (other tabs), update UI and article links
    window.addEventListener('storage', function(e) {
      if (e.key === 'timerhavenLang') {
        const lang = (e.newValue || getSiteLang()).slice(0,2);
        applyLanguage(lang);
      }
    });

    // Initialize on load
    document.addEventListener("DOMContentLoaded", function() {
      // Apply UI language and localized article links
      applyLanguage(getSiteLang());
      // Initial render of habits
      renderHabits();
    });
  </script>
