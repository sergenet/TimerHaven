/* Unified card style for equal height/width */
.article-card, .tool-card {
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 2px 12px #e0e7ef;
  min-width: 220px;
  max-width: 340px;

  flex-direction: column;
  justify-content: flex-start;
  align-items: stretch;

  margin: 0;
  box-sizing: border-box;
  text-align: left;
  overflow: hidden;
}

/* Card headings */
.article-card h2, .tool-card h3 {
  font-size: 1.35em;
  font-weight: 700;
  margin-bottom: 0.4em;
  display: flex;
  align-items: center;
  gap: 0.3em;
}

.article-card ul, .article-card ol, .tool-card ul, .tool-card ol { 
  margin-left: 1em; font-size: 1em; margin-bottom: 0.2em; padding-right: 0.2em; word-break: break-word; 
}

.article-card .btn, .tool-card .btn { 
  align-self: stretch;
  font-weight: 600; 
  border-radius: 8px; 
  margin-top: 0.2em; 
  margin-bottom: 0; 
  box-sizing: border-box;
}

.form-inline { display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; }
.pomodoro-display { font-weight:700; font-size:1.25rem; margin-top:.5rem; margin-bottom:.5rem; }
.controls-row { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; margin-top:.5rem; }
.toggles { margin-top:.6rem; display:flex; gap:0.75rem; flex-wrap:wrap; align-items:center; }
.faq-section { margin-top:1rem; background:#f7fafc; border-radius:8px; padding:1rem; }
.btn-small { padding:.35rem .7rem; font-size:.9rem; }
.back-link { display: inline-block; margin-bottom: 1em; color: #185a9d; text-decoration: none; font-weight: bold; font-size: 1em; }
.back-link:hover { text-decoration: underline; color: #43cea2; }

/* Non-editable language indicator (top-right) */
.language-indicator {
  position: fixed;
  right: 18px;
  top: 16px;
  z-index: 12000;
  display:flex;
  align-items:center;
  gap:8px;
  color:#185a9d;
  font-weight:600;
  background: rgba(255,255,255,0.95);
  padding: 8px 12px;
  border-radius: 10px;
  box-shadow: 0 6px 18px rgba(8,20,40,0.06);
  font-size: 0.98em;
}
.language-indicator .lang-label { margin-right: 6px; }
.language-indicator .lang-name { background: linear-gradient(90deg,#43cea2 0%,#185a9d 100%); color:#fff; padding:6px 10px; border-radius:8px; font-weight:700; box-shadow: 0 2px 8px #e0e7ef; }

@media (max-width: 1100px) {
  .main-container{padding:0 8px;}
  .center-row, .card-row{gap:1em;}
  .tool-card,.article-card{width:97vw;max-width:540px;height:auto;}
}
@media (max-width: 800px) {
  .main-container{padding:0;}
  .center-row, .card-row{flex-direction:column;align-items:center;}
  .tool-card,.article-card{width:98vw;max-width:540px;height:auto;}

details summary { cursor: pointer; padding: 0.35em 0; font-weight: bold; font-size: 1.09em; }

      try {
        const l = localStorage.getItem('timerhavenLang') || 'en';
        return (l && l.slice(0,2)) || 'en';
      } catch (e) {
        return 'en';
      }
    }

    function applyLanguage(lang) {
      lang = (lang || getLang()).slice(0,2);
      const t = translations[lang] || translations['en'];

      // RTL support
      document.documentElement.lang = lang;
      document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';

      // language indicator
      const labelEl = document.getElementById('language-label');
      const nameEl = document.getElementById('language-name');
      if (labelEl) labelEl.textContent = t['language-label'] || 'Language:';
      if (nameEl) nameEl.textContent = langNames[lang] || lang;

      // Article 1 (left)
      document.getElementById('howto-title').innerHTML = t.howtoTitle || '';
      document.getElementById('howto-steps').innerHTML = (t.howtoSteps || []).map(s => `<li>${s}</li>`).join('');
      document.getElementById('howto-link').textContent = t.howtoLink || '';
      document.getElementById('howto-link').href = (lang === 'en') ? 'pomodoro-how-to.html' : `pomodoro-how-to-${lang}.html`;

      // Tool card
      document.getElementById('back-link').innerHTML = t.backLink || '';
      document.getElementById('tool-title').innerHTML = t.toolTitle || '';

      // Form labels
      document.getElementById('work-label').innerHTML = `${t.workLabel} <input type="number" id="workLength" min="1" max="60" value="25" class="form-control" style="width:80px; margin-left:.3rem;">`;
      document.getElementById('break-label').innerHTML = `${t.breakLabel} <input type="number" id="breakLength" min="1" max="30" value="5" class="form-control" style="width:80px; margin-left:.3rem;">`;

      // Buttons
      document.getElementById('startBtn').innerHTML = t.startBtn || '';
      document.getElementById('pauseBtn').innerHTML = t.pauseBtn || '';
      document.getElementById('resetBtn').innerHTML = t.resetBtn || '';

      // FAQ
      document.getElementById('faq-title').textContent = t.faqTitle || '';
      document.getElementById('faq-list').innerHTML = (t.faqList || []).map(s => `<li>${s}</li>`).join('');

      // Article 2 (right)
      document.getElementById('tips-title').innerHTML = t.tipsTitle || '';
      document.getElementById('tips-list').innerHTML = (t.tipsList || []).map(s => `<li>${s}</li>`).join('');
      document.getElementById('tips-link').textContent = t.tipsLink || '';
      document.getElementById('tips-link').href = (lang === 'en') ? 'pomodoro-tips.html' : `pomodoro-tips-${lang}.html`;

      // Update status with current state
      updateDisplay();
    }

    // listen for main-menu language changes
    window.addEventListener('storage', function(e) {
      if (e.key === 'timerhavenLang') {
        applyLanguage((e.newValue || 'en').slice(0,2));
      }
    });

    // Pomodoro Timer logic
    let timer = null;
    let running = false;
    let isWork = true;
    let timeLeft = 25*60;
    let cycleCount = 0;

    function updateDisplay() {
      const min = Math.floor(timeLeft/60);
      const sec = timeLeft % 60;
      document.getElementById('pomodoroDisplay').textContent = String(min).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
      const lang = getLang();
      const t = translations[lang] || translations['en'];
      document.getElementById('pomodoroStatus').textContent = isWork ? (t.pomodoroStatus || 'Work') : (t.pomodoroStatusBreak || 'Break');
      document.getElementById('pomodoroCycle').textContent = (t.pomodoroCycle || 'Completed cycles:') + ' ' + cycleCount;
    }

    function setLengths() {
      if (isWork) {
        timeLeft = parseInt(document.getElementById('workLength').value,10) * 60;
      } else {
        timeLeft = parseInt(document.getElementById('breakLength').value,10) * 60;
      }
      updateDisplay();
    }

    // initialize after DOM is ready
    document.addEventListener('DOMContentLoaded', function() {
      // apply language from main site
      applyLanguage(getLang());

      document.getElementById('workLength').addEventListener('change', setLengths);
      document.getElementById('breakLength').addEventListener('change', setLengths);

      document.getElementById('startBtn').addEventListener('click', function(){
        if (running) return;
        running = true;
        timer = setInterval(function(){
          if (timeLeft > 0) {
            timeLeft--;
            updateDisplay();
          } else {
            clearInterval(timer);
            running = false;
            if (isWork) cycleCount++;
            isWork = !isWork;
            setLengths();
          }
        }, 1000);
      });

      document.getElementById('pauseBtn').addEventListener('click', function(){
        if (timer) clearInterval(timer);
        running = false;
      });

      document.getElementById('resetBtn').addEventListener('click', function(){
        if (timer) clearInterval(timer);
        running = false;
        cycleCount = 0;
        isWork = true;
        setLengths();
      });

      setLengths();
    });
  </script>
