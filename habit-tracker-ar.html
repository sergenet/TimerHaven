<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <title>متعقب العادات — TimerHaven</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="description" content="تتبّع العادات اليومية وابنِ روتينًا جديدًا. تعرّف على كيفية استخدام المتعقب، واحصل على نصائح الإنتاجية، الأسئلة الشائعة والمقالات."/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/assets/css/tool-theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    :root{--brand:#0b63a0;--muted:#6b7c89;--card:#fff;--bg:#fbfeff}
    html,body{height:100%}
    body{
      background:var(--bg);
      font-family:'Montserrat', Arial, sans-serif;
      color:var(--text-dark,#102a43);
      margin:0;
      padding:2rem;
      direction:rtl;
    }
    .container{max-width:720px;margin:0 auto}
    .card{background:var(--card);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,0.06);padding:1.6rem 1.5rem;box-sizing:border-box}
    /* Back link and title styling */
    .back-link{display:inline-block;margin-bottom:.75rem;color:#007bff !important;text-decoration:none;font-weight:700;direction:ltr}
    .back-link:hover{text-decoration:underline}
    .tool-title{font-size:1.35rem;margin:0 0 .4rem 0;display:flex;align-items:center;gap:.4rem;color:#185a9d;justify-content:flex-end}
    /* Read full guide button (explicit blue) */
    .read-guide{
      display:inline-flex;align-items:center;justify-content:center;margin:.25rem 0 .9rem 0;padding:.45rem .7rem;border-radius:8px;
      background:#007bff !important;color:#fff !important;text-decoration:none;font-weight:700;font-size:.95rem;border:none;
      box-shadow:0 6px 18px rgba(0,123,255,0.08);
    }
    .stats-bar{background:#f6fbfa;border-radius:10px;margin-bottom:1.2rem;padding:.7rem 1rem;font-size:1.05rem;font-weight:600;color:#185a9d;display:flex;gap:2em;align-items:center;justify-content:space-between;direction:ltr}
    .habit-form{margin-bottom:1rem;display:flex;gap:.5rem;justify-content:flex-end}
    .habit-form input{direction:ltr} /* keep input direction LTR for convenience */
    .habit-list{margin-bottom:1rem}
    .habit-item{background:#f7fafc;border-radius:7px;padding:.6rem .8rem;margin-bottom:.6rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .habit-meta{font-size:.9em;color:#888;margin-right:.6em;margin-left:1em;display:block;text-align:right}
    .habit-history{display:flex;gap:3px;margin-right:1em;align-items:center}
    .dot{width:15px;height:15px;border-radius:50%;display:inline-block;background:#e0e7ef;border:1px solid #d0d0d0}
    .dot.done{background:#43cea2;border:1.5px solid #185a9d}
    .dot.today{border:2px solid #43cea2}
    .archive-btn{font-size:.9em;margin-left:.6em;background:#fff;border:1px solid #43cea2;color:#43cea2;border-radius:6px;padding:.15rem .7rem}
    .archive-btn.archived{opacity:.65;color:#888;border-color:#d0d0d0}
    .banner{background:linear-gradient(90deg,#43cea2 0%,#185a9d 100%);color:#fff;border-radius:10px;font-size:1.11em;font-weight:600;text-align:center;margin-bottom:1em;padding:.7em .8em;display:none}
    .faq-section{margin-top:1.1rem;margin-bottom:0.3rem;font-size:1rem;background:#f7fafc;border-radius:8px;padding:1rem;box-shadow:0 1px 4px #e0e7ef;direction:rtl;text-align:right}
    .faq-section summary{cursor:pointer;padding:.35em 0;font-weight:700;font-size:1.02rem}
    .faq-section ul{margin-top:.5rem;color:var(--muted);padding-right:1em}
    @media (max-width:900px){ .card{padding:1rem} }
  </style>
</head>
<body>
  <script>try{ localStorage.setItem('timerhavenLang','ar'); }catch(e){};</script>

  <main class="container" role="main">
    <section class="card tool-card" aria-labelledby="tool-title">
      <a href="index.html" class="back-link" id="back-link">← العودة إلى القائمة الرئيسية</a>

      <div id="tool-title" class="tool-title"><i class="fa fa-check-double"></i> متعقب العادات</div>

      <!-- Read full guide button (Arabic canonical path) -->
      <p style="margin:0 0 .6rem 0; text-align:right;">
        <a id="read-guide-btn" class="read-guide" href="https://timerhaven.com/ar/habit-tracker/habit-tracker-index.html" role="button" target="_blank" rel="noopener">اقرأ المقال</a>
      </p>

      <div id="banner" class="banner" style="display:none;"></div>

      <div id="stats-bar" class="stats-bar">المتعقبة: 0 &bull; تم اليوم: 0 &bull; أفضل سلسلة: 0</div>

      <div class="habit-section">
        <form class="habit-form" id="habitForm" autocomplete="off" role="search" aria-label="Add habit">
          <input class="form-control" id="habitInput" placeholder="اسم العادة" type="text" />
          <button class="btn btn-success btn-sm" id="add-btn" type="submit">أضف العادة</button>
        </form>

        <div id="habitList" class="habit-list" aria-live="polite"></div>
      </div>

      <details class="faq-section" id="faq-section">
        <summary id="faq-title">الأسئلة الشائعة</summary>
        <ul id="faq-list" style="padding-right:1em;"></ul>
      </details>
    </section>
  </main>

  <!-- Mobile-only tips (outside tool card) -->
  <details class="tips-mobile" id="tips-mobile" style="display:none;">
    <summary><h4 id="tips-mobile-title" style="color:#185a9d;display:inline;"></h4></summary>
    <ul id="tips-mobile-list" style="padding-right:1em;"></ul>
  </details>

  <script>
    const habitTranslations = {
      ar: {
        "language-label":"اللغة:",
        "back-link":"العودة إلى القائمة الرئيسية",
        "tool-title":"متعقب العادات",
        "habitInput":"اسم العادة",
        "add-btn":"أضف العادة",
        "banner-all-done":"🎉 تم الانتهاء من جميع العادات اليوم! عمل رائع!",
        "stats-tracked":"المتعقبة: ",
        "stats-done":"تم اليوم: ",
        "stats-best":"أفضل سلسلة: ",
        "howto-title":'<i class="fa fa-check-double"></i> كيفية استخدام متعقب العادات',
        "howto-steps":`<li><b>أضف عادة:</b> اكتب عادة يومية وانقر إضافة.</li>
          <li><b>علّمها منجزة:</b> عندما تُنجز العادة، انقر "تم".</li>
          <li><b>احذف/أرشف:</b> احذف أو أرشف العادات غير المرغوب فيها.</li>
          <li><b>كرر يوميًا:</b> عد كل يوم لتحديث تقدمك.</li>`,
        "howto-article-btn":"اقرأ المقال",
        "howto-article-link":"https://timerhaven.com/ar/habit-tracker/habit-tracker-index.html",
        "tips-title":'<i class="fa fa-lightbulb" style="color:#43cea2;"></i> نصائح',
        "tips-list":`<li><b>ابدأ صغيرًا:</b> ابدأ بعادات بسيطة وسهلة.</li>
          <li><b>تتبع يوميًا:</b> الثبات هو المفتاح.</li>
          <li><b>احتفل بالتقدم:</b> الانتصارات الصغيرة تحافظ على الدافع.</li>`,
        "tips-article-btn":"اقرأ المقال",
        "tips-article-link":"https://timerhaven.com/ar/habit-tracker/habit-tips-ar.html",
        "tips-mobile-title":'<i class="fa fa-lightbulb" style="color:#43cea2;"></i> نصائح',
        "tips-mobile-list":`<li><b>ابدأ صغيرًا:</b> ابنِ تدريجيًا.</li>
          <li><b>راجع السلاسل:</b> راجع تقدمك للبقاء متحفزًا.</li>
          <li><b>أضف تذكيرات:</b> استخدم تنبيهات التقويم.</li>`,
        "faq-title":"الأسئلة الشائعة",
        "faq-list":`<li><b>هل تُحفظ العادات؟</b> نعم، في متصفحك حتى تمسحها.</li>
          <li><b>هل أستطيع تتبع عدة عادات؟</b> نعم.</li>
          <li><b>هل تُعرض السلاسل؟</b> نعم لكل عادة.</li>`,
        "mark-done":"تم",
        "done-today":"تم اليوم",
        "streak":"السلسلة: ",
        "longest":"الأفضل: ",
        "archive":"أرشفة",
        "unarchive":"استعادة",
        "delete":"حذف",
        "no-habits":"لا توجد عادات بعد."
      }
    };

    function getTodayStr() {
      const d = new Date();
      return d.getFullYear() + "-" + (d.getMonth()+1).toString().padStart(2,"0") + "-" + d.getDate().toString().padStart(2,"0");
    }
    function lastNDays(n) {
      const arr = [];
      for (let i = n-1; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        arr.push(d.getFullYear() + "-" + (d.getMonth()+1).toString().padStart(2,"0") + "-" + d.getDate().toString().padStart(2,"0"));
      }
      return arr;
    }

    let habits = JSON.parse(localStorage.getItem('habits') || '[]');

    function getLang() {
      try {
        const l = localStorage.getItem('timerhavenLang') || 'ar';
        return (l && l.slice(0,2)) || 'ar';
      } catch (e) {
        return 'ar';
      }
    }

    function applyLanguage(lang) {
      lang = (lang || getLang()).slice(0,2);
      const t = habitTranslations[lang] || habitTranslations['ar'];
      document.body.dir = (lang === 'ar') ? 'rtl' : 'ltr';

      const back = document.getElementById('back-link'); if (back) back.textContent = t['back-link'] || '';
      const toolTitle = document.getElementById('tool-title'); if (toolTitle) toolTitle.innerHTML = `<i class="fa fa-check-double"></i> ${t['tool-title'] || ''}`;
      const input = document.getElementById('habitInput'); if (input) input.placeholder = t['habitInput'] || '';
      const addBtn = document.getElementById('add-btn'); if (addBtn) addBtn.textContent = t['add-btn'] || '';
      const faqTitle = document.getElementById('faq-title'); if (faqTitle) faqTitle.textContent = t['faq-title'] || '';
      const faqList = document.getElementById('faq-list'); if (faqList) faqList.innerHTML = t['faq-list'] || '';
      const howtoTitle = document.getElementById('howto-title'); if (howtoTitle) howtoTitle.innerHTML = t['howto-title'] || '';
      const howtoSteps = document.getElementById('howto-steps'); if (howtoSteps) howtoSteps.innerHTML = t['howto-steps'] || '';
      const howtoBtn = document.getElementById('howto-article-btn'); if (howtoBtn) { howtoBtn.textContent = t['howto-article-btn'] || ''; howtoBtn.href = t['howto-article-link'] || ''; }

      const tipsTitle = document.getElementById('tips-title'); if (tipsTitle) tipsTitle.innerHTML = t['tips-title'] || '';
      const tipsList = document.getElementById('tips-list'); if (tipsList) tipsList.innerHTML = t['tips-list'] || '';
      const tipsBtn = document.getElementById('tips-article-btn'); if (tipsBtn) { tipsBtn.textContent = t['tips-article-btn'] || ''; tipsBtn.href = t['tips-article-link'] || ''; }

      const tipsMobileTitle = document.getElementById('tips-mobile-title'); if (tipsMobileTitle) tipsMobileTitle.innerHTML = t['tips-mobile-title'] || '';
      const tipsMobileList = document.getElementById('tips-mobile-list'); if (tipsMobileList) tipsMobileList.innerHTML = t['tips-mobile-list'] || '';

      // mobile tips visibility
      const mobileDetails = document.getElementById('tips-mobile');
      if (mobileDetails) {
        mobileDetails.style.display = (window.innerWidth < 801) ? 'block' : 'none';
      }

      renderHabits();
    }

    function saveHabits() { localStorage.setItem('habits', JSON.stringify(habits)); }

    function resetHabitsIfNeeded() {
      const today = getTodayStr();
      let changed = false;
      habits.forEach(habit => {
        if (!habit.history) habit.history = [];
        if (habit.lastChecked !== today) {
          habit.doneToday = false;
          habit.lastChecked = today;
          changed = true;
        }
      });
      if (changed) saveHabits();
    }

    function renderStats(tracked, done, best) {
      const lang = getLang();
      const t = habitTranslations[lang] || habitTranslations['ar'];
      const sb = document.getElementById("stats-bar");
      if (sb) sb.innerHTML = `${t["stats-tracked"]}${tracked} &bull; ${t["stats-done"]}${done} &bull; ${t["stats-best"]}${best}`;
    }

    function renderBanner(tracked, done) {
      const lang = getLang();
      const t = habitTranslations[lang] || habitTranslations['ar'];
      const banner = document.getElementById("banner");
      if (banner) {
        if (tracked > 0 && done === tracked) {
          banner.textContent = t["banner-all-done"] || habitTranslations["ar"]["banner-all-done"];
          banner.style.display = "block";
        } else {
          banner.style.display = "none";
        }
      }
    }

    function renderHabits() {
      resetHabitsIfNeeded();
      const lang = getLang();
      const t = habitTranslations[lang] || habitTranslations['ar'];
      const list = document.getElementById('habitList');
      if (!list) return;
      list.innerHTML = '';
      const today = getTodayStr();
      let doneTodayCount = 0;
      let bestStreak = 0;
      let activeCount = 0;
      habits.forEach(h => { if (!h.archived) activeCount++; });
      if (habits.length === 0 || activeCount === 0) {
        list.innerHTML = `<div style="color:#888;">${t["no-habits"] || habitTranslations["ar"]["no-habits"]}</div>`;
      }
      habits.forEach((habit, idx) => {
        if (habit.archived) return;
        let streak = habit.streak || 0;
        let longest = habit.longest || streak;
        bestStreak = Math.max(bestStreak, longest);
        if (!habit.history) habit.history = [];
        let historyDots = "";
        lastNDays(7).forEach((date) => {
          const done = habit.history.includes(date);
          historyDots += `<span class="dot${done ? ' done' : ''}${date === today ? ' today' : ''}" title="${date}"></span>`;
        });
        const isDone = habit.doneToday;
        if (isDone) doneTodayCount++;
        list.innerHTML += `
          <div class="habit-item">
            <span style="display:flex; flex-direction:column; align-items:flex-end;">
              <b>${habit.name}</b>
              <span class="habit-meta">${t["streak"]}${streak} ${t["longest"]}${longest}</span>
              <span class="habit-history">${historyDots}</span>
            </span>
            <div style="display:flex; gap:.5rem; align-items:center;">
              <button class="btn btn-outline-${isDone ? 'secondary' : 'success'} btn-sm habit-btn" onclick="markDone(${idx})" ${isDone ? 'disabled' : ''}>
                ${isDone ? t["done-today"] : t["mark-done"]}
              </button>
              <button class="archive-btn${habit.archived ? ' archived' : ''}" onclick="archiveHabit(${idx})">
                ${habit.archived ? t["unarchive"] : t["archive"]}
              </button>
              <button class="btn btn-outline-danger btn-sm habit-btn" onclick="deleteHabit(${idx})"><i class="fa fa-trash"></i> ${t["delete"]}</button>
            </div>
          </div>
        `;
      });
      renderStats(activeCount, doneTodayCount, bestStreak);
      renderBanner(activeCount, doneTodayCount);
    }

    document.addEventListener('DOMContentLoaded', function() {
      // ensure local testing uses Arabic by default
      try { localStorage.setItem('timerhavenLang','ar'); } catch(e) {}
      applyLanguage(getLang());

      // Add habit form handling
      const form = document.getElementById('habitForm');
      if (form) {
        form.addEventListener('submit', function(e) {
          e.preventDefault();
          const name = document.getElementById('habitInput').value.trim();
          if (!name) return;
          habits.push({
            name,
            streak: 0,
            longest: 0,
            doneToday: false,
            lastChecked: getTodayStr(),
            history: [],
            archived: false
          });
          saveHabits();
          document.getElementById('habitInput').value = "";
          renderHabits();
        });
      }

      // Respond to language changes from other tabs
      window.addEventListener('storage', function(e) {
        if (e.key === 'timerhavenLang') {
          const lang = (e.newValue || getLang()).slice(0,2);
          applyLanguage(lang);
        }
      });

      // Toggle mobile tips visibility on resize
      window.addEventListener('resize', function(){ applyLanguage(getLang()); });

      renderHabits();
    });

    // Actions available to HTML
    window.markDone = function(idx){
      const today = getTodayStr();
      if (!habits[idx].doneToday) {
        habits[idx].doneToday = true;
        habits[idx].lastChecked = today;
        habits[idx].streak = (habits[idx].streak || 0) + 1;
        habits[idx].longest = Math.max(habits[idx].longest || 0, habits[idx].streak);
        if (!habits[idx].history) habits[idx].history = [];
        if (!habits[idx].history.includes(today)) habits[idx].history.push(today);
        saveHabits();
        renderHabits();
      }
    }
    window.archiveHabit = function(idx){
      habits[idx].archived = !habits[idx].archived;
      saveHabits();
      renderHabits();
    }
    window.deleteHabit = function(idx){
      habits.splice(idx, 1);
      saveHabits();
      renderHabits();
    }
  </script>

  <footer style="direction:rtl; text-align:right; margin-top:1.2rem; color:var(--muted);">

    <a href="terms.html">الشروط</a> &bull;
    <a href="contact.html">اتصل بنا</a>
  </footer>
</body>
</html>
