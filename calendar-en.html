<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Calendar — TimerHaven</title>
  <meta name="description" content="Easily save and manage multiple calendar notes. Learn how to use Calendar, get productivity tips, FAQs, and read expert articles.">
  <meta name="author" content="Serge Shammas">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tool-theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <style>
    /* Local layout (colors come from shared theme) */
    .main-container { max-width:1200px; margin:2rem auto; padding:0 1rem; min-height:90vh; display:flex; justify-content:center; }
    .tool-card { width:420px; padding:18px; box-sizing:border-box; }
    .back-link { display:inline-block; margin-bottom:.6rem; color:var(--brand); text-decoration:none; font-weight:700; }

    /* TOOL TITLE: force the darker blue used across the site screenshots.
       Made more specific and !important to override the shared theme or other rules. */
    section.tool-card .tool-title { font-size:1.35rem; margin:0 0 .5rem 0; display:flex; align-items:center; gap:.4rem; color:#185a9d !important; }

    /* Read guide button: blue rounded rectangular style to match other tools */
    .read-guide {
      display:inline-block;
      margin:.35rem 0 .8rem 0;
      padding:.45rem .7rem;
      border-radius:8px;
      background:var(--brand,#0d6efd);
      color:#fff;
      text-decoration:none;
      font-weight:700;
      font-size:.95rem;
      border:none;
    }

    .small-muted{ color:#6b7c89; font-size:.95rem; margin-bottom:.8rem; }

    /* Force the header controls to stay on a single line and keep right-side selects aligned */
    .calendar-header {
      display:flex;
      align-items:center;
      gap:.4rem;
      margin-bottom:.6rem;
      /* prevent header from wrapping into multiple rows */
      white-space:nowrap;
    }

    /* left button group should stay compact and not wrap */
    .calendar-nav {
      display:flex;
      gap:.2rem;
      align-items:center;
      flex-shrink:0; /* don't let this collapse */
    }
    .calendar-nav .btn {
      min-width:34px;
      padding:.18rem .36rem;
      height:32px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }

    /* right-controls container (month/year selects) is pushed to the right and kept on same line */
    .calendar-header .right-controls {
      margin-left:auto;
      display:flex;
      gap:.45rem;
      align-items:center;
      flex-shrink:0;
    }

    .calendar-select {
      border-radius:8px;
      padding:.18rem .32rem;
      border:1px solid #e4edf5;
      background:#fff;
      font-size:.92rem;
      height:32px;
      box-sizing:border-box;
      /* don't allow selects to shrink and wrap */
      flex-shrink:0;
    }
    .calendar-select.month { width:95px; }
    .calendar-select.year  { width:56px; }

    .calendar-table { width:100%; margin-top:1rem; border-collapse: separate; border-spacing:0; background:#fff; border-radius:8px; overflow:hidden; min-height:360px; table-layout:auto; }
    .calendar-table thead th { text-align:center; font-weight:700; padding:.6rem .3rem; border-bottom:1px solid #eef2f6; background:#fff; }
    .calendar-table tbody td { text-align:center; vertical-align:middle; padding:.5rem .25rem; height:52px; }

    .day-cell { cursor:pointer; border-radius:6px; transition:background .12s; display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; margin:0 auto; padding:0; box-sizing:border-box; }
    .day-cell:hover, .day-cell:focus { background:#eef6fb; outline:none; }
    .has-note { background:#fff5d6 !important; }
    .calendar-today { display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; background:linear-gradient(180deg,#e6f7ff 0%,#cfefff 100%); color:#004e73; border-radius:50%; font-weight:700; border:1px solid rgba(0,126,204,0.18); box-shadow:0 4px 12px rgba(24,144,255,0.08); padding:0; margin:0; }

    details.faq-section summary { cursor:pointer; padding:.2rem 0; font-weight:600; }
    details.faq-section ul { margin-top:.5rem; color:var(--muted); padding-left:1rem; }

    @media (max-width:800px) { .tool-card{ width:98vw; padding:1rem; } .calendar-select.month{ width:100%; } .calendar-select.year{ width:120px; } }
  </style>
</head>
<body>
  <main class="main-container" role="main">
    <section class="tool-card" aria-labelledby="tool-title">
      <a id="back-link" class="back-link" href="index.html">← Back to Main Menu</a>

      <!-- Inline style added on the h3 as a final override so nothing (even inline scripts or theme rules) can accidentally change it -->
      <h3 id="tool-title" class="tool-title" style="color:#185a9d !important;"><i class="fa fa-calendar-days"></i> Calendar</h3>
      <a id="read-guide-btn" class="read-guide" href="en/calendar-planning/calendar-planning-index.html" role="button">Read full guide</a>

      <div class="small-muted" id="tool-help">Click any day to add/view/edit your notes. Multiple notes per day are supported and persist!</div>

      <div class="calendar-header" aria-label="Calendar navigation">
        <div class="calendar-nav" role="toolbar" aria-label="Month and year navigation">
          <button id="nav-prev-year" class="btn btn-sm btn-outline-secondary" aria-label="Previous year">«</button>
          <button id="nav-prev-month" class="btn btn-sm btn-outline-secondary" aria-label="Previous month">‹</button>
          <button id="nav-today" class="btn btn-sm btn-outline-secondary" aria-label="Today">Today</button>
          <button id="nav-next-month" class="btn btn-sm btn-outline-secondary" aria-label="Next month">›</button>
          <button id="nav-next-year" class="btn btn-sm btn-outline-secondary" aria-label="Next year">»</button>
        </div>

        <!-- Right controls kept on same line with left buttons -->
        <div class="right-controls">
          <select id="calendar-month-select" class="calendar-select month" aria-label="Select month"></select>
          <select id="calendar-year-select" class="calendar-select year" aria-label="Select year"></select>
        </div>
      </div>

      <table id="calendar-table" class="calendar-table table" role="grid" aria-describedby="tool-help"></table>

      <details class="faq-section" id="faq-section" style="margin-top:12px;">
        <summary id="faq-title">FAQs ▾</summary>
        <ul id="faq-list" style="margin-top:.5rem;"></ul>
      </details>
    </section>
  </main>

  <!-- Notes Modal -->
  <div class="modal fade" id="noteModal" tabindex="-1" aria-labelledby="noteModalLabel" aria-hidden="true">
    <div class="modal-dialog"><div class="modal-content">
      <form id="noteForm" autocomplete="off">
        <div class="modal-header">
          <h5 class="modal-title" id="noteModalLabel"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <ul id="noteList" class="note-list" aria-live="polite"></ul>
          <textarea id="noteInput" class="form-control" rows="3" placeholder="Add a new note for this day..."></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="note-close-btn">Close</button>
          <button type="submit" class="btn btn-success" id="note-add-btn">Add Note</button>
        </div>
      </form>
    </div></div>
  </div>

  <footer style="text-align:center;padding:18px 12px;color:var(--muted);">&copy; 2025 TimerHaven. All tools are free and privacy-friendly. <a href="privacy.html">Privacy Policy</a> · <a href="contact.html">Contact</a></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Full calendar script (preserved original rendering + modal + persistence)
    let notes = {};
    try { notes = JSON.parse(localStorage.getItem('calendarNotes') || '{}'); } catch(e) { notes = {}; console.error('notes parse error', e); }

    let currentYear, currentMonth, selectedDay;

    function getLang() { return localStorage.getItem('timerhavenLang') || 'en'; }

    const translations = {
      en: {
        "back-link":"← Back to Main Menu",
        "tool-title":"Calendar",
        "tool-help":"Click any day to add/view/edit your notes. Multiple notes per day are supported and persist!",
        "faq-list": `<li><strong>Are my notes saved?</strong> Yes — notes are saved in your browser and remain until you delete them.</li>
                     <li><strong>Can I add more than one note?</strong> Yes — you can add multiple notes per day.</li>
                     <li><strong>How to backup?</strong> Use Export to download a backup file you can keep or restore later.</li>`,
        "noteModalLabel":"Notes for",
        "noteInput":"Add a new note for this day...",
        "note-none":"No notes yet for this day.",
        "note-delete":"Delete this note",
        "note-close-btn":"Close",
        "note-add-btn":"Add Note",
        "days":["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]
      }
    };

    function t(lang, key) {
      if (translations[lang] && translations[lang][key]) return translations[lang][key];
      return translations['en'][key] || '';
    }

    function updateLanguage(lang) {
      lang = lang || getLang();
      document.body.dir = (lang === 'ar') ? 'rtl' : 'ltr';
      const obj = translations[lang] || translations['en'];
      const back = document.getElementById('back-link'); back && (back.textContent = obj['back-link']);
      const toolTitle = document.getElementById('tool-title'); toolTitle && (toolTitle.innerHTML = `<i class="fa fa-calendar-days"></i> ${obj['tool-title']}`);
      const help = document.getElementById('tool-help'); help && (help.textContent = obj['tool-help']);
      const faqList = document.getElementById('faq-list'); faqList && (faqList.innerHTML = obj['faq-list']);
      const readBtn = document.getElementById('read-guide-btn'); if (readBtn) { readBtn.textContent = 'Read full guide'; readBtn.href = 'en/calendar-planning/calendar-planning-index.html'; }
      const nm = document.getElementById('noteModalLabel'); nm && (nm.innerHTML = `${obj['noteModalLabel']} <span id="modal-date-label"></span>`);
      const ni = document.getElementById('noteInput'); ni && (ni.placeholder = obj['noteInput']);
      const nc = document.getElementById('note-close-btn'); nc && (nc.textContent = obj['note-close-btn']);
      const na = document.getElementById('note-add-btn'); na && (na.textContent = obj['note-add-btn']);
      if (typeof currentYear === 'number' && typeof currentMonth === 'number') {
        renderCalendar(currentYear, currentMonth, lang);
      }
    }

    function populateMonthYearControls(year, month, lang) {
      lang = lang || getLang();
      const monthSelect = document.getElementById('calendar-month-select');
      const yearSelect = document.getElementById('calendar-year-select');
      if (!monthSelect || !yearSelect) return;
      const locale = (lang === 'ar') ? 'ar-SA' : lang;
      const mf = new Intl.DateTimeFormat(locale, { month:'long' });

      monthSelect.innerHTML = '';
      for (let m=0;m<12;m++){
        const opt = document.createElement('option'); opt.value = String(m); opt.textContent = mf.format(new Date(2000,m,1));
        if (m===month) opt.selected = true; monthSelect.appendChild(opt);
      }

      const now = new Date(); const base = now.getFullYear();
      const start = base - 100; const end = base + 100;
      yearSelect.innerHTML = '';
      for (let y=start; y<=end; y++){
        const opt = document.createElement('option'); opt.value = String(y); opt.textContent = String(y);
        if (y===year) opt.selected = true; yearSelect.appendChild(opt);
      }
    }

    function renderCalendar(year, month, lang) {
      currentYear = year; currentMonth = month; lang = lang || getLang();

      const table = document.getElementById('calendar-table');
      if (table) {
        const maxRows = 6, rowHeight = 44, headerHeight = 48;
        table.style.minHeight = (maxRows*rowHeight + headerHeight) + 'px';
      }

      populateMonthYearControls(year, month, lang);

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month+1, 0).getDate();

      let html = '<thead><tr>';
      const dayNames = (translations[lang] && translations[lang].days) ? translations[lang].days : translations['en'].days;
      dayNames.forEach(d => html += `<th scope="col">${d}</th>`);
      html += '</tr></thead><tbody><tr>';

      for (let i=0;i<firstDay;i++) html += '<td></td>';

      const now = new Date(); const todayY = now.getFullYear(), todayM = now.getMonth(), todayD = now.getDate();

      for (let d=1; d<=daysInMonth; d++){
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const dayNotes = notes[dateStr] || [];
        const hasNote = dayNotes.length > 0;
        if ((firstDay + d - 1) % 7 === 0 && d !== 1) html += '</tr><tr>';
        const isToday = (d===todayD && month===todayM && year===todayY);
        const classes = ['day-cell', hasNote ? 'has-note' : '', isToday ? 'calendar-today' : ''].join(' ').trim();
        html += `<td role="gridcell" tabindex="0" data-date="${dateStr}" aria-label="${dateStr}"><div class="${classes}" ${isToday ? 'aria-current="date"' : ''}>${d}</div></td>`;
      }

      html += '</tr></tbody>';
      if (table) table.innerHTML = html;

      Array.from(document.querySelectorAll('.day-cell')).forEach(cell => {
        cell.addEventListener('click', function() {
          const td = cell.closest('td');
          if (!td) return;
          selectedDay = td.getAttribute('data-date');
          showNoteModal(selectedDay);
        });
        cell.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            const td = cell.closest('td');
            if (!td) return;
            selectedDay = td.getAttribute('data-date');
            showNoteModal(selectedDay);
          }
        });
      });
    }

    function showNoteModal(dateStr){
      const ml = document.getElementById('modal-date-label'); if (ml) ml.textContent = dateStr;
      renderNoteList(dateStr);
      const input = document.getElementById('noteInput'); if (input) input.value = '';
      const modal = new bootstrap.Modal(document.getElementById('noteModal')); modal.show();
      setTimeout(()=>{ try{ input && input.focus(); }catch(e){} }, 120);
    }

    // ... rest of calendar script unchanged ...
    document.addEventListener('DOMContentLoaded', function(){
      const now = new Date();
      currentYear = now.getFullYear();
      currentMonth = now.getMonth();

      updateLanguage(getLang());
      populateMonthYearControls(currentYear, currentMonth, getLang());
      hookupCalendarControls();
      renderCalendar(currentYear, currentMonth, getLang());
    });
  </script>
</body>
</html>
