<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Planificador de Reuniones</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Encuentra el mejor horario para todos, en cualquier parte del mundo.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body { background: #f4f7fb; font-family: 'Montserrat', Arial, sans-serif; }
    .main-container { max-width: 1200px; margin: 2em auto; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
    .center-row { display: flex; flex-direction: row; justify-content: center; align-items: stretch; gap: 2em; width: 100%; }
    .tool-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px #e0e7ef;
      min-width: 220px;
      max-width: 340px;
      width: 340px;
      min-height: 500px;
      flex: 1 1 340px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      padding: 2em 1.3em 1em 1.3em;
      margin: 0;
      box-sizing: border-box;
      text-align: left;
      overflow: hidden;
    }
    .back-link { display: inline-block; margin-bottom: 1em; color: #007bff; text-decoration: none; font-weight: bold; font-size: 1em; }
    .back-link:hover { text-decoration: underline; }
    .faq-section { margin-top: 1.1em; margin-bottom: 0.3em; font-size: 1em; background: #f7fafc; border-radius: 8px; padding: 1em; box-shadow: 0 1px 4px #e0e7ef; }
    .faq-section summary { font-weight: bold; font-size: 1.07em; cursor: pointer; margin-bottom: 0.5em; }
    .language-selector-row { margin-bottom: 1em; }
  </style>
</head>
<body>
  <div class="main-container">
    <div class="center-row">
      <div class="tool-card">
        <div class="language-selector-row">
          <label for="languageSelector">Idioma</label>
          <select id="languageSelector" class="form-select" onchange="onLanguageChange()">
            <option value="en">Inglés</option><option value="fr">Francés</option><option value="de">Alemán</option><option value="ru">Ruso</option><option value="el">Griego</option><option value="es">Español</option><option value="ar">العربية</option>
          </select>
        </div>
        <a href="index.html" class="back-link"><i class="fa fa-arrow-left"></i> Volver al menú principal</a>
        <h3><i class="fa fa-users"></i> Planificador de Reuniones</h3>
        <form id="meetingForm">
          <div class="meeting-form-row">
            <label for="participantName">Nombre del participante</label>
            <input type="text" id="participantName" class="form-control" placeholder="Introduce el nombre (ej. Juan)" autocomplete="off">
          </div>
          <div class="meeting-form-row">
            <label for="participantCity">Zona horaria / Ciudad</label>
            <select id="participantCity" class="form-select" autocomplete="off">
              <option value="" disabled selected>Elige ciudad/zona horaria</option>
              <option value="America/New_York">Nueva York 🇺🇸</option><option value="America/Chicago">Chicago 🇺🇸</option><option value="America/Los_Angeles">Los Ángeles 🇺🇸</option><option value="America/Toronto">Toronto 🇨🇦</option><option value="Europe/London">Londres 🇬🇧</option><option value="Europe/Paris">París 🇫🇷</option><option value="Europe/Berlin">Berlín 🇩🇪</option><option value="Europe/Moscow">Moscú 🇷🇺</option><option value="Europe/Istanbul">Estambul 🇹🇷</option><option value="Asia/Dubai">Dubái 🇦🇪</option><option value="Asia/Kolkata">Calcuta 🇮🇳</option><option value="Asia/Shanghai">Shanghái 🇨🇳</option><option value="Asia/Tokyo">Tokio 🇯🇵</option><option value="Asia/Singapore">Singapur 🇸🇬</option><option value="Asia/Jakarta">Yakarta 🇮🇩</option><option value="Australia/Sydney">Sídney 🇦🇺</option><option value="Pacific/Auckland">Auckland 🇳🇿</option><option value="America/Sao_Paulo">São Paulo 🇧🇷</option><option value="America/Mexico_City">Ciudad de México 🇲🇽</option><option value="Africa/Johannesburg">Johannesburgo 🇿🇦</option><option value="Africa/Cairo">El Cairo 🇪🇬</option><option value="Africa/Nairobi">Nairobi 🇰🇪</option><option value="Asia/Seoul">Seúl 🇰🇷</option><option value="Asia/Hong_Kong">Hong Kong 🇭🇰</option><option value="Asia/Bangkok">Bangkok 🇹🇭</option><option value="Asia/Manila">Manila 🇵🇭</option><option value="Europe/Madrid">Madrid 🇪🇸</option><option value="Europe/Rome">Roma 🇮🇹</option><option value="Europe/Warsaw">Varsovia 🇵🇱</option><option value="Europe/Amsterdam">Ámsterdam 🇳🇱</option><option value="Europe/Athens">Atenas 🇬🇷</option><option value="America/Vancouver">Vancouver 🇨🇦</option>
            </select>
          </div>
          <button type="button" class="btn btn-success btn-participant" id="addParticipant"><i class="fa fa-plus"></i> Agregar participante</button>
        </form>
        <div class="participant-list" id="participantList"></div>
        <div class="meeting-form-row">
          <label for="meetingDate">Selecciona la fecha</label>
          <input type="date" id="meetingDate" class="form-control">
        </div>
        <div class="meeting-form-row">
          <label for="meetingTime">Selecciona la hora</label>
          <input type="time" id="meetingTime" class="form-control">
          <button type="button" class="btn btn-primary btn-sm" style="margin-top:0.6em;" id="calcTimes"><i class="fa fa-clock"></i> Mostrar horarios</button>
        </div>
        <div>
          <div id="meetingTimes"></div>
        </div>
        <details class="faq-section">
          <summary>FAQs</summary>
          <ul style="padding-left: 1em;">
            <li><b>¿Cuántos participantes?</b> Los que necesites.</li><li><b>¿Qué zonas horarias?</b> Elige entre más de 30 ciudades globales.</li><li><b>¿Cómo compartir?</b> Copia los horarios y compártelos con los asistentes.</li>
          </ul>
        </details>
      </div>
    </div>
  </div>
  <script>
    function onLanguageChange() {
      var lang = document.getElementById("languageSelector").value;
      window.location.href = "meeting-planner-" + lang + ".html";
    }
  </script>
</body>
</html>
