<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <title>Stopwatch — TimerHaven</title>

  <style>
    body { background: #f4f7fb; font-family: 'Montserrat', Arial, sans-serif; }
    .main-container { max-width: 1200px; margin: 2em auto; display: flex; justify-content: center; align-items: center; min-height: 90vh; padding: 0 1rem; }
    .center-row { display: flex; flex-direction: row; justify-content: center; align-items: flex-start; gap: 2em; width: 100%; }
    .article-card { background: #fff; border-radius: 16px; box-shadow: 0 2px 12px #e0e7ef; width: 340px; min-width: 200px; min-height: 340px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; padding: 2em 1.3em 1em 1.3em; text-align: left; overflow: hidden; box-sizing: border-box; }
    .article-card h2 { font-size: 1.25em; font-weight: 700; margin-bottom: 0.6em; color: #185a9d; }
    .article-card ul, .article-card ol { margin-left: 1em; font-size: 1em; margin-bottom: 0.2em; padding-right: 0.2em; word-break: break-word; color: #374151; }
    .article-card .btn { align-self: stretch; font-weight: 600; border-radius: 8px; margin-top: 0.6em; box-sizing: border-box; }
    .tool-card { background: #fff; border-radius: 16px; box-shadow: 0 2px 12px #e0e7ef; width: 340px; min-width: 240px; min-height: 330px; display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; padding: 2em 1.5em 1em 1.5em; text-align: left; position: relative; z-index: 1; }
    .tool-card h3 { font-size: 1.35em; font-weight: 700; margin-bottom: 0.5em; color: #185a9d; }
    .stopwatch-display { font-weight: 700; font-size: 1.25rem; margin-top: 0.5rem; margin-bottom: 0.5rem; }
    .controls-row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-top: 0.5rem; }
    .lap-list { margin-top: 0.8rem; }
    .back-link { display: block; margin-bottom: 0.5em; color: #185a9d; text-decoration: none; font-weight: 600; font-size: 1em; }
    .back-link:hover { text-decoration: underline; color: #43cea2; }
    .faq-section { margin-top: 1em; margin-bottom: 0.3em; font-size: 1em; background: #f7fafc; border-radius: 8px; padding: 1em; box-shadow: 0 1px 4px #e0e7ef; }
    .faq-section summary { font-weight: bold; font-size: 1em; cursor: pointer; margin-bottom: 0.5em; }
    .btn-small { padding: 0.35rem 0.7rem; font-size: 0.9rem; }

    /* Non-editable language indicator (top-right) */
    .language-indicator {
      position: fixed;
      right: 18px;
      top: 16px;
      z-index: 12000;
      display:flex;
      align-items:center;
      gap:8px;
      color:#185a9d;
      font-weight:600;
      background: rgba(255,255,255,0.95);
      padding: 8px 12px;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(8,20,40,0.06);
      font-size: 0.98em;
    }
    .language-indicator .lang-label { margin-right: 6px; }
    .language-indicator .lang-name { background: linear-gradient(90deg,#43cea2 0%,#185a9d 100%); color:#fff; padding:6px 10px; border-radius:8px; font-weight:700; box-shadow: 0 2px 8px #e0e7ef; }

    @media (max-width: 1100px) { .main-container{padding:0 8px;} .center-row{gap:1em;} .tool-card,.article-card{width:97vw;max-width:540px;height:auto;} }
    @media (max-width: 800px) { .main-container{padding:0;} .center-row{flex-direction:column;align-items:center;} .tool-card,.article-card{width:98vw;max-width:540px;height:auto;} .article-card { display: none !important; } }

    const langNames = { en: "English", fr: "Français", es: "Español", de: "Deutsch", ru: "Русский", el: "Ελληνικά", ar: "العربية" };

    function getLang() {
      try {
        const l = localStorage.getItem('timerhavenLang') || 'en';
        return (l && l.slice(0,2)) || 'en';
      } catch (e) {
        return 'en';
      }
    }

    function applyLanguage(lang) {
      lang = (lang || getLang()).slice(0,2);
      const t = translations[lang] || translations['en'];

      // RTL support
      document.documentElement.lang = lang;
      document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';

      // language indicator
      const labelEl = document.getElementById('language-label');
      const nameEl = document.getElementById('language-name');
      if (labelEl) labelEl.textContent = t['language-label'] || 'Language:';
      if (nameEl) nameEl.textContent = langNames[lang] || lang;

      // Article 1 (left)
      document.getElementById('howto-title').innerHTML = t.howtoTitle || '';
      document.getElementById('howto-steps').innerHTML = (t.howtoSteps || []).map(s => `<li>${s}</li>`).join('');
      document.getElementById('howto-link').textContent = t.howtoLink || '';
      document.getElementById('howto-link').href = (lang === 'en') ? 'stopwatch-how-to.html' : `stopwatch-how-to-${lang}.html`;

      // Tool card
      document.getElementById('back-link').innerHTML = t.backLink || '';
      document.getElementById('tool-title').innerHTML = t.toolTitle || '';

      // Buttons
      document.getElementById('swStartBtn').textContent = t.startBtn || '';
      document.getElementById('swPauseBtn').textContent = t.pauseBtn || '';
      document.getElementById('swResetBtn').textContent = t.resetBtn || '';
      document.getElementById('swLapBtn').textContent = t.lapBtn || '';

      // FAQ
      document.getElementById('faq-title').textContent = t.faqTitle || '';
      document.getElementById('faq-list').innerHTML = (t.faqList || []).map(s => `<li>${s}</li>`).join('');

      // Article 2 (right)
      document.getElementById('tips-title').innerHTML = t.tipsTitle || '';
      document.getElementById('tips-list').innerHTML = (t.tipsList || []).map(s => `<li>${s}</li>`).join('');
      document.getElementById('tips-link').textContent = t.tipsLink || '';
      document.getElementById('tips-link').href = (lang === 'en') ? 'stopwatch-tips.html' : `stopwatch-tips-${lang}.html`;
    }

    // listen for main-menu language changes
    window.addEventListener('storage', function(e) {
      if (e.key === 'timerhavenLang') {
        applyLanguage((e.newValue || 'en').slice(0,2));
      }
    });

    // Stopwatch logic
    let swTimer = null, swStart = null, swElapsed = 0, swRunning = false, laps = [];

    function swFormat(ms) {
      const t = Math.floor(ms / 1000);
      const h = Math.floor(t / 3600);
      const m = Math.floor((t % 3600) / 60);
      const s = t % 60;
      return String(h).padStart(2,'0')+":"+String(m).padStart(2,'0')+":"+String(s).padStart(2,'0');
    }

    function renderLaps() {
      const lapList = document.getElementById('lapList');
      const lang = getLang();
      const t = translations[lang] || translations['en'];
      lapList.innerHTML = laps.map((l,i) => {
        return `<div class="lap-item">${t.lapLabel || 'Lap'} ${i+1}: ${swFormat(l)}</div>`;
      }).join('');
    }

    function swUpdateDisplay() {
      document.getElementById('swDisplay').textContent = swFormat(swElapsed);
      renderLaps();
    }

    // initialize after DOM is ready
    document.addEventListener('DOMContentLoaded', function() {
      // apply language from main site
      applyLanguage(getLang());

      document.getElementById('swStartBtn').onclick = function() {
        if (swRunning) return;
        swRunning = true;
        swStart = Date.now() - swElapsed;
        swTimer = setInterval(function(){
          swElapsed = Date.now() - swStart;
          swUpdateDisplay();
        }, 100);
      };

      document.getElementById('swPauseBtn').onclick = function() {
        swRunning = false;
        clearInterval(swTimer);
      };

      document.getElementById('swResetBtn').onclick = function() {
        swRunning = false;
        clearInterval(swTimer);
        swElapsed = 0;
        laps = [];
        swUpdateDisplay();
      };

      document.getElementById('swLapBtn').onclick = function() {
        if (swRunning) laps.push(swElapsed);
        swUpdateDisplay();
      };

      swUpdateDisplay();
    });
  </script>
