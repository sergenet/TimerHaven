<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-itunes-app" content="app-id=6756510490">
  <title>Offline — TimerHaven</title>
  <meta name="theme-color" content="#185a9d">
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Montserrat", Arial, sans-serif;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      color: #1c2733;
    }
    .card {
      width: min(480px, 100%);
      background: #fff;
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 12px 40px rgba(24, 90, 157, 0.18);
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 1.35rem; color: #185a9d; }
    p { margin: 0 0 20px; line-height: 1.5; color: #445; font-size: 0.95rem; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    a {
      display: block;
      padding: 13px 16px;
      border-radius: 12px;
      background: #f1f7fb;
      color: #185a9d;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { background: #e3f1f8; }
  </style>
</head>
<body>
  <main class="card">
    <h1>You're offline</h1>
    <p>The timer pages you already opened still work. Reconnect to reach the rest of TimerHaven.</p>
    <ul>
      <li><a href="/pomodoro-en.html">Pomodoro Timer</a></li>
      <li><a href="/countdown-en.html">Countdown Timer</a></li>
      <li><a href="/stopwatch-en.html">Stopwatch</a></li>
      <li><a href="/notes-en.html">Notes</a></li>
      <li><a href="/">All tools</a></li>
    </ul>
  </main>
</body>
</html>
