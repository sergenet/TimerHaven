<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimerHaven</title>
  <style>
    :root {
      --primary: #185a9d;
      --secondary: #43cea2;
      --text: #ffffff;
      --bg: #0f172a;
    }
    body {
      width: 320px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      padding: 1.25rem;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .header h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .header p {
      margin: 4px 0 0 0;
      font-size: 0.75rem;
      opacity: 0.9;
    }
    .container {
      padding: 1.25rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.85rem;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 0.9rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      color: inherit;
    }
    .card:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
      border-color: var(--secondary);
    }
    .card-icon {
      font-size: 1.5rem;
      margin-bottom: 0.4rem;
      display: block;
    }
    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
    }
    .footer {
      padding: 1rem 1.25rem;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-main {
      background: var(--secondary);
      color: var(--bg);
      border: none;
      padding: 0.65rem 1.2rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      text-decoration: none;
      display: inline-block;
      box-sizing: border-box;
      transition: opacity 0.2s;
    }
    .btn-main:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>TIMERHAVEN</h1>
    <p>Privacy-First Focus & Productivity</p>
  </div>
  <div class="container">
    <div class="grid">
      <a href="https://timerhaven.com/pomodoro.html" target="_blank" class="card">
        <span class="card-icon">🍅</span>
        <span class="card-title" data-i18n="pomodoro">Pomodoro</span>
      </a>
      <a href="https://timerhaven.com/timer.html" target="_blank" class="card">
        <span class="card-icon">⏱️</span>
        <span class="card-title" data-i18n="timer">Timer</span>
      </a>
      <a href="https://timerhaven.com/stopwatch.html" target="_blank" class="card">
        <span class="card-icon">🕒</span>
        <span class="card-title" data-i18n="stopwatch">Stopwatch</span>
      </a>
      <a href="https://timerhaven.com/clipboard-manager.html" target="_blank" class="card">
        <span class="card-icon">📋</span>
        <span class="card-title" data-i18n="clips">Clips</span>
      </a>
    </div>
  </div>
  <div class="footer">
    <a href="https://timerhaven.com/index.html" target="_blank" class="btn-main" data-i18n="launchBtn">Launch All Web Tools</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
