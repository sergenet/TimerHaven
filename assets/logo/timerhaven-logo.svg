<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#43cea2"/>
      <stop offset="1" stop-color="#185a9d"/>
    </linearGradient>
  </defs>
  <circle cx="150" cy="150" r="140" fill="#ffffff" />
  <circle cx="150" cy="150" r="120" fill="url(#g1)" />
  <!-- Timer body -->
  <rect x="110" y="100" rx="14" ry="14" width="80" height="70" fill="#0a2540"/>
  <!-- Digital display -->
  <rect x="122" y="116" rx="6" ry="6" width="56" height="24" fill="#eaf6f7"/>
  <text x="150" y="134" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#0a2540">25:00</text>
  <!-- small top knob -->
  <rect x="142" y="86" width="16" height="8" rx="4" fill="#ff6a3d"/>
  <!-- outer ring stroke -->
  <circle cx="150" cy="150" r="140" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
</svg>