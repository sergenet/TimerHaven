<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <title>Habit Tracker — TimerHaven</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="description" content="Verfolge tägliche Gewohnheiten und baue Routinen auf. Lerne, wie du den Habit Tracker verwendest, erhalte Produktivitätstipps, FAQs und Fachartikel."/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/assets/css/tool-theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    :root{--brand:#0b63a0;--muted:#6b7c89;--card:#fff;--bg:#fbfeff}
    html,body{height:100%}
    body{background:var(--bg);font-family:'Montserrat',Arial,sans-serif;color:var(--text-dark,#102a43);margin:0;padding:2rem}

    .container{max-width:720px;margin:0 auto}
    .card{background:var(--card);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,0.06);padding:1.6rem 1.5rem;box-sizing:border-box}

    /* Make Back and Read-guide consistent blue */
    .back-link{display:inline-block;margin-bottom:.75rem;color:#007bff !important;text-decoration:none;font-weight:700}
    .back-link:hover{text-decoration:underline}
    .tool-title{font-size:1.35rem;margin:0 0 .4rem 0;display:flex;align-items:center;gap:.4rem;color:#185a9d}

    .cta{
      display:inline-block;
      margin:.35rem 0 .8rem 0;
      padding:.45rem .7rem;
      border-radius:8px;
      background:#007bff !important;
      color:#fff !important;
      text-decoration:none;
      font-weight:700;
      font-size:.95rem;
      border:none;
      box-shadow:0 6px 18px rgba(0,123,255,0.08);
    }

    .stats-bar{background:#f6fbfa;border-radius:10px;margin-bottom:1.2rem;padding:.7rem 1rem;font-size:1.05rem;font-weight:600;color:#185a9d;display:flex;gap:2em;align-items:center;justify-content:space-between}
    .habit-form{margin-bottom:1rem;display:flex;gap:.5rem}
    .habit-list{margin-bottom:1rem}
    .habit-item{background:#f7fafc;border-radius:7px;padding:.6rem .8rem;margin-bottom:.6rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .habit-meta{font-size:.9em;color:#888;margin-left:.6em;margin-right:1em}
    .habit-history{display:flex;gap:3px;margin-left:1em;align-items:center}
    .dot{width:15px;height:15px;border-radius:50%;display:inline-block;background:#e0e7ef;border:1px solid #d0d0d0}
    .dot.done{background:#43cea2;border:1.5px solid #185a9d}
    .dot.today{border:2px solid #43cea2}
    .archive-btn{font-size:.9em;margin-left:.6em;background:#fff;border:1px solid #43cea2;color:#43cea2;border-radius:6px;padding:.15rem .7rem}
    .archive-btn.archived{opacity:.65;color:#888;border-color:#d0d0d0}
    .banner{background:linear-gradient(90deg,#43cea2 0%,#185a9d 100%);color:#fff;border-radius:10px;font-size:1.11em;font-weight:600;text-align:center;margin-bottom:1em;padding:.7em .8em;display:none}
    .faq-section summary{cursor:pointer;padding:.2rem 0;font-weight:700}
    .faq-section ul{margin-top:.5rem;color:var(--muted);padding-left:1rem}

    @media (max-width:900px) { .card{padding:1rem} }
  </style>
</head>
<body>
  <script>try{ localStorage.setItem('timerhavenLang','de'); }catch(e){};</script>

  <main class="container" role="main">
    <section class="card tool-card" aria-labelledby="tool-title">
      <a href="index.html" class="back-link" id="back-link">← Zurück zum Hauptmenü</a>

      <div id="tool-title" class="tool-title"><i class="fa fa-check-double"></i> Habit Tracker</div>

      <!-- Read full guide button (canonical absolute path) -->
      <p style="margin:0 0 .6rem 0;">
        <a id="read-guide-btn" class="cta" href="https://timerhaven.com/de/habit-tracker/habit-tracker-index.html" role="button" target="_blank" rel="noopener">Ganzer Artikel</a>
      </p>

      <div id="banner" class="banner" style="display:none;"></div>

      <div id="stats-bar" class="stats-bar">Verfolgt: 0 &bull; Heute erledigt: 0 &bull; Beste Serie: 0</div>

      <div class="habit-section">
        <form class="habit-form" id="habitForm">
          <input type="text" id="habitInput" class="form-control" placeholder="Gewohnheit">
          <button type="submit" class="btn btn-success btn-sm" id="add-btn">Hinzufügen</button>
        </form>

        <div id="habitList" class="habit-list"></div>
      </div>

      <details class="faq-section">
        <summary id="faq-title">Häufig gestellte Fragen</summary>
        <ul id="faq-list" style="padding-left:1em;"></ul>
      </details>
    </section>
  </main>

  <script>
    // German translations (focused)
    const habitTranslations = {
      de: {
        "language-label":"Sprache:",
        "back-link":"← Zurück zum Hauptmenü",
        "tool-title":"Habit Tracker",
        "habitInput":"Gewohnheit",
        "add-btn":"Hinzufügen",
        "banner-all-done":"🎉 Alle Gewohnheiten für heute erledigt! Gut gemacht!",
        "stats-tracked":"Verfolgt: ",
        "stats-done":"Heute erledigt: ",
        "stats-best":"Beste Serie: ",
        "howto-title":'<i class="fa fa-check-double"></i> Wie man den Habit Tracker nutzt',
        "howto-steps":`<li><b>Gewohnheit hinzufügen:</b> Geben Sie Ihre tägliche Gewohnheit ein und klicken Sie auf Hinzufügen.</li>
          <li><b>Als erledigt markieren:</b> Wenn Sie eine Gewohnheit abgeschlossen haben, klicken Sie auf Erledigt.</li>
          <li><b>Entfernen/Archivieren:</b> Löschen oder archivieren Sie Gewohnheiten, die Sie nicht mehr verfolgen möchten.</li>
          <li><b>Täglich wiederholen:</b> Kehren Sie jeden Tag zurück, um Ihren Fortschritt zu aktualisieren.</li>`,
        "howto-article-btn":"Ganzer Artikel",
        "howto-article-link":"https://timerhaven.com/de/habit-tracker/habit-tracker-index.html",
        "tips-title":'<i class="fa fa-lightbulb" style="color:#43cea2;"></i> Produktivitätstipps',
        "tips-list":`<li><b>Klein anfangen:</b> Beginnen Sie mit einfachen Gewohnheiten.</li>
          <li><b>Täglich verfolgen:</b> Beständigkeit ist entscheidend.</li>
          <li><b>Fortschritt feiern:</b> Erkennen Sie kleine Erfolge an.</li>`,
        "tips-article-btn":"Ganzer Artikel",
        "tips-article-link":"habit-tips-de.html",
        "tips-mobile-title":'<i class="fa fa-lightbulb" style="color:#43cea2;"></i> Tipps',
        "tips-mobile-list":`<li><b>Klein anfangen:</b> Schrittweise aufbauen.</li>
          <li><b>Serien verfolgen:</b> Überprüfen Sie Ihre Serien zur Motivation.</li>
          <li><b>Erinnerungen setzen:</b> Nutzen Sie Kalendererinnerungen.</li>`,
        "faq-title":"Häufig gestellte Fragen",
        "faq-list":`<li><b>Werden Gewohnheiten gespeichert?</b> Ja, im Browser.</li>
          <li><b>Mehrere Gewohnheiten?</b> Ja.</li>
          <li><b>Serien sichtbar?</b> Ja, für jede Gewohnheit.</li>`,
        "mark-done":"Erledigt",
        "done-today":"Heute erledigt",
        "streak":"Serie: ",
        "longest":"Bestes: ",
        "archive":"Archivieren",
        "unarchive":"Wiederherstellen",
        "delete":"Löschen",
        "no-habits":"Noch keine Gewohnheiten."
      }
    };

    function getTodayStr(){
      const d = new Date();
      return d.getFullYear() + "-" + (d.getMonth()+1).toString().padStart(2,"0") + "-" + d.getDate().toString().padStart(2,"0");
    }
    function lastNDays(n){
      const arr = [];
      for (let i = n-1; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        arr.push(d.getFullYear() + "-" + (d.getMonth()+1).toString().padStart(2,"0") + "-" + d.getDate().toString().padStart(2,"0"));
      }
      return arr;
    }

    let habits = JSON.parse(localStorage.getItem('habits') || '[]');

    function getLang(){
      try { const l = localStorage.getItem('timerhavenLang') || 'de'; return (l && l.slice(0,2)) || 'de'; } catch(e) { return 'de'; }
    }

    function applyLanguage(lang) {
      lang = (lang || getLang()).slice(0,2);
      const t = habitTranslations[lang] || habitTranslations['de'];
      document.body.dir = (lang === "ar") ? "rtl" : "ltr";
      const back = document.getElementById('back-link'); if (back) back.textContent = t['back-link'] || '';
      const toolTitle = document.getElementById('tool-title'); if (toolTitle) toolTitle.innerHTML = `<i class="fa fa-check-double"></i> ${t['tool-title'] || ''}`;
      const input = document.getElementById('habitInput'); if (input) input.placeholder = t['habitInput'] || '';
      const addBtn = document.getElementById('add-btn'); if (addBtn) addBtn.textContent = t['add-btn'] || '';
      const faqTitle = document.getElementById('faq-title'); if (faqTitle) faqTitle.textContent = t['faq-title'] || '';
      const faqList = document.getElementById('faq-list'); if (faqList) faqList.innerHTML = t['faq-list'] || '';
      const readBtn = document.getElementById('read-guide-btn'); if (readBtn) { readBtn.textContent = t['howto-article-btn'] || 'Ganzer Artikel'; readBtn.href = t['howto-article-link'] || 'https://timerhaven.com/de/habit-tracker/habit-tracker-index.html'; readBtn.target = '_blank'; readBtn.rel = 'noopener'; }

      // tips mobile visibility
      const mobileDetails = document.getElementById('tips-mobile');
      if (mobileDetails) {
        mobileDetails.style.display = (window.innerWidth < 801) ? 'block' : 'none';
        const tipsMobileTitle = document.getElementById('tips-mobile-title');
        const tipsMobileList = document.getElementById('tips-mobile-list');
        if (tipsMobileTitle) tipsMobileTitle.innerHTML = t['tips-mobile-title'] || '';
        if (tipsMobileList) tipsMobileList.innerHTML = t['tips-mobile-list'] || '';
      }
    }

    function saveHabits(){ localStorage.setItem('habits', JSON.stringify(habits)); }

    function resetHabitsIfNeeded(){
      const today = getTodayStr();
      let changed = false;
      habits.forEach(habit => {
        if (!habit.history) habit.history = [];
        if (habit.lastChecked !== today) {
          habit.doneToday = false;
          habit.lastChecked = today;
          changed = true;
        }
      });
      if (changed) saveHabits();
    }

    function renderHabits() {
      resetHabitsIfNeeded();
      const lang = getLang();
      const t = habitTranslations[lang] || habitTranslations['de'];
      const list = document.getElementById('habitList');
      list.innerHTML = '';
      const today = getTodayStr();
      let doneTodayCount = 0;
      let bestStreak = 0;
      let activeCount = 0;
      habits.forEach(h => { if (!h.archived) activeCount++; });
      if (habits.length === 0 || activeCount === 0) {
        list.innerHTML = `<div style="color:#888;">${t["no-habits"]}</div>`;
      }
      habits.forEach((habit, idx) => {
        if (habit.archived) return;
        let streak = habit.streak || 0;
        let longest = habit.longest || streak;
        bestStreak = Math.max(bestStreak, longest);
        if (!habit.history) habit.history = [];
        let historyDots = "";
        lastNDays(7).forEach((date) => {
          const done = habit.history.includes(date);
          historyDots += `<span class="dot${done ? ' done' : ''}${date === today ? ' today' : ''}" title="${date}"></span>`;
        });
        const isDone = habit.doneToday;
        if (isDone) doneTodayCount++;
        list.innerHTML += `
          <div class="habit-item">
            <span><b>${habit.name}</b>
              <span class="habit-meta">${t["streak"]}${streak} ${t["longest"]}${longest}</span>
              <span class="habit-history">${historyDots}</span>
            </span>
            <div>
              <button class="btn btn-outline-${isDone ? 'secondary' : 'success'} btn-sm habit-btn" onclick="markDone(${idx})" ${isDone ? 'disabled' : ''}>
                ${isDone ? t["done-today"] : t["mark-done"]}
              </button>
              <button class="archive-btn${habit.archived ? ' archived' : ''}" onclick="archiveHabit(${idx})">
                ${habit.archived ? t["unarchive"] : t["archive"]}
              </button>
              <button class="btn btn-outline-danger btn-sm habit-btn" onclick="deleteHabit(${idx})"><i class="fa fa-trash"></i> ${t["delete"]}</button>
            </div>
          </div>
        `;
      });
      renderStats(activeCount, doneTodayCount, bestStreak);
      renderBanner(activeCount, doneTodayCount);
    }

    function renderStats(tracked, done, best) {
      const t = habitTranslations[getLang()] || habitTranslations['de'];
      document.getElementById("stats-bar").innerHTML =
        `${t["stats-tracked"]}${tracked} &bull; ${t["stats-done"]}${done} &bull; ${t["stats-best"]}${best}`;
    }

    function renderBanner(tracked, done) {
      const t = habitTranslations[getLang()] || habitTranslations['de'];
      const banner = document.getElementById("banner");
      if (tracked > 0 && done === tracked) {
        banner.textContent = t["banner-all-done"] || habitTranslations["de"]["banner-all-done"];
        banner.style.display = "block";
      } else {
        banner.style.display = "none";
      }
    }

    document.getElementById('habitForm').addEventListener('submit', function(e){
      e.preventDefault();
      const name = document.getElementById('habitInput').value.trim();
      if (!name) return;
      habits.push({
        name,
        streak: 0,
        longest: 0,
        doneToday: false,
        lastChecked: getTodayStr(),
        history: [],
        archived: false
      });
      saveHabits();
      document.getElementById('habitInput').value = "";
      renderHabits();
    });

    window.markDone = function(idx){
      const today = getTodayStr();
      if (!habits[idx].doneToday) {
        habits[idx].doneToday = true;
        habits[idx].lastChecked = today;
        habits[idx].streak = (habits[idx].streak || 0) + 1;
        habits[idx].longest = Math.max(habits[idx].longest || 0, habits[idx].streak);
        if (!habits[idx].history) habits[idx].history = [];
        if (!habits[idx].history.includes(today)) habits[idx].history.push(today);
        saveHabits();
        renderHabits();
      }
    }

    window.archiveHabit = function(idx){
      habits[idx].archived = !habits[idx].archived;
      saveHabits();
      renderHabits();
    }

    window.deleteHabit = function(idx){
      habits.splice(idx, 1);
      saveHabits();
      renderHabits();
    }

    window.addEventListener('storage', function(e) {
      if (e.key === 'timerhavenLang') {
        const lang = (e.newValue || getLang()).slice(0,2);
        applyLanguage(lang);
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      applyLanguage(getLang());
      renderHabits();
      window.addEventListener('resize', function(){ applyLanguage(getLang()); });
    });
  </script>

  <footer style="text-align:center;margin-top:1.2rem;color:var(--muted);">
    &copy; 2025 TimerHaven. Alle Tools sind kostenlos und datenschutzfreundlich.<br/>
    <a href="privacy.html">Datenschutz</a> &bull;
    <a href="terms.html">Nutzungsbedingungen</a> &bull;
    <a href="contact.html">Kontakt</a>
  </footer>
</body>
</html>
