<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Countdown Timer — TimerHaven</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Set a countdown timer for deadlines, events, or meetings. Learn how to use the Countdown Timer, get productivity tips, FAQs, and read expert articles.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body { background: #f4f7fb; font-family: 'Montserrat', Arial, sans-serif; }
    .main-container { max-width: 1200px; margin: 2em auto; display: flex; justify-content: center; align-items: center; min-height: 90vh; padding: 0 12px; }
    .center-row { width:100%; display:flex; justify-content:center; align-items:flex-start; }
    .tool-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px #e0e7ef;
      width: 100%;
      max-width: 520px;
      min-width: 220px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      padding: 1.6rem 1.3rem;
      box-sizing: border-box;
    }
    .tool-card h3 { font-size: 1.35em; font-weight: 700; margin-bottom: 0.4em; display: flex; align-items: center; gap: 0.3em; color: #185a9d; }
    .help-section { margin-bottom: 1rem; color:#51606b; }
    .countdown-row { display:flex; gap:1.25rem; align-items:flex-start; justify-content:center; flex-wrap:wrap; margin-bottom:.8rem; }
    .time-group { display:flex; flex-direction:column; align-items:center; gap:.35rem; min-width:92px; }
    .time-group label { font-weight:600; font-size:.95rem; margin:0; text-align:center; }
    .time-input { width:120px; text-align:center; padding:.375rem .5rem; }
    .controls { display:flex; gap:.6rem; justify-content:center; margin-top:.6rem; flex-wrap:wrap; align-items:center; }
    #display { font-size:2em; margin-top:1.2rem; text-align:center; }
    .faq-section { margin-top: 1.1em; margin-bottom: 0.3em; font-size: 1rem; background: #f7fafc; border-radius: 8px; padding: 1rem; box-shadow: 0 1px 4px #e0e7ef; }
    .faq-section summary { font-weight:700; font-size:1.02rem; cursor:pointer; }
    .back-link { display:inline-block; margin-bottom:0.8rem; color:#007bff; text-decoration:none; font-weight:700; }
    .back-link:hover { text-decoration: underline; }
    .read-guide { display:inline-flex; align-items:center; justify-content:center; width:auto; align-self:flex-start; margin:.35rem 0 .8rem 0; padding:.45rem .7rem; border-radius:8px; background:#007bff; color:#fff; text-decoration:none; font-weight:700; font-size:.95rem; border:none; box-sizing:border-box; }
    .beep-indicator { display:inline-block; margin-left:.6rem; padding:.25rem .5rem; border-radius:999px; font-weight:700; color:#fff; background:#ffb703; font-size:.85rem; }
    @media (max-width: 820px) { .tool-card{max-width:97vw;} .countdown-row{justify-content:center;} .time-input{width:96px;} }

    /* lightweight non-blocking modal (centered) */
    .timeup-modal-backdrop {
      position:fixed; inset:0; background: rgba(0,0,0,0.36); display:none; align-items:center; justify-content:center; z-index:12000;
    }
    .timeup-modal {
      background:#fff; padding:1.1rem 1.2rem; border-radius:10px; box-shadow:0 8px 30px rgba(0,0,0,0.18); max-width:360px; width:92%;
    }
    .timeup-modal h4 { margin:0 0 .6rem 0; font-size:1.05rem;}
    .timeup-modal p { margin:0 0 .8rem 0; color:#22313f; }
  </style>
</head>
<body>

<div class="main-container">
  <div class="center-row">
    <div class="tool-card" role="main" aria-labelledby="tool-title">
      <a href="index.html" class="back-link" id="back-link">← Back to Main Menu</a>

      <h3 id="tool-title"><i class="fa fa-stopwatch-20"></i> Countdown Timer</h3>

      <a id="read-guide-btn" class="read-guide" href="https://timerhaven.com/en/countdown-timer/countdown-index.html" role="button" target="_blank" rel="noopener">Read full guide</a>

      <div class="help-section" id="tool-help">Set a countdown timer for deadlines, events, or meetings.</div>

      <div class="countdown">
        <div class="countdown-row" aria-label="Countdown inputs">
          <div class="time-group">
            <label for="hours">Hours</label>
            <input type="number" id="hours" class="form-control time-input" inputmode="numeric" min="0" placeholder="00" aria-label="Hours" maxlength="3" value="00">
          </div>

          <div class="time-group">
            <label for="minutes">Minutes</label>
            <input type="number" id="minutes" class="form-control time-input" inputmode="numeric" min="0" placeholder="00" aria-label="Minutes" maxlength="3" value="00">
          </div>

          <div class="time-group">
            <label for="seconds">Seconds</label>
            <input type="number" id="seconds" class="form-control time-input" inputmode="numeric" min="0" max="59" placeholder="00" aria-label="Seconds" maxlength="2" value="00">
          </div>
        </div>

        <div class="controls" role="toolbar" aria-label="Timer controls">
          <button id="startBtn" class="btn btn-success"><i class="fa fa-play"></i> Start</button>
          <button id="pauseBtn" class="btn btn-secondary"><i class="fa fa-pause"></i> Pause</button>
          <button id="resetBtn" class="btn btn-danger"><i class="fa fa-refresh"></i> Reset</button>
          <button id="stopBeepBtn" class="btn btn-outline-dark" title="Stop sound" disabled><i class="fa fa-volume-off"></i> Stop Beep</button>
          <span id="beepIndicator" class="beep-indicator" style="display:none">Beep playing</span>
        </div>

        <div id="display" aria-live="polite">00:00:00</div>
      </div>

      <details class="faq-section">
        <summary id="faq-title">FAQs</summary>
        <ul id="faq-list" style="margin-top:.5rem;"></ul>
      </details>
    </div>
  </div>
</div>

<!-- non-blocking "time's up" modal -->
<div id="timeupBackdrop" class="timeup-modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="timeup-modal" role="document" aria-labelledby="timeupTitle">
    <h4 id="timeupTitle">Time's up!</h4>
    <p>The countdown has finished.</p>
    <div style="text-align:right">
      <button id="timeupOkBtn" class="btn btn-primary">OK</button>
    </div>
  </div>
</div>

<script>
  // keep English UI for standalone
  localStorage.setItem('timerhavenLang','en');

  const countdownTranslations = {
    en: {
      "language-label":"Language:",
      "back-link":"Back to Main Menu",
      "tool-title":"Countdown Timer",
      "tool-help":"Set a countdown timer for deadlines, events, or meetings.",
      "hours":"Hours","minutes":"Minutes","seconds":"Seconds",
      "start":"Start","pause":"Pause","resume":"Resume","reset":"Reset",
      "display":"00:00:00","alert-end":"Time's up!","faq-title":"FAQs",
      "faq-list":`<li><b>Will the timer keep running if I switch tabs?</b> Yes, as long as this page is open.</li>
        <li><b>Can I set a timer for long durations?</b> Yes — use Hours + Minutes for longer timers.</li>
        <li><b>Can I pause the timer?</b> Yes, use the "Pause" button.</li>`
    }
  };

  function getLang(){ try{ const l = localStorage.getItem('timerhavenLang') || 'en'; return (l && l.slice(0,2)) || 'en'; }catch(e){return 'en';} }

  // audio context + continuous beep
  let audioCtx = null, beepOsc = null, beepGain = null, beepPlaying = false;

  function ensureAudioContext() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    return !!audioCtx;
  }

  function updateStopBeepUI() {
    const btn = document.getElementById('stopBeepBtn');
    const indicator = document.getElementById('beepIndicator');
    if (!btn || !indicator) return;
    btn.disabled = !beepPlaying;
    indicator.style.display = beepPlaying ? 'inline-block' : 'none';
  }

  // Robust startContinuousBeep / stopBeep replacements
  function startContinuousBeep(frequency = 880, gainLevel = 0.18) {
    try {
      // Ensure audio context is created and resumed from a user gesture
      if (!ensureAudioContext()) {
        console.warn('AudioContext unavailable — cannot play beep');
        return false;
      }

      // If something is already playing, stop first
      try { stopBeep(); } catch(e){ /* ignore */ }

      // Create oscillator + gain
      beepOsc = audioCtx.createOscillator();
      beepGain = audioCtx.createGain();

      // Oscillator setup
      beepOsc.type = 'sine';
      beepOsc.frequency.value = frequency;

      // Connect nodes
      beepOsc.connect(beepGain);
      beepGain.connect(audioCtx.destination);

      // Immediately set gain to audible level (no zero ramp) to avoid inaudible state
      try {
        const now = audioCtx.currentTime || 0;
        // Use setValueAtTime for reliability, then small ramp for smoothness
        beepGain.gain.setValueAtTime(gainLevel, now);
      } catch (e) {
        // Fallback if scheduling fails
        try { beepGain.gain.value = gainLevel; } catch(_) {}
      }

      // Start oscillator
      try {
        beepOsc.start();
      } catch (e) {
        // Some browsers require start time param
        try { beepOsc.start(audioCtx.currentTime || 0); } catch (err) { console.warn('osc.start() failed', err); }
      }

      // Mark playing and update UI
      beepPlaying = true;
      updateStopBeepUI && updateStopBeepUI();
      console.info('beep started', { frequency, gainLevel });
      return true;
    } catch (err) {
      console.warn('startContinuousBeep error', err);
      // Clean up partially-created nodes
      try { if (beepOsc) { beepOsc.disconnect(); beepOsc = null; } } catch(e){}
      try { if (beepGain) { beepGain.disconnect(); beepGain = null; } } catch(e){}
      beepPlaying = false;
      updateStopBeepUI && updateStopBeepUI();
      return false;
    }
  }

  function stopBeep() {
    try {
      if (beepOsc) {
        try { beepOsc.stop(); } catch(e){ /* ignore */ }
        try { beepOsc.disconnect(); } catch(e){ /* ignore */ }
      }
    } catch(e){}
    // ensure references are cleared
    beepOsc = null;
    try { if (beepGain) { try { beepGain.disconnect(); } catch(e){} } } catch(e){}
    beepGain = null;
    // Do NOT immediately close the AudioContext here — closing prevents quick re-use on some devices.
    // But if you prefer to close to release hardware, uncomment:
    // if (audioCtx) { try { audioCtx.close(); } catch(e){} audioCtx = null; }
    beepPlaying = false;
    updateStopBeepUI && updateStopBeepUI();
    console.info('beep stopped');
  }

  function applyLanguage(lang) {
    lang = (lang || getLang()).slice(0,2);
    const t = countdownTranslations[lang] || countdownTranslations['en'];
    document.body.dir = (lang === 'ar') ? 'rtl' : 'ltr';
    const back = document.getElementById('back-link'); if (back) back.textContent = '← ' + (t['back-link'] || '');
    const tt = document.getElementById('tool-title'); if (tt) tt.innerHTML = `<i class="fa fa-stopwatch-20"></i> ${t['tool-title'] || ''}`;
    const help = document.getElementById('tool-help'); if (help) help.textContent = t['tool-help'] || '';
    const hrs = document.getElementById('hours'); const mins = document.getElementById('minutes'); const secs = document.getElementById('seconds');
    if (hrs) { hrs.placeholder = t['hours'] || 'Hours'; if (!hrs.value) hrs.value = '00'; }
    if (mins) { mins.placeholder = t['minutes'] || 'Minutes'; if (!mins.value) mins.value = '00'; }
    if (secs) { secs.placeholder = t['seconds'] || 'Seconds'; if (!secs.value) secs.value = '00'; }
    const startBtn = document.getElementById('startBtn'); const pauseBtn = document.getElementById('pauseBtn'); const resetBtn = document.getElementById('resetBtn');
    if (startBtn) startBtn.innerHTML = '<i class="fa fa-play"></i> ' + (t['start'] || 'Start');
    if (pauseBtn) pauseBtn.innerHTML = '<i class="fa fa-pause"></i> ' + (t['pause'] || 'Pause');
    if (resetBtn) resetBtn.innerHTML = '<i class="fa fa-refresh"></i> ' + (t['reset'] || 'Reset');
    const faqTitle = document.getElementById('faq-title'); if (faqTitle) faqTitle.textContent = t['faq-title'] || '';
    const faqList = document.getElementById('faq-list'); if (faqList) faqList.innerHTML = t['faq-list'] || '';
    const readBtn = document.getElementById('read-guide-btn'); if (readBtn) { readBtn.href = 'https://timerhaven.com/en/countdown-timer/countdown-index.html'; readBtn.setAttribute('target','_blank'); readBtn.setAttribute('rel','noopener'); }
    const disp = document.getElementById('display'); if (disp) disp.textContent = t['display'] || '00:00:00';
  }

  window.addEventListener('storage', function(e){ if (e.key === 'timerhavenLang') applyLanguage((e.newValue||'en').slice(0,2)); });

  let timerInterval = null; let totalSeconds = 0; let paused = false;

  function updateDisplay() {
    const hrs = Math.floor(totalSeconds / 3600);
    const mins = Math.floor((totalSeconds % 3600) / 60);
    const secs = totalSeconds % 60;
    document.getElementById('display').textContent =
      String(hrs).padStart(2,'0') + ':' + String(mins).padStart(2,'0') + ':' + String(secs).padStart(2,'0');
  }

  function parseInputValue(id) {
    const el = document.getElementById(id);
    if (!el) return 0;
    const v = String(el.value || '').replace(/[^\d]/g, '');
    return v === '' ? 0 : Math.max(0, parseInt(v,10));
  }

  function padInput(elId) {
    const el = document.getElementById(elId);
    if (!el) return;
    let n = parseInt(el.value);
    if (!Number.isFinite(n) || n < 0) n = 0;
    if (elId === 'seconds') n = Math.max(0, Math.min(59, n));
    el.value = n < 10 ? String(n).padStart(2,'0') : String(n);
  }

  // non-blocking modal helpers
  function showTimeupModal() {
    const bd = document.getElementById('timeupBackdrop');
    if (!bd) return;
    bd.style.display = 'flex';
    bd.setAttribute('aria-hidden','false');
  }
  function hideTimeupModal() {
    const bd = document.getElementById('timeupBackdrop');
    if (!bd) return;
    bd.style.display = 'none';
    bd.setAttribute('aria-hidden','true');
  }

  document.addEventListener('DOMContentLoaded', function() {
    applyLanguage(getLang());
    totalSeconds = 0; updateDisplay();

    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const stopBeepBtn = document.getElementById('stopBeepBtn');
    const timeupOkBtn = document.getElementById('timeupOkBtn');

    if (startBtn) {
      startBtn.addEventListener('click', function() {
        // resume/create audio context on user gesture
        ensureAudioContext();

        if (timerInterval) return;
        const h = parseInputValue('hours');
        const m = parseInputValue('minutes');
        const s = parseInputValue('seconds');
        totalSeconds = Math.max(0, h*3600 + m*60 + s);
        updateDisplay();
        if (totalSeconds <= 0) return;
        paused = false;
        timerInterval = setInterval(function() {
          if (!paused && totalSeconds > 0) {
            totalSeconds--;
            updateDisplay();
          }
          if (totalSeconds <= 0) {
            clearInterval(timerInterval); timerInterval = null;
            totalSeconds = 0;
            updateDisplay(); // ensure 00:00:00
            // start beep then show modal shortly after to avoid blocking audio
            try { startContinuousBeep(920, 0.18); } catch(e){}
            updateStopBeepUI();
            setTimeout(() => {
              // show non-blocking modal
              showTimeupModal();
            }, 160);
          }
        }, 1000);
      });
    }

    if (pauseBtn) {
      pauseBtn.addEventListener('click', function() {
        paused = !paused;
        const lang = getLang(); const t = countdownTranslations[lang] || countdownTranslations['en'];
        this.innerHTML = (paused ? '<i class="fa fa-play"></i> ' + (t['resume'] || 'Resume') : '<i class="fa fa-pause"></i> ' + (t['pause'] || 'Pause'));
      });
    }

    if (resetBtn) {
      resetBtn.addEventListener('click', function() {
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        totalSeconds = 0; paused = false;
        stopBeep();
        const hrsEl = document.getElementById('hours');
        const minsEl = document.getElementById('minutes');
        const secsEl = document.getElementById('seconds');
        if (hrsEl) hrsEl.value = '00';
        if (minsEl) minsEl.value = '00';
        if (secsEl) secsEl.value = '00';
        updateDisplay();
        const lang = getLang(); const t = countdownTranslations[lang] || countdownTranslations['en'];
        const pauseBtnEl = document.getElementById('pauseBtn');
        if (pauseBtnEl) pauseBtnEl.innerHTML = '<i class="fa fa-pause"></i> ' + (t['pause'] || 'Pause');
        hideTimeupModal();
      });
    }

    if (stopBeepBtn) {
      stopBeepBtn.addEventListener('click', function() {
        stopBeep();
      });
    }

    if (timeupOkBtn) {
      timeupOkBtn.addEventListener('click', function() {
        stopBeep();
        hideTimeupModal();
      });
    }

    ['hours','minutes','seconds'].forEach(id => {
      const el = document.getElementById(id); if (!el) return;
      el.addEventListener('blur', function(){ padInput(id); });
      el.addEventListener('keydown', function(e){
        if (['Backspace','Delete','ArrowLeft','ArrowRight','Tab','Enter'].includes(e.key)) return;
        if (e.ctrlKey||e.metaKey) return;
        if (!/^\d$/.test(e.key)) e.preventDefault();
      });
    });

    padInput('hours'); padInput('minutes'); padInput('seconds'); updateStopBeepUI();
  });
</script>
