<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preload" as="image" href="/assets/images/pomodoro-timer-share-image.webp" fetchpriority="high" media="(max-width: 768px)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimerHaven</title>
  <style>
    :root {
      --primary: #185a9d;
      --secondary: #43cea2;
      --text: #ffffff;
      --bg: #0f172a;
    }
    body {
      width: 320px;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      padding: 1.5rem;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .container {
      padding: 1.5rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      color: inherit;
    }
    .card:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
      border-color: var(--secondary);
    }
    .card-icon {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      display: block;
    }
    .card-title {
      font-size: 0.85rem;
      font-weight: 500;
    }
    .footer {
      padding: 1rem;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-main {
      background: var(--secondary);
      color: var(--bg);
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      text-decoration: none;
      display: inline-block;
      transition: opacity 0.2s;
    }
    .btn-main:hover {
      opacity: 0.9;
    }
  </style>
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/webfonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" as="image" href="/assets/images/pomodoro-timer-share-image.webp" fetchpriority="high">
</head>
<body>
  <div class="header">
    <h1>TIMERHAVEN</h1>
  </div>
  <div class="container">
    <div class="grid">
      <a href="https://timerhaven.com/timer.html" target="_blank" class="card">
        <span class="card-icon">⏱️</span>
        <span class="card-title">Timer</span>
      </a>
      <a href="https://timerhaven.com/stopwatch.html" target="_blank" class="card">
        <span class="card-icon">🕒</span>
        <span class="card-title">Stopwatch</span>
      </a>
      <a href="https://timerhaven.com/pomodoro.html" target="_blank" class="card">
        <span class="card-icon">🍅</span>
        <span class="card-title">Pomodoro</span>
      </a>
      <a href="https://timerhaven.com/clipboard-manager.html" target="_blank" class="card">
        <span class="card-icon">📋</span>
        <span class="card-title">Clips</span>
      </a>
    </div>
  </div>
  <div class="footer">
    <a href="https://timerhaven.com/index.html" target="_blank" class="btn-main">Launch Web Tools</a>
  </div>
</body>
</html>
