    /* Hide the visible language indicator while keeping markup intact */

<script>
  const apiKey = "5f484bfa921ef56c9c279660";

  const currencyTranslations = {
    en: {"language-label":"Language:","back-link":"Back to Main Menu","tool-title":"Currency Converter","tool-help":"Convert currencies using live exchange rates.","amount":"Amount","convert":"Convert","result-placeholder":"Converted amount will appear here.","fetching":"Fetching rate...","amount-error":"Please enter a valid amount.","conversion-unavailable":"Conversion not available.","fetch-error":"Could not fetch conversion.","faq-title":"FAQs","faq-list":`<li><b>Are exchange rates live?</b> Yes, rates update regularly from the API.</li><li><b>Can I convert between any currency?</b> Most global currencies are supported.</li><li><b>Is this free?</b> Yes, all tools on TimerHaven are free.</li>`,"howto-title":'<i class="fa fa-dollar-sign"></i> How to Use Currency Converter',"howto-steps":`<li><b>Select currencies:</b> Choose the currencies you want to convert between.</li><li><b>Enter amount:</b> Type the amount you want to convert.</li><li><b>View result:</b> The converted amount shows instantly.</li>`,"howto-article-btn":"Read Full Article","howto-article-link":"currency-how-to.html","tips-title":'<i class="fa fa-lightbulb" style="color:#43cea2;"></i> Currency Productivity Tips',"tips-list":`<li><b>Double-check rates:</b> For large transfers, confirm rates with your bank.</li><li><b>Keep a history:</b> Record conversions for budgeting.</li><li><b>Use for travel:</b> Convert local prices on the go.</li>`,"tips-article-btn":"Read Full Article","tips-article-link":"currency-tips.html"},
    ru: {"language-label":"Язык:","back-link":"Назад в главное меню","tool-title":"Конвертер валют","tool-help":"Конвертируйте валюты по актуальным курсам.","amount":"Сумма","convert":"Конвертировать","result-placeholder":"Сконвертированная сумма появится здесь.","fetching":"Получение курса...","amount-error":"Пожалуйста, введите корректную сумму.","conversion-unavailable":"Конвертация недоступна.","fetch-error":"Не удалось получить конвертацию.","faq-title":"Частые вопросы","faq-list":`<li><b>Курсы актуальны?</b> Да, обновляются регулярно.</li><li><b>Можно конвертировать любые валюты?</b> Большинство мировых валют поддерживаются.</li><li><b>Это бесплатно?</b> Да, все инструменты TimerHaven бесплатны.</li>`,"howto-title":'<i class="fa fa-dollar-sign"></i> Как пользоваться Конвертером валют',"howto-steps":`<li><b>Выберите валюты:</b> Выберите валюты для конвертации.</li><li><b>Введите сумму:</b> Введите сумму для конвертации.</li><li><b>Просмотрите результат:</b> Конвертированная сумма появится сразу.</li>`,"howto-article-btn":"Читать полный текст","howto-article-link":"currency-how-to-ru.html","tips-title":'<i class="fa fa-lightbulb" style="color:#43cea2;"></i> Советы по конвертации валют',"tips-list":`<li><b>Проверяйте курсы:</b> Для крупных переводов уточняйте в банке.</li><li><b>Ведите историю:</b> Записывайте конвертации для бюджета.</li><li><b>Для путешествий:</b> Быстро переводи цены на месте.</li>`,"tips-article-btn":"Читать полный текст","tips-article-link":"currency-tips-ru.html"},
    el: {"language-label":"Γλώσσα:","back-link":"Επιστροφή στο κύριο μενού","tool-title":"Μετατροπέας Νομισμάτων","tool-help":"Μετατρέψτε νομίσματα με live ισοτιμίες.","amount":"Ποσό","convert":"Μετατροπή","result-placeholder":"Το αποτέλεσμα εμφανίζεται εδώ.","fetching":"Φόρτωση ισοτιμίας...","amount-error":"Παρακαλώ εισάγετε έγκυρο ποσό.","conversion-unavailable":"Η μετατροπή δεν είναι διαθέσιμη.","fetch-error":"Δεν ήταν δυνατή η λήψη της μετατροπής.","faq-title":"Συχνές Ερωτήσεις","faq-list":`<li><b>Οι ισοτιμίες είναι σε πραγματικό χρόνο;</b> Ναι, ενημερώνονται τακτικά.</li><li><b>Μπορώ να μετατρέψω οποιοδήποτε νόμισμα;</b> Τα πιο δημοφιλή είναι διαθέσιμα.</li><li><b>Είναι δωρεάν;</b> Ναι, όλα τα εργαλεία είναι δωρεάν.</li>`,"howto-title":'<i class="fa fa-dollar-sign"></i> Πώς να χρησιμοποιήσετε τον Μετατροπέα Νομισμάτων',"howto-steps":`<li><b>Επιλέξτε νομίσματα:</b> Διαλέξτε αυτά που θέλετε να μετατρέψετε.</li><li><b>Εισάγετε ποσό:</b> Γράψτε το ποσό για μετατροπή.</li><li><b>Δείτε το αποτέλεσμα:</b> Το αποτέλεσμα εμφανίζεται άμεσα.</li>`,"howto-article-btn":"Διαβάστε το πλήρες άρθρο","howto-article-link":"currency-how-to-el.html","tips-title":'<i class="fa fa-lightbulb" style="color:#43cea2;"></i> Συμβουλές για μετατροπή νομισμάτων',"tips-list":`<li><b>Ελέγξτε τις ισοτιμίες:</b> Για μεγάλες μεταφορές, επιβεβαιώστε με την τράπεζα.</li><li><b>Κρατήστε ιστορικό:</b> Σημειώστε τις μετατροπές για τον προϋπολογισμό.</li><li><b>Ιδανικό για ταξίδια:</b> Μετατρέψτε τιμές γρήγορα.</li>`,"tips-article-btn":"Διαβάστε το πλήρες άρθρο","tips-article-link":"currency-tips-el.html"},
    es: {"language-label":"Idioma:","back-link":"Volver al menú principal","tool-title":"Conversor de monedas","tool-help":"Convierte monedas con tasas en tiempo real.","amount":"Cantidad","convert":"Convertir","result-placeholder":"El resultado aparece aquí.","fetching":"Obteniendo tasa...","amount-error":"Por favor introduce una cantidad válida.","conversion-unavailable":"Conversión no disponible.","fetch-error":"No se pudo obtener la conversión.","faq-title":"Preguntas frecuentes","faq-list":`<li><b>¿Las tasas son en tiempo real?</b> Sí, se actualizan regularmente.</li><li><b>¿Puedo convertir cualquier moneda?</b> La mayoría de monedas están disponibles.</li><li><b>¿Es gratis?</b> Sí, todas las herramientas son gratuitas.</li>`,"howto-title":'<i class="fa fa-dollar-sign"></i> Cómo usar el Conversor de monedas',"howto-steps":`<li><b>Selecciona monedas:</b> Elige las monedas a convertir.</li><li><b>Introduce cantidad:</b> Escribe la cantidad a convertir.</li><li><b>Ver resultado:</b> El resultado aparece al instante.</li>`,"howto-article-btn":"Leer artículo completo","howto-article-link":"currency-how-to-es.html","tips-title":'<i class="fa fa-lightbulb" style="color:#43cea2;"></i> Consejos para convertir monedas',"tips-list":`<li><b>Verifica las tasas:</b> Para grandes transferencias, consulta el banco.</li><li><b>Mantén un historial:</b> Guarda tus conversiones para controlar gastos.</li><li><b>Usa en viajes:</b> Convierte precios locales rápidamente.</li>`,"tips-article-btn":"Leer artículo completo","tips-article-link":"currency-tips-es.html"},
    ar: {"language-label":"اللغة:","back-link":"العودة إلى القائمة الرئيسية","tool-title":"محول العملات","tool-help":"حوّل العملات باستخدام أسعار الصرف المباشرة.","amount":"المبلغ","convert":"تحويل","result-placeholder":"المبلغ المحول يظهر هنا.","fetching":"جاري جلب السعر...","amount-error":"يرجى إدخال مبلغ صحيح.","conversion-unavailable":"التحويل غير متاح.","fetch-error":"تعذر جلب التحويل.","faq-title":"الأسئلة الشائعة","faq-list":`<li><b>هل الأسعار مباشرة؟</b> نعم، يتم تحديثها باستمرار.</li><li><b>هل يمكن تحويل أي عملة؟</b> معظم العملات العالمية متاحة.</li><li><b>هل الأداة مجانية؟</b> نعم، جميع الأدوات مجانية.</li>`,"howto-title":'<i class="fa fa-dollar-sign"></i> كيفية استخدام محول العملات',"howto-steps":`<li><b>اختر العملات:</b> حدد العملات للتحويل بينها.</li><li><b>أدخل المبلغ:</b> اكتب المبلغ للتحويل.</li><li><b>شاهد النتيجة:</b> تظهر النتيجة فورًا.</li>`,"howto-article-btn":"اقرأ المقال الكامل","howto-article-link":"currency-how-to-ar.html","tips-title":'<i class="fa fa-lightbulb" style="color:#43cea2;"></i> نصائح لتحويل العملات',"tips-list":`<li><b>تحقق من الأسعار:</b> للتحويلات الكبيرة، تحقق مع البنك.</li><li><b>احتفظ بسجل:</b> سجل التحويلات للميزانية.</li><li><b>استخدمه في السفر:</b> حوّل الأسعار المحلية بسرعة.</li>`,"tips-article-btn":"اقرأ المقال الكامل","tips-article-link":"currency-tips-ar.html"}
  };

  const langNames = { en: "English", fr: "Français", de: "Deutsch", ru: "Русский", el: "Ελληνικά", es: "Español", ar: "العربية" };

  function populateCurrencySelects() {
    const from = document.getElementById('fromCurrency');
    const to = document.getElementById('toCurrency');
    from.innerHTML = '';
    to.innerHTML = '';
    currencyList.forEach(cur => {
      from.innerHTML += `<option value="${cur}">${cur}</option>`;
      to.innerHTML += `<option value="${cur}">${cur}</option>`;
    });
    from.value = "USD";
    to.value = "EUR";
  }

  function getLang() {
    try { const l = localStorage.getItem('timerhavenLang') || 'ar'; return (l && l.slice(0,2)) || 'ar'; } catch (e) { return 'ar'; }
  }

  function applyLanguage(lang) {
    lang = (lang || getLang()).slice(0,2);
    const t = currencyTranslations[lang] || currencyTranslations['ar'];
    document.body.dir = (lang === 'ar') ? 'rtl' : 'ltr';
    const labelEl = document.getElementById('language-label');
    const nameEl = document.getElementById('language-name');
    if (labelEl) labelEl.textContent = t['language-label'] || 'اللغة:';
    if (nameEl) nameEl.textContent = langNames[lang] || lang;
    if (document.getElementById('back-link')) document.getElementById('back-link').textContent = t['back-link'] || '';
    if (document.getElementById('tool-title')) document.getElementById('tool-title').innerHTML = `<i class="fa fa-dollar-sign"></i> ${t['tool-title'] || ''}`;
    if (document.getElementById('tool-help')) document.getElementById('tool-help').textContent = t['tool-help'] || '';
    if (document.getElementById('amount')) document.getElementById('amount').placeholder = t['amount'] || '';
    if (document.getElementById('convert-btn')) document.getElementById('convert-btn').textContent = t['convert'] || 'تحويل';
    if (document.getElementById('result')) document.getElementById('result').textContent = t['result-placeholder'] || '';
    if (document.getElementById('faq-title')) document.getElementById('faq-title').textContent = t['faq-title'] || '';
    if (document.getElementById('faq-list')) document.getElementById('faq-list').innerHTML = t['faq-list'] || '';
    if (document.getElementById('howto-title')) document.getElementById('howto-title').innerHTML = t['howto-title'] || '';
    if (document.getElementById('howto-steps')) document.getElementById('howto-steps').innerHTML = t['howto-steps'] || '';
    if (document.getElementById('howto-article-btn')) { document.getElementById('howto-article-btn').textContent = t['howto-article-btn'] || ''; document.getElementById('howto-article-btn').href = t['howto-article-link'] || ''; }
    if (document.getElementById('tips-title')) document.getElementById('tips-title').innerHTML = t['tips-title'] || '';
    if (document.getElementById('tips-list')) document.getElementById('tips-list').innerHTML = t['tips-list'] || '';
    if (document.getElementById('tips-article-btn')) { document.getElementById('tips-article-btn').textContent = t['tips-article-btn'] || ''; document.getElementById('tips-article-btn').href = t['tips-article-link'] || ''; }
    if (document.getElementById('howto-mobile-title')) document.getElementById('howto-mobile-title').innerHTML = t['howto-title'] || '';
    if (document.getElementById('howto-mobile-steps')) document.getElementById('howto-mobile-steps').innerHTML = t['howto-steps'] || '';
    if (document.getElementById('tips-mobile-title')) document.getElementById('tips-mobile-title').innerHTML = t['tips-title'] || '';
    if (document.getElementById('tips-mobile-list')) document.getElementById('tips-mobile-list').innerHTML = t['tips-list'] || '';
  }

  document.addEventListener('DOMContentLoaded', function(){
    populateCurrencySelects();
    applyLanguage(getLang());
  });

  window.addEventListener('storage', function(e) {
    if (e.key === 'timerhavenLang') applyLanguage((e.newValue || 'ar').slice(0,2));
  });

  document.getElementById('currencyForm').addEventListener('submit', function(e){
    e.preventDefault();
    const amountVal = parseFloat(document.getElementById('amount').value);
    const fromCur = document.getElementById('fromCurrency').value;
    const toCur = document.getElementById('toCurrency').value;
    const lang = getLang();
    const t = currencyTranslations[lang] || currencyTranslations['ar'];
    if (isNaN(amountVal) || amountVal <= 0) {
      document.getElementById('result').innerText = t['amount-error'] || "يرجى إدخال مبلغ صحيح.";
      return;
    }
    document.getElementById('result').innerText = t['fetching'] || "جاري جلب السعر...";
    fetch(`https://v6.exchangerate-api.com/v6/${apiKey}/pair/${fromCur}/${toCur}/${amountVal}`)
      .then(r => r.json())
      .then(data => {
        if (data && typeof data.conversion_result !== 'undefined') {
          const conv = (Math.round((data.conversion_result + Number.EPSILON) * 100000) / 100000);
          const rate = (Math.round((data.conversion_rate + Number.EPSILON) * 100000) / 100000);
          document.getElementById('result').innerText = `${amountVal} ${fromCur} = ${conv} ${toCur} (السعر: ${rate})`;
        } else {
          document.getElementById('result').innerText = t['conversion-unavailable'] || "التحويل غير متاح.";
        }
      })
      .catch(() => {
        document.getElementById('result').innerText = t['fetch-error'] || "تعذر جلب التحويل.";
      });
  });
</script>
