<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <title>Meeting-Planer — TimerHaven</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="description" content="Finde die beste Meeting‑Zeit für alle – überall auf der Welt."/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/assets/css/tool-theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    :root{--brand:#0b63a0;--muted:#6b7c89;--card:#fff;--bg:#fbfeff}
    html,body{height:100%}
    body { background:var(--bg); font-family:'Montserrat', Arial, sans-serif; margin:0; padding:2rem; color:var(--text-dark,#102a43); }
    .container { max-width:720px; margin:0 auto; }
    .card { background:var(--card); border-radius:16px; box-shadow:0 8px 24px rgba(0,0,0,0.06); padding:1.6rem 1.5rem; box-sizing:border-box; }
    /* Back link — consistent blue */
    .back-link { display:inline-block; margin-bottom:.75rem; color:#007bff !important; text-decoration:none; font-weight:700; }
    .back-link:hover { text-decoration:underline; }
    .tool-title { font-size:1.35rem; margin:0 0 .4rem 0; display:flex; align-items:center; gap:.4rem; color:#185a9d; }
    .cta {
      display:inline-block;
      margin:.35rem 0 .8rem 0;
      padding:.45rem .7rem;
      border-radius:8px;
      background:#007bff !important;
      color:#fff !important;
      text-decoration:none;
      font-weight:700;
      font-size:.95rem;
      border:none;
      box-shadow:0 6px 18px rgba(0,123,255,0.08);
    }
    .tool-help { color:var(--muted); margin-bottom:.8rem; }
    .meeting-form-row { margin-bottom:.8rem; }
    .participant-item { background:#f7fafc; border-radius:8px; padding:.6rem; margin-bottom:.6rem; display:flex; justify-content:space-between; align-items:center; gap:.6rem; }
    .meeting-times-grid { display:flex; flex-direction:column; gap:.4rem; margin-top:0.6rem; }
    .time-suggestion { display:flex; gap:.6rem; align-items:center; justify-content:space-between; padding:.45rem .6rem; border-radius:8px; background:#fff; border:1px solid #eef6f3; }
    .faq-section { margin-top:1.1rem; margin-bottom:0.3rem; font-size:1rem; background:#f7fafc; border-radius:8px; padding:1rem; box-shadow:0 1px 4px #e0e7ef; }
    .faq-section summary { font-weight:700; font-size:1.02rem; cursor:pointer; }
    @media (max-width:900px){ .card{padding:1rem} }
  </style>
</head>
<body>
  <main class="container" role="main">
    <section class="card" aria-labelledby="tool-title">
      <a href="index.html" class="back-link" id="back-link">← Zurück zum Hauptmenü</a>

      <h3 id="tool-title" class="tool-title"><i class="fa fa-users"></i> Meeting-Planer</h3>

      <!-- Read full guide button (canonical German path) -->
      <p style="margin:0 0 .6rem 0;">
        <a id="read-guide-btn" class="cta" href="https://timerhaven.com/de/meeting-planner/meeting-planner-index.html" role="button" target="_blank" rel="noopener">Ganzer Artikel</a>
      </p>

      <div class="tool-help" id="tool-help">Plane Meetings über Zeitzonen hinweg, füge Teilnehmer hinzu und finde die beste Zeit.</div>

      <!-- Participants -->
      <form id="meetingForm" onsubmit="return false;">
        <div class="meeting-form-row">
          <label for="participantName" id="participant-name-label">Teilnehmername</label>
          <input autocomplete="off" type="text" id="participantName" class="form-control" placeholder="Name eingeben (z. B. Anna)">
        </div>
        <div class="meeting-form-row">
          <label for="participantCity" id="city-label">Zeitzone / Stadt</label>
          <select id="participantCity" class="form-select"></select>
        </div>
        <div style="display:flex;gap:.5rem;align-items:center;">
          <button type="button" class="btn btn-success btn-participant" id="add-participant-btn"><i class="fa fa-plus"></i> <span id="add-participant-btn-text">Teilnehmer hinzufügen</span></button>
          <button type="button" class="btn btn-outline-secondary" id="clear-participants-btn" title="Teilnehmer löschen"><i class="fa fa-eraser"></i></button>
        </div>
      </form>

      <div id="participantList" style="margin-top:1rem;"></div>

      <div class="meeting-form-row">
        <label for="meetingDate" id="meeting-date-label">Meeting-Datum wählen</label>
        <input type="date" id="meetingDate" class="form-control">
      </div>

      <div class="meeting-form-row">
        <label for="meetingTimeSelect" id="meeting-time-label">Meeting-Zeit wählen (Vorschlag)</label>
        <select id="meetingTimeSelect" class="form-select"></select>
      </div>

      <div id="meetingTimes" aria-live="polite"></div>

      <details class="faq-section" id="faq-section">
        <summary id="faq-title">Häufig gestellte Fragen</summary>
        <ul id="faq-list" style="padding-left:1em;">
        </ul>
      </details>
    </section>
  </main>

<script src="https://cdn.jsdelivr.net/npm/luxon@3.4.3/build/global/luxon.min.js"></script>
<script>
const translations = {
  de: {
    "back-link":"← Zurück zum Hauptmenü",
    "tool-title":"Meeting-Planer",
    "participant-name-label":"Teilnehmername",
    "participant-name-placeholder":"Name eingeben (z. B. Anna)",
    "city-label":"Zeitzone / Stadt",
    "add-participant-btn-text":"Teilnehmer hinzufügen",
    "meeting-date-label":"Meeting-Datum wählen",
    "meeting-time-label":"Meeting-Zeit wählen (Vorschlag)",
    "howto-article-btn":"Ganzer Artikel",
    "howto-article-link":"https://timerhaven.com/de/meeting-planner/meeting-planner-index.html",
    "faq-list":[
      {"bold":"Wie viele Teilnehmer?","text":"Fügen Sie so viele hinzu, wie Sie möchten."},
      {"bold":"Welche Zeitzonen?","text":"Wählen Sie aus 30+ beliebten Städten oder Zeitzonen."},
      {"bold":"Wie teilen?","text":"Kopieren Sie die Meeting‑Zeiten und teilen Sie sie mit den Teilnehmern."}
    ],
    "enter-name-msg":"Bitte geben Sie einen Teilnehmernamen ein.",
    "select-city-msg":"Bitte wählen Sie eine Stadt / Zeitzone.",
    "select-date-time-msg":"Bitte wählen Sie Datum und Uhrzeit.",
    "no-participants-yet":"Noch keine Teilnehmer.",
    "meeting-times-heading":"Meeting‑Zeiten (Organisator lokal → Teilnehmer lokal)"
  }
};

const localizedArticles = {
  howto: { de:'https://timerhaven.com/de/meeting-planner/meeting-planner-index.html' },
  tips: { de:'meeting-tips.html' }
};

function getLang(){ try{ const l=localStorage.getItem('timerhavenLang')||'de'; return (l&&l.slice(0,2))||'de'; }catch(e){return 'de';} }
function applyLanguage(lang) {
  lang=(lang||getLang()).slice(0,2);
  const t = translations[lang] || translations.de;
  document.body.dir = (lang==='ar') ? 'rtl' : 'ltr';
  const back = document.getElementById('back-link'); if (back) back.textContent = t['back-link'] || 'Zurück zum Hauptmenü';
  const toolTitle = document.getElementById('tool-title'); if (toolTitle) toolTitle.textContent = t['tool-title'] || 'Meeting-Planer';
  const participantLabel = document.getElementById('participant-name-label'); if (participantLabel) participantLabel.textContent = t['participant-name-label'] || 'Teilnehmername';
  const participantPlaceholder = document.getElementById('participantName'); if (participantPlaceholder) participantPlaceholder.placeholder = t['participant-name-placeholder'] || '';
  const cityLabel = document.getElementById('city-label'); if (cityLabel) cityLabel.textContent = t['city-label'] || 'Zeitzone / Stadt';
  const addBtnText = document.getElementById('add-participant-btn-text'); if (addBtnText) addBtnText.textContent = t['add-participant-btn-text'] || 'Teilnehmer hinzufügen';

  document.getElementById("meeting-date-label").textContent = t["meeting-date-label"] || 'Meeting-Datum wählen';
  document.getElementById("meeting-time-label").textContent = t["meeting-time-label"] || 'Meeting-Zeit wählen (Vorschlag)';

  const faqList = document.getElementById("faq-list");
  faqList.innerHTML = "";
  (t["faq-list"] || []).forEach(faq => {
    const li = document.createElement("li");
    li.innerHTML = `<b>${faq.bold}</b> ${faq.text}`;
    faqList.appendChild(li);
  });

  const howtoBtn = document.getElementById("read-guide-btn");
  if (howtoBtn) {
    howtoBtn.href = localizedArticles.howto[lang] || localizedArticles.howto.de;
    howtoBtn.textContent = t['howto-article-btn'] || 'Ganzer Artikel';
    howtoBtn.target = '_blank';
    howtoBtn.rel = 'noopener';
  }

  populateCities();
  populateTimeSelect();
  updateMeetingTimes();
}

/* meeting planner logic */
const { DateTime } = luxon;
const LS_PARTICIPANTS = 'meetingPlannerParticipants';
const LS_DATE = 'meetingPlannerDate';
const LS_TIME = 'meetingPlannerTime';

const cities = [
  {value:"", label:"Wählen Sie eine Stadt/Zeitzone"},
  {value:"America/New_York", label:"New York 🇺🇸"},
  {value:"America/Chicago", label:"Chicago 🇺🇸"},
  {value:"America/Los_Angeles", label:"Los Angeles 🇺🇸"},
  {value:"America/Toronto", label:"Toronto 🇨🇦"},
  {value:"Europe/London", label:"London 🇬🇧"},
  {value:"Europe/Paris", label:"Paris 🇫🇷"},
  {value:"Europe/Berlin", label:"Berlin 🇩🇪"},
  {value:"Europe/Moscow", label:"Moscow 🇷🇺"},
  {value:"Europe/Istanbul", label:"Istanbul 🇹🇷"},
  {value:"Asia/Dubai", label:"Dubai 🇦🇪"},
  {value:"Asia/Kolkata", label:"Kolkata 🇮🇳"},
  {value:"Asia/Shanghai", label:"Shanghai 🇨🇳"},
  {value:"Asia/Tokyo", label:"Tokyo 🇯🇵"},
  {value:"Asia/Singapore", label:"Singapore 🇸🇬"},
  {value:"Asia/Jakarta", label:"Jakarta 🇮🇩"},
  {value:"Australia/Sydney", label:"Sydney 🇦🇺"},
  {value:"Pacific/Auckland", label:"Auckland 🇳🇿"},
  {value:"America/Sao_Paulo", label:"São Paulo 🇧🇷"},
  {value:"America/Mexico_City", label:"Mexico City 🇲🇽"},
  {value:"Africa/Johannesburg", label:"Johannesburg 🇿🇦"},
  {value:"Africa/Cairo", label:"Cairo 🇪🇬"},
  {value:"Africa/Nairobi", label:"Nairobi 🇰🇪"},
  {value:"Asia/Seoul", label:"Seoul 🇰🇷"},
  {value:"Asia/Hong_Kong", label:"Hong Kong 🇭🇰"},
  {value:"Asia/Bangkok", label:"Bangkok 🇹🇭"},
  {value:"Asia/Manila", label:"Manila 🇵🇭"},
  {value:"Europe/Madrid", label:"Madrid 🇪🇸"},
  {value:"Europe/Rome", label:"Rome 🇮🇹"},
  {value:"Europe/Warsaw", label:"Warsaw 🇵🇱"},
  {value:"Europe/Amsterdam", label:"Amsterdam 🇳🇱"},
  {value:"Europe/Athens", label:"Athens 🇬🇷"},
  {value:"America/Vancouver", label:"Vancouver 🇨🇦"}
];

function populateCities() {
  const sel = document.getElementById('participantCity');
  sel.innerHTML = '';
  cities.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.value;
    opt.textContent = c.label;
    sel.appendChild(opt);
  });
}

function loadParticipants(){ try { const raw = localStorage.getItem(LS_PARTICIPANTS); window.participants = raw ? JSON.parse(raw) : []; } catch(e){ window.participants = []; } }
function saveParticipants(){ try { localStorage.setItem(LS_PARTICIPANTS, JSON.stringify(window.participants || [])); } catch(e){} }

function renderParticipants(){
  const container = document.getElementById('participantList');
  container.innerHTML = '';
  const lang = getLang();
  const t = translations[lang] || translations.de;
  if (!window.participants || window.participants.length === 0) {
    container.innerHTML = `<div style="color:#888;">${t["no-participants-yet"] || "Noch keine Teilnehmer."}</div>`;
    return;
  }
  window.participants.forEach((p, idx) => {
    const el = document.createElement('div');
    el.className = 'participant-item';
    el.innerHTML = `<div style="min-width:0;"><div style="font-weight:700;">${escapeHtml(p.name)}</div><div style="font-size:.9em;color:#666;">${escapeHtml(p.city)}</div></div>
      <div style="display:flex;gap:.5rem;"><button class="btn btn-outline-danger btn-sm" onclick="removeParticipant(${idx})" aria-label="Teilnehmer entfernen"><i class="fa fa-trash"></i></button></div>`;
    container.appendChild(el);
  });
}
function escapeHtml(s){ if(!s) return ''; return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'", '&#39;'); }

document.addEventListener('DOMContentLoaded', function() {
  applyLanguage(getLang());
  populateCities();
  populateTimeSelect();
  loadParticipants();
  renderParticipants();
  try {
    const savedDate = localStorage.getItem('meetingPlannerDate');
    const savedTime = localStorage.getItem('meetingPlannerTime');
    if (savedDate) document.getElementById('meetingDate').value = savedDate;
    if (savedTime) document.getElementById('meetingTimeSelect').value = savedTime;
  } catch(e){}
  updateMeetingTimes();
});

document.getElementById('add-participant-btn').addEventListener('click', function() {
  const name = document.getElementById('participantName').value.trim();
  const city = document.getElementById('participantCity').value;
  const lang = getLang();
  const t = translations[lang] || translations.de;
  if (!name) { alert(t['enter-name-msg'] || 'Bitte geben Sie einen Teilnehmernamen ein.'); return; }
  if (!city) { alert(t['select-city-msg'] || 'Bitte wählen Sie eine Stadt/Zeitzone.'); return; }
  window.participants = window.participants || [];
  window.participants.push({ name, city });
  saveParticipants();
  document.getElementById('participantName').value = '';
  document.getElementById('participantCity').selectedIndex = 0;
  renderParticipants();
  updateMeetingTimes();
});
window.removeParticipant = function(idx){ window.participants.splice(idx,1); saveParticipants(); renderParticipants(); updateMeetingTimes(); };
document.getElementById('clear-participants-btn').addEventListener('click', function(){ if (!window.participants || window.participants.length === 0) return; if (!confirm('Alle Teilnehmer löschen?')) return; window.participants=[]; saveParticipants(); renderParticipants(); updateMeetingTimes(); });

function populateTimeSelect(){
  const sel = document.getElementById('meetingTimeSelect');
  if (!sel) return;
  const lang = getLang(); const t = translations[lang] || translations.de;
  sel.innerHTML = '';
  const placeholder = document.createElement('option'); placeholder.value=''; placeholder.textContent = '— ' + (t['meeting-time-label']||'Meeting‑Zeit wählen') + ' —'; sel.appendChild(placeholder);
  for(let h=0;h<24;h++){ for(let m=0;m<60;m+=30){ const hr=String(h).padStart(2,'0'); const min=String(m).padStart(2,'0'); const opt=document.createElement('option'); opt.value=`${hr}:${min}`; opt.textContent=`${hr}:${min}`; sel.appendChild(opt); } }
  if (!sel.value) {
    const now = DateTime.local().startOf('minute'); const minutes = now.minute;
    const next = now.plus({ minutes: (minutes < 30 ? (30 - minutes) : (60 - minutes)) });
    const v = `${String(next.hour).padStart(2,'0')}:${String(Math.floor(next.minute/30)*30).padStart(2,'0')}`;
    sel.value = v;
  }
}

function saveMeetingSettings(){ try{ localStorage.setItem('meetingPlannerDate', document.getElementById('meetingDate').value); localStorage.setItem('meetingPlannerTime', document.getElementById('meetingTimeSelect').value); }catch(e){} }

function updateMeetingTimes(){
  const dateInput = document.getElementById('meetingDate').value;
  const timeInput = document.getElementById('meetingTimeSelect').value;
  const timesDiv = document.getElementById('meetingTimes');
  const lang = getLang();
  const t = translations[lang] || translations.de;
  if (!dateInput || !timeInput) {
    timesDiv.innerHTML = `<div style="color:#888;">${t['select-date-time-msg'] || 'Bitte wählen Sie Datum und Uhrzeit.'}</div>`;
    return;
  }
  if (!window.participants || window.participants.length === 0) {
    timesDiv.innerHTML = `<div style="color:#888;">${t['no-participants-yet'] || 'Noch keine Teilnehmer.'}</div>`;
    return;
  }
  const localISO = `${dateInput}T${timeInput}`;
  let organizerDT = DateTime.fromISO(localISO);
  if (!organizerDT.isValid) {
    timesDiv.innerHTML = `<div style="color:#b00;">${t['select-date-time-msg'] || 'Bitte wählen Sie Datum und Uhrzeit.'}</div>`;
    return;
  }
  let html = `<div style="font-weight:700;margin-bottom:.4rem;">${t['meeting-times-heading'] || 'Meeting‑Zeiten (Organisator lokal → Teilnehmer lokal)'}</div>`;
  html += `<div class="meeting-times-grid">`;
  html += `<div class="time-suggestion"><div><b>Organisator</b> (${escapeHtml(organizerDT.zoneName)})</div><div>${escapeHtml(organizerDT.toLocaleString(DateTime.DATETIME_FULL))}</div></div>`;
  window.participants.forEach(p => {
    let localP; try { localP = organizerDT.setZone(p.city); } catch(e){ localP = null; }
    const label = localP ? localP.toLocaleString(DateTime.DATETIME_FULL) : 'Ungültige Zone';
    html += `<div class="time-suggestion"><div><b>${escapeHtml(p.name)}</b> <span style="color:#666;">(${escapeHtml(p.city)})</span></div><div>${escapeHtml(label)}</div></div>`;
  });
  html += `</div>`;
  timesDiv.innerHTML = html;
  saveMeetingSettings();
}

document.getElementById('meetingDate').addEventListener('input', updateMeetingTimes);
document.getElementById('meetingTimeSelect').addEventListener('change', updateMeetingTimes);

window.addEventListener('storage', function(e){
  if (e.key === 'timerhavenLang') {
    applyLanguage((e.newValue || 'de').slice(0,2));
    try {
      const lang = (e.newValue || 'de').slice(0,2).toLowerCase();
      const supported = ['es','fr','de','ru','el','ar'];
      if (supported.indexOf(lang) !== -1) {
        const localized = location.pathname.replace(/(meeting-planner)(\.html)?$/i, '$1-' + lang + '.html');
        const target = (localized === location.pathname) ? ('/meeting-planner-' + lang + '.html') : localized;
        if (target && (target !== location.pathname + location.search + location.hash)) {
          location.replace(target + location.search + location.hash);
        }
      }
    } catch (err) {}
  }
});

function getLang(){ try{ const l=localStorage.getItem('timerhavenLang')||'de'; return (l&&l.slice(0,2))||'de'; }catch(e){return 'de';} }
function applyLanguage(lang){ lang=(lang||getLang()).slice(0,2); const t = translations[lang] || translations.de; document.body.dir = (lang==='ar') ? 'rtl' : 'ltr'; const back=document.getElementById('back-link'); if(back) back.textContent=t['back-link']||'Zurück zum Hauptmenü'; const toolTitle=document.getElementById('tool-title'); if(toolTitle) toolTitle.textContent=t['tool-title']||'Meeting-Planer'; const participantLabel=document.getElementById('participant-name-label'); if(participantLabel) participantLabel.textContent=t['participant-name-label']||'Teilnehmername'; const participantPlaceholder=document.getElementById('participantName'); if(participantPlaceholder) participantPlaceholder.placeholder=t['participant-name-placeholder']||''; const cityLabel=document.getElementById('city-label'); if(cityLabel) cityLabel.textContent=t['city-label']||'Zeitzone / Stadt'; const addBtnText=document.getElementById('add-participant-btn-text'); if(addBtnText) addBtnText.textContent=t['add-participant-btn-text']||'Teilnehmer hinzufügen'; document.getElementById("meeting-date-label").textContent = t["meeting-date-label"] || 'Meeting-Datum wählen'; document.getElementById("meeting-time-label").textContent = t["meeting-time-label"] || 'Meeting‑Zeit wählen (Vorschlag)'; const faqList=document.getElementById("faq-list"); faqList.innerHTML=''; (t["faq-list"]||[]).forEach(faq=>{ const li=document.createElement('li'); li.innerHTML=`<b>${faq.bold}</b> ${faq.text}`; faqList.appendChild(li); }); populateCities(); populateTimeSelect(); updateMeetingTimes(); }
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/js/all.min.js"></script>

</footer>
</body>
</html>
