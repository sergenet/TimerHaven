<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Meeting-Planer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Finde die beste Meeting-Zeit für alle – überall auf der Welt.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body { background: #f4f7fb; font-family: 'Montserrat', Arial, sans-serif; }
    .main-container { max-width: 1200px; margin: 2em auto; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
    .center-row { display: flex; flex-direction: row; justify-content: center; align-items: stretch; gap: 2em; width: 100%; }
    .tool-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px #e0e7ef;
      min-width: 220px;
      max-width: 340px;
      width: 340px;
      min-height: 500px;
      flex: 1 1 340px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      padding: 2em 1.3em 1em 1.3em;
      margin: 0;
      box-sizing: border-box;
      text-align: left;
      overflow: hidden;
    }
    .back-link { display: inline-block; margin-bottom: 1em; color: #007bff; text-decoration: none; font-weight: bold; font-size: 1em; }
    .back-link:hover { text-decoration: underline; }
    .faq-section { margin-top: 1.1em; margin-bottom: 0.3em; font-size: 1em; background: #f7fafc; border-radius: 8px; padding: 1em; box-shadow: 0 1px 4px #e0e7ef; }
    .faq-section summary { font-weight: bold; font-size: 1.07em; cursor: pointer; margin-bottom: 0.5em; }
    .language-selector-row { margin-bottom: 1em; }
  </style>
</head>
<body>
  <div class="main-container">
    <div class="center-row">
      <div class="tool-card">
        <div class="language-selector-row">
          <label for="languageSelector">Sprache</label>
          <select id="languageSelector" class="form-select" onchange="onLanguageChange()">
            <option value="en">Englisch</option><option value="fr">Französisch</option><option value="de">Deutsch</option><option value="ru">Russisch</option><option value="el">Griechisch</option><option value="es">Spanisch</option><option value="ar">Arabisch</option>
          </select>
        </div>
        <a href="index.html" class="back-link"><i class="fa fa-arrow-left"></i> Zurück zum Hauptmenü</a>
        <h3><i class="fa fa-users"></i> Meeting-Planer</h3>
        <form id="meetingForm">
          <div class="meeting-form-row">
            <label for="participantName">Teilnehmername</label>
            <input type="text" id="participantName" class="form-control" placeholder="Name eingeben (z. B. Anna)" autocomplete="off">
          </div>
          <div class="meeting-form-row">
            <label for="participantCity">Zeitzone / Stadt</label>
            <select id="participantCity" class="form-select" autocomplete="off">
              <option value="" disabled selected>Wählen Sie eine Stadt/Zeitzone</option>
              <option value="America/New_York">New York 🇺🇸</option><option value="America/Chicago">Chicago 🇺🇸</option><option value="America/Los_Angeles">Los Angeles 🇺🇸</option><option value="America/Toronto">Toronto 🇨🇦</option><option value="Europe/London">London 🇬🇧</option><option value="Europe/Paris">Paris 🇫🇷</option><option value="Europe/Berlin">Berlin 🇩🇪</option><option value="Europe/Moscow">Moskau 🇷🇺</option><option value="Europe/Istanbul">Istanbul 🇹🇷</option><option value="Asia/Dubai">Dubai 🇦🇪</option><option value="Asia/Kolkata">Kolkata 🇮🇳</option><option value="Asia/Shanghai">Shanghai 🇨🇳</option><option value="Asia/Tokyo">Tokio 🇯🇵</option><option value="Asia/Singapore">Singapur 🇸🇬</option><option value="Asia/Jakarta">Jakarta 🇮🇩</option><option value="Australia/Sydney">Sydney 🇦🇺</option><option value="Pacific/Auckland">Auckland 🇳🇿</option><option value="America/Sao_Paulo">São Paulo 🇧🇷</option><option value="America/Mexico_City">Mexiko-Stadt 🇲🇽</option><option value="Africa/Johannesburg">Johannesburg 🇿🇦</option><option value="Africa/Cairo">Kairo 🇪🇬</option><option value="Africa/Nairobi">Nairobi 🇰🇪</option><option value="Asia/Seoul">Seoul 🇰🇷</option><option value="Asia/Hong_Kong">Hongkong 🇭🇰</option><option value="Asia/Bangkok">Bangkok 🇹🇭</option><option value="Asia/Manila">Manila 🇵🇭</option><option value="Europe/Madrid">Madrid 🇪🇸</option><option value="Europe/Rome">Rom 🇮🇹</option><option value="Europe/Warsaw">Warschau 🇵🇱</option><option value="Europe/Amsterdam">Amsterdam 🇳🇱</option><option value="Europe/Athens">Athen 🇬🇷</option><option value="America/Vancouver">Vancouver 🇨🇦</option>
            </select>
          </div>
          <button type="button" class="btn btn-success btn-participant" id="addParticipant"><i class="fa fa-plus"></i> Teilnehmer hinzufügen</button>
        </form>
        <div class="participant-list" id="participantList"></div>
        <div class="meeting-form-row">
          <label for="meetingDate">Meeting-Datum wählen</label>
          <input type="date" id="meetingDate" class="form-control">
        </div>
        <div class="meeting-form-row">
          <label for="meetingTime">Meeting-Zeit wählen</label>
          <input type="time" id="meetingTime" class="form-control">
          <button type="button" class="btn btn-primary btn-sm" style="margin-top:0.6em;" id="calcTimes"><i class="fa fa-clock"></i> Zeiten anzeigen</button>
        </div>
        <div>
          <div id="meetingTimes"></div>
        </div>
        <details class="faq-section">
          <summary>FAQs</summary>
          <ul style="padding-left: 1em;">
            <li><b>Wie viele Teilnehmer?</b> So viele Sie möchten.</li><li><b>Welche Zeitzonen?</b> Wählen Sie aus über 30 beliebten Städten/Zeitzonen.</li><li><b>Wie teilen?</b> Kopieren Sie die Zeiten und teilen Sie sie mit den Teilnehmern.</li>
          </ul>
        </details>
      </div>
    </div>
  </div>
  <script>
    function onLanguageChange() {
      var lang = document.getElementById("languageSelector").value;
      window.location.href = "meeting-planner-" + lang + ".html";
    }
  </script>
</body>
</html>
